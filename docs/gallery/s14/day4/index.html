<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마켓보드 · 실시간 시세</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --text:#14161a; --sub:#6b7280; --line:#e5e7eb;
  --up:#e5383b; --down:#1d6fe0; --flat:#6b7280; --accent:#111827; --star:#f5b301;
  --upbg:rgba(229,56,59,.12); --downbg:rgba(29,111,224,.12);
  --live:#16a34a; --sim:#9ca3af; --warn:#d97706;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --panel:#171a20; --panel2:#1f232b; --text:#e8eaed; --sub:#9aa1ad; --line:#2a2f38;
    --up:#ff5a5f; --down:#4c8dff; --accent:#e8eaed; --upbg:rgba(255,90,95,.16); --downbg:rgba(76,141,255,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --panel:#171a20; --panel2:#1f232b; --text:#e8eaed; --sub:#9aa1ad; --line:#2a2f38;
  --up:#ff5a5f; --down:#4c8dff; --accent:#e8eaed; --upbg:rgba(255,90,95,.16); --downbg:rgba(76,141,255,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.logo span{color:var(--up)}
.clock{color:var(--sub);font-size:12px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none;font-size:18px;line-height:1}
.search{margin-top:10px;position:relative}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 40px 0 14px;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .clear{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;background:none;color:var(--sub);display:none;font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.tab .n{opacity:.6;font-size:12px;margin-left:4px}
.status{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 4px}
@media (max-width:640px){.status{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.status::-webkit-scrollbar{display:none}.chip{flex:none}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sim);flex:none}
.dot.live{background:var(--live);box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.dot.warn{background:var(--warn)}
.dot.wait{background:var(--sim);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.list{margin:8px 0 40px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row,.head{display:grid;grid-template-columns:34px minmax(0,1.5fr) 110px 1fr .9fr .8fr 64px;align-items:center;gap:8px;padding:0 12px;min-height:52px;border-bottom:1px solid var(--line)}
.head{min-height:36px;font-size:12px;color:var(--sub);background:var(--panel2)}
.head div:nth-child(n+3){text-align:right}
.row{cursor:pointer;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2)}
.star{border:0;background:none;font-size:18px;color:var(--line);padding:0;width:30px;height:30px;line-height:1}
.star.on{color:var(--star)}
.nm{min-width:0}
.nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.price{font-weight:700;border-radius:6px;padding:2px 4px;margin-right:-4px;transition:background .6s}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.f-up{background:var(--upbg);transition:none} .f-down{background:var(--downbg);transition:none}
.badge{font-size:11px;border-radius:6px;padding:2px 6px;text-align:center;justify-self:end;white-space:nowrap}
.badge.live{color:var(--live);background:rgba(22,163,74,.12)}
.badge.sim{color:var(--sub);background:var(--panel2)}
.sec{padding:8px 12px;font-size:12px;font-weight:700;color:var(--sub);background:var(--panel2);border-bottom:1px solid var(--line)}
.empty{padding:40px 16px;text-align:center;color:var(--sub);line-height:1.6}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--panel);padding:12px;color:var(--sub);font-size:14px}
.note{color:var(--sub);font-size:12px;line-height:1.6;margin:-24px 0 32px}
/* mobile */
@media (max-width:640px){
  .head{display:none}
  .row{grid-template-columns:30px minmax(0,1fr) 64px auto;grid-template-areas:"s n g p" "s n g c";gap:0 10px;padding:8px 12px;min-height:60px}
  .row .spark{grid-area:g;width:64px;height:32px}
  .row .star{grid-area:s}
  .row .nm{grid-area:n}
  .row .price{grid-area:p}
  .row .chg{display:none}
  .row .rate{grid-area:c;font-size:13px}
  .row .badge{display:none}
  .nm small .bdg{display:inline}
}
.nm small .bdg{display:none;margin-left:4px}
.spark{width:110px;height:34px;display:block}
.closed{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;cursor:pointer;text-align:left;min-width:0}
.card:hover{background:var(--panel2)}
.card .cn{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cp{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.card .cr{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.card canvas{width:100%;height:46px;margin:6px 0 0}
@media (max-width:640px){
  .cards{display:flex;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}
  .cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 150px}
}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--panel);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:18px}
@media (max-width:640px){
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:88vh;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
}
.sh-top{display:flex;align-items:flex-start;gap:10px}
.sh-top h2{margin:0;font-size:19px}
.sh-top small{color:var(--sub);font-size:12px}
.sh-top .x{margin-left:auto}
.big{font-size:30px;font-weight:800;margin:14px 0 2px;font-variant-numeric:tabular-nums}
.bigchg{font-weight:600;font-variant-numeric:tabular-nums}
canvas{width:100%;height:200px;display:block;margin:14px 0 6px}
.chartcap{font-size:12px;color:var(--sub);text-align:right}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.info div{background:var(--panel2);border-radius:10px;padding:10px 12px}
.info span{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.info b{font-variant-numeric:tabular-nums;font-size:14px;word-break:break-all}
.info .wide{grid-column:1/-1}
.sh-actions{display:flex;gap:8px;margin-top:14px}
.sh-actions button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">마켓<span>보드</span></div>
      <div class="clock" id="clock"></div>
      <button class="iconbtn" id="themeBtn" title="화면 테마 전환" aria-label="화면 테마 전환">◐</button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="종목·코인·통화 검색 (예: 삼성, BTC, 엔화, 금)" autocomplete="off">
      <button class="clear" id="qClear" aria-label="검색어 지우기">×</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status"></div>
  <div class="cards" id="cards"></div>
  <div class="list" id="list"></div>
  <p class="note">
    <b>실시간</b> 표시는 공개 시세(업비트·바이낸스, ECB 환율, gold-api)를 직접 받아온 값이고, <b>모의</b> 표시는 무료 공개 API가 없어 실제와 비슷하게 움직이도록 만든 참고용 가상 시세입니다. 투자 판단에 사용하지 마세요.
    인터넷이 끊기거나 공개 API에 접속하지 못하면 해당 항목도 모의 데이터로 자동 전환됩니다.
  </p>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sh-top">
      <div><h2 id="mName"></h2><small id="mCode"></small></div>
      <button class="iconbtn x" id="mClose" aria-label="닫기">✕</button>
    </div>
    <div class="big" id="mPrice"></div>
    <div class="bigchg" id="mChg"></div>
    <canvas id="chart"></canvas>
    <div class="chartcap" id="mCap"></div>
    <div class="info" id="mInfo"></div>
    <div class="sh-actions"><button id="mFav"></button></div>
  </div>
</div>

   나중에 증권사·유료 API가 생기면 해당 함수만 교체하면 됩니다.
   ========================================================= */

  {id:'metal',name:'금·은'}
];
const CAT_NAME = Object.fromEntries(CATS.map(c=>[c.id,c.name]));
const items = new Map();
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let favs = new Set(store.get('mb.favs', ['kr:005930','coin:KRW-BTC','fx:USD','metal:XAU']));

  stock:{state:'sim', text:'주식·국채 모의 시세'}
};

/* ---------- 유틸 ---------- */
const $ = s=>document.querySelector(s);
const rnd = (a,b)=>a+Math.random()*(b-a);
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function autoDec(p){ const a=Math.abs(p); return a>=1000?0:a>=100?1:a>=1?2:a>=0.01?4:6; }
function fmt(n,dec){ if(n==null||!isFinite(n))return '-'; return n.toLocaleString('ko-KR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtTime(t){ if(!t)return '-'; const d=new Date(t); return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function dirOf(x){ return x>0?'up':x<0?'down':'flat'; }
function sign(x){ return x>0?'+':''; }
async function getJSON(url, ms=8000){
  const ctl = new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{ const r=await fetch(url,{signal:ctl.signal,cache:'no-store'}); if(!r.ok)throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
function krTick(p){ return p<2000?1:p<5000?5:p<20000?10:p<50000?50:p<200000?100:p<500000?500:1000; }

function upsert(o){
  let it = items.get(o.id);
  if(!it){
    it = Object.assign({hist:[], high:o.price, low:o.price, alias:'', unit:'', kind:'price'}, o);
    if(it.dec==null) it.dec = autoDec(it.price);
    items.set(it.id, it);
    return it;
  }
  const old = it.price;
  Object.assign(it, o);
  if(o.high==null) it.high = Math.max(it.high ?? it.price, it.price);
  if(o.low==null)  it.low  = Math.min(it.low ?? it.price, it.price);
  if(old!==it.price) it._flash = it.price>old?'f-up':'f-down';
  return it;
}
function pushHist(it, max=240){
  const h=it.hist, last=h[h.length-1];
  if(!last || Date.now()-last.t>=1500){ h.push({t:Date.now(), v:it.price}); if(h.length>max)h.shift(); }
  else last.v=it.price;
}
function removeCat(cat, src){ for(const [k,v] of items) if(v.cat===cat && (!src||v.src===src)) items.delete(k); }

/* ---------- 모의 시세 엔진 ----------
   · 날짜와 종목으로 정해지는 난수를 써서, 같은 날 새로고침해도 같은 가격·흐름이 나옵니다.
   · 시장 공통 흐름(지수) + 종목 고유 흐름을 섞어 지수와 종목이 함께 움직입니다.
   · 장 시간에만 움직이고, 장이 끝나면 종가에 멈춥니다. (공휴일은 반영하지 않음)
   · 하루 변동폭: 지수 약 1%, 대형주 약 2%, 국채 금리 수 bp 수준 */
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function gaussR(r){ let u=0; while(!u)u=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r()); }
const gaussAt = key => gaussR(rng(hashStr(key)));

// 시장별 거래 시간 (현지 시각). tz는 표준시 기준 UTC 오프셋, dst는 서머타임 규칙
const MARKETS = {
  KR:{tz:9,  open:[9,0],  close:[15,30], label:'국내'},
  US:{tz:-5, open:[9,30], close:[16,0],  dst:'us', label:'미국'},
  JP:{tz:9,  open:[9,0],  close:[15,30], label:'일본'},
  HK:{tz:8,  open:[9,30], close:[16,0],  label:'홍콩'},
  CN:{tz:8,  open:[9,30], close:[15,0],  label:'중국'},
  EU:{tz:1,  open:[9,0],  close:[17,30], dst:'eu', label:'유럽'},
  UK:{tz:0,  open:[8,0],  close:[16,30], dst:'eu', label:'영국'},
  CRYPTO:{tz:9, open:[9,0], close:[33,0], weekend:true},  // 24시간, 매일 오전 9시 기준
  FX:{tz:9,  open:[9,0],  close:[33,0]},                  // 평일 24시간
  METAL:{tz:9, open:[9,0], close:[33,0]}
};
function nthSunday(y,m,n){ const d=new Date(Date.UTC(y,m,1)); const first=(7-d.getUTCDay())%7+1; return Date.UTC(y,m,first+7*(n-1)); }
function lastSunday(y,m){ const d=new Date(Date.UTC(y,m+1,0)); return Date.UTC(y,m,d.getUTCDate()-d.getUTCDay()); }
function tzOffset(mk, ms){
  const m=MARKETS[mk], y=new Date(ms).getUTCFullYear();
  if(m.dst==='us'){ const s=nthSunday(y,2,2)+7*3600e3, e=nthSunday(y,10,1)+6*3600e3; if(ms>=s&&ms<e) return m.tz+1; }
  if(m.dst==='eu'){ const s=lastSunday(y,2)+3600e3, e=lastSunday(y,9)+3600e3; if(ms>=s&&ms<e) return m.tz+1; }
  return m.tz;
}
const DAY=864e5;
const isTradingDay = (mk,dayIdx)=> MARKETS[mk].weekend || ((dayIdx%7)+3)%7<5; // dayIdx 0 = 1970-01-01(목)
function sessionOf(dayIdx, mk){
  const m=MARKETS[mk], off=tzOffset(mk, dayIdx*DAY+12*3600e3)*3600e3;
  return {day:dayIdx, open:dayIdx*DAY+(m.open[0]*60+m.open[1])*60e3-off, close:dayIdx*DAY+(m.close[0]*60+m.close[1])*60e3-off};
}
function currentSession(mk, now){
  const off=tzOffset(mk,now)*3600e3; let d=Math.floor((now+off)/DAY);
  for(let i=0;i<10;i++,d--){
    if(!isTradingDay(mk,d)) continue;
    const s=sessionOf(d,mk); if(now>=s.open) return Object.assign(s,{isOpen:now<s.close});
  }
}
function prevTradingDay(mk,d){ do{d--;}while(!isTradingDay(mk,d)); return d; }

// 종가 수준: 기준가 주변을 천천히 오가는 과정 (최근 40거래일 충격의 가중합)
function dailyShock(it, d){
  const m = gaussAt(it.mk+'|m|'+d), e = gaussAt(it.id+'|e|'+d);
  return it.beta*m + Math.sqrt(1-it.beta*it.beta)*e;
}
function levelX(it, d){
  let x=0, w=1, day=d;
  for(let k=0;k<40;k++){ x += w*dailyShock(it,day)*it.dvol; w*=0.95; day=prevTradingDay(it.mk,day); }
  return x;
}
const fromX = (it,x)=> it.add ? it.base + x : it.base*Math.exp(x);

// 하루 장중 경로: 전일 종가 → 당일 종가를 잇는 브라운 브리지 (시장 공통 + 종목 고유)
const bridgeCache = new Map();
function bridge(key, n){
  let b = bridgeCache.get(key); if(b && b.length===n+1) return b;
  const r = rng(hashStr(key)); b = new Float64Array(n+1);
  for(let i=1;i<=n;i++) b[i]=b[i-1]+gaussR(r)/Math.sqrt(n);
  const end=b[n]; for(let i=0;i<=n;i++) b[i]-=end*i/n;
  bridgeCache.set(key,b); return b;
}
function buildDay(it, s){
  const n = Math.max(60, Math.round((s.close-s.open)/1000/20));       // 20초 간격
  const xp = levelX(it, prevTradingDay(it.mk,s.day)), xc = levelX(it, s.day);
  const bm = bridge(it.mk+'|b|'+s.day, n), bi = bridge(it.id+'|b|'+s.day, n);
  const a = it.beta, c = Math.sqrt(1-a*a), iv = it.dvol*0.7, gap = (s.close-s.open)>=DAY ? 0 : 0.3*(xc-xp); // 24시간 시장은 시가 갭 없음
  const path = new Float64Array(n+1);
  for(let i=0;i<=n;i++){ const t=i/n; path[i] = xp + gap*(i?1:0) + (xc-xp-gap*(i?1:0))*t + iv*(a*bm[i]+c*bi[i]); }
  path[0]=xp;
  it.day = {key:s.day, s, n, path, prev:fromX(it,xp)};
}
function simValue(it, now){
  const s = currentSession(it.mk, now);
  if(!it.day || it.day.key!==s.day) buildDay(it, s);
  const {n, path} = it.day;
  const f = Math.min(1, Math.max(0, (now-s.open)/(s.close-s.open))) * n;
  const i = Math.min(n-1, Math.floor(f)), x = path[i] + (path[i+1]-path[i])*(f-i);
  return {s, x, f};
}
function roundSim(it, v){
  if(it.cat==='kr' && it.kind!=='idx'){ const t=krTick(v); return Math.round(v/t)*t; }
  const p=Math.pow(10,it.dec); return Math.round(v*p)/p;
}
function simUpdate(it, now){
  const {s, x, f} = simValue(it, now);
  const price = roundSim(it, fromX(it,x));
  if(it.price!=null && price!==it.price) it._flash = price>it.price?'f-up':'f-down';
  const changed = price!==it.price || it.closed!==!s.isOpen || it.hist.length===0;
  it.price = price; it.prev = roundSim(it, it.day.prev); it.closed = !s.isOpen;
  it.updated = s.isOpen ? now : s.close;
  if(changed){
    // 차트용: 장 시작부터 현재까지 최대 240개 점
    const {n, path} = it.day, last = Math.floor(f), step = Math.max(1, Math.ceil(n/240)), h=[];
    for(let i=0;i<=last;i+=step) h.push({t:s.open+(s.close-s.open)*i/n, v:fromX(it,path[i])});
    h.push({t:Math.min(now,s.close), v:price});
    it.hist = h;
    it.high = roundSim(it, Math.max(...h.map(p=>p.v))); it.low = roundSim(it, Math.min(...h.map(p=>p.v)));
    it.histLabel = (s.isOpen ? '오늘 장 흐름' : '최근 거래일 흐름 · 장마감') + ' (모의)';
    it._dirty = true;
  }
}
function simItem(o){
  const it = upsert(Object.assign({src:'sim', srcName:'모의 시세', beta:0.7, hist:[]}, o, {price:null}));
  it.price = null; simUpdate(it, Date.now());
  return it;
}

      }

function match(it, q){
  if(!q) return true;
  const hay = (it.name+' '+it.code+' '+it.alias+' '+CAT_NAME[it.cat]).toLowerCase().replace(/\s+/g,'');
  return q.split(/\s+/).every(w=>hay.includes(w.replace(/\s+/g,'')));
}
function sortItems(a,b){
  const ra = a.rank!=null&&a.rank>=0?a.rank:999, rb = b.rank!=null&&b.rank>=0?b.rank:999;
  if(ra!==rb) return ra-rb;
  if(a.cat==='coin' && b.cat==='coin') return (b.vol24||0)-(a.vol24||0);
  return 0;
}
function visible(){
  const q = query.trim().toLowerCase();

    if(tab==='fav' && !favs.has(it.id)) continue;
    if(tab!=='all' && tab!=='fav' && it.cat!==tab) continue;
    if(!match(it,q)) continue;
    (groups[it.cat] ||= []).push(it);
  }
  const order = ['kr','us','coin','fx','bond','metal'];
  return order.filter(c=>groups[c]).map(c=>({cat:c, list:groups[c].sort(sortItems)}));
}

/* ---------- 목록·카드용 미니 그래프 ---------- */
function drawSpark(cv, it, d){
  if(!cv) return;
  const h = it.hist, last = h[h.length-1];
  const theme = document.documentElement.dataset.theme||'auto';
  const sig = h.length+'|'+(last?last.v:'')+'|'+it.prev+'|'+cv.clientWidth+'|'+theme;
  if(cv.dataset.sig===sig) return;
  const w=cv.clientWidth, ht=cv.clientHeight; if(!w||!ht) return;
  cv.dataset.sig=sig;
  const dpr=window.devicePixelRatio||1; cv.width=w*dpr; cv.height=ht*dpr;
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,ht);
  const css=getComputedStyle(document.documentElement);
  const col=css.getPropertyValue(d==='down'?'--down':d==='up'?'--up':'--flat').trim(), sub=css.getPropertyValue('--sub').trim();
  const pts = h.length?h:[{v:it.price}];
  const vs=pts.map(p=>p.v).concat([it.prev]); let mn=Math.min(...vs), mx=Math.max(...vs);
  if(mx===mn){ mx+=1; mn-=1; }
  const X=i=>2+(pts.length===1?w-4:i/(pts.length-1)*(w-4)), Y=v=>3+(1-(v-mn)/(mx-mn))*(ht-6);
  g.setLineDash([2,3]); g.strokeStyle=sub; g.globalAlpha=.6; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,Y(it.prev)); g.lineTo(w,Y(it.prev)); g.stroke(); g.setLineDash([]); g.globalAlpha=1;
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(X(i),Y(p.v)):g.moveTo(X(i),Y(p.v)));
  g.strokeStyle=col; g.lineWidth=1.5; g.lineJoin='round'; g.stroke();
  if(pts.length===1){ g.beginPath(); g.arc(X(0),Y(pts[0].v),2.5,0,7); g.fillStyle=col; g.fill(); }
}
const CARD_IDS = [['kr:KOSPI'],['kr:KOSDAQ'],['us:SPX'],['us:IXIC'],['fx:USD'],['coin:KRW-BTC','coin:BN-BTC','coin:sim-BTC'],['metal:XAU']];

function drawChart(it, d){
  const cv = $('#chart'), dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(cv.width!==w*dpr || cv.height!==h*dpr){ cv.width=w*dpr; cv.height=h*dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const css = getComputedStyle(document.documentElement);
  const col = css.getPropertyValue(d==='down'?'--down':d==='up'?'--up':'--flat').trim();
  const sub = css.getPropertyValue('--sub').trim(), line = css.getPropertyValue('--line').trim();
  const pts = it.hist.length?it.hist:[{t:Date.now(),v:it.price}];
  const vs = pts.map(p=>p.v).concat([it.prev]);
  let mn=Math.min(...vs), mx=Math.max(...vs); if(mx===mn){mx+=Math.abs(mx)*0.001||1; mn-=Math.abs(mn)*0.001||1;}
  const pad={l:4,r:62,t:10,b:10}, W=w-pad.l-pad.r, H=h-pad.t-pad.b;
  const X=i=>pad.l+(pts.length===1?W:i/(pts.length-1)*W), Y=v=>pad.t+(1-(v-mn)/(mx-mn))*H;
  g.font='11px sans-serif'; g.fillStyle=sub; g.strokeStyle=line; g.lineWidth=1;
  for(let k=0;k<=3;k++){ const v=mn+(mx-mn)*k/3, y=Y(v); g.beginPath(); g.moveTo(pad.l,y); g.lineTo(pad.l+W,y); g.stroke(); g.fillText(fmt(v,it.dec),pad.l+W+6,y+4); }
  // 기준선(전일 종가)
  g.setLineDash([4,4]); g.strokeStyle=sub; g.beginPath(); g.moveTo(pad.l,Y(it.prev)); g.lineTo(pad.l+W,Y(it.prev)); g.stroke(); g.setLineDash([]);
  const grad=g.createLinearGradient(0,pad.t,0,pad.t+H); grad.addColorStop(0,col+'40'); grad.addColorStop(1,col+'00');
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(X(i),Y(p.v)):g.moveTo(X(i),Y(p.v)));
  g.lineTo(X(pts.length-1),pad.t+H); g.lineTo(X(0),pad.t+H); g.closePath(); g.fillStyle=grad; g.fill();
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(X(i),Y(p.v)):g.moveTo(X(i),Y(p.v))); g.strokeStyle=col; g.lineWidth=2; g.stroke();
  const lx=X(pts.length-1), ly=Y(pts[pts.length-1].v); g.beginPath(); g.arc(lx,ly,3.5,0,7); g.fillStyle=col; g.fill();
}

}
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  tab=b.dataset.t; store.set('mb.tab',tab); showAll={};
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  render(true); window.scrollTo({top:0});
});
$('#list').addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]'); if(f){ e.stopPropagation(); toggleFav(f.dataset.fav); return; }
  const m=e.target.closest('[data-more]'); if(m){ showAll[m.dataset.more]=true; render(true); return; }
  const r=e.target.closest('.row'); if(r) openModal(r.dataset.id);
});
let qt;
$('#q').addEventListener('input',e=>{
  $('#qClear').style.display = e.target.value?'block':'none';
  clearTimeout(qt); qt=setTimeout(()=>{ query=e.target.value; render(true); },120);
});
$('#qClear').addEventListener('click',()=>{ $('#q').value=''; query=''; $('#qClear').style.display='none'; render(true); $('#q').focus(); });
$('#mClose').addEventListener('click',closeModal);
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
$('#mFav').addEventListener('click',()=>{ if(openId){ toggleFav(openId); renderModal(); } });
window.addEventListener('resize',()=>{ if(openId) renderModal(); render(false); });

const themes=['auto','light','dark'];
let theme = store.get('mb.theme','auto');
function applyTheme(){ if(theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',theme);
  $('#themeBtn').title = '테마: '+({auto:'시스템',light:'라이트',dark:'다크'})[theme]; if(openId) renderModal(); if(items.size) render(false); }
$('#themeBtn').addEventListener('click',()=>{ theme=themes[(themes.indexOf(theme)+1)%3]; store.set('mb.theme',theme); applyTheme(); });

function tickClock(){ $('#clock').textContent = new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

/* ---------- 시작 ---------- */
applyTheme(); buildTabs(); tickClock(); setInterval(tickClock,1000);
addSimStocks(); simStep(); render(true);
setInterval(simStep, 2000);
// 세 소스를 동시에 연결 (금 원화 환산은 환율이 들어오는 대로 다음 갱신에서 반영)
['fx','coin','metal'].forEach(k=>startSource(k));
</script>
</body>
