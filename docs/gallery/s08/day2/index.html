<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>익명게시판</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --border:#dde1e8; --border-strong:#c3c9d4;
    --text:#15181e; --text-dim:#5f6775; --text-faint:#8d95a3;
    --accent:#2f6df6; --accent-text:#ffffff; --accent-soft:#e7effe;
    --danger:#cf4034; --danger-soft:#fdeceb;
    --warn:#a8600b; --warn-soft:#fbf1e0;
    --poll:#2e7d4f; --poll-soft:#e6f3ec;
    --radius:12px;
    --focus:#2f6df6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101216; --surface:#181b21; --surface-2:#22262e; --border:#2f343d; --border-strong:#454c58;
      --text:#e9ebef; --text-dim:#a6adba; --text-faint:#79808e;
      --accent:#6595ff; --accent-text:#0b0d11; --accent-soft:#1d2840;
      --danger:#ff7a6d; --danger-soft:#35211f;
      --warn:#e0a458; --warn-soft:#33281a;
      --poll:#78c495; --poll-soft:#1b2d23;
      --focus:#8fb0ff;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,textarea{font:inherit; color:inherit}
  .hidden{display:none !important}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

  /* ---------- 버튼 ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:40px; padding:9px 16px; border-radius:9px;
    font-weight:600; font-size:14px;
    background:var(--surface); color:var(--text);
    border:1.5px solid var(--border-strong); transition:background .12s, border-color .12s;
  }
  .btn:hover{background:var(--surface-2)}
  .btn-primary{background:var(--accent); color:var(--accent-text); border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent); filter:brightness(1.08)}
  .btn-danger{background:var(--danger-soft); color:var(--danger); border-color:var(--danger)}
  .btn-danger:hover{background:var(--danger-soft); filter:brightness(.97)}
  .btn-sm{min-height:34px; padding:6px 12px; font-size:13.5px; border-radius:8px}
  .btn-block{width:100%}

  /* 목록으로 돌아가기 — 항상 눈에 띄도록 강조 */
  .btn-back{
    display:inline-flex; align-items:center; gap:8px;
    min-height:42px; padding:9px 18px 9px 14px; border-radius:999px;
    font-weight:700; font-size:14px;
    background:var(--accent-soft); color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .btn-back:hover{background:var(--accent); color:var(--accent-text)}
  .btn-back .arrow{font-size:16px; line-height:1}
  .back-bar{margin-bottom:14px}
  .back-bottom{margin-top:28px; padding-top:20px; border-top:1px solid var(--border)}

  /* ---------- 인증 ---------- */
  .auth{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .auth-card{width:100%; max-width:430px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:32px}
  .auth-card h1{margin:0 0 6px; font-size:23px; letter-spacing:-.02em}
  .auth-card .sub{margin:0 0 24px; color:var(--text-dim); font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-dim)}
  .field input, .field textarea{
    width:100%; padding:11px 12px; background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:9px; outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent); background:var(--surface)}
  .note{font-size:12.5px; color:var(--text-dim); line-height:1.6; margin-top:18px;
    background:var(--surface-2); padding:13px 14px; border-radius:10px; border:1px solid var(--border)}
  .err{color:var(--danger); font-size:13px; margin-top:10px; min-height:19px; font-weight:600}

  /* ---------- 레이아웃 ---------- */
  header.top{position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border)}
  .top-inner{max-width:760px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:10px}
  .brand{font-size:17px; font-weight:700; letter-spacing:-.02em; margin-right:auto; padding:6px 4px}
  .whoami{font-size:12.5px; color:var(--text-dim); margin-right:2px}
  main{max-width:760px; margin:0 auto; padding:22px 20px 90px}
  .list-label{display:flex; align-items:baseline; gap:8px; margin:0 0 12px; font-size:13.5px;
    font-weight:700; color:var(--text-dim)}
  .list-label .count{font-size:12.5px; font-weight:500; color:var(--text-faint)}
  .list-label + .list-label, .group + .list-label{margin-top:26px}

  /* ---------- 목록 ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:15px 18px; margin-bottom:10px; display:block; cursor:pointer;
    transition:border-color .12s}
  .card:hover{border-color:var(--border-strong)}
  .card h3{margin:7px 0 4px; font-size:16.5px; letter-spacing:-.01em; font-weight:700}
  .snippet{color:var(--text-dim); font-size:13.5px; margin:0 0 10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card.pinned{border-color:var(--poll); background:var(--surface)}
  .meta{display:flex; flex-wrap:wrap; align-items:center; gap:10px; font-size:12.5px; color:var(--text-faint)}
  .badge{display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    background:var(--surface-2); color:var(--text-dim); white-space:nowrap}
  .badge.t-general{background:var(--accent-soft); color:var(--accent)}
  .badge.t-report{background:var(--danger-soft); color:var(--danger)}
  .badge.t-poll{background:var(--poll-soft); color:var(--poll)}
  .badge.pin{background:var(--poll-soft); color:var(--poll)}
  .badge.mine{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border)}
  .badge.author{background:var(--warn-soft); color:var(--warn)}
  .empty{text-align:center; padding:50px 20px; color:var(--text-dim); font-size:14px;
    background:var(--surface); border:1px dashed var(--border-strong); border-radius:var(--radius)}

  /* ---------- 상세 ---------- */
  .detail h1{font-size:23px; margin:10px 0 8px; letter-spacing:-.02em; line-height:1.35}
  .body-text{white-space:pre-wrap; word-break:break-word; margin:18px 0 22px}
  .divider{height:1px; background:var(--border); margin:22px 0}
  .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .spacer{margin-left:auto}

  /* ---------- 투표 ---------- */
  .poll{background:var(--surface); border:1.5px solid var(--poll); border-radius:var(--radius); padding:16px 18px}
  .poll-head{font-size:13.5px; font-weight:700; color:var(--poll); margin-bottom:12px}
  .poll-opt{width:100%; text-align:left; padding:12px 14px; border:1.5px solid var(--border-strong);
    border-radius:9px; background:var(--surface-2); margin-bottom:8px; font-size:14.5px; font-weight:600}
  .poll-opt:hover{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .result-row{margin-bottom:11px}
  .result-label{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px; gap:10px}
  .result-label .n{color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap}
  .bar{height:10px; background:var(--surface-2); border-radius:999px; overflow:hidden}
  .bar>i{display:block; height:100%; background:var(--text-faint); border-radius:999px;
    transition:width .35s ease}
  .result-row.picked .bar>i{background:var(--poll)}
  .result-row.picked .result-label strong{color:var(--poll)}
  .poll-foot{font-size:12.5px; color:var(--text-dim); margin-top:12px}
  .mini{margin-top:10px}
  .mini .bar{height:8px}
  .mini .result-label{font-size:12.5px; margin-bottom:4px}

  /* ---------- 댓글 ---------- */
  .comment{background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:8px}
  .comment.by-author{border-color:var(--warn); background:var(--surface)}
  .comment .ctext{white-space:pre-wrap; word-break:break-word; margin:7px 0 8px; font-size:14.5px}
  .comment textarea, .comment-form textarea{width:100%; min-height:76px; padding:10px 12px;
    background:var(--surface-2); border:1.5px solid var(--border); border-radius:9px;
    outline:none; resize:vertical}
  .comment textarea:focus, .comment-form textarea:focus{border-color:var(--accent); background:var(--surface)}
  .comment-form{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 14px}
  .comment-form textarea{margin-bottom:9px}

  /* ---------- 모달 ---------- */
  .modal{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; padding:20px}
  .modal-box{background:var(--surface); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:560px; max-height:90vh; overflow:auto; padding:22px}
  .modal-box h2{margin:0 0 16px; font-size:18px; letter-spacing:-.01em}
  .types{display:flex; gap:8px; margin-bottom:14px}
  .types label{flex:1; text-align:center; padding:10px; border:1.5px solid var(--border);
    border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; color:var(--text-dim)}
  .types input{position:absolute; opacity:0; width:0; height:0}
  .types label:has(input:checked){border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .types label:has(input:focus-visible){outline:2px solid var(--focus); outline-offset:2px}
  .opt-row{display:flex; gap:8px; margin-bottom:8px}
  .opt-row input{flex:1; padding:10px 12px; background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:9px; outline:none}
  .opt-row input:focus{border-color:var(--accent); background:var(--surface)}
  textarea#pBody{min-height:150px; resize:vertical}
  .hint{font-size:12.5px; color:var(--text-dim); margin:4px 0 0}

  /* ---------- 계정/데이터 ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:12px}
  .panel h3{margin:0 0 10px; font-size:14.5px}
  .kv{display:grid; grid-template-columns:150px 1fr; gap:7px 12px; font-size:13.5px}
  .kv dt{color:var(--text-dim)}
  .kv dd{margin:0; word-break:break-all; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px}
  pre.store{background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:12px;
    font-size:11.5px; line-height:1.55; overflow:auto; max-height:230px; margin:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .store-note{font-size:12.5px; color:var(--text-dim); margin:0 0 9px}
  .danger-zone{border:1.5px solid var(--danger)}
  .danger-zone h3{color:var(--danger)}

  /* ---------- 토스트 ---------- */
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
    background:var(--text); color:var(--bg); padding:11px 18px; border-radius:999px;
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; z-index:60; max-width:90vw; text-align:center}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:520px){
    .top-inner{flex-wrap:wrap; gap:8px}
    .brand{width:100%; margin-right:0}
    .kv{grid-template-columns:1fr; gap:2px 0}
    .kv dt{margin-top:8px}
  }
</style>
</head>
<body>

<!-- ===================== 1. 학교 이메일 인증 ===================== -->
<div class="auth" id="authView">
  <div class="auth-card">
    <h1>익명게시판</h1>
    <p class="sub">학교 이메일로 재학생 인증을 마치면 익명 계정이 만들어집니다.</p>
    <div class="field">
      <label for="emailInput">학교 이메일</label>
      <input id="emailInput" type="email" placeholder="student@school.hs.kr" autocomplete="off">
    </div>
    <button class="btn btn-primary btn-block" id="authBtn">인증하고 시작하기</button>
    <div class="err" id="authErr"></div>
    <p class="note">
      입력한 이메일은 SHA-256 단방향 암호화를 거친 뒤 즉시 폐기되며, 원문은 어디에도 저장되지 않습니다.
      암호화된 값은 개인정보 저장소에만 보관되고, 게시글 저장소에는 계정과 연결되지 않는 익명 토큰만 기록됩니다.
    </p>
  </div>
</div>

<!-- ===================== 2. 메인 앱 ===================== -->
<div id="appView" class="hidden">
  <header class="top">
    <div class="top-inner">
      <button class="brand" data-action="go-list">익명게시판</button>
      <span class="whoami">익명으로 활동 중</span>
      <button class="btn btn-sm" data-action="go-account">내 계정</button>
      <button class="btn btn-sm btn-primary" data-action="open-compose">글쓰기</button>
    </div>
  </header>

  <main>
    <section id="listView"></section>
    <section id="detailView" class="hidden detail"></section>
    <section id="accountView" class="hidden"></section>
  </main>
</div>

<!-- ===================== 3. 글쓰기 / 수정 모달 ===================== -->
<div class="modal hidden" id="composeModal">
  <div class="modal-box">
    <h2 id="composeTitle">새 글 쓰기</h2>

    <div class="field" id="typeField">
      <label>게시글 유형</label>
      <div class="types">
        <label><input type="radio" name="ptype" value="general" checked>일반</label>
        <label><input type="radio" name="ptype" value="report">고발</label>
        <label><input type="radio" name="ptype" value="poll">투표</label>
      </div>
    </div>

    <div class="field">
      <label for="pTitle">제목</label>
      <input id="pTitle" type="text" maxlength="100" placeholder="제목을 입력하세요">
    </div>

    <div class="field">
      <label for="pBody">내용</label>
      <textarea id="pBody" placeholder="내용을 입력하세요"></textarea>
    </div>

    <div class="field hidden" id="pollField">
      <label>투표 선택지 (2~6개)</label>
      <div id="optList"></div>
      <button class="btn btn-sm" id="addOptBtn">선택지 추가</button>
    </div>

    <p class="hint" id="composeHint">작성자 정보는 익명 토큰으로만 기록되며, 다른 사용자에게는 ‘익명’으로만 표시됩니다.</p>
    <div class="err" id="composeErr"></div>
    <div class="row">
      <span class="spacer"></span>
      <button class="btn" data-action="close-compose">취소</button>
      <button class="btn btn-primary" id="submitPostBtn">등록</button>
    </div>
  </div>
</div>

<!-- ===================== 4. 확인 모달 ===================== -->
<div class="modal hidden" id="confirmModal">
  <div class="modal-box" style="max-width:420px">
    <h2 id="confirmTitle">확인</h2>
    <p id="confirmMsg" style="color:var(--text-dim); font-size:14px; margin:0 0 18px"></p>
    <div class="row">
      <span class="spacer"></span>
      <button class="btn" id="confirmNo">취소</button>
      <button class="btn btn-danger" id="confirmYes">삭제</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* =========================================================
   0. 저장소 — 개인정보 / 게시글 데이터 분리 저장
   ========================================================= */
var KEY_IDENTITY = "anonboard.identity.v1";  // 개인정보 저장소 (이메일 해시)
var KEY_CONTENT  = "anonboard.content.v1";   // 게시글 저장소 (익명 토큰만)
var KEY_SESSION  = "anonboard.session.v1";   // 현재 탭 세션

var memFallback = {};                        // 브라우저 저장소 사용 불가 시 대체

function lsGet(k){
  try{ var v = localStorage.getItem(k); return v === null ? (memFallback[k] || null) : v; }
  catch(e){ return memFallback[k] || null; }
}
function lsSet(k, v){
  memFallback[k] = v;
  try{ localStorage.setItem(k, v); }catch(e){}
}
function ssGet(k){
  try{ var v = sessionStorage.getItem(k); return v === null ? (memFallback["s:"+k] || null) : v; }
  catch(e){ return memFallback["s:"+k] || null; }
}
function ssSet(k, v){
  memFallback["s:"+k] = v;
  try{ sessionStorage.setItem(k, v); }catch(e){}
}
function ssDel(k){
  delete memFallback["s:"+k];
  try{ sessionStorage.removeItem(k); }catch(e){}
}

var identityDB = { accounts: {} };            // accountId -> {emailHash, domain, joinedAt, authorRef}
var contentDB  = { posts: [], comments: [] }; // 게시글/댓글 — 개인정보 없음, authorRef만 기록
var session    = null;                        // {accountId, authorRef}

function loadAll(){
  try{ identityDB = JSON.parse(lsGet(KEY_IDENTITY)) || { accounts:{} }; }
  catch(e){ identityDB = { accounts:{} }; }
  try{ contentDB = JSON.parse(lsGet(KEY_CONTENT)) || { posts:[], comments:[] }; }
  catch(e){ contentDB = { posts:[], comments:[] }; }
  if(!identityDB.accounts) identityDB.accounts = {};
  if(!contentDB.posts) contentDB.posts = [];
  if(!contentDB.comments) contentDB.comments = [];
}
function persist(){
  lsSet(KEY_IDENTITY, JSON.stringify(identityDB));
  lsSet(KEY_CONTENT,  JSON.stringify(contentDB));
}

/* =========================================================
   1. SHA-256 단방향 암호화
   ========================================================= */
var K256=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function rotr(x,n){ return ((x>>>n)|(x<<(32-n)))>>>0; }

function sha256(message){
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes=new TextEncoder().encode(message), l=bytes.length;
  var total=((((l+8)>>6)+1)*64);
  var buf=new Uint8Array(total);
  buf.set(bytes); buf[l]=0x80;
  var dv=new DataView(buf.buffer);
  dv.setUint32(total-8, Math.floor(l*8/4294967296));
  dv.setUint32(total-4, (l*8)>>>0);
  var w=new Uint32Array(64);
  for(var i=0;i<total;i+=64){
    for(var t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
    for(t=16;t<64;t++){
      var s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3);
      var s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(t=0;t<64;t++){
      var S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      var ch=(e&f)^((~e)&g);
      var t1=(h+S1+ch+K256[t]+w[t])>>>0;
      var S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      var maj=(a&b)^(a&c)^(b&c);
      var t2=(S0+maj)>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map(function(x){ return x.toString(16).padStart(8,"0"); }).join("");
}

var SALT = "anonboard::v1::";
function hashEmail(email){ return sha256(SALT + email.trim().toLowerCase()); }

/* =========================================================
   2. 유틸
   ========================================================= */
function uid(){
  if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID().replace(/-/g,"");
  var s="";
  for(var i=0;i<32;i++) s += Math.floor(Math.random()*16).toString(16);
  return s;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
  });
}
function fmt(ts){
  var d=new Date(ts), now=new Date(), diff=(now-d)/1000;
  if(diff < 60) return "방금 전";
  if(diff < 3600) return Math.floor(diff/60)+"분 전";
  if(diff < 86400) return Math.floor(diff/3600)+"시간 전";
  var p=function(n){ return String(n).padStart(2,"0"); };
  var y=(d.getFullYear()===now.getFullYear()) ? "" : d.getFullYear()+".";
  return y+(d.getMonth()+1)+"."+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes());
}
var TYPE_LABEL={general:"일반", report:"고발", poll:"투표"};
var TYPE_CLASS={general:"t-general", report:"t-report", poll:"t-poll"};

function $(id){ return document.getElementById(id); }

function getComment(id){ return contentDB.comments.filter(function(c){ return c.id===id; })[0] || null; }
function commentsOf(id){
  return contentDB.comments.filter(function(c){ return c.postId===id; })
                           .sort(function(a,b){ return a.createdAt-b.createdAt; });
}
function isMine(ref){ return !!session && ref===session.authorRef; }

var toastTimer;
function toast(msg){
  var el=$("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove("show"); }, 2000);
}

var view = "list";            // list | detail | account

/* =========================================================
   4. 인증 — 학교 이메일 단방향 암호화
   ========================================================= */
$("authBtn").addEventListener("click", doAuth);
$("emailInput").addEventListener("keydown", function(e){ if(e.key==="Enter") doAuth(); });

function doAuth(){
  var email = $("emailInput").value.trim().toLowerCase();
  var err = $("authErr");
  err.textContent = "";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    err.textContent = "학교 이메일 형식으로 입력하세요. 예: student@school.hs.kr";
    return;
  }
  var domain = email.split("@")[1];
  var hash = hashEmail(email);

  // 원문 이메일은 여기서 폐기되고, 이후 어디에도 저장되지 않는다.
  $("emailInput").value = "";
  email = null;

  var found = null;
  Object.keys(identityDB.accounts).forEach(function(id){
    if(identityDB.accounts[id].emailHash === hash) found = id;
  });

  if(!found){
    found = "acc_" + uid().slice(0,12);       // 해시와 무관한 임의 계정 ID
    identityDB.accounts[found] = {
      emailHash: hash,
      domain: domain,
      joinedAt: Date.now(),
      authorRef: "ref_" + uid().slice(0,16)   // 게시글 저장소에 기록되는 익명 토큰
    };
    persist();
  }

  session = { accountId: found, authorRef: identityDB.accounts[found].authorRef };
  ssSet(KEY_SESSION, found);
  enterApp();
  toast("재학생 인증이 완료되었습니다.");
}

function enterApp(){
  $("authView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  go("list");
}

function logout(){
  session = null; currentPostId = null; view = "list";
  ssDel(KEY_SESSION);
  $("appView").classList.add("hidden");
  $("authView").classList.remove("hidden");
  $("authErr").textContent = "";
}

/* =========================================================
   5. 라우팅 & 렌더
   ========================================================= */
function go(v, id){
  view = v;
  if(id !== undefined) currentPostId = id;
  editingCommentId = null;
  render();
  window.scrollTo(0,0);
}

function render(){
  if(!session) return;
  if(view==="detail" && !getPost(currentPostId)) view="list";
  $("listView").classList.toggle("hidden", view!=="list");
  $("detailView").classList.toggle("hidden", view!=="detail");
  $("accountView").classList.toggle("hidden", view!=="account");
  if(view==="list") renderList();
  else if(view==="detail") renderDetail();
  else renderAccount();
}

function totalVotes(p){
  if(p.type!=="poll" || !p.poll) return 0;
  return p.poll.options.reduce(function(s,o){ return s+o.voters.length; }, 0);
}
function myChoice(p){
  if(p.type!=="poll" || !p.poll || !session) return -1;
  for(var i=0;i<p.poll.options.length;i++){
    if(p.poll.options[i].voters.indexOf(session.authorRef) !== -1) return i;
  }
  return -1;
}

/* ---------- 목록: 투표 글 최상단 고정 + 최신 글 ---------- */
function renderList(){
  var all = contentDB.posts.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
  if(!all.length){
    $("listView").innerHTML =
      '<div class="list-label">최신 글</div>'
      + '<div class="empty">아직 등록된 글이 없습니다.<br>글쓰기 버튼을 눌러 첫 글을 남겨보세요.</div>';
    return;
  }

  var polls  = all.filter(function(p){ return p.type==="poll"; });
  var normal = all.filter(function(p){ return p.type!=="poll"; });
  var html = "";

  if(polls.length){
    html += '<div class="list-label">실시간 투표 <span class="count">최상단 고정 · '+polls.length+'개</span></div>';
    html += '<div class="group">' + polls.map(pollCard).join("") + '</div>';
  }

  html += '<div class="list-label">최신 글 <span class="count">'+normal.length+'개</span></div>';
  html += normal.length
    ? '<div class="group">' + normal.map(postCard).join("") + '</div>'
    : '<div class="empty">투표 외의 글이 아직 없습니다.</div>';

  $("listView").innerHTML = html;
}

/* 고정된 투표 카드 — 참여 현황을 실시간으로 보여준다 */
function pollCard(p){
  var total = totalVotes(p);
  var mine_i = myChoice(p);
  var voted = mine_i !== -1;
  var top = p.poll.options.slice().sort(function(a,b){ return b.voters.length-a.voters.length; })[0];
  var pct = total ? Math.round(top.voters.length/total*100) : 0;

  return '<article class="card pinned" role="button" tabindex="0" data-action="open-post" data-id="'+p.id+'">'
    + '<div class="row" style="gap:6px">'
    +   '<span class="badge pin">고정</span>'
    +   '<span class="badge t-poll">투표</span>'
    +   (isMine(p.authorRef) ? '<span class="badge mine">내 글</span>' : '')
    + '</div>'
    + '<h3>'+esc(p.title)+'</h3>'
    + '<div class="meta"><span>익명</span><span>'+fmt(p.createdAt)+'</span>'
    +   '<span>참여 '+total+'명</span><span>댓글 '+commentsOf(p.id).length+'</span></div>'
    + '<div class="mini">'
    +   '<div class="result-label">'
    +     '<span>'+(voted ? esc(top.text) : "참여하면 결과가 공개됩니다")+'</span>'
    +     '<span class="n">'+(voted ? pct+"%" : "")+'</span>'
    +   '</div>'
    +   '<div class="bar"><i style="width:'+(voted?pct:0)+'%"></i></div>'
    + '</div>'
    + '</article>';
}

function postCard(p){
  return '<article class="card" role="button" tabindex="0" data-action="open-post" data-id="'+p.id+'">'
    + '<div class="row" style="gap:6px">'
    +   '<span class="badge '+TYPE_CLASS[p.type]+'">'+TYPE_LABEL[p.type]+'</span>'
    +   (isMine(p.authorRef) ? '<span class="badge mine">내 글</span>' : '')
    + '</div>'
    + '<h3>'+esc(p.title)+'</h3>'
    + '<p class="snippet">'+esc(p.body)+'</p>'
    + '<div class="meta"><span>익명</span><span>'+fmt(p.createdAt)+'</span>'
    +   (p.updatedAt ? '<span>수정됨</span>' : '')
    +   '<span>댓글 '+commentsOf(p.id).length+'</span><span>공감 '+p.likes.length+'</span></div>'
    + '</article>';
}

/* ---------- 상세 ---------- */
function renderDetail(){
  var p = getPost(currentPostId);
  if(!p){ go("list"); return; }
  var mine = isMine(p.authorRef);
  var liked = p.likes.indexOf(session.authorRef) !== -1;

  var backBtn = '<button class="btn-back" data-action="go-list">'
    + '<span class="arrow">←</span>글 목록으로 돌아가기</button>';

  var html = '<div class="back-bar">'+backBtn+'</div>'
    + '<div class="row" style="gap:6px">'
    +   '<span class="badge '+TYPE_CLASS[p.type]+'">'+TYPE_LABEL[p.type]+'</span>'
    +   (mine ? '<span class="badge mine">내 글</span>' : '')
    + '</div>'
    + '<h1>'+esc(p.title)+'</h1>'
    + '<div class="meta"><span>익명</span><span>'+fmt(p.createdAt)+'</span>'
    +   (p.updatedAt ? '<span>수정 '+fmt(p.updatedAt)+'</span>' : '')+'</div>'
    + (p.body ? '<div class="body-text">'+esc(p.body)+'</div>' : '<div style="height:18px"></div>');

  if(p.type==="poll") html += renderPoll(p);

  html += '<div class="row" style="margin-top:18px">'
    +   '<button class="btn btn-sm'+(liked?' btn-primary':'')+'" data-action="like" data-id="'+p.id+'">'
    +     '공감 '+p.likes.length+'</button>'
    +   '<span class="spacer"></span>'
    +   (mine
        ? '<button class="btn btn-sm" data-action="edit-post" data-id="'+p.id+'">수정</button>'
          +'<button class="btn btn-sm btn-danger" data-action="del-post" data-id="'+p.id+'">삭제</button>'
        : '')
    + '</div>'
    + '<div class="divider"></div>';

  var cs = commentsOf(p.id);
  html += '<div class="list-label">댓글 <span class="count">'+cs.length+'개</span></div>';
  html += cs.length
    ? cs.map(function(c){ return renderComment(c, p); }).join("")
    : '<div class="empty" style="padding:26px">첫 댓글을 남겨보세요.</div>';

  html += '<div class="comment-form" style="margin-top:12px">'
    + '<textarea id="newComment" placeholder="댓글을 입력하세요"></textarea>'
    + '<div class="row"><span class="spacer"></span>'
    + '<button class="btn btn-sm btn-primary" data-action="add-comment" data-id="'+p.id+'">댓글 등록</button></div>'
    + '<div class="err" id="commentErr"></div></div>'
    + '<div class="back-bottom">'+backBtn+'</div>';

  $("detailView").innerHTML = html;
}

function renderPoll(p){
  var mine_i = myChoice(p);
  var total = totalVotes(p);
  var out = '<div class="poll">';

  if(mine_i === -1){
    out += '<div class="poll-head">투표에 참여하세요</div>';
    out += p.poll.options.map(function(o,i){
      return '<button class="poll-opt" data-action="vote" data-id="'+p.id+'" data-opt="'+i+'">'
        + esc(o.text) + '</button>';
    }).join("");
    out += '<div class="poll-foot">현재 '+total+'명 참여 · 한 계정당 한 번만 투표할 수 있습니다.</div>';
  }else{
    out += '<div class="poll-head">투표 결과</div>';
    out += p.poll.options.map(function(o,i){
      var pct = total ? Math.round(o.voters.length/total*1000)/10 : 0;
      return '<div class="result-row'+(i===mine_i?' picked':'')+'">'
        + '<div class="result-label"><strong>'+esc(o.text)+(i===mine_i?' ✓':'')+'</strong>'
        + '<span class="n">'+o.voters.length+'표 · '+pct+'%</span></div>'
        + '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    }).join("");
    out += '<div class="poll-foot">총 '+total+'명 참여 · 다른 사용자의 투표가 실시간으로 반영됩니다.</div>';
  }
  return out + '</div>';
}

/* 댓글 — 글 작성자가 단 댓글은 모든 사용자에게 ‘작성자’로 표시된다 */
function renderComment(c, post){
  var mine = isMine(c.authorRef);
  var byAuthor = c.authorRef === post.authorRef;

  if(editingCommentId === c.id){
    return '<div class="comment'+(byAuthor?' by-author':'')+'">'
      + '<div class="meta"><span>익명</span>'
      +   (byAuthor ? '<span class="badge author">작성자</span>' : '')
      +   '<span>'+fmt(c.createdAt)+'</span></div>'
      + '<textarea id="editComment">'+esc(c.body)+'</textarea>'
      + '<div class="row" style="margin-top:8px"><span class="spacer"></span>'
      + '<button class="btn btn-sm" data-action="cancel-edit-comment">취소</button>'
      + '<button class="btn btn-sm btn-primary" data-action="save-comment" data-id="'+c.id+'">저장</button>'
      + '</div></div>';
  }

  return '<div class="comment'+(byAuthor?' by-author':'')+'">'
    + '<div class="meta"><span>익명</span>'
    +   (byAuthor ? '<span class="badge author">작성자</span>' : '')
    +   (mine ? '<span class="badge mine">내 댓글</span>' : '')
    +   '<span>'+fmt(c.createdAt)+'</span>'
    +   (c.updatedAt ? '<span>수정됨</span>' : '')
    + '</div>'
    + '<div class="ctext">'+esc(c.body)+'</div>'
    + (mine
      ? '<div class="row"><span class="spacer"></span>'
        + '<button class="btn btn-sm" data-action="edit-comment" data-id="'+c.id+'">수정</button>'
        + '<button class="btn btn-sm btn-danger" data-action="del-comment" data-id="'+c.id+'">삭제</button></div>'
      : '')
    + '</div>';
}

$("submitPostBtn").addEventListener("click", function(){
  var title = $("pTitle").value.trim();
  var body  = $("pBody").value.trim();
  var err   = $("composeErr");
  err.textContent = "";
  if(!title){ err.textContent = "제목을 입력하세요."; return; }

  if(composeMode === "edit"){
    var p = getPost(composeTargetId);
    if(!p || !isMine(p.authorRef)){ err.textContent = "수정 권한이 없습니다."; return; }
    if(!body && p.type !== "poll"){ err.textContent = "내용을 입력하세요."; return; }
    p.title = title; p.body = body; p.updatedAt = Date.now();
    persist(); closeCompose(); render();
    toast("게시글이 수정되었습니다.");
    return;
  }

  var type = document.querySelector("input[name=ptype]:checked").value;
  if(!body && type !== "poll"){ err.textContent = "내용을 입력하세요."; return; }

  var poll = null;
  if(type === "poll"){
    var texts = Array.prototype.map.call($("optList").querySelectorAll("input"), function(i){
      return i.value.trim();
    }).filter(function(t){ return t.length > 0; });
    if(texts.length < 2){ err.textContent = "투표 선택지를 2개 이상 입력하세요."; return; }
    poll = { options: texts.map(function(t){ return { text:t, voters:[] }; }) };
  }

  var newPost = {
    id: "post_" + uid().slice(0,12),
    type: type,
    title: title,
    body: body,
    poll: poll,
    likes: [],
    authorRef: session.authorRef,   // 개인정보 아님 — 익명 토큰
    createdAt: Date.now(),
    updatedAt: null
  };
  contentDB.posts.push(newPost);
  persist();
  closeCompose();
  go("detail", newPost.id);
  toast("게시글이 등록되었습니다.");
});

/* =========================================================
   7. 확인 모달
   ========================================================= */
function askConfirm(title, msg, fn){
  $("confirmTitle").textContent = title;
  $("confirmMsg").textContent = msg;
  confirmAction = fn;
  $("confirmModal").classList.remove("hidden");
}
$("confirmNo").addEventListener("click", function(){
  $("confirmModal").classList.add("hidden"); confirmAction = null;
});
$("confirmYes").addEventListener("click", function(){
  $("confirmModal").classList.add("hidden");
  if(confirmAction){ var f = confirmAction; confirmAction = null; f(); }
});

/* =========================================================
   8. 액션 처리 (이벤트 위임)
   ========================================================= */
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-action]");
  if(!el) return;
  var a = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");

  if(a === "go-list")            go("list");
  else if(a === "go-account")    go("account");
  else if(a === "open-post")     go("detail", id);
  else if(a === "open-compose")  openCompose();
  else if(a === "close-compose") closeCompose();
  else if(a === "rm-opt"){
    if($("optList").children.length > 2) el.parentElement.remove();
    else toast("선택지는 2개 이상이어야 합니다.");
  }
  else if(a === "like"){
    var p = getPost(id); if(!p) return;
    var i = p.likes.indexOf(session.authorRef);
    if(i === -1) p.likes.push(session.authorRef); else p.likes.splice(i,1);
    persist(); render();
  }
  else if(a === "vote"){
    var p2 = getPost(id); if(!p2 || p2.type !== "poll") return;
    if(myChoice(p2) !== -1) return;                        // 한 계정당 한 표
    var oi = parseInt(el.getAttribute("data-opt"), 10);
    p2.poll.options[oi].voters.push(session.authorRef);
    persist(); render();                                   // 즉시 결과 시각화
    toast("투표가 반영되었습니다.");
  }
  else if(a === "edit-post") openEdit(id);
  else if(a === "del-post"){
    askConfirm("게시글 삭제", "이 게시글과 달린 댓글이 모두 삭제되며 되돌릴 수 없습니다.", function(){
      var p3 = getPost(id); if(!p3 || !isMine(p3.authorRef)) return;
      contentDB.posts = contentDB.posts.filter(function(x){ return x.id !== id; });
      contentDB.comments = contentDB.comments.filter(function(c){ return c.postId !== id; });
      persist(); go("list");
      toast("게시글이 삭제되었습니다.");
    });
  }
  else if(a === "add-comment"){
    var box = $("newComment"), e2 = $("commentErr");
    var text = box.value.trim();
    if(!text){ e2.textContent = "댓글 내용을 입력하세요."; return; }
    contentDB.comments.push({
      id: "cmt_" + uid().slice(0,12), postId: id, body: text,
      authorRef: session.authorRef, createdAt: Date.now(), updatedAt: null
    });
    persist(); render();
    toast("댓글이 등록되었습니다.");
  }
  else if(a === "edit-comment"){ editingCommentId = id; render(); }
  else if(a === "cancel-edit-comment"){ editingCommentId = null; render(); }
  else if(a === "save-comment"){
    var c = getComment(id);
    if(!c || !isMine(c.authorRef)) return;
    var v = $("editComment").value.trim();
    if(!v){ toast("댓글 내용을 입력하세요."); return; }
    c.body = v; c.updatedAt = Date.now(); editingCommentId = null;
    persist(); render();
    toast("댓글이 수정되었습니다.");
  }
  else if(a === "del-comment"){
    askConfirm("댓글 삭제", "이 댓글을 삭제하며 되돌릴 수 없습니다.", function(){
      var c2 = getComment(id);
      if(!c2 || !isMine(c2.authorRef)) return;
      contentDB.comments = contentDB.comments.filter(function(x){ return x.id !== id; });
      persist(); render();
      toast("댓글이 삭제되었습니다.");
    });
  }
  else if(a === "purge"){
    askConfirm("내 활동 기록 영구 파기",
      "계정 정보와 작성한 글, 댓글, 공감, 투표 기록이 모두 삭제되며 복구할 수 없습니다.", purgeMe);
  }
  else if(a === "logout") logout();
});

document.addEventListener("keydown", function(ev){
  if(ev.key !== "Enter" && ev.key !== " ") return;
  var el = ev.target.closest && ev.target.closest('.card[data-action="open-post"]');
  if(!el) return;
  ev.preventDefault();
  go("detail", el.getAttribute("data-id"));
});

/* ---------- 내 활동 기록 영구 파기 ---------- */
function purgeMe(){
  var ref = session.authorRef;

  // 1) 내가 쓴 글과 그 글에 달린 모든 댓글
  var myPostIds = contentDB.posts.filter(function(p){ return p.authorRef === ref; })
                                 .map(function(p){ return p.id; });
  contentDB.posts = contentDB.posts.filter(function(p){ return p.authorRef !== ref; });
  contentDB.comments = contentDB.comments.filter(function(c){
    return c.authorRef !== ref && myPostIds.indexOf(c.postId) === -1;
  });

  // 2) 다른 글에 남긴 공감과 투표 흔적
  contentDB.posts.forEach(function(p){
    p.likes = p.likes.filter(function(r){ return r !== ref; });
    if(p.poll){
      p.poll.options.forEach(function(o){
        o.voters = o.voters.filter(function(r){ return r !== ref; });
      });
    }
  });

  // 3) 개인정보 저장소의 계정 레코드
  delete identityDB.accounts[session.accountId];

  persist();
  logout();
  toast("모든 활동 기록과 계정 정보가 영구 삭제되었습니다.");
}

/* =========================================================
   9. 초기화 · 다른 탭과 실시간 동기화
   ========================================================= */
loadAll();
resetCompose();

var savedId = ssGet(KEY_SESSION);
if(savedId && identityDB.accounts[savedId]){
  session = { accountId: savedId, authorRef: identityDB.accounts[savedId].authorRef };
  enterApp();
}else{
  $("emailInput").focus();
}

window.addEventListener("storage", function(e){
  if(e.key !== KEY_CONTENT && e.key !== KEY_IDENTITY) return;
  loadAll();
  if(!session) return;
  if(!identityDB.accounts[session.accountId]){ logout(); return; }
  render();
});

})();
</script>
