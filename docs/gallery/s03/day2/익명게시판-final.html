<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>익명게시판</title>
<style>
  :root{
    --paper:#ffffff;
    --ink:#17171c;
    --ink-soft:#63636e;
    --line:#e7e7ef;
    --line-strong:#d2d2e0;
    --accent:#2f4bff;
    --accent-soft:#eef0ff;
    --live:#12a150;
    --danger:#d43b52;
    --radius:14px;
    --shadow:0 1px 0 var(--line);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- 상단 ---------- */
  header.top{border-bottom:1px solid var(--line);margin-bottom:22px;}
  .top-inner{max-width:900px;margin:0 auto;padding:22px 20px 18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .bubble{
    width:26px;height:22px;background:var(--accent);border-radius:11px 11px 11px 3px;position:relative;flex:none;
  }
  .bubble::after{content:"";position:absolute;left:6px;top:8px;width:4px;height:4px;border-radius:50%;background:#fff;
    box-shadow:7px 0 0 #fff,14px 0 0 #fff;}
  h1{font-size:23px;font-weight:800;letter-spacing:-0.03em;margin:0;}
  .tagline{font-size:14px;color:var(--ink-soft);margin:0;}
  .live-flag{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--live);}
  .dot.blink{animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot.blink{animation:none}}

  /* ---------- 검색 / 필터 ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:26px;}
  .search{flex:1 1 240px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);
    border-radius:999px;padding:8px 14px;background:#fff;}
  .search input{border:0;outline:0;flex:1;background:transparent;min-width:0;}
  .search svg{flex:none;color:var(--ink-soft);}
  .filters{display:flex;gap:6px;}
  .chip{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink-soft);}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* ---------- 버튼 ---------- */
  .btn{border:1px solid var(--line-strong);background:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink);}
  .btn:hover{border-color:var(--ink-soft);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#2540e6;border-color:#2540e6;}
  .btn.ghost{border-color:transparent;color:var(--ink-soft);padding:8px 10px;}
  .btn.ghost:hover{color:var(--ink);background:#f4f4f9;}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{border-color:var(--danger);}
  .btn.big{padding:11px 20px;font-size:15px;}

  /* ---------- 섹션 ---------- */
  .section-head{display:flex;align-items:center;gap:12px;margin:0 0 4px;}
  .section-head h2{font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;}
  .count{font-size:14px;color:var(--ink-soft);font-weight:500;}
  .section-desc{font-size:14px;color:var(--ink-soft);margin:0 0 16px;}
  .section-head .btn{margin-left:auto;}

  /* ---------- 카테고리 카드 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;list-style:none;padding:0;margin:0;}
  .cat{border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 12px;background:#fff;
    display:flex;flex-direction:column;gap:6px;min-height:132px;}
  .cat:hover{border-color:var(--line-strong);}
  .cat-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-0.01em;}
  .tag{width:9px;height:9px;border-radius:3px;flex:none;}
  .cat-desc{font-size:14px;color:var(--ink-soft);margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .stats{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap;}
  .stat{font-size:12.5px;color:var(--ink-soft);background:#f5f5fa;border-radius:6px;padding:3px 8px;}
  .stat.on{background:#e7f6ec;color:#0e7c3f;}
  .cat-actions{display:flex;gap:4px;border-top:1px solid var(--line);margin:10px -16px -12px;padding:6px 10px;}
  .cat-actions .btn{flex:1;}

  /* ---------- 목록 ---------- */
  .list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .post{border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;background:#fff;}
  .post h3{margin:0 0 5px;font-size:16px;font-weight:700;letter-spacing:-0.01em;}
  .post p{margin:0;font-size:14.5px;color:#3d3d48;white-space:pre-wrap;word-break:break-word;}
  .post-foot{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:13px;color:var(--ink-soft);}
  .post-foot .btn{margin-left:auto;}
  .who{font-weight:600;color:#4a4a58;}

  /* 채팅방 카드: 말풍선 */
  .room{border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:15px 16px;background:#fff;
    display:flex;align-items:center;gap:14px;}
  .room-main{min-width:0;flex:1;}
  .room h3{margin:0 0 3px;font-size:16px;font-weight:700;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .room .meta{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}

  /* ---------- 탭 ---------- */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;}
  .tab{border:0;background:transparent;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);}

  /* ---------- 빈 화면 ---------- */
  .empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--ink-soft);font-size:14.5px;}
  .empty strong{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px;}

  /* ---------- 채팅방 내부 ---------- */
  .room-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .room-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.02em;}
  .room-head .btn{margin-left:auto;}
  .msgs{height:min(56vh,440px);overflow-y:auto;padding:16px 2px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:78%;}
  .msg .who{font-size:12.5px;display:block;margin-bottom:3px;}
  .msg .text{background:#f4f4f9;border-radius:12px 12px 12px 3px;padding:8px 12px;font-size:15px;
    white-space:pre-wrap;word-break:break-word;display:inline-block;}
  .msg time{font-size:12px;color:var(--ink-soft);margin-left:6px;}
  .msg.mine{margin-left:auto;text-align:right;}
  .msg.mine .text{background:var(--accent-soft);border-radius:12px 12px 3px 12px;color:#12206b;}
  .msg.sys{max-width:100%;text-align:center;font-size:12.5px;color:var(--ink-soft);}
  .composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px;}
  .composer input{flex:1;border:1px solid var(--line-strong);border-radius:10px;padding:11px 14px;outline:0;min-width:0;}
  .composer input:focus{border-color:var(--accent);}

  /* ---------- 폼 / 모달 ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(20,20,30,.34);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;}
  .modal{background:#fff;border-radius:16px;width:min(460px,100%);padding:22px;max-height:90vh;overflow:auto;}
  .modal h3{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-0.02em;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;outline:0;background:#fff;}
  .field textarea{min-height:120px;resize:vertical;line-height:1.55;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
  .field .hint{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}
  .error{color:var(--danger);font-size:13px;margin:-6px 0 12px;min-height:18px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;}
  .back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-soft);font-size:14px;padding:4px 0;margin-bottom:10px;}
  .back:hover{color:var(--ink);}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="bubble" aria-hidden="true"></div>
      <div>
        <h1>익명게시판</h1>
        <p class="tagline">이름 없이, 마음 편히 떠드는 곳</p>
      </div>
    </div>
    <div class="live-flag"><span class="dot blink"></span><span id="liveLabel">실시간 연결됨</span></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="search" type="search" placeholder="카테고리, 게시글, 채팅방 검색" aria-label="검색" />
    </div>
    <div class="filters" role="group" aria-label="필터">
      <button class="chip" data-filter="all" aria-pressed="true">전체</button>
      <button class="chip" data-filter="post" aria-pressed="false">게시글</button>
      <button class="chip" data-filter="room" aria-pressed="false">채팅방</button>
    </div>
  </div>

  <main id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function () {
  "use strict";

  /* =========================================================
     1. 상태 (서버 없이 메모리에만 보관)
     ========================================================= */
  var CLIENT_ID = "c" + Math.random().toString(36).slice(2, 10);

  var state = {
    categories: [],
    posts: [],
    rooms: [],
    messages: []            // {id, roomId, authorKey, nick, text, at, sys}
  };

  var ui = {
    view: "home",           // home | category | room
    categoryId: null,
    tab: "post",            // category 화면의 탭
    roomId: null,
    query: "",
    filter: "all",
    draft: "",              // 채팅 입력 중인 내용
    focusChat: false        // 입장 직후·전송 직후에만 입력칸으로 커서를 옮긴다
  };

  // 익명 표시용 별명(세션 안에서만 유지, 어디에도 실명 없음)
  var nickByRoom = {};
  // 실시간 접속 현황 {clientId: {roomId, at}}
  var presence = {};

  /* =========================================================
     2. 유틸
     ========================================================= */
  function uid(p) { return (p || "id") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function now() { return Date.now(); }

  // 검사 기능: 빈 문장(공백만 있는 입력)은 받지도, 출력하지도 않는다
  function clean(v) { return (v == null ? "" : String(v)).replace(/\s+$/g, "").replace(/^\s+/g, ""); }
  function isEmpty(v) { return clean(v).length === 0; }

  // 여러 줄 입력: 줄마다 공백을 다듬고, 빈 줄은 아예 버린다
  // 저장할 때와 보여줄 때 모두 거치므로 빈 문장은 화면에 남지 않는다
  function cleanBody(v) {
    return String(v == null ? "" : v).split("\n")
      .map(function (line) { return clean(line); })
      .filter(function (line) { return line.length > 0; })
      .join("\n");
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function relTime(ts) {
    var d = Math.floor((now() - ts) / 1000);
    if (d < 5) return "방금 전";
    if (d < 60) return d + "초 전";
    if (d < 3600) return Math.floor(d / 60) + "분 전";
    if (d < 86400) return Math.floor(d / 3600) + "시간 전";
    return Math.floor(d / 86400) + "일 전";
  }

  function clock(ts) {
    var d = new Date(ts), h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }

  // 카테고리마다 고정된 색 태그
  function hue(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return "hsl(" + h + " 62% 58%)";
  }

  function nickFor(roomId) {
    if (!nickByRoom[roomId]) nickByRoom[roomId] = "익명" + (Math.floor(Math.random() * 900) + 100);
    return nickByRoom[roomId];
  }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function toast(msg) {
    var root = document.getElementById("toastRoot");
    root.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { root.innerHTML = ""; }, 1900);
  }

  /* =========================================================
     3. 실시간 상태 업데이트
        - 같은 브라우저의 다른 탭과 상태를 즉시 동기화
        - 1초마다 접속 인원 / 시간 표시 갱신
     ========================================================= */
  var channel = null;
  try { channel = new BroadcastChannel("anon-board"); } catch (e) { channel = null; }

  function share(kind) {
    if (!channel) return;
    try { channel.postMessage({ from: CLIENT_ID, kind: kind || "state", state: state }); } catch (e) {}
  }

  function beat() {
    presence[CLIENT_ID] = { roomId: ui.view === "room" ? ui.roomId : null, at: now() };
    if (!channel) return;
    try {
      channel.postMessage({ from: CLIENT_ID, kind: "beat", roomId: presence[CLIENT_ID].roomId, at: now() });
    } catch (e) {}
  }

  if (channel) {
    channel.onmessage = function (ev) {
      var d = ev.data;
      if (!d || d.from === CLIENT_ID) return;

      if (d.kind === "beat") {
        presence[d.from] = { roomId: d.roomId, at: d.at };
        paintLive();
        return;
      }
      if (d.kind === "hello") { share("state"); beat(); return; }
      if (d.state) {
        state = d.state;                 // 마지막 변경 내용을 그대로 반영
        render();
      }
    };
    try { channel.postMessage({ from: CLIENT_ID, kind: "hello" }); } catch (e) {}
  }

  function onlineIn(roomId) {
    var n = 0, t = now();
    for (var k in presence) {
      if (!Object.prototype.hasOwnProperty.call(presence, k)) continue;
      if (t - presence[k].at > 7000) { delete presence[k]; continue; }
      if (presence[k].roomId === roomId) n++;
    }
    return n;
  }

  function onlineInCategory(catId) {
    var n = 0;
    state.rooms.forEach(function (r) { if (r.categoryId === catId) n += onlineIn(r.id); });
    return n;
  }

  // 전체 다시 그리지 않고 숫자·시간만 갱신 (입력 중인 글이 지워지지 않도록)
  function paintLive() {
    var i, els = document.querySelectorAll("[data-ts]");
    for (i = 0; i < els.length; i++) els[i].textContent = relTime(Number(els[i].getAttribute("data-ts")));
    els = document.querySelectorAll("[data-online-room]");
    for (i = 0; i < els.length; i++) els[i].textContent = onlineIn(els[i].getAttribute("data-online-room")) + "명 접속 중";
    els = document.querySelectorAll("[data-online-cat]");
    for (i = 0; i < els.length; i++) {
      var n = onlineInCategory(els[i].getAttribute("data-online-cat"));
      els[i].textContent = n + "명 접속 중";
      if (els[i].classList.contains("stat")) els[i].classList.toggle("on", n > 0);
    }
  }

  setInterval(function () { beat(); paintLive(); }, 1000);
  beat();

  // 탭 간 연결이 막힌 환경에서는 "연결됨"이라고 적지 않는다
  (function () {
    var label = document.getElementById("liveLabel");
    if (!label) return;
    label.textContent = channel ? "실시간 연결됨" : "이 탭에서만 갱신 중";
    if (!channel) {
      var d = document.querySelector(".live-flag .dot");
      if (d) { d.classList.remove("blink"); d.style.background = "var(--ink-soft)"; }
    }
  })();

  /* =========================================================
     4. 데이터 변경
     ========================================================= */
  function commit() { share("state"); render(); }

  function addCategory(name, desc) {
    state.categories.push({ id: uid("cat"), name: clean(name), desc: cleanBody(desc), at: now() });
  }

  function removeCategory(id) {
    state.categories = state.categories.filter(function (c) { return c.id !== id; });
    var roomIds = state.rooms.filter(function (r) { return r.categoryId === id; }).map(function (r) { return r.id; });
    state.rooms = state.rooms.filter(function (r) { return r.categoryId !== id; });
    state.posts = state.posts.filter(function (p) { return p.categoryId !== id; });
    state.messages = state.messages.filter(function (m) { return roomIds.indexOf(m.roomId) === -1; });
  }

  /* =========================================================
     5. 모달 (작성 / 수정)
     ========================================================= */
  function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }

  /**
   * fields: [{key,label,type,value,placeholder,options,hint}]
   * onSubmit(values) -> 문자열을 돌려주면 오류 메시지로 표시
   */
  function openModal(title, fields, submitLabel, onSubmit) {
    var body = fields.map(function (f) {
      var input;
      if (f.type === "textarea") {
        input = '<textarea id="f_' + f.key + '" placeholder="' + esc(f.placeholder || "") + '">' + esc(f.value || "") + "</textarea>";
      } else if (f.type === "select") {
        input = '<select id="f_' + f.key + '">' + f.options.map(function (o) {
          return '<option value="' + esc(o.value) + '"' + (o.value === f.value ? " selected" : "") + ">" + esc(o.label) + "</option>";
        }).join("") + "</select>";
      } else {
        input = '<input id="f_' + f.key + '" type="text" value="' + esc(f.value || "") + '" placeholder="' + esc(f.placeholder || "") + '" />';
      }
      return '<div class="field"><label for="f_' + f.key + '">' + esc(f.label) + "</label>" + input +
        (f.hint ? '<p class="hint">' + esc(f.hint) + "</p>" : "") + "</div>";
    }).join("");

    document.getElementById("modalRoot").innerHTML =
      '<div class="backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        "<h3>" + esc(title) + "</h3>" +
        '<form id="modalForm">' + body +
          '<p class="error" id="modalError"></p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn" id="cancelBtn">취소</button>' +
            '<button type="submit" class="btn primary">' + esc(submitLabel) + "</button>" +
          "</div>" +
        "</form></div></div>";

    var first = document.querySelector("#modalForm input, #modalForm textarea, #modalForm select");
    if (first) first.focus();

    document.getElementById("cancelBtn").onclick = closeModal;
    document.getElementById("backdrop").onmousedown = function (e) { if (e.target.id === "backdrop") closeModal(); };
    document.getElementById("modalForm").onsubmit = function (e) {
      e.preventDefault();
      var values = {};
      fields.forEach(function (f) { values[f.key] = document.getElementById("f_" + f.key).value; });
      var err = onSubmit(values);
      if (err) { document.getElementById("modalError").textContent = err; return; }
      closeModal();
    };
  }

  function categoryOptions() {
    return state.categories.map(function (c) { return { value: c.id, label: c.name }; });
  }

  /* =========================================================
     6. 화면 그리기
     ========================================================= */
  var view = document.getElementById("view");

  function matches(text) {
    if (!ui.query) return true;
    return String(text).toLowerCase().indexOf(ui.query.toLowerCase()) !== -1;
  }

  function postsOf(catId) {
    return state.posts.filter(function (p) { return p.categoryId === catId; })
      .sort(function (a, b) { return b.at - a.at; });
  }
  function roomsOf(catId) {
    return state.rooms.filter(function (r) { return r.categoryId === catId; })
      .sort(function (a, b) { return b.at - a.at; });
  }

  function postCard(p) {
    var cat = byId(state.categories, p.categoryId);
    var body = cleanBody(p.body);              // 저장돼 있던 빈 줄도 화면에는 내보내지 않는다
    var mine = p.authorKey === CLIENT_ID;      // 내가 쓴 글에만 수정 버튼
    return '<li class="post">' +
      "<h3>" + esc(p.title) + "</h3>" +
      (body ? "<p>" + esc(body) + "</p>" : "") +
      '<div class="post-foot">' +
        '<span class="who">' + esc(p.nick) + "</span>" +
        (cat ? "<span>" + esc(cat.name) + "</span>" : "") +
        '<span data-ts="' + (p.editedAt || p.at) + '">' + relTime(p.editedAt || p.at) + "</span>" +
        (p.editedAt ? "<span>수정됨</span>" : "") +
        (mine ? '<button class="btn ghost" data-act="edit-post" data-id="' + p.id + '">수정</button>' : "") +
      "</div></li>";
  }

  function roomCard(r) {
    var cat = byId(state.categories, r.categoryId);
    return '<li class="room">' +
      '<div class="room-main">' +
        "<h3>" + esc(r.name) + "</h3>" +
        '<div class="meta"><span class="dot"></span>' +
          '<span data-online-room="' + r.id + '">' + onlineIn(r.id) + "명 접속 중</span>" +
          (cat ? "<span>" + esc(cat.name) + "</span>" : "") +
        "</div>" +
      "</div>" +
      '<button class="btn primary big" data-act="enter-room" data-id="' + r.id + '">입장</button>' +
    "</li>";
  }

  /* ---------- 홈: 카테고리 목록이 가장 먼저 ---------- */
  function renderHome() {
    var cats = state.categories.filter(function (c) { return matches(c.name) || matches(c.desc); });
    var html = "";

    if (!ui.query) {
      html += '<div class="section-head"><h2>카테고리</h2>' +
        '<span class="count">' + state.categories.length + "개</span>" +
        '<button class="btn primary" data-act="new-category">카테고리 만들기</button></div>' +
        '<p class="section-desc">들어가고 싶은 곳을 고르면 게시글과 채팅방이 함께 보입니다.</p>';

      if (!state.categories.length) {
        html += '<div class="empty"><strong>아직 카테고리가 없습니다</strong>첫 카테고리를 만들면 여기에서 바로 떠들 수 있습니다.</div>';
      } else {
        html += '<ul class="grid">' + state.categories.map(function (c) {
          return '<li class="cat">' +
            '<div class="cat-name"><span class="tag" style="background:' + hue(c.name) + '"></span>' + esc(c.name) + "</div>" +
            (isEmpty(c.desc) ? "" : '<p class="cat-desc">' + esc(c.desc) + "</p>") +
            '<div class="stats">' +
              '<span class="stat">게시글 ' + postsOf(c.id).length + "</span>" +
              '<span class="stat">채팅방 ' + roomsOf(c.id).length + "</span>" +
              '<span class="' + (onlineInCategory(c.id) > 0 ? "stat on" : "stat") + '" data-online-cat="' + c.id + '">' +
                onlineInCategory(c.id) + "명 접속 중</span>" +
            "</div>" +
            '<div class="cat-actions">' +
              '<button class="btn ghost" data-act="open-category" data-id="' + c.id + '">들어가기</button>' +
              '<button class="btn ghost" data-act="edit-category" data-id="' + c.id + '">수정</button>' +
              '<button class="btn ghost danger" data-act="remove-category" data-id="' + c.id + '">삭제</button>' +
            "</div></li>";
        }).join("") + "</ul>";
      }
      view.innerHTML = html;
      return;
    }

    /* ---------- 검색 결과 (필터 적용) ---------- */
    var posts = ui.filter === "room" ? [] : state.posts.filter(function (p) { return matches(p.title) || matches(p.body); });
    var rooms = ui.filter === "post" ? [] : state.rooms.filter(function (r) { return matches(r.name); });
    var showCats = ui.filter === "all";

    html += '<div class="section-head"><h2>검색 결과</h2><span class="count">' +
      ((showCats ? cats.length : 0) + posts.length + rooms.length) + "건</span>" +
      '<button class="btn" data-act="clear-search">검색 지우기</button></div>' +
      '<p class="section-desc">“' + esc(ui.query) + '”와 일치하는 내용입니다.</p>';

    if ((showCats ? cats.length : 0) + posts.length + rooms.length === 0) {
      html += '<div class="empty"><strong>일치하는 내용이 없습니다</strong>다른 낱말로 찾아보거나 새로 글을 써 보세요.</div>';
    } else {
      if (showCats && cats.length) {
        html += '<div class="section-head"><h2>카테고리</h2><span class="count">' + cats.length + "개</span></div>" +
          '<ul class="grid" style="margin-bottom:22px">' + cats.map(function (c) {
            return '<li class="cat">' +
              '<div class="cat-name"><span class="tag" style="background:' + hue(c.name) + '"></span>' + esc(c.name) + "</div>" +
              (isEmpty(c.desc) ? "" : '<p class="cat-desc">' + esc(c.desc) + "</p>") +
              '<div class="cat-actions"><button class="btn ghost" data-act="open-category" data-id="' + c.id + '">들어가기</button></div>' +
            "</li>";
          }).join("") + "</ul>";
      }
      if (rooms.length) {
        html += '<div class="section-head"><h2>채팅방</h2><span class="count">' + rooms.length + "개</span></div>" +
          '<ul class="list" style="margin-bottom:22px">' + rooms.map(roomCard).join("") + "</ul>";
      }
      if (posts.length) {
        html += '<div class="section-head"><h2>게시글</h2><span class="count">' + posts.length + "개</span></div>" +
          '<ul class="list">' + posts.map(postCard).join("") + "</ul>";
      }
    }
    view.innerHTML = html;
  }

  /* ---------- 카테고리 화면 ---------- */
  function renderCategory() {
    var c = byId(state.categories, ui.categoryId);
    if (!c) { ui.view = "home"; renderHome(); return; }

    var posts = postsOf(c.id).filter(function (p) { return matches(p.title) || matches(p.body); });
    var rooms = roomsOf(c.id).filter(function (r) { return matches(r.name); });

    var html = '<button class="back" data-act="home">← 카테고리 목록</button>' +
      '<div class="section-head">' +
        '<h2><span class="tag" style="display:inline-block;background:' + hue(c.name) + ';margin-right:8px"></span>' + esc(c.name) + "</h2>" +
        '<span class="count" data-online-cat="' + c.id + '">' + onlineInCategory(c.id) + "명 접속 중</span>" +
      "</div>" +
      (isEmpty(c.desc) ? "" : '<p class="section-desc">' + esc(c.desc) + "</p>");

    html += '<div class="tabs" role="tablist">' +
      '<button class="tab" role="tab" data-act="tab" data-tab="post" aria-selected="' + (ui.tab === "post") + '">게시판 ' + postsOf(c.id).length + "</button>" +
      '<button class="tab" role="tab" data-act="tab" data-tab="room" aria-selected="' + (ui.tab === "room") + '">채팅방 ' + roomsOf(c.id).length + "</button>" +
    "</div>";

    if (ui.tab === "post") {
      html += '<div class="section-head"><h2>게시글</h2><span class="count">' + posts.length + "개</span>" +
        '<button class="btn primary" data-act="new-post">글쓰기</button></div>';
      html += posts.length
        ? '<ul class="list">' + posts.map(postCard).join("") + "</ul>"
        : '<div class="empty"><strong>' + (ui.query ? "일치하는 게시글이 없습니다" : "첫 글을 기다리는 중입니다") + "</strong>" +
          (ui.query ? "검색어를 지우면 전체 글이 보입니다." : "이름은 남지 않으니 편하게 적어도 됩니다.") + "</div>";
    } else {
      html += '<div class="section-head"><h2>채팅방</h2><span class="count">' + rooms.length + "개</span>" +
        '<button class="btn primary" data-act="new-room">채팅방 만들기</button></div>';
      html += rooms.length
        ? '<ul class="list">' + rooms.map(roomCard).join("") + "</ul>"
        : '<div class="empty"><strong>' + (ui.query ? "일치하는 채팅방이 없습니다" : "열려 있는 채팅방이 없습니다") + "</strong>" +
          (ui.query ? "검색어를 지우면 전체 방이 보입니다." : "방을 만들면 바로 입장할 수 있습니다.") + "</div>";
    }
    view.innerHTML = html;
  }

  /* ---------- 채팅방 내부 ---------- */
  function renderRoom() {
    var r = byId(state.rooms, ui.roomId);
    if (!r) { ui.view = "home"; renderHome(); return; }
    var cat = byId(state.categories, r.categoryId);
    var me = nickFor(r.id);

    // 다시 그리기 전에 입력 중이던 위치와 읽던 위치를 기억해 둔다
    var active = document.activeElement;
    var wasTyping = !!(active && active.id === "chatInput");
    var caret = wasTyping ? active.selectionStart : 0;
    var oldBox = document.getElementById("msgs");
    var wasAtBottom = oldBox ? (oldBox.scrollHeight - oldBox.scrollTop - oldBox.clientHeight < 60) : true;

    var msgs = state.messages.filter(function (m) { return m.roomId === r.id; });

    var html = '<button class="back" data-act="back-category">← ' + esc(cat ? cat.name : "목록") + "</button>" +
      '<div class="room-head">' +
        "<h2>" + esc(r.name) + "</h2>" +
        '<span class="count"><span class="dot" style="display:inline-block;margin-right:5px"></span>' +
          '<span data-online-room="' + r.id + '">' + onlineIn(r.id) + "명 접속 중</span></span>" +
        '<button class="btn big danger" data-act="leave-room">퇴장</button>' +
      "</div>";

    html += '<div class="msgs" id="msgs">';
    if (!msgs.length) {
      html += '<div class="empty" style="margin:auto"><strong>아직 대화가 없습니다</strong>' + esc(me) + "(으)로 첫 마디를 건네보세요.</div>";
    } else {
      html += msgs.map(function (m) {
        if (m.sys) return '<div class="msg sys">' + esc(m.text) + "</div>";
        var mine = m.authorKey === CLIENT_ID + "|" + r.id;
        return '<div class="msg' + (mine ? " mine" : "") + '">' +
          '<span class="who">' + esc(m.nick) + (mine ? " (나)" : "") + "</span>" +
          '<span class="text">' + esc(m.text) + "</span>" +
          "<time>" + clock(m.at) + "</time>" +
        "</div>";
      }).join("");
    }
    html += "</div>";

    html += '<form class="composer" id="chatForm">' +
      '<input id="chatInput" type="text" placeholder="' + esc(me) + '(으)로 이야기하기" autocomplete="off" aria-label="메시지 입력" />' +
      '<button class="btn primary" type="submit">보내기</button>' +
    "</form>";

    view.innerHTML = html;

    // 아래쪽을 보고 있었을 때만 따라 내려간다 (위로 올려 읽는 중이면 그대로 둔다)
    var box = document.getElementById("msgs");
    if (wasAtBottom || ui.focusChat) box.scrollTop = box.scrollHeight;

    var input = document.getElementById("chatInput");
    input.value = ui.draft;
    input.oninput = function () { ui.draft = input.value; };

    // 다른 탭의 갱신 때문에 포커스를 뺏거나 커서가 끝으로 튀지 않게 한다
    if (wasTyping || ui.focusChat) {
      input.focus();
      var at = ui.focusChat ? input.value.length : Math.min(caret, input.value.length);
      try { input.setSelectionRange(at, at); } catch (e) {}
    }
    ui.focusChat = false;

    document.getElementById("chatForm").onsubmit = function (e) {
      e.preventDefault();
      var text = clean(input.value);
      if (isEmpty(text)) { toast("빈 메시지는 보낼 수 없습니다"); input.value = ""; ui.draft = ""; return; }
      state.messages.push({
        id: uid("msg"), roomId: r.id, authorKey: CLIENT_ID + "|" + r.id,
        nick: me, text: text, at: now()
      });
      ui.draft = "";
      ui.focusChat = true;
      commit();
    };
  }

  // 필터 칩은 검색 결과에만 적용된다. 그 밖의 화면에서는 눌러도 달라지는 게 없으므로 감춘다
  // (카테고리 안에서는 게시판 / 채팅방 탭이 같은 역할을 한다)
  function syncToolbar() {
    var filters = document.querySelector(".filters");
    if (filters) filters.style.display = (ui.view === "home" && ui.query) ? "flex" : "none";
  }

  function render() {
    if (ui.view === "home") renderHome();
    else if (ui.view === "category") renderCategory();
    else renderRoom();
    syncToolbar();
    paintLive();
  }

  /* =========================================================
     7. 동작 연결
     ========================================================= */
  function enterRoom(id) {
    var r = byId(state.rooms, id);
    if (!r) return;
    ui.view = "room"; ui.roomId = id; ui.draft = ""; ui.focusChat = true;
    state.messages.push({ id: uid("msg"), roomId: id, sys: true, text: nickFor(id) + "님이 입장했습니다.", at: now() });
    beat();
    commit();
  }

  function leaveRoom() {
    var id = ui.roomId, r = byId(state.rooms, id);
    if (r) state.messages.push({ id: uid("msg"), roomId: id, sys: true, text: nickFor(id) + "님이 퇴장했습니다.", at: now() });
    ui.view = "category";
    ui.categoryId = r ? r.categoryId : null;
    ui.tab = "room";
    ui.roomId = null; ui.draft = "";
    beat();
    commit();
    toast("채팅방에서 나왔습니다");
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");

    if (act === "home") { ui.view = "home"; ui.categoryId = null; render(); }

    else if (act === "open-category") { ui.view = "category"; ui.categoryId = id; ui.tab = "post"; render(); }

    else if (act === "back-category") { leaveRoom(); }

    else if (act === "tab") { ui.tab = el.getAttribute("data-tab"); render(); }

    else if (act === "clear-search") {
      ui.query = ""; document.getElementById("search").value = ""; render();
    }

    /* ---- 카테고리 생성 / 수정 / 제거 ---- */
    else if (act === "new-category") {
      openModal("카테고리 만들기", [
        { key: "name", label: "이름", placeholder: "예: 잡담" },
        { key: "desc", label: "설명", type: "textarea", placeholder: "어떤 이야기를 나누는 곳인가요?", hint: "비워 두면 설명 없이 만들어집니다." }
      ], "만들기", function (v) {
        if (isEmpty(v.name)) return "카테고리 이름을 입력해 주세요.";
        var dup = state.categories.some(function (c) { return c.name === clean(v.name); });
        if (dup) return "같은 이름의 카테고리가 이미 있습니다.";
        addCategory(v.name, v.desc);
        commit(); toast("카테고리를 만들었습니다");
      });
    }

    else if (act === "edit-category") {
      var c = byId(state.categories, id);
      if (!c) return;
      openModal("카테고리 수정", [
        { key: "name", label: "이름", value: c.name },
        { key: "desc", label: "설명", type: "textarea", value: c.desc }
      ], "저장", function (v) {
        if (isEmpty(v.name)) return "카테고리 이름을 입력해 주세요.";
        var dup = state.categories.some(function (x) { return x.id !== c.id && x.name === clean(v.name); });
        if (dup) return "같은 이름의 카테고리가 이미 있습니다.";
        c.name = clean(v.name); c.desc = cleanBody(v.desc);
        commit(); toast("카테고리를 수정했습니다");
      });
    }

    else if (act === "remove-category") {
      var t = byId(state.categories, id);
      if (!t) return;
      var np = postsOf(t.id).length, nr = roomsOf(t.id).length;
      var warn = "‘" + t.name + "’ 카테고리를 삭제할까요?" +
        (np + nr > 0 ? "\n안에 있는 게시글 " + np + "개와 채팅방 " + nr + "개도 함께 사라집니다." : "");
      if (!window.confirm(warn)) return;
      removeCategory(t.id);
      if (ui.categoryId === t.id) { ui.view = "home"; ui.categoryId = null; }
      commit(); toast("카테고리를 삭제했습니다");
    }

    /* ---- 게시글 작성 / 수정 ---- */
    else if (act === "new-post") {
      if (!state.categories.length) { toast("먼저 카테고리를 만들어 주세요"); return; }
      openModal("글쓰기", [
        { key: "categoryId", label: "카테고리", type: "select", value: ui.categoryId || state.categories[0].id, options: categoryOptions() },
        { key: "title", label: "제목", placeholder: "제목을 적어 주세요" },
        { key: "body", label: "내용", type: "textarea", placeholder: "무슨 이야기를 하고 싶나요?", hint: "이름은 남지 않고 익명으로만 올라갑니다." }
      ], "올리기", function (v) {
        if (isEmpty(v.title)) return "제목이 비어 있습니다.";
        if (isEmpty(v.body)) return "내용이 비어 있습니다.";
        state.posts.push({
          id: uid("post"), categoryId: v.categoryId, title: clean(v.title), body: cleanBody(v.body),
          nick: "익명" + (Math.floor(Math.random() * 900) + 100), at: now(), editedAt: null,
          authorKey: CLIENT_ID
        });
        ui.categoryId = v.categoryId;
        if (ui.view === "category") ui.tab = "post";
        commit(); toast("글을 올렸습니다");
      });
    }

    else if (act === "edit-post") {
      var p = byId(state.posts, id);
      if (!p) return;
      if (p.authorKey !== CLIENT_ID) { toast("내가 쓴 글만 수정할 수 있습니다"); return; }
      openModal("게시글 수정", [
        { key: "categoryId", label: "카테고리", type: "select", value: p.categoryId, options: categoryOptions() },
        { key: "title", label: "제목", value: p.title },
        { key: "body", label: "내용", type: "textarea", value: p.body }
      ], "저장", function (v) {
        if (isEmpty(v.title)) return "제목이 비어 있습니다.";
        if (isEmpty(v.body)) return "내용이 비어 있습니다.";
        p.categoryId = v.categoryId; p.title = clean(v.title); p.body = cleanBody(v.body); p.editedAt = now();
        commit(); toast("글을 수정했습니다");
      });
    }

    /* ---- 채팅방 생성 / 입장 / 퇴장 ---- */
    else if (act === "new-room") {
      if (!state.categories.length) { toast("먼저 카테고리를 만들어 주세요"); return; }
      openModal("채팅방 만들기", [
        { key: "categoryId", label: "카테고리", type: "select", value: ui.categoryId || state.categories[0].id, options: categoryOptions() },
        { key: "name", label: "방 이름", placeholder: "예: 오늘 급식 얘기" }
      ], "만들기", function (v) {
        if (isEmpty(v.name)) return "방 이름을 입력해 주세요.";
        var room = { id: uid("room"), categoryId: v.categoryId, name: clean(v.name), at: now() };
        state.rooms.push(room);
        ui.categoryId = v.categoryId; ui.tab = "room";
        commit(); toast("채팅방을 만들었습니다");
      });
    }

    else if (act === "enter-room") { enterRoom(id); }

    else if (act === "leave-room") { leaveRoom(); }
  });

  /* ---- 검색 / 필터 ---- */
  document.getElementById("search").addEventListener("input", function (e) {
    ui.query = clean(e.target.value);
    if (ui.view === "room") { ui.view = "category"; }
    render();
  });

  var chips = document.querySelectorAll(".chip");
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener("click", function (e) {
      ui.filter = e.currentTarget.getAttribute("data-filter");
      for (var j = 0; j < chips.length; j++) {
        chips[j].setAttribute("aria-pressed", String(chips[j] === e.currentTarget));
      }
      render();
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });

  /* =========================================================
     8. 처음 보여줄 예시 데이터
     ========================================================= */
