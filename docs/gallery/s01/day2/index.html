<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Memo · 익명 게시판</title>
<style>
  /* ===== 색상/기본값: 밝은 톤 + 강조색 연한 남색 ===== */
  :root {
    --bg: #F4F6FB;
    --surface: #FFFFFF;
    --text: #1E2333;
    --text-sub: #555D72;
    --text-muted: #8A90A2;
    --border: #E4E7EF;
    --accent: #5A6FB0;        /* 연한 남색 (버튼/강조) */
    --accent-strong: #4A5E9C;
    --accent-soft: #EDF0FA;
    --accent-ink: #3D4F8F;
    --danger: #C0433B;
    --maxw: 640px;
    --shadow: 0 8px 24px rgba(42, 56, 110, .22);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell {
    max-width: var(--maxw);
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--border);
  }

  /* ===== 상단: 로고 / 프로필 / 카테고리 탭 ===== */
  .top {
    position: sticky; top: 0; z-index: 20;
    padding-top: env(safe-area-inset-top);
    background: rgba(255, 255, 255, .97);
    border-bottom: 1px solid var(--border);
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; padding: 0 16px;
  }
  .logo {
    font-size: 23px; font-weight: 800; letter-spacing: -.02em;
    color: var(--accent); text-decoration: none;
  }
  .profile { position: relative; }
  .profile-btn {
    width: 38px; height: 38px; border: 0; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .menu {
    position: absolute; right: 0; top: 46px; min-width: 148px; padding: 6px;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(30, 35, 51, .12);
  }
  .menu button {
    display: block; width: 100%; text-align: left;
    border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-size: 15px;
  }
  .menu button:hover { background: var(--accent-soft); }

  .tabs { display: flex; gap: 4px; padding: 0 8px; overflow-x: auto; }
  .tab {
    position: relative; border: 0; background: none;
    padding: 10px 12px 12px; font-size: 15px; font-weight: 600; color: var(--text-muted);
  }
  .tab[aria-selected="true"] { color: var(--accent-ink); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 10px; right: 10px; bottom: 0;
    height: 3px; border-radius: 3px 3px 0 0; background: var(--accent);
  }
  .tab[aria-disabled="true"] { cursor: default; }

  /* ===== 목록 + 검색 ===== */
  .search { padding: 12px 16px 4px; }
  .search-box { position: relative; }
  .search-box svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none;
  }
  .search-box input {
    width: 100%; height: 44px; padding: 0 14px 0 40px;
    border: 1px solid transparent; border-radius: 12px;
    background: var(--bg); font-size: 16px; outline: none;
  }
  .search-box input:focus { border-color: var(--accent); background: #fff; }

  .list { list-style: none; margin: 0; padding: 0 0 110px; }
  .item {
    display: block; padding: 14px 16px;
    border-bottom: 1px solid var(--border); text-decoration: none;
  }
  .item:hover, .item:active { background: #FAFBFE; }
  .item-title {
    font-size: 16px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-meta, .meta-left {
    display: flex; gap: 6px; min-width: 0;
    font-size: 13px; color: var(--text-muted);
  }
  .item-meta { margin-top: 4px; }
  .author { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty, .notice {
    padding: 72px 24px; text-align: center; color: var(--text-muted); white-space: pre-line; margin: 0;
  }

  /* ===== 글쓰기 버튼 (오른쪽 아래, 강조색) ===== */
  .fab {
    position: fixed; z-index: 30;
    right: calc(max(0px, (100vw - var(--maxw)) / 2) + 16px);
    bottom: calc(20px + env(safe-area-inset-bottom));
    display: inline-flex; align-items: center; gap: 8px;
    height: 54px; padding: 0 22px 0 18px; border-radius: 27px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-size: 16px; font-weight: 700; box-shadow: var(--shadow);
  }
  .fab:hover { background: var(--accent-strong); }

  /* ===== 공통: 하위 상단바, 버튼, 입력 ===== */
  .subbar {
    display: flex; align-items: center; gap: 4px;
    height: 50px; padding: 0 6px; border-bottom: 1px solid var(--border);
  }
  .subbar h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .back {
    display: inline-flex; align-items: center; gap: 2px;
    border: 0; background: none; padding: 8px 10px; border-radius: 8px;
    color: var(--text-sub); font-size: 15px;
  }
  .back:hover { background: var(--bg); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 12px; font-weight: 700; white-space: nowrap;
  }
  .btn-primary { width: 100%; height: 54px; background: var(--accent); color: #fff; font-size: 16px; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-primary:disabled { opacity: .6; cursor: progress; }
  .btn-soft { height: 42px; padding: 0 14px; background: var(--accent-soft); color: var(--accent-ink); font-size: 14px; }
  .btn-soft:hover { background: #E2E7F7; }
  .btn-sm { height: 38px; padding: 0 16px; font-size: 14px; border-radius: 10px; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-strong); }
  .btn-accent:disabled { opacity: .6; }
  .btn-ghost { background: var(--bg); color: var(--text-sub); }

  .text-actions { display: flex; gap: 2px; flex: none; }
  .text-btn {
    border: 0; background: none; padding: 6px 8px; border-radius: 8px;
    font-size: 13px; color: var(--text-sub);
  }
  .text-btn:hover { background: var(--bg); }
  .text-btn.danger { color: var(--danger); }

  .input, .textarea {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 12px; background: #fff;
    font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .input:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .textarea { min-height: 220px; resize: vertical; line-height: 1.6; }

  /* ===== 글쓰기 화면 ===== */
  .form { padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); }
  .field { margin-bottom: 18px; }
  .label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--text-sub); }
  .hint { margin: 6px 0 0; font-size: 12.5px; color: var(--text-muted); }
  .error { margin: 6px 0 0; font-size: 13px; color: var(--danger); white-space: pre-line; }
  .link-row { display: flex; gap: 8px; margin-top: 14px; }
  .link-row .input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; }

  .chips { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  .chips:empty { display: none; }
  .chip {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    border: 1px solid var(--border); border-radius: 12px; background: #fff;
  }
  .thumb {
    position: relative; flex: none; width: 52px; height: 52px; overflow: hidden;
    border-radius: 8px; background: var(--bg); color: var(--text-muted);
    display: grid; place-items: center;
  }
  .thumb.sm { width: 36px; height: 36px; }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .play {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #fff; background: rgba(0, 0, 0, .28);
  }
  .chip-body { flex: 1; min-width: 0; }
  .chip-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip-sub { font-size: 12px; color: var(--text-muted); }
  .icon-btn {
    flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: none; color: var(--text-muted); display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }

  /* ===== 글 보기 화면 ===== */
  .post { padding: 20px 16px 8px; }
  .post-title { margin: 0; font-size: 21px; line-height: 1.4; font-weight: 800; letter-spacing: -.01em; }
  .post-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .post-content { margin: 16px 0 0; font-size: 16px; line-height: 1.75; white-space: pre-wrap; }
  .media { display: grid; gap: 10px; margin-top: 16px; }
  .media:empty { display: none; }
  .media img, .media video {
    display: block; width: 100%; max-height: 70vh; object-fit: contain;
    border-radius: 12px; background: var(--bg);
  }
  .media video { background: #000; }
  .links { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
  .link-card {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 12px;
    color: var(--accent-ink); text-decoration: none; font-size: 14px;
  }
  .link-card:hover { background: var(--accent-soft); }
  .link-card svg { flex: none; }
  .link-card span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .reactions { display: flex; justify-content: center; gap: 10px; margin: 28px 0 12px; }
  .react {
    display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px;
    border: 1px solid var(--border); border-radius: 999px; background: #fff;
    color: var(--text-sub); font-size: 14px; font-weight: 600;
  }
  .react[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .react .count { font-variant-numeric: tabular-nums; }

  .divider { height: 8px; background: var(--bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .comments { padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); }
  .comments h2 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
  .comment-list { list-style: none; margin: 0; padding: 0; }
  .comment { padding: 10px 0 12px; border-bottom: 1px solid var(--border); }
  .comment-head { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); }
  .comment-body { margin: 2px 0 0; font-size: 15px; white-space: pre-wrap; }
  .comment-empty { padding: 18px 0; font-size: 14px; color: var(--text-muted); }
  .comment-form, .comment-edit { display: grid; gap: 8px; }
  .comment-form { margin-top: 14px; }
  .comment-form .textarea, .comment-edit .textarea { min-height: 84px; }
  .row-end { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <header class="header">
      <!-- 왼쪽 위 로고: 누르면 전체 탭으로 이동 -->
      <a href="#/" class="logo" id="logo" aria-label="Memo, 전체 글로 이동">Memo</a>
      <!-- 오른쪽 위 프로필: 누르면 설정/로그아웃 버튼 (기능은 나중에 구현) -->
      <div class="profile">
        <button type="button" class="profile-btn" id="profileBtn" aria-label="프로필" aria-haspopup="menu" aria-expanded="false" aria-controls="profileMenu"></button>
        <div class="menu" id="profileMenu" role="menu" hidden>
          <button type="button" role="menuitem">설정</button>
          <button type="button" role="menuitem">로그아웃</button>
        </div>
      </div>
    </header>
    <!-- 카테고리 탭: 전체만 동작, 나머지 탭 상호작용은 나중에 구현 -->
    <nav class="tabs" id="tabs" role="tablist" aria-label="카테고리">
      <button type="button" role="tab" class="tab" id="tabAll" aria-selected="true">전체</button>
      <button type="button" role="tab" class="tab" aria-selected="false" aria-disabled="true" title="준비 중">잡담</button>
      <button type="button" role="tab" class="tab" aria-selected="false" aria-disabled="true" title="준비 중">공부</button>
      <button type="button" role="tab" class="tab" aria-selected="false" aria-disabled="true" title="준비 중">IT</button>
    </nav>
  </div>
  <main id="app"></main>
</div>
<!-- 가장 중요한 버튼: 글쓰기 (오른쪽 아래) -->
<a href="#/write" class="fab" id="fab" hidden>글쓰기</a>

<script>
(() => {
  'use strict';

  /* ================================================================
     설정값
     ================================================================ */
  const MAX_FILE_SIZE = 200 * 1024 * 1024; // 첨부파일 1개당 최대 200MB
  const IMAGE_EXT = /\.(jpe?g|png|gif|webp|bmp|svg|heic|heif|avif|tiff?)$/i;
  const VIDEO_EXT = /\.(mp4|mov|m4v|webm|mkv|avi|wmv|3gp|ogv)$/i;

  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  const fab = document.getElementById('fab');
  const profileBtn = document.getElementById('profileBtn');
  const menu = document.getElementById('profileMenu');

  const state = { query: '', posts: [] };

  /* ================================================================
     작은 도우미 함수들
     ================================================================ */
  const ICONS = {
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
    pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    search: '<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
    close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>',
    play: '<polygon points="7 4 20 12 7 20 7 4" fill="currentColor"/>',
    clip: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
    up: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
    down: '<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>'
  };
  function icon(name, size = 20) {
    const t = document.createElement('template');
    t.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
    return t.content.firstElementChild;
  }

  // 요소 생성기: 사용자 입력은 항상 텍스트로만 넣어서 HTML이 실행되지 않게 함
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [key, value] of Object.entries(attrs)) {
        if (value == null || value === false) continue;
        if (key === 'class') node.className = value;
        else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value === true ? '' : value);
      }
    }
    for (const child of children.flat()) {
      if (child == null || child === false) continue;
      node.append(child instanceof Node ? child : String(child));
    }
    return node;
  }

  const uid = () => (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

  // 작성일 표시: "~전" 형식 (예: 3시간전, 7일전, 3개월전)
  function timeAgo(ts) {
    const sec = Math.floor((Date.now() - ts) / 1000);
    if (sec < 60) return '방금전';
    const min = Math.floor(sec / 60);
    if (min < 60) return `${min}분전`;
    const hour = Math.floor(min / 60);
    if (hour < 24) return `${hour}시간전`;
    const day = Math.floor(hour / 24);
    if (day < 30) return `${day}일전`;
    if (day < 365) return `${Math.min(11, Math.floor(day / 30))}개월전`;
    return `${Math.floor(day / 365)}년전`;
  }
  const timeEl = ts => el('time', { datetime: new Date(ts).toISOString(), 'data-ts': ts }, timeAgo(ts));

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + 'B';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + 'KB';
    return (bytes / 1024 / 1024).toFixed(1) + 'MB';
  }

  // 링크 주소 정리: "example.com" → "https://example.com/", http/https만 허용
  function normalizeUrl(raw) {
    let s = raw.trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s;
    try {
      const u = new URL(s);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
      if (!u.hostname.includes('.') && u.hostname !== 'localhost') return null;
      return u.href;
    } catch (_) {
      return null;
    }
  }

  // 파일 종류 판별 (브라우저가 형식을 못 알려줄 때는 확장자로 판단)
  function mediaType(file) {
    if (/^(image|video)\//.test(file.type)) return file.type;
    if (IMAGE_EXT.test(file.name)) return 'image/' + file.name.split('.').pop().toLowerCase();
    if (VIDEO_EXT.test(file.name)) return 'video/' + file.name.split('.').pop().toLowerCase();
    return null;
  }

  function showError(node, message) {
    node.textContent = message || '';
    node.hidden = !message;
  }

  // 화면을 떠날 때 미리보기용 임시 URL 정리
  let objectURLs = [];
  function objectURL(blob) {
    const url = URL.createObjectURL(blob);
    objectURLs.push(url);
    return url;
  }
  function releaseURLs() {
    objectURLs.forEach(url => URL.revokeObjectURL(url));
    objectURLs = [];
  }

  /* ================================================================
     저장소 (IndexedDB)
     - 새로고침/브라우저 재시작 후에도 글이 유지됨
     - 200MB 첨부파일도 저장할 수 있도록 localStorage 대신 IndexedDB 사용
     ================================================================ */
  let db = null;
  const DB_NAME = 'memo-board';
  const STORE_NAMES = ['posts', 'files', 'reactions'];

  // 같은 브라우저에서 이전 버전 게시판이 같은 이름의 DB를 다른 구조로 먼저 만들어 둔 경우,
  // 필요한 저장 공간이 없어서 글 보기 화면이 열리지 않았음 → 없는 저장 공간을 만들어서 엶
  function openDB(version) {
    return new Promise((resolve, reject) => {
      let req;
      try { req = version ? indexedDB.open(DB_NAME, version) : indexedDB.open(DB_NAME); } catch (err) { reject(err); return; }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('posts')) d.createObjectStore('posts', { keyPath: 'id' });              // 글 + 댓글
        if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });              // 첨부 사진/동영상 원본
        if (!d.objectStoreNames.contains('reactions')) d.createObjectStore('reactions', { keyPath: 'postId' });  // 내가 누른 좋아요/싫어요
      };
      // 이전 버전 게시판이 다른 탭에 열려 있으면 그 탭을 닫을 때까지 기다림
      req.onblocked = () => {
        app.replaceChildren(el('p', { class: 'notice' },
          '다른 탭에 열려 있는 이전 버전 게시판을 닫아주세요.\n닫으면 자동으로 이어서 열려요.'));
      };
      req.onsuccess = () => {
        const d = req.result;
        if (STORE_NAMES.every(name => d.objectStoreNames.contains(name))) { resolve(d); return; }
        const next = d.version + 1;
        d.close();
        openDB(next).then(resolve, reject);
      };
      req.onerror = () => reject(req.error);
    });
  }

  // 트랜잭션 하나로 작업을 묶어서, 모두 저장되거나 하나도 저장되지 않게 함
  function run(storeNames, mode, work) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeNames, mode);
      const stores = {};
      [].concat(storeNames).forEach(name => { stores[name] = tx.objectStore(name); });
      let result;
      work(stores, value => { result = value; });
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('aborted'));
    });
  }

  const Store = {
    allPosts: () => run('posts', 'readonly', (s, done) => {
      s.posts.getAll().onsuccess = e => done(e.target.result);
    }),
    post: id => run('posts', 'readonly', (s, done) => {
      s.posts.get(id).onsuccess = e => done(e.target.result || null);
    }),
    file: id => run('files', 'readonly', (s, done) => {
      s.files.get(id).onsuccess = e => done(e.target.result ? e.target.result.blob : null);
    }),
    reaction: id => run('reactions', 'readonly', (s, done) => {
      s.reactions.get(id).onsuccess = e => done(e.target.result || { postId: id, like: false, dislike: false });
    }),
    // 글 작성/수정: 새 첨부는 추가, 뺀 첨부는 삭제
    savePost: (fields, addFiles, removeIds) => run(['posts', 'files'], 'readwrite', s => {
      removeIds.forEach(id => s.files.delete(id));
      addFiles.forEach(f => s.files.put({ id: f.id, blob: f.file }));
      s.posts.get(fields.id).onsuccess = e => {
        const existing = e.target.result;
        const post = existing
          ? Object.assign(existing, fields)
          : Object.assign({ createdAt: fields.updatedAt, likes: 0, dislikes: 0, comments: [] }, fields);
        s.posts.put(post);
      };
    }),
    deletePost: id => run(['posts', 'files', 'reactions'], 'readwrite', s => {
      s.posts.get(id).onsuccess = e => {
        const post = e.target.result;
        if (post) post.attachments.forEach(a => s.files.delete(a.id));
        s.posts.delete(id);
        s.reactions.delete(id);
      };
    }),
    updatePost: (id, mutate) => run('posts', 'readwrite', (s, done) => {
      s.posts.get(id).onsuccess = e => {
        const post = e.target.result;
        if (!post) { done(null); return; }
        mutate(post);
        s.posts.put(post);
        done(post);
      };
    }),
    // 좋아요/싫어요: 둘 다 누를 수 있고, 같은 버튼을 다시 누르면 취소
    toggleReaction: (id, kind) => run(['posts', 'reactions'], 'readwrite', (s, done) => {
      s.posts.get(id).onsuccess = e => {
        const post = e.target.result;
        if (!post) { done(null); return; }
        s.reactions.get(id).onsuccess = e2 => {
          const reaction = e2.target.result || { postId: id, like: false, dislike: false };
          reaction[kind] = !reaction[kind];
          const key = kind === 'like' ? 'likes' : 'dislikes';
          post[key] = Math.max(0, (post[key] || 0) + (reaction[kind] ? 1 : -1));
          s.posts.put(post);
          s.reactions.put(reaction);
          done({ post, reaction });
        };
      };
    })
  };

  // 이전 버전(다른 형식)으로 저장된 글을 이 버전 형식으로 맞춤
  // - 저장된 글/댓글/첨부/좋아요 기록은 그대로 두고 형식만 바꿈, 바뀐 글만 다시 저장
  function migrateLegacy() {
    const hasOldComments = db.objectStoreNames.contains('comments'); // 이전 버전은 댓글을 따로 저장했음
    const names = hasOldComments ? ['posts', 'reactions', 'comments'] : ['posts', 'reactions'];
    return run(names, 'readwrite', s => {
      const fixPosts = oldComments => {
        s.posts.getAll().onsuccess = e => {
          e.target.result.forEach(post => {
            let changed = false;
            if (!Array.isArray(post.attachments)) { post.attachments = []; changed = true; }
            if (post.attachments.some(a => !a || !a.id || !a.type)) {
              post.attachments = post.attachments.filter(a => a && (a.id || a.fileId)).map(a => (a.id && a.type) ? a : {
                id: a.id || a.fileId,
                name: a.name || '',
                type: a.type || (a.kind === 'video' ? 'video/*' : 'image/*'),
                size: a.size || 0
              });
              changed = true;
            }
            if (!Array.isArray(post.links)) { post.links = []; changed = true; }
            if (!Array.isArray(post.comments)) { post.comments = []; changed = true; }
            const moved = (oldComments[post.id] || []).filter(c => !post.comments.some(x => x.id === c.id));
            if (moved.length) {
              moved.forEach(c => post.comments.push({ id: c.id, content: c.content, createdAt: c.createdAt, updatedAt: c.updatedAt }));
              post.comments.sort((a, b) => a.createdAt - b.createdAt);
              changed = true;
            }
            ['likes', 'dislikes'].forEach(key => {
              if (typeof post[key] !== 'number') { post[key] = 0; changed = true; }
            });
            if ('liked' in post || 'disliked' in post) {
              const reaction = { postId: post.id, like: !!post.liked, dislike: !!post.disliked };
              s.reactions.get(post.id).onsuccess = e2 => { if (!e2.target.result) s.reactions.put(reaction); };
              delete post.liked;
              delete post.disliked;
              changed = true;
            }
            if (changed) s.posts.put(post);
          });
        };
      };
      if (!hasOldComments) { fixPosts({}); return; }
      s.comments.getAll().onsuccess = e => {
        const byPost = {};
        e.target.result.forEach(c => { (byPost[c.postId] = byPost[c.postId] || []).push(c); });
        fixPosts(byPost);
        s.comments.clear(); // 글 안으로 옮긴 댓글은 중복되지 않게 비움
      };
    });
  }

  // 브라우저가 저장 공간을 임의로 비우지 않도록 요청
  function requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch (_) { /* 지원하지 않는 브라우저는 무시 */ }
  }

  /* ================================================================
     화면 이동 (주소의 # 부분으로 화면 구분, 휴대폰 뒤로가기 지원)
     #/            전체 탭 (글 목록)
     #/write       글쓰기
     #/post/:id    글 보기
     #/edit/:id    글 수정
     ================================================================ */
  const norm = h => (!h || h === '#') ? '#/' : h;
  const stack = [norm(location.hash)];
  let seq = 0;
  let currentView = null;
  let listScroll = 0;

  window.addEventListener('hashchange', () => {
    const h = norm(location.hash);
    if (stack[stack.length - 1] !== h) {
      if (stack.length > 1 && stack[stack.length - 2] === h) stack.pop();
      else stack.push(h);
    }
    route();
  });

  function go(h) {
    if (norm(location.hash) === h) route();
    else location.hash = h;
  }
  function replace(h) {
    stack[stack.length - 1] = h;
    if (norm(location.hash) === h) route();
    else location.replace(h);
  }
  // 바로 전 화면이 target이면 뒤로가기, 아니면 target으로 교체
  function backTo(h) {
    if (stack.length > 1 && stack[stack.length - 2] === h) history.back();
    else replace(h);
  }

  function route() {
    if (!db) return;
    if (currentView === 'list') listScroll = window.scrollY;
    releaseURLs();
    closeMenu();
    const token = ++seq;
    const h = norm(location.hash);
    let m, task;
    if (h === '#/') task = renderList(token);
    else if (h === '#/write') task = renderWrite(token, null);
    else if ((m = h.match(/^#\/edit\/([\w-]+)$/))) task = renderWrite(token, m[1]);
    else if ((m = h.match(/^#\/post\/([\w-]+)$/))) task = renderDetail(token, m[1]);
    else return replace('#/');
    // 화면을 그리다 오류가 나도 '불러오는 중…'에서 멈추지 않고 안내를 보여줌
    task.catch(err => {
      console.error(err);
      if (token === seq) renderFailed();
    });
  }

  function setView(name) {
    currentView = name;
    tabs.hidden = name !== 'list';
    fab.hidden = name !== 'list';
    if (name !== 'list') window.scrollTo(0, 0);
  }

  function backButton(label, target) {
    return el('button', { type: 'button', class: 'back', onclick: () => backTo(target) }, icon('back', 20), label);
  }

  function renderMissing() {
    setView('missing');
    app.replaceChildren(
      el('div', { class: 'subbar' }, backButton('목록', '#/')),
      el('p', { class: 'notice' }, '글을 찾을 수 없어요.\n삭제된 글일 수 있어요.')
    );
  }

  function renderFailed() {
    setView('error');
    app.replaceChildren(
      el('div', { class: 'subbar' }, backButton('목록', '#/')),
      el('p', { class: 'notice' }, '화면을 불러오지 못했어요.\n새로고침 후 다시 시도해주세요.')
    );
  }

  /* ================================================================
     1) 전체 탭: 최신순 글 목록 + 검색
     ================================================================ */
  async function renderList(token) {
    setView('list');
    const input = el('input', {
      type: 'search', placeholder: '제목이나 내용으로 검색', 'aria-label': '글 검색',
      enterkeyhint: 'search', autocomplete: 'off'
    });
    input.value = state.query;
    input.addEventListener('input', () => { state.query = input.value; drawList(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) input.blur(); });

    const list = el('ul', { class: 'list', id: 'postList' }, el('li', { class: 'empty' }, '불러오는 중…'));
    app.replaceChildren(el('div', { class: 'search' }, el('div', { class: 'search-box' }, icon('search', 18), input)), list);

    let posts;
    try { posts = await Store.allPosts(); } catch (err) { console.error(err); posts = []; }
    if (token !== seq) return;
    state.posts = posts.sort((a, b) => b.createdAt - a.createdAt); // 최신순
    drawList();
    window.scrollTo(0, listScroll);
  }

  function drawList() {
    const list = document.getElementById('postList');
    if (!list) return;
    const q = state.query.trim().toLowerCase();
    const shown = q
      ? state.posts.filter(p => p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q))
      : state.posts;

    if (!shown.length) {
      list.replaceChildren(el('li', { class: 'empty' }, q
        ? `'${state.query.trim()}'에 대한 검색 결과가 없어요.`
        : '아직 작성된 글이 없어요.\n오른쪽 아래 글쓰기 버튼으로 첫 글을 남겨보세요.'));
      return;
    }
    // 각 항목: 제목, 작성일, 작성자
    list.replaceChildren(...shown.map(p => el('li', null,
      el('a', { class: 'item', href: '#/post/' + p.id },
        el('div', { class: 'item-title' }, p.title),
        el('div', { class: 'item-meta' },
          timeEl(p.createdAt),
          el('span', { 'aria-hidden': 'true' }, '·'),
          el('span', { class: 'author' }, p.author))))));
  }

  /* ================================================================
     2) 글쓰기 / 글 수정
     ================================================================ */
  async function renderWrite(token, id) {
    setView('write');
    let post = null;
    if (id) {
      app.replaceChildren(el('p', { class: 'notice' }, '불러오는 중…'));
      post = await Store.post(id);
      if (token !== seq) return;
      if (!post) return renderMissing();
    }
    const isEdit = !!post;
    const draft = {
      files: isEdit ? post.attachments.map(a => Object.assign({ existing: true }, a)) : [],
      links: isEdit ? post.links.slice() : [],
      removed: []
    };

    const nickname = el('input', { class: 'input', id: 'f-author', maxlength: '20', required: true, placeholder: '사용할 닉네임', autocomplete: 'off' });
    const title = el('input', { class: 'input', id: 'f-title', maxlength: '100', required: true, placeholder: '제목을 입력하세요' });
    const content = el('textarea', { class: 'textarea', id: 'f-content', required: true, placeholder: '내용을 입력하세요' });
    if (isEdit) {
      nickname.value = post.author;
      title.value = post.title;
      content.value = post.content;
    }

    // 사진/동영상 첨부
    const fileInput = el('input', { type: 'file', accept: 'image/*,video/*', multiple: true, hidden: true, 'aria-label': '사진·동영상 선택' });
    const fileError = el('p', { class: 'error', role: 'alert', hidden: true });
    const fileList = el('ul', { class: 'chips', 'aria-label': '첨부한 사진·동영상' });

    function drawFiles() {
      fileList.replaceChildren(...draft.files.map(f => {
        const isVideo = f.type.startsWith('video/');
        const thumb = el('div', { class: 'thumb' });
        if (f.url) {
          thumb.append(isVideo
            ? el('video', { src: f.url + '#t=0.1', muted: true, playsinline: true, preload: 'metadata' })
            : el('img', { src: f.url, alt: '' }));
          if (isVideo) thumb.append(el('span', { class: 'play' }, icon('play', 16)));
        } else {
          thumb.append(icon(isVideo ? 'play' : 'image', 20));
        }
        return el('li', { class: 'chip' },
          thumb,
          el('div', { class: 'chip-body' },
            el('div', { class: 'chip-name' }, f.name),
            el('div', { class: 'chip-sub' }, (isVideo ? '동영상' : '사진') + ' · ' + formatSize(f.size))),
          el('button', {
            type: 'button', class: 'icon-btn', 'aria-label': `${f.name} 첨부 빼기`,
            onclick: () => {
              draft.files = draft.files.filter(x => x !== f);
              if (f.existing) draft.removed.push(f.id);
              drawFiles();
            }
          }, icon('close', 18)));
      }));
    }

    fileInput.addEventListener('change', () => {
      const errors = [];
      for (const file of fileInput.files) {
        const type = mediaType(file);
        if (!type) { errors.push(`${file.name}: 사진이나 동영상만 첨부할 수 있어요.`); continue; }
        if (file.size > MAX_FILE_SIZE) { errors.push(`${file.name}: 200MB를 넘는 파일은 첨부할 수 없어요.`); continue; }
        draft.files.push({ id: uid(), name: file.name, type, size: file.size, file, url: objectURL(file) });
      }
      fileInput.value = '';
      showError(fileError, errors.join('\n'));
      drawFiles();
    });

    // 수정할 때는 저장된 사진/동영상 미리보기를 불러옴
    draft.files.forEach(f => {
      Store.file(f.id).then(blob => {
        if (!blob || token !== seq) return;
        f.url = objectURL(blob);
        drawFiles();
      }).catch(() => {});
    });

    // 링크 첨부
    const linkInput = el('input', { class: 'input', type: 'text', inputmode: 'url', placeholder: 'https://', 'aria-label': '첨부할 링크 주소', autocomplete: 'off' });
    const linkError = el('p', { class: 'error', role: 'alert', hidden: true });
    const linkList = el('ul', { class: 'chips', 'aria-label': '첨부한 링크' });

    function drawLinks() {
      linkList.replaceChildren(...draft.links.map(url => el('li', { class: 'chip' },
        el('div', { class: 'thumb sm' }, icon('link', 18)),
        el('div', { class: 'chip-body' }, el('div', { class: 'chip-name' }, url)),
        el('button', {
          type: 'button', class: 'icon-btn', 'aria-label': '링크 빼기',
          onclick: () => { draft.links = draft.links.filter(u => u !== url); drawLinks(); }
        }, icon('close', 18)))));
    }
    function addLink() {
      const raw = linkInput.value.trim();
      if (!raw) return true;
      const url = normalizeUrl(raw);
      if (!url) {
        showError(linkError, '올바른 링크 주소를 입력해주세요. (예: https://example.com)');
        return false;
      }
      showError(linkError, '');
      if (!draft.links.includes(url)) draft.links.push(url);
      linkInput.value = '';
      drawLinks();
      return true;
    }
    linkInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addLink(); }
    });

    const submitLabel = isEdit ? '수정 완료' : '글쓰기 완료';
    const submit = el('button', { type: 'submit', class: 'btn btn-primary' }, submitLabel);

    const field = (label, forId, control, hint) => el('div', { class: 'field' },
      el('label', { class: 'label', for: forId }, label), control, hint ? el('p', { class: 'hint' }, hint) : null);

    const form = el('form', { class: 'form' },
      field('닉네임', 'f-author', nickname, '글에 작성자로 표시되는 이름이에요. 실명은 쓰지 않아도 돼요.'),
      field('제목', 'f-title', title),
      field('내용', 'f-content', content),
      el('div', { class: 'field' },
        el('span', { class: 'label' }, '첨부'),
        el('button', { type: 'button', class: 'btn btn-soft', onclick: () => fileInput.click() }, icon('clip', 18), '사진·동영상 추가'),
        fileInput,
        el('p', { class: 'hint' }, '파일 1개당 최대 200MB'),
        fileError,
        fileList,
        el('div', { class: 'link-row' },
          linkInput,
          el('button', { type: 'button', class: 'btn btn-soft', onclick: addLink }, '링크 추가')),
        linkError,
        linkList),
      submit);

    form.addEventListener('submit', async e => {
      e.preventDefault();
      // 공백만 입력한 칸은 빈 칸으로 처리해서 필수 입력 안내가 뜨게 함
      [nickname, title, content].forEach(f => { if (!f.value.trim()) f.value = ''; });
      if (!form.reportValidity()) return;
      if (!addLink()) { linkInput.focus(); return; } // 입력만 하고 '추가'를 안 누른 링크도 첨부

      submit.disabled = true;
      submit.textContent = '저장 중…';
      const fields = {
        id: isEdit ? post.id : uid(),
        author: nickname.value.trim(),
        title: title.value.trim(),
        content: content.value.trim(),
        links: draft.links.slice(),
        attachments: draft.files.map(f => ({ id: f.id, name: f.name, type: f.type, size: f.size })),
        updatedAt: Date.now()
      };
      try {
        await Store.savePost(fields, draft.files.filter(f => f.file), draft.removed);
        requestPersist();
        if (isEdit) {
          backTo('#/post/' + fields.id);
        } else {
          // 목록 맨 위에서 새 글이 보이도록 검색어/스크롤 초기화
          state.query = '';
          listScroll = 0;
          backTo('#/');
        }
      } catch (err) {
        console.error(err);
        alert(err && err.name === 'QuotaExceededError'
          ? '저장 공간이 부족해서 글을 저장하지 못했어요.'
          : '글을 저장하지 못했어요. 다시 시도해주세요.');
        submit.disabled = false;
        submit.textContent = submitLabel;
      }
    });

    app.replaceChildren(
      el('div', { class: 'subbar' },
        backButton('취소', isEdit ? '#/post/' + post.id : '#/'),
        el('h2', null, isEdit ? '글 수정' : '글쓰기')),
      form);
    drawFiles();
    drawLinks();
  }

  /* ================================================================
     3) 글 보기: 본문, 첨부, 좋아요/싫어요, 수정/삭제, 댓글
     ================================================================ */
  async function renderDetail(token, id) {
    setView('detail');
    app.replaceChildren(el('p', { class: 'notice' }, '불러오는 중…'));
    let post, reaction;
    try {
      [post, reaction] = await Promise.all([Store.post(id), Store.reaction(id)]);
    } catch (err) {
      console.error(err);
    }
    if (token !== seq) return;
    if (!post) return renderMissing();

    // 첨부 사진/동영상
    const media = el('div', { class: 'media' });
    post.attachments.forEach(a => {
      const slot = el('div');
      media.append(slot);
      Store.file(a.id).then(blob => {
        if (!blob || token !== seq) { slot.remove(); return; }
        const url = objectURL(blob);
        slot.replaceWith(a.type.startsWith('video/')
          ? el('video', { src: url, controls: true, playsinline: true, preload: 'metadata' })
          : el('img', { src: url, alt: a.name }));
      }).catch(() => slot.remove());
    });

    // 첨부 링크
    const links = post.links.length
      ? el('ul', { class: 'links' }, post.links.map(url => el('li', null,
          el('a', { class: 'link-card', href: url, target: '_blank', rel: 'noopener noreferrer' }, icon('link', 18), el('span', null, url)))))
      : null;

    // 좋아요 / 싫어요
    function reactButton(kind, label, iconName) {
      const count = el('span', { class: 'count' });
      const btn = el('button', { type: 'button', class: 'react', 'aria-pressed': 'false' }, icon(iconName, 18), label, count);
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const r = await Store.toggleReaction(id, kind);
          if (r) paintReactions(r.post, r.reaction);
        } catch (err) {
          console.error(err);
          alert('반영하지 못했어요. 다시 시도해주세요.');
        }
        btn.disabled = false;
      });
      btn.count = count;
      return btn;
    }
    const likeBtn = reactButton('like', '좋아요', 'up');
    const dislikeBtn = reactButton('dislike', '싫어요', 'down');
    function paintReactions(p, r) {
      likeBtn.setAttribute('aria-pressed', String(!!r.like));
      likeBtn.count.textContent = p.likes || 0;
      dislikeBtn.setAttribute('aria-pressed', String(!!r.dislike));
      dislikeBtn.count.textContent = p.dislikes || 0;
    }
    paintReactions(post, reaction);

    // 글 수정 / 삭제
    async function deletePost() {
      if (!confirm('이 글을 삭제할까요?\n삭제한 글은 되돌릴 수 없어요.')) return;
      try {
        await Store.deletePost(id);
        backTo('#/');
      } catch (err) {
        console.error(err);
        alert('글을 삭제하지 못했어요. 다시 시도해주세요.');
      }
    }

    // 댓글
    let current = post;
    const commentCount = el('span');
    const commentList = el('ul', { class: 'comment-list' });
    const commentInput = el('textarea', { class: 'textarea', placeholder: '댓글을 입력하세요', 'aria-label': '댓글 입력', maxlength: '1000' });
    const commentSubmit = el('button', { type: 'submit', class: 'btn btn-sm btn-accent' }, '작성하기');
    const commentForm = el('form', { class: 'comment-form' }, commentInput, el('div', { class: 'row-end' }, commentSubmit));

    function drawComments() {
      commentCount.textContent = current.comments.length;
      commentList.replaceChildren(...(current.comments.length
        ? current.comments.map(commentItem)
        : [el('li', { class: 'comment-empty' }, '아직 댓글이 없어요.')]));
    }

    function commentItem(c) {
      const li = el('li', { class: 'comment' });
      const showView = () => li.replaceChildren(
        el('div', { class: 'comment-head' },
          timeEl(c.createdAt),
          el('div', { class: 'text-actions' },
            el('button', { type: 'button', class: 'text-btn', onclick: showEdit }, '수정'),
            el('button', { type: 'button', class: 'text-btn danger', onclick: remove }, '삭제'))),
        el('p', { class: 'comment-body' }, c.content));

      const showEdit = () => {
        const ta = el('textarea', { class: 'textarea', 'aria-label': '댓글 수정', maxlength: '1000' });
        ta.value = c.content;
        const save = el('button', { type: 'submit', class: 'btn btn-sm btn-accent' }, '저장');
        const form = el('form', { class: 'comment-edit' }, ta,
          el('div', { class: 'row-end' },
            el('button', { type: 'button', class: 'btn btn-sm btn-ghost', onclick: showView }, '취소'),
            save));
        form.addEventListener('submit', async e => {
          e.preventDefault();
          const text = ta.value.trim();
          if (!text) { ta.focus(); return; }
          save.disabled = true;
          try {
            const p = await Store.updatePost(id, p => {
              const target = p.comments.find(x => x.id === c.id);
              if (target) { target.content = text; target.updatedAt = Date.now(); }
            });
            if (p) { current = p; drawComments(); }
          } catch (err) {
            console.error(err);
            alert('댓글을 수정하지 못했어요. 다시 시도해주세요.');
            save.disabled = false;
          }
        });
        li.replaceChildren(form);
        ta.focus();
      };

      const remove = async () => {
        if (!confirm('이 댓글을 삭제할까요?')) return;
        try {
          const p = await Store.updatePost(id, p => { p.comments = p.comments.filter(x => x.id !== c.id); });
          if (p) { current = p; drawComments(); }
        } catch (err) {
          console.error(err);
          alert('댓글을 삭제하지 못했어요. 다시 시도해주세요.');
        }
      };

      showView();
      return li;
    }

    commentForm.addEventListener('submit', async e => {
      e.preventDefault();
      const text = commentInput.value.trim();
      if (!text) { commentInput.focus(); return; }
      commentSubmit.disabled = true;
      try {
        const p = await Store.updatePost(id, p => {
          p.comments.push({ id: uid(), content: text, createdAt: Date.now() });
        });
        if (p) { current = p; commentInput.value = ''; drawComments(); }
      } catch (err) {
        console.error(err);
        alert('댓글을 저장하지 못했어요. 다시 시도해주세요.');
      }
      commentSubmit.disabled = false;
    });

    app.replaceChildren(
      el('div', { class: 'subbar' }, backButton('목록', '#/')),
      el('article', { class: 'post' },
        el('h1', { class: 'post-title' }, post.title),
        el('div', { class: 'post-meta' },
          el('div', { class: 'meta-left' },
            timeEl(post.createdAt),
            el('span', { 'aria-hidden': 'true' }, '·'),
            el('span', { class: 'author' }, post.author)),
          el('div', { class: 'text-actions' },
            el('button', { type: 'button', class: 'text-btn', onclick: () => go('#/edit/' + id) }, '수정'),
            el('button', { type: 'button', class: 'text-btn danger', onclick: deletePost }, '삭제'))),
        el('div', { class: 'post-content' }, post.content),
        media,
        links,
        el('div', { class: 'reactions' }, likeBtn, dislikeBtn)),
      el('div', { class: 'divider' }),
      el('section', { class: 'comments', 'aria-label': '댓글' },
        el('h2', null, '댓글 ', commentCount),
        commentList,
        commentForm));
    drawComments();
  }

  /* ================================================================
     상단 영역 동작
     ================================================================ */
  profileBtn.append(icon('user', 20));
  fab.prepend(icon('pencil', 20));

  function closeMenu() {
    menu.hidden = true;
    profileBtn.setAttribute('aria-expanded', 'false');
  }
  profileBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = menu.hidden;
    menu.hidden = !open;
    profileBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', e => {
    if (!menu.hidden && !e.target.closest('.profile')) closeMenu();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  // 설정/로그아웃: PRD에 따라 버튼만 만들고 기능은 나중에 구현
  menu.querySelectorAll('button').forEach(b => b.addEventListener('click', closeMenu));

  // 로고: 전체 탭으로 이동
  document.getElementById('logo').addEventListener('click', e => {
    e.preventDefault();
    state.query = '';
    listScroll = 0;
    window.scrollTo(0, 0);
    go('#/');
  });
  // 전체 탭
  document.getElementById('tabAll').addEventListener('click', () => {
    listScroll = 0;
    window.scrollTo(0, 0);
    go('#/');
  });

  // "~전" 표시를 30초마다 갱신
  setInterval(() => {
    document.querySelectorAll('time[data-ts]').forEach(t => { t.textContent = timeAgo(Number(t.dataset.ts)); });
  }, 30000);

  /* ================================================================
     시작
     ================================================================ */
  (async () => {
    try {
      db = await openDB();
    } catch (err) {
      console.error(err);
      setView('error');
      app.replaceChildren(el('p', { class: 'notice' },
        '이 브라우저에서는 글을 저장할 수 없어요.\n시크릿 모드가 아닌 최신 브라우저(Chrome, Safari, Edge 등)에서 열어주세요.'));
      return;
    }
    try { await migrateLegacy(); } catch (err) { console.error(err); }
    route();
  })();
})();
</script>
</body>
</html>
