<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학생 작품 | AI × BUILD · 한국디지털미디어고등학교</title>
<meta name="theme-color" content="#FBFAF7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C6603C'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='bold' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
/* ---------- 학생 작품 갤러리 전용 (색은 사이트 공통 변수를 씁니다) ---------- */
.g-head{padding:44px 0 22px}
.g-head h1{font-size:34px;margin-top:6px}
.g-head p{margin-top:8px;color:var(--ink-muted);max-width:720px}
.g-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-body)}
.seg button.on{background:var(--accent-wash);color:var(--accent-strong)}
.g-search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:10px;font:inherit;background:var(--surface)}
.g-search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.g-note{font-size:13px;color:var(--ink-faint);margin:6px 0 18px}

.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.days button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink-body)}
.days button.on{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.days button[disabled]{opacity:.4;cursor:default}
.days button i{font-style:normal;font-weight:500;opacity:.7;margin-left:3px}

.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:60px}
.s-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow)}
.s-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.s-name{font-size:17px;font-weight:800;color:var(--ink)}
.s-team{font-size:12px;font-weight:700;color:var(--accent-strong);background:var(--accent-wash);padding:2px 8px;border-radius:99px;white-space:nowrap}
.s-cnt{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.dot{width:30px;height:30px;border-radius:7px;border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink-faint);background:none;padding:0}
.dot.has{border:0;background:var(--accent);color:#fff;cursor:pointer}
.dot.has:hover{background:var(--accent-strong)}
.s-open{margin-top:12px;width:100%}

.w-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:60px}
.w-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.w-who{display:flex;gap:8px;align-items:center;justify-content:space-between}
.w-who b{color:var(--ink);font-size:15.5px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.file:hover{border-color:var(--accent-soft);background:var(--accent-wash)}
.ft{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--navy);color:#fff}
.ft.md{background:#3B539B}.ft.img{background:#2F7A55}.ft.etc{background:var(--navy-soft)}
.fn{flex:1;min-width:0}
.fn b{display:block;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn small{display:block;font-size:12px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn em{display:block;font-style:normal;font-size:12.5px;color:var(--ink-muted);margin-top:2px;line-height:1.45}

.empty{padding:44px 20px;text-align:center;border:1px dashed var(--line-strong);border-radius:var(--radius);color:var(--ink-muted);margin-bottom:60px}

/* ---------- 학생 한 명 보기 ---------- */
.p-nav{margin:22px 0 0}
.back-link{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:1px solid var(--accent-strong);border-radius:10px;background:var(--accent-strong);color:#fff;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:var(--shadow)}
.back-link:hover{background:#8F3623;border-color:#8F3623;color:#fff}
.back-link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back-link .ico{font-size:15px;line-height:1}
.p-foot{margin:28px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:14px 0 16px}
.p-head h2{font-size:28px}
.timeline{display:flex;flex-direction:column;gap:12px;margin-bottom:60px}
.t-row{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:start}
.t-day{font-weight:800;color:var(--ink);padding-top:10px}
.t-day small{display:block;font-weight:600;font-size:12px;color:var(--ink-faint)}
.t-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.t-none{padding:12px 14px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink-faint);font-size:13.5px}

/* ---------- 보기 창 ---------- */
.viewer-dlg{position:fixed;inset:0;z-index:100;background:rgba(20,18,16,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.v-panel{background:var(--surface);border-radius:16px;width:min(1180px,100%);height:min(860px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.v-bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.v-title{flex:1;min-width:0}
.v-title b{display:block;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-title small{color:var(--ink-faint)}
.v-body{flex:1;min-height:0;overflow:auto;background:var(--bg)}
.v-body iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.v-body img{max-width:100%;margin:20px auto}
.v-size{display:inline-flex;gap:4px}
.v-size button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.v-size button.on{background:var(--accent-wash);border-color:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.phone-frame{width:390px;max-width:100%;height:100%;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* 마크다운 */
.mdv{max-width:820px;margin:0 auto;padding:30px 28px 60px;background:var(--surface);min-height:100%;color:var(--ink-body)}
.mdv h1{font-size:28px;margin:6px 0 16px}.mdv h2{font-size:21px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mdv h3{font-size:17px;margin:20px 0 8px}.mdv h4{font-size:15px;margin:16px 0 6px}
.mdv p{margin:10px 0}.mdv ul,.mdv ol{margin:8px 0 8px 22px;padding:0}.mdv ul{list-style:disc}.mdv ol{list-style:decimal}.mdv li{margin:3px 0}
.mdv code{font-family:var(--mono);font-size:.9em;background:var(--bg-tint);padding:1px 5px;border-radius:5px}
.mdv pre{background:var(--navy);color:#f1efe9;padding:14px 16px;border-radius:10px;overflow:auto;font-size:13px;line-height:1.6}
.mdv pre code{background:none;padding:0;color:inherit}
.mdv blockquote{margin:12px 0;padding:8px 14px;border-left:4px solid var(--accent-soft);background:var(--bg-soft);color:var(--ink-muted)}
.mdv table{border-collapse:collapse;margin:12px 0;width:100%;font-size:14px}.mdv th,.mdv td{border:1px solid var(--line);padding:7px 10px;text-align:left}.mdv th{background:var(--bg-soft)}
.mdv hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.mdv input[type=checkbox]{margin-right:6px}

@media (max-width:860px){
  .g-head h1{font-size:26px}
  .t-row{grid-template-columns:1fr;gap:4px}
  .t-day{padding-top:0}
  .viewer-dlg{padding:0}.v-panel{border-radius:0;height:100%}
  .v-size{display:none}
}
.g-privacy{margin:6px 0 0;color:var(--ink-muted);font-size:13.5px}
</style>
</head>

<!-- tools/build-gallery.py 가 만드는 공개용 작품 목록. 직접 고치지 않습니다. -->
<script src="data.js"></script>
<script>
(function () {
  'use strict';

  var DATA = window.STUDENT_WORKS || { updated: '', days: 10, students: [] };
  var DAYS = DATA.days || 10;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function enc(p) { return p.split('/').map(encodeURIComponent).join('/'); }

  var LABELS = DATA.labels || {};
  var state = { view: 'students', day: 0, q: '', student: '' };

  /* 작품이 한 개라도 올라온 일차만 보여 줍니다 */
  var ACTIVE = (function () {
    var seen = {};
    DATA.students.forEach(function (s) { Object.keys(s.days || {}).forEach(function (d) { if (s.days[d].length) seen[d] = 1; }); });
    return Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
  })();
  function dayLabel(d) { return LABELS[d] ? d + '일차 · ' + LABELS[d] : d + '일차'; }

  /* ---------- 공통 ---------- */
  function worksOf(s, d) { return (s.days && s.days[d]) || []; }
  function dayCount(s) { return ACTIVE.filter(function (d) { return worksOf(s, d).length; }).length; }
  function matchStudent(s) {
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    var hay = [s.name, s.team].concat(Object.keys(s.days || {}).reduce(function (a, d) {
      return a.concat(s.days[d].map(function (f) { return f.title + ' ' + f.name + ' ' + (f.desc || ''); }));
    }, [])).join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }
  function kind(f) {
    if (f.ext === 'html' || f.ext === 'htm') return { cls: '', label: 'HTML' };
    if (f.ext === 'md') return { cls: 'md', label: 'MD' };
    if (/^(png|jpe?g|gif|webp|svg)$/.test(f.ext)) return { cls: 'img', label: 'IMG' };
    return { cls: 'etc', label: f.ext.toUpperCase() || 'FILE' };
  }
  function fileBtn(s, d, i) {
    var f = worksOf(s, d)[i], k = kind(f);
    return '<button class="file" type="button" data-open="' + esc(s.id) + '|' + d + '|' + i + '">' +
      '<span class="ft ' + k.cls + '">' + k.label + '</span>' +
      '<span class="fn"><b>' + esc(f.title || f.name) + '</b>' + (f.desc ? '<em>' + esc(f.desc) + '</em>' : '') + '<small>' + esc(f.name) + '</small></span>' +
      '<span aria-hidden="true">→</span></button>';
  }

  /* ---------- 학생별 ---------- */
  function renderStudents() {
    var list = DATA.students.filter(matchStudent);
    if (!DATA.students.length) return emptyAll();
    if (!list.length) return '<div class="empty">검색 결과가 없습니다.</div>';
    return '<div class="s-grid">' + list.map(function (s) {
      var dots = ACTIVE.map(function (d) {
        return worksOf(s, d).length
          ? '<button class="dot has" type="button" title="' + esc(dayLabel(d)) + ' 보기" data-student="' + esc(s.id) + '" data-day="' + d + '">' + d + '</button>'
          : '<span class="dot" title="' + esc(dayLabel(d)) + ' · 아직 없음">' + d + '</span>';
      }).join('');
      return '<article class="s-card">' +
        '<div class="s-top"><span class="s-name">' + esc(s.name) + '</span>' + (s.team ? '<span class="s-team">' + esc(s.team) + '</span>' : '') + '</div>' +
        '<div class="s-cnt">' + dayCount(s) + ' / ' + ACTIVE.length + '번 제출</div>' +
        '<div class="dots">' + dots + '</div>' +
        '<button class="btn btn-ghost s-open" type="button" data-student="' + esc(s.id) + '">전체 기록 보기 →</button>' +
      '</article>';
    }).join('') + '</div>';
  }

  /* ---------- 일차별 ---------- */
  function renderDays() {
    if (!DATA.students.length) return emptyAll();
    if (ACTIVE.indexOf(state.day) < 0) state.day = ACTIVE[ACTIVE.length - 1];
    var tabs = '<div class="days">' + ACTIVE.map(function (d) {
      var n = DATA.students.filter(function (s) { return worksOf(s, d).length; }).length;
      return '<button type="button" data-pick="' + d + '"' + (state.day === d ? ' class="on"' : '') + '>' + esc(dayLabel(d)) + '<i>' + n + '</i></button>';
    }).join('') + '</div>';
    var list = DATA.students.filter(function (s) { return worksOf(s, state.day).length && matchStudent(s); });
    var body = list.length
      ? '<div class="w-list">' + list.map(function (s) {
          return '<article class="w-card"><div class="w-who"><b>' + esc(s.name) + '</b>' + (s.team ? '<span class="s-team">' + esc(s.team) + '</span>' : '') + '</div>' +
            '<div class="files">' + worksOf(s, state.day).map(function (_f, i) { return fileBtn(s, state.day, i); }).join('') + '</div></article>';
        }).join('') + '</div>'
      : '<div class="empty">검색 결과가 없습니다.</div>';
    return tabs + body;
  }

  /* ---------- 학생 한 명 ---------- */
  function renderPerson(id) {
    var s = DATA.students.filter(function (x) { return x.id === id; })[0];
    if (!s) return '<div class="empty">학생을 찾을 수 없습니다.</div>';
    // 이 학생이 제출한 일차만 시간 순서대로 보여 줍니다
    var rows = ACTIVE.filter(function (d) { return worksOf(s, d).length; }).map(function (d) {
      var w = worksOf(s, d);
      return '<div class="t-row" id="day-' + d + '"><div class="t-day">' + d + '일차<small>' + esc(LABELS[d] || '') + '</small></div>' +
        '<div class="t-box"><div class="files">' + w.map(function (_f, i) { return fileBtn(s, d, i); }).join('') + '</div></div></div>';
    }).join('');
    if (!rows) rows = '<div class="t-none">아직 올라온 작품이 없습니다.</div>';
    var backBtn = '<button class="back-link" type="button">' +
      '<span class="ico" aria-hidden="true">←</span>학생 목록으로</button>';
    return '<div class="p-nav">' + backBtn + '</div>' +
      '<div class="p-head"><div><h2>' + esc(s.name) + '</h2>' +
      (s.team ? '<span class="s-team">' + esc(s.team) + '</span> ' : '') + '<span class="s-cnt">' + dayCount(s) + ' / ' + ACTIVE.length + '번 제출</span></div></div>' +
      '<div class="timeline">' + rows + '</div>' +
      '<div class="p-foot">' + backBtn + '</div>';
  }

  function emptyAll() {
    return '<div class="empty">아직 올라온 작품이 없습니다.<br>선생님이 작품을 정리하면 여기에 나타납니다.</div>';
  }

  /* ---------- 화면 그리기 · 주소 ---------- */
  function readHash() {
    var p = new URLSearchParams(location.hash.slice(1));
    state.student = p.get('s') || '';
    state.view = p.get('v') === 'days' ? 'days' : 'students';
    state.day = parseInt(p.get('d'), 10) || 0;
  }
  function writeHash() {
    var p = new URLSearchParams();
    if (state.student) p.set('s', state.student);
    else { if (state.view === 'days') { p.set('v', 'days'); if (state.day) p.set('d', state.day); } }
    var h = p.toString();
    history.replaceState(null, '', h ? '#' + h : location.pathname);
  }
  function render() {
    document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', !state.student && b.dataset.view === state.view); });
    $('view').innerHTML = state.student ? renderPerson(state.student) : (state.view === 'days' ? renderDays() : renderStudents());
    var total = DATA.students.reduce(function (a, s) { return a + Object.keys(s.days || {}).reduce(function (b, d) { return b + s.days[d].length; }, 0); }, 0);
    $('note').textContent = DATA.students.length
      ? '학생 ' + DATA.students.length + '명 · 파일 ' + total + '개' + (DATA.updated ? ' · 마지막 정리 ' + DATA.updated : '')
      : '';
  }

  /* ---------- 보기 창 ---------- */
  var lastFocus = null;
  function openFile(sid, d, i) {
    var s = DATA.students.filter(function (x) { return x.id === sid; })[0];
    var f = s && worksOf(s, d)[i];
    if (!f) return;
    var url = enc(f.path), k = kind(f), body = $('vBody');
    lastFocus = document.activeElement;
    $('vTitle').textContent = f.title || f.name;
    $('vSub').textContent = s.name + ' · ' + dayLabel(d) + ' · ' + (f.desc || f.name);
    $('vOpen').href = url;
    $('vSize').hidden = k.cls !== '';
    setSize('pc');
    if (k.cls === '') {
      // 학생 작품은 별도 창(iframe)에서 실행합니다. 최고 점수 저장(localStorage)이 되도록 same-origin 을 허용합니다.
      body.innerHTML = '<iframe id="vFrame" title="' + esc(f.title || f.name) + '" src="' + url + '" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"></iframe>';
    } else if (k.cls === 'md') {
      body.innerHTML = '<article class="mdv">' + (f.text != null ? markdown(f.text) : '<p>불러오는 중…</p>') + '</article>';
      if (f.text == null) fetch(url).then(function (r) { return r.text(); }).then(function (t) {
        body.innerHTML = '<article class="mdv">' + markdown(t) + '</article>';
      }).catch(function () { body.innerHTML = '<article class="mdv"><p>파일을 불러오지 못했습니다. [새 탭]으로 열어 보세요.</p></article>'; });
    } else if (k.cls === 'img') {
      body.innerHTML = '<img src="' + url + '" alt="' + esc(f.name) + '">';
    } else {
      body.innerHTML = '<article class="mdv"><p>이 파일은 미리 볼 수 없습니다.</p><p><a class="btn btn-primary" href="' + url + '" download>내려받기</a></p></article>';
    }
    $('dlg').hidden = false;
    document.body.style.overflow = 'hidden';
    $('vClose').focus();
  }
  function closeFile() {
    $('dlg').hidden = true;
    $('vBody').innerHTML = '';
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }
  function setSize(sz) {
    document.querySelectorAll('#vSize button').forEach(function (b) { b.classList.toggle('on', b.dataset.size === sz); });
    var fr = $('vFrame'); if (fr) fr.className = sz === 'phone' ? 'phone-frame' : '';
  }

  /* ---------- 아주 작은 마크다운 변환기 (외부 라이브러리 없이) ---------- */
  function inline(t) {
    t = esc(t);
    var codes = [];
    t = t.replace(/`([^`]+)`/g, function (_m, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
         .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
         .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
         .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
         .replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return t.replace(/\u0000(\d+)\u0000/g, function (_m, n) { return '<code>' + codes[n] + '</code>'; });
  }
  function markdown(src) {
    var lines = src.replace(/\r\n?/g, '\n').split('\n'), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
      }
      var h = l.match(/^(#{1,4})\s+(.*)$/);
      if (h) { out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^>\s?/.test(l)) {
        var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ''));
        out.push('<blockquote>' + q.map(inline).join('<br>') + '</blockquote>'); continue;
      }
      if (/^\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
        var cells = function (r) { return r.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };
        var head = cells(l); i += 2; var rows = [];
        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
        continue;
      }
      if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
        var ordered = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
          var it = lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, '');
          it = it.replace(/^\[( |x|X)\]\s*/, function (_m, x) { return '<input type="checkbox" disabled' + (x === ' ' ? '' : ' checked') + '>'; });
          items.push('<li>' + (it.indexOf('<input') === 0 ? it.slice(0, it.indexOf('>') + 1) + inline(it.slice(it.indexOf('>') + 1)) : inline(it)) + '</li>');
        }
        out.push((ordered ? '<ol>' : '<ul>') + items.join('') + (ordered ? '</ol>' : '</ul>')); continue;
      }
      if (!l.trim()) { i++; continue; }
      var p = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*+]|\d+\.)\s|\|)/.test(lines[i])) p.push(lines[i++]);
      if (!p.length) p.push(lines[i++]);
      out.push('<p>' + p.map(inline).join('<br>') + '</p>');
    }
    return out.join('\n');
  }

  /* ---------- 이벤트 ---------- */
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { state.student = ''; state.view = b.dataset.view; writeHash(); render(); });
  });
  $('q').addEventListener('input', function () { state.q = this.value.trim(); if (state.student) state.student = ''; render(); });
  $('view').addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]');
    if (o) { var p = o.dataset.open.split('|'); openFile(p[0], +p[1], +p[2]); return; }
    var pick = e.target.closest('[data-pick]');
    if (pick) { state.day = +pick.dataset.pick; writeHash(); render(); return; }
    var st = e.target.closest('[data-student]');
    if (st) {
      state.student = st.dataset.student; writeHash(); render();
      window.scrollTo(0, 0);
      if (st.dataset.day) { var el = $('day-' + st.dataset.day); if (el) el.scrollIntoView({ block: 'center' }); }
      return;
    }
    var back = e.target.closest('.back-link');
    if (back) { e.preventDefault(); state.student = ''; writeHash(); render(); }
  });
  $('vClose').addEventListener('click', closeFile);
  $('dlg').addEventListener('click', function (e) { if (e.target === this) closeFile(); });
  $('vSize').addEventListener('click', function (e) { var b = e.target.closest('[data-size]'); if (b) setSize(b.dataset.size); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('dlg').hidden) closeFile(); });
  var navEl = $('siteNav'), navToggle = $('navToggle');
  navToggle.addEventListener('click', function () {
    var open = navEl.classList.toggle('is-open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  readHash();
  render();
})();
</script>
</body>
</html>
