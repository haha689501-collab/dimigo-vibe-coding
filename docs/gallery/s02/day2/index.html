<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유리병 편지 — 익명 게시판</title>
<style>
  :root {
    --sea: #0f2f4a;
    --sea-deep: #081c2e;
    --foam: #cfe6ef;
    --paper: #fbf6e9;
    --paper-line: #e3d9c2;
    --ink: #2b2b2b;
    --ink-soft: #6b6560;
    --accent: #d8842f;
    --accent-dark: #b86a1c;
    --danger: #c0392b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, var(--sea) 0%, var(--sea-deep) 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 헤더 */
  header { padding: 18px 20px 10px; color: var(--foam); text-align: center; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.75; }

  /* 탭 */
  nav.tabs { display: flex; justify-content: center; gap: 8px; padding: 6px 16px 12px; }
  nav.tabs button {
    background: rgba(255,255,255,0.08);
    color: var(--foam);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  nav.tabs button.active { background: var(--foam); color: var(--sea-deep); font-weight: 700; }

  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 6px 16px 110px; }
  .view { display: none; }
  .view.active { display: block; }

  /* 메모장 카드 */
  .card {
    background: var(--paper);
    background-image: repeating-linear-gradient(
      transparent 0, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px
    );
    background-position: 0 14px;
    border-radius: var(--radius);
    padding: 22px 22px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    position: relative;
    animation: float-in 0.45s ease;
  }
  .card.no-anim { animation: none; }
  @keyframes float-in {
    from { opacity: 0; transform: translateY(18px) rotate(-1deg); }
    to   { opacity: 1; transform: translateY(0) rotate(0); }
  }
  .card .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-dark);
    background: rgba(216,132,47,0.14);
    border-radius: 999px;
    padding: 4px 10px;
    margin-bottom: 10px;
  }
  .card .text {
    font-size: 17px;
    line-height: 28px;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0 0 14px;
    min-height: 84px;
  }
  .card .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--paper-line); }
  .btn-ghost.saved { color: var(--accent-dark); border-color: var(--accent); background: rgba(216,132,47,0.1); }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 700; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(192,57,43,0.4); }

  /* 다음 유리병 버튼 */
  .next-wrap { text-align: center; margin-top: 18px; }
  .next-wrap button {
    background: rgba(255,255,255,0.1);
    color: var(--foam);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  .next-wrap button:hover { background: rgba(255,255,255,0.18); }

  /* 저장 목록 */
  .saved-list { display: flex; flex-direction: column; gap: 14px; }
  .empty {
    color: var(--foam);
    text-align: center;
    opacity: 0.75;
    padding: 50px 10px;
    font-size: 15px;
    line-height: 1.6;
  }

  /* 유리병 던지기 플로팅 버튼 (가장 중요한 버튼) */
  .fab {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 16px 28px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    cursor: pointer;
    font-family: inherit;
    z-index: 20;
  }
  .fab:hover { background: var(--accent-dark); }

  /* 글쓰기 팝업 시트 */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    padding: 20px 20px 24px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
  }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; }
  .sheet p.hint { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); }
  .sheet textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    line-height: 26px;
    font-family: inherit;
    background: #fff;
    background-image: repeating-linear-gradient(transparent 0, transparent 25px, #efe8d6 25px, #efe8d6 26px);
    background-position: 0 12px;
    color: var(--ink);
  }
  .sheet textarea:focus { outline: 2px solid var(--accent); }
  .sheet .error { color: var(--danger); font-size: 13px; min-height: 18px; margin: 6px 0 8px; }
  .sheet .row { display: flex; gap: 8px; justify-content: flex-end; }

  /* 토스트 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 96px;
    transform: translateX(-50%) translateY(10px);
    background: rgba(255,255,255,0.95);
    color: var(--sea-deep);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 40;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🌊 유리병 편지</h1>
  <p>바다에 떠다니는 낯선 생각을 건져 올려 보세요</p>
</header>

<nav class="tabs">
  <button data-view="sea" class="active">바다</button>
  <button data-view="saved">간직한 유리병</button>
</nav>

<main>
  <!-- 바다(추천) 뷰: 가장 먼저 보이는 화면 -->
  <section id="view-sea" class="view active">
    <div id="bottle-slot"></div>
    <div class="next-wrap">
      <button id="btn-next">🫙 다음 유리병 건지기</button>
    </div>
  </section>

  <!-- 저장 뷰 -->
  <section id="view-saved" class="view">
    <div id="saved-list" class="saved-list"></div>
  </section>
</main>

<button class="fab" id="btn-write">✉️ 유리병 던지기</button>

<!-- 글쓰기 팝업 -->
<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2>유리병에 담을 이야기</h2>
    <p class="hint">누가 썼는지는 남지 않아요. 주제는 자동으로 분류됩니다.</p>
    <textarea id="write-text" maxlength="500" placeholder="요즘 떠오른 생각, 궁금한 것, 나누고 싶은 이야기…"></textarea>
    <div class="error" id="write-error"></div>
    <div class="row">
      <button class="btn btn-ghost" id="btn-cancel">취소</button>
      <button class="btn btn-primary" id="btn-throw">바다로 던지기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   구조 안내
   ----------------------------------------------------------------------------
   이 파일은 두 층으로 나뉘어 있습니다.

   [1] BottleCore  — 화면과 무관한 순수 로직 (카테고리, 분류, 시드, 저장소, 추천)
                     DOM을 전혀 건드리지 않고, 상태 변화는 이벤트로만 알립니다.
   [2] DomRenderer — BottleCore의 이벤트를 받아 HTML 카드로 그리는 "렌더러"

   MVP 이후 3D 게임(배를 타고 바다를 돌아다니며 유리병을 줍는 형태)으로 갈 때는
   [2]만 3D 씬 렌더러(예: Three.js, 게임 엔진 브리지)로 교체하면 됩니다.
   BottleCore의 공개 API(next / throwBottle / toggleSave / getSaved …)는 그대로 씁니다.
   ========================================================================== */

/* ============================================================================
   [1] BottleCore — 엔진 독립 로직
   ========================================================================== */
const BottleCore = (() => {

  /* ---------- 1-1. 고정 카테고리 & 키워드 기반 자동 분류 ---------- */
  const CATEGORIES = [
    '과학·기술', '예술·문화', '사회·경제', '자연·환경',
    '음식·요리', '여행·장소', '스포츠·건강', '일상·생각'
  ];
  const FALLBACK_CATEGORY = '일상·생각';

  const KEYWORDS = {
    '과학·기술': ['과학','기술','우주','물리','화학','생물','컴퓨터','코딩','프로그래밍','AI','인공지능','로봇','알고리즘','데이터','반도체','실험','수학','전기','앱','소프트웨어','인터넷','양자','뇌'],
    '예술·문화': ['그림','미술','음악','영화','소설','시 ','책','전시','공연','연극','디자인','사진','작가','예술','문화','드라마','만화','애니','노래','악기','뮤지컬','건축'],
    '사회·경제': ['경제','정치','사회','뉴스','돈','주식','투자','회사','직장','취업','물가','부동산','법','정책','세금','창업','시장','금리','노동','교육제도','선거'],
    '자연·환경': ['자연','환경','기후','숲','나무','바다','강','산','동물','식물','새','곤충','하늘','비 ','눈 ','계절','지구','쓰레기','재활용','날씨','별','꽃','정원'],
    '음식·요리': ['음식','요리','맛','레시피','카페','커피','빵','밥','국','김치','디저트','식당','맛집','요리법','간식','라면','과일','채소','와인','차 ','한식','양식'],
    '여행·장소': ['여행','장소','도시','골목','기차','비행기','공항','숙소','지도','길','섬','시골','동네','산책','거리','유럽','일본','제주','시장 구경','풍경','마을'],
    '스포츠·건강': ['운동','스포츠','축구','야구','농구','달리기','러닝','헬스','요가','수영','건강','수면','잠','스트레칭','등산','자전거','체력','식단','병원','마라톤','피로'],
    '일상·생각': ['생각','고민','하루','일상','기분','친구','가족','추억','질문','습관','시간','마음','꿈','행복','외로움','취미','메모','오늘','내일','문득']
  };

  // 외부 API 없이 동작. 나중에 AI 분류 API로 교체할 때 이 함수만 바꾸면 됨.
  function classify(text) {
    const t = text.toLowerCase();
    let best = FALLBACK_CATEGORY, bestScore = 0;
    for (const cat of CATEGORIES) {
      let score = 0;
      for (const kw of KEYWORDS[cat]) {
        const k = kw.toLowerCase();
        let idx = t.indexOf(k);
        while (idx !== -1) { score++; idx = t.indexOf(k, idx + k.length); }
      }
      if (score > bestScore) { bestScore = score; best = cat; }
    }
    return best;
  }

  /* ---------- 1-2. 초기 시드 글 (콜드스타트 대응, 카테고리별 4개) ---------- */
  const SEED_POSTS = [
    // 과학·기술
    { c: '과학·기술', t: '우주에서 가장 흔한 원소가 수소인데, 우리 몸의 대부분은 산소·탄소로 이루어져 있다는 게 새삼 신기하다. 우리는 별이 만든 재료로 만들어졌다.' },
    { c: '과학·기술', t: '알고리즘이 나를 잘 안다고 느낄수록, 사실은 내가 알고리즘에 맞춰지고 있는 건 아닐까. 코딩을 배우면서 든 생각.' },
    { c: '과학·기술', t: '문어의 뇌는 다리에도 분산되어 있어서 각 다리가 어느 정도 스스로 판단한다고 한다. 지능이 꼭 한 곳에 모여 있을 필요는 없구나.' },
    { c: '과학·기술', t: '양자 컴퓨터 이야기를 들으면 늘 이해한 것 같다가 놓친다. 그래도 "동시에 여러 상태"라는 말이 자꾸 머릿속을 맴돈다.' },
    // 예술·문화
    { c: '예술·문화', t: '좋은 소설은 마지막 장을 덮은 뒤에 시작된다. 며칠 동안 인물들이 계속 머릿속에서 살아 움직인다.' },
    { c: '예술·문화', t: '미술관에서 한 그림 앞에 20분을 서 있었다. 무엇이 좋았는지 설명은 못 하겠지만, 그 시간이 비어 있지 않았다는 건 안다.' },
    { c: '예술·문화', t: '옛날 영화의 느린 호흡이 요즘은 오히려 새롭게 느껴진다. 빠른 편집에 익숙해진 눈이 쉬는 기분.' },
    { c: '예술·문화', t: '악기를 하나 배우고 싶다. 잘하려는 게 아니라, 손끝으로 소리를 만든다는 감각이 궁금해서.' },
    // 사회·경제
    { c: '사회·경제', t: '물가가 오른다는 뉴스는 매일 보는데, 정작 내 월급이 왜 그대로인지는 아무도 설명해주지 않는다.' },
    { c: '사회·경제', t: '작은 동네 서점이 문을 닫았다. 편리함을 선택할 때마다 무언가를 잃고 있다는 걸 알면서도 멈추지 못한다.' },
    { c: '사회·경제', t: '주식을 시작하고 나서야 회사가 어떻게 돈을 버는지 궁금해졌다. 관심은 이렇게 엉뚱한 곳에서 시작되기도 한다.' },
    { c: '사회·경제', t: '투표 한 표가 세상을 바꾸지 못한다는 말과, 그래도 해야 한다는 말 사이에서 늘 후자를 고른다.' },
    // 자연·환경
    { c: '자연·환경', t: '비 온 다음 날 숲에서 나는 냄새에는 이름이 있다고 한다. 페트리코르. 이름을 알고 나니 더 오래 맡게 된다.' },
    { c: '자연·환경', t: '까마귀는 사람 얼굴을 기억하고 몇 년 뒤에도 알아본다고 한다. 동네 까마귀에게 잘해야겠다.' },
    { c: '자연·환경', t: '분리수거를 열심히 해도 재활용률이 생각보다 낮다는 걸 알고 허탈했다. 그래도 안 할 수는 없어서 계속한다.' },
    { c: '자연·환경', t: '밤하늘의 별빛은 수백 년 전에 출발한 빛이다. 지금 보는 별이 이미 사라졌을 수도 있다는 게 이상하게 위로가 된다.' },
    // 음식·요리
    { c: '음식·요리', t: '라면 물을 정확히 맞추는 것보다, 대충 넣고도 맛있게 먹는 사람이 부럽다. 요리는 결국 태도의 문제인가.' },
    { c: '음식·요리', t: '할머니의 김치 맛은 레시피로 적을 수가 없다. "적당히"와 "손맛"이라는 단위는 계량이 안 된다.' },
    { c: '음식·요리', t: '혼자 먹는 저녁에도 접시에 예쁘게 담으면 하루가 조금 달라진다. 음식은 나를 대접하는 방법이기도 하다.' },
    { c: '음식·요리', t: '카페에서 커피를 시켰는데 원두 설명이 세 줄이었다. 다 읽고 마시니 정말 다른 맛이 났다. 아마 기분 탓이겠지만.' },
    // 여행·장소
    { c: '여행·장소', t: '목적지 없이 기차를 타고 종점에서 내려본 적이 있다. 낯선 동네를 걷는 것만으로 여행이 되었다.' },
    { c: '여행·장소', t: '골목이 많은 도시가 좋다. 길을 잃을 수 있는 도시는 아직 발견할 게 남아 있는 도시다.' },
    { c: '여행·장소', t: '공항에서 비행기를 기다리는 시간이 사실 여행의 가장 좋은 부분인지도 모른다. 아무것도 아직 일어나지 않은 시간.' },
    { c: '여행·장소', t: '어릴 때 살던 시골 마을을 지도에서 찾아봤다. 기억보다 훨씬 작았다. 기억 속 장소는 늘 조금 더 크다.' },
    // 스포츠·건강
    { c: '스포츠·건강', t: '달리기를 시작하고 알았다. 몸이 힘든 건 5분, 그만두고 싶은 마음이 힘든 건 20분. 그 뒤로는 그냥 달려진다.' },
    { c: '스포츠·건강', t: '잠을 충분히 잔 다음 날은 세상이 조금 덜 밉다. 건강은 마음의 문제라기보다 수면의 문제일 때가 많다.' },
    { c: '스포츠·건강', t: '축구 경기를 볼 때 공보다 공 없는 선수의 움직임을 보면 완전히 다른 경기가 보인다.' },
    { c: '스포츠·건강', t: '등산은 올라갈 때보다 내려올 때 다리가 더 힘들다. 내려오는 법도 따로 배워야 하는 거였다.' },
    // 일상·생각
    { c: '일상·생각', t: '오늘 문득 든 생각. 내가 좋아하는 것들의 목록은 길어졌는데, 왜 궁금한 것들의 목록은 짧아졌을까.' },
    { c: '일상·생각', t: '친구와 오래 연락을 안 했다는 걸 깨닫고 메시지를 보냈다. 답장이 오기까지의 시간이 왜 이렇게 길게 느껴질까.' },
    { c: '일상·생각', t: '습관은 결심으로 만들어지지 않고 환경으로 만들어진다는 말을 요즘 매일 실감한다.' },
    { c: '일상·생각', t: '행복은 큰 사건이 아니라 하루 중 잠깐 스치는 기분이라는 걸 나이가 들수록 인정하게 된다.' }
  ].map((p, i) => ({ id: 'seed-' + i, text: p.t, category: p.c, createdAt: 0 }));

  /* ---------- 1-3. 저장소 (localStorage, 서버 미연동, 작성자 정보 없음) ----------
     3D 버전에서 다른 저장 방식(게임 엔진의 DataStore 등)을 쓰려면
     아래 storage 객체의 load/save만 교체하면 됩니다. */
  const KEY_POSTS = 'bottle_user_posts_v1';   // 내가 던진 유리병
  const KEY_SAVED = 'bottle_saved_v1';        // 간직한 유리병

  const storage = {
    load(key) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : []; }
      catch { return []; }
    },
    save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }
  };

  /* ---------- 1-4. 이벤트 버스 (렌더러와의 유일한 연결 통로) ---------- */
  const listeners = {};
  function on(event, fn) { (listeners[event] = listeners[event] || []).push(fn); }
  function emit(event, payload) { (listeners[event] || []).forEach(fn => fn(payload)); }

  /* ---------- 1-5. 추천 로직 — 연속 추천 방지 (직전 노출 N개 카테고리 제외, N=4) ---------- */
  const N_RECENT = 4;
  let recentCategories = [];   // 이번 세션에서 최근 노출된 카테고리 (순서대로)
  let shownIds = new Set();    // 이번 세션에서 이미 보여준 글
  let currentPost = null;

  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function getAllPosts() { return SEED_POSTS.concat(storage.load(KEY_POSTS)); }

  function next() {
    const all = getAllPosts();
    if (all.length === 0) { currentPost = null; emit('bottle', null); return null; }

    // 이미 본 글은 제외, 다 봤으면 초기화
    let pool = all.filter(p => !shownIds.has(p.id));
    if (pool.length === 0) { shownIds.clear(); pool = all.filter(p => !currentPost || p.id !== currentPost.id); }
    if (pool.length === 0) pool = all;

    // 직전 노출된 N개 카테고리 제외. 후보가 없으면 가장 오래된 제외 항목부터 완화
    let exclude = recentCategories.slice(-N_RECENT);
    let candidates = pool.filter(p => !exclude.includes(p.category));
    while (candidates.length === 0 && exclude.length > 0) {
      exclude = exclude.slice(1);
      candidates = pool.filter(p => !exclude.includes(p.category));
    }
    if (candidates.length === 0) candidates = pool;

    const post = pickRandom(candidates);
    shownIds.add(post.id);
    recentCategories.push(post.category);
    if (recentCategories.length > N_RECENT) recentCategories.shift();
    currentPost = post;
    emit('bottle', post);
    return post;
  }

  function getCurrent() { return currentPost; }

  /* ---------- 1-6. 간직하기 / 돌려보내기 ---------- */
  function getSaved() { return storage.load(KEY_SAVED); }
  function isSaved(id) { return getSaved().some(p => p.id === id); }

  function toggleSave(post) {
    if (!post) return false;
    const saved = getSaved();
    const idx = saved.findIndex(p => p.id === post.id);
    let nowSaved;
    if (idx === -1) { saved.unshift(post); nowSaved = true; }
    else { saved.splice(idx, 1); nowSaved = false; }
    storage.save(KEY_SAVED, saved);
    emit('saved-changed', { post, nowSaved, saved });
    return nowSaved;
  }

  function unsaveById(id) {
    const post = getSaved().find(p => p.id === id);
    if (post) toggleSave(post);
  }

  /* ---------- 1-7. 유리병 던지기 (등록) — 빈 글 차단, 자동 분류 ---------- */
  function throwBottle(rawText) {
    const text = (rawText || '').trim();
    if (!text) {
      return { ok: false, error: '빈 유리병은 바다에 띄울 수 없어요. 이야기를 적어 주세요.' };
    }
    const post = {
      id: 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      text,
      category: classify(text),
      createdAt: Date.now()
    };
    const posts = storage.load(KEY_POSTS);
    posts.push(post);
    storage.save(KEY_POSTS, posts);
    emit('thrown', post);
    return { ok: true, post };
  }

  return {
    CATEGORIES, classify,
    on,
    next, getCurrent,
    getSaved, isSaved, toggleSave, unsaveById,
    throwBottle
  };
})();

/* ============================================================================
   [2] DomRenderer — HTML/CSS 렌더러 (3D 전환 시 이 부분을 교체)
   ========================================================================== */
const DomRenderer = (() => {
  const $ = sel => document.querySelector(sel);

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  }

  /* ---------- 카드 ---------- */
  function cardHTML(post, mode, noAnim) {
    const saved = BottleCore.isSaved(post.id);
    const btn = mode === 'saved'
      ? `<button class="btn btn-danger" data-act="unsave" data-id="${post.id}">바다로 돌려보내기</button>`
      : `<button class="btn btn-ghost ${saved ? 'saved' : ''}" data-act="save" data-id="${post.id}">${saved ? '간직 중 ✓' : '이 유리병 간직하기'}</button>`;
    return `
      <article class="card ${noAnim ? 'no-anim' : ''}" data-id="${post.id}">
        <span class="badge">${escapeHTML(post.category)}</span>
        <p class="text">${escapeHTML(post.text)}</p>
        <div class="actions">${btn}</div>
      </article>`;
  }

  function renderBottle(post, noAnim) {
    $('#bottle-slot').innerHTML = post
      ? cardHTML(post, 'sea', noAnim)
      : '<div class="empty">바다가 비어 있어요.</div>';
  }

  function renderSaved() {
    const saved = BottleCore.getSaved();
    $('#saved-list').innerHTML = saved.length
      ? saved.map(p => cardHTML(p, 'saved', true)).join('')
      : '<div class="empty">아직 간직한 유리병이 없어요.<br>바다에서 마음에 드는 글을 건져 보세요.</div>';
  }

  /* ---------- 뷰 전환 ---------- */
  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
    if (name === 'saved') renderSaved();
  }

  /* ---------- 글쓰기 팝업 ---------- */
  function openSheet() {
    $('#write-error').textContent = '';
    $('#overlay').classList.add('open');
    setTimeout(() => $('#write-text').focus(), 50);
  }
  function closeSheet() { $('#overlay').classList.remove('open'); }

  /* ---------- 토스트 ---------- */
  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------- Core 이벤트 → 화면 반영 ---------- */
  function bindCoreEvents() {
    BottleCore.on('bottle', post => renderBottle(post, false));

    BottleCore.on('saved-changed', ({ post, nowSaved }) => {
      const cur = BottleCore.getCurrent();
      if (cur && cur.id === post.id) renderBottle(cur, true);   // 현재 카드 버튼 상태 갱신
      if ($('#view-saved').classList.contains('active')) renderSaved();
      toast(nowSaved ? '유리병을 간직했어요' : '유리병을 바다로 돌려보냈어요');
    });

    BottleCore.on('thrown', post => {
      $('#write-text').value = '';
      closeSheet();
      showView('sea');
      toast(`유리병이 바다로 떠났어요 · 분류: ${post.category}`);
    });
  }

  /* ---------- 사용자 입력 → Core 호출 ---------- */
  function bindUserEvents() {
    document.querySelectorAll('nav.tabs button').forEach(b =>
      b.addEventListener('click', () => showView(b.dataset.view)));

    $('#btn-next').addEventListener('click', () => BottleCore.next());

    // 카드 안 버튼 (간직 / 돌려보내기) — 이벤트 위임
    document.addEventListener('click', e => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      if (btn.dataset.act === 'save') BottleCore.toggleSave(BottleCore.getCurrent());
      else if (btn.dataset.act === 'unsave') BottleCore.unsaveById(btn.dataset.id);
    });

    $('#btn-write').addEventListener('click', openSheet);
    $('#btn-cancel').addEventListener('click', closeSheet);
    $('#overlay').addEventListener('click', e => { if (e.target === $('#overlay')) closeSheet(); });
    $('#write-text').addEventListener('input', () => { $('#write-error').textContent = ''; });

    $('#btn-throw').addEventListener('click', () => {
      const result = BottleCore.throwBottle($('#write-text').value);
      if (!result.ok) {
        $('#write-error').textContent = result.error;
        $('#write-text').focus();
      }
    });
  }

  function init() {
    bindCoreEvents();
    bindUserEvents();
    BottleCore.next();   // 새로고침마다 랜덤한 유리병으로 시작
  }

  return { init };
})();

/* ============================================================================
   시작
   ========================================================================== */
DomRenderer.init();
</script>
</body>
