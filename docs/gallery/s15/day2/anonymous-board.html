<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>익명 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ece3d0;
    --paper-raised:#f4eddd;
    --ink:#2b2621;
    --ink-soft:#6d6355;
    --rule:#d3c6ab;
    --mark:#3c4f63;
    --mark-soft:#e3ddcb;
    --warn:#8f3a2c;
    --serif:"Noto Serif KR", "Nanum Myeongjo", Georgia, "Apple SD Gothic Neo", serif;
    --sans:"Noto Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#221f1a;
      --paper-raised:#2b2721;
      --ink:#eae2d2;
      --ink-soft:#a79c89;
      --rule:#463f34;
      --mark:#9fb8cf;
      --mark-soft:#332e26;
      --warn:#d98b7a;
    }
  }
  :root[data-theme="dark"]{
    --paper:#221f1a;
    --paper-raised:#2b2721;
    --ink:#eae2d2;
    --ink-soft:#a79c89;
    --rule:#463f34;
    --mark:#9fb8cf;
    --mark-soft:#332e26;
    --warn:#d98b7a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select,button{font-size:1rem;color:inherit;}
  :focus-visible{outline:2px solid var(--mark);outline-offset:2px;}

  .wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- 머리말 ---------- */
  .masthead{
    padding:36px 0 18px;
    border-bottom:2px solid var(--ink);
  }
  .masthead h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:2rem;
    letter-spacing:-0.02em;
    margin:0;
  }
  .masthead p{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:0.875rem;
  }

  /* ---------- 게시판 선택 ---------- */
  .boards{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:14px 0;
    border-bottom:1px solid var(--rule);
  }
  .board-btn{
    background:none;
    border:1px solid transparent;
    border-radius:2px;
    padding:6px 12px;
    color:var(--ink-soft);
    font-size:0.9375rem;
  }
  .board-btn:hover{color:var(--ink);}
  .board-btn[aria-pressed="true"]{
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
  }

  /* ---------- 검색 / 글쓰기 ---------- */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--rule);
  }
  .toolbar .search-scope{
    border:1px solid var(--rule);
    background:var(--paper-raised);
    border-radius:2px;
    padding:8px 6px;
  }
  .toolbar .search-input{
    flex:1 1 180px;
    min-width:0;
    border:1px solid var(--rule);
    background:var(--paper-raised);
    border-radius:2px;
    padding:8px 10px;
  }
  .toolbar .search-input::placeholder{color:var(--ink-soft);}

  .btn{
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:2px;
    padding:8px 14px;
    font-weight:500;
  }
  .btn-quiet{
    background:none;
    color:var(--ink);
    border:1px solid var(--rule);
  }
  .btn-text{
    background:none;
    border:none;
    color:var(--ink-soft);
    padding:6px 0;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .btn-text:hover{color:var(--ink);}

  .result-note{
    padding:12px 0 0;
    font-size:0.875rem;
    color:var(--ink-soft);
  }

  /* ---------- 글 목록 ---------- */
  .post-list{list-style:none;margin:0;padding:0;}
  .post-item{
    border-bottom:1px solid var(--rule);
    padding:20px 0;
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .post-main{flex:1 1 auto;min-width:0;}
  .post-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:1.1875rem;
    line-height:1.4;
    margin:0 0 6px;
    letter-spacing:-0.01em;
    word-break:break-word;
  }
  .post-preview{
    margin:0 0 8px;
    font-size:0.875rem;
    color:var(--ink-soft);
    line-height:1.55;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
  }
  .post-meta{
    font-size:0.8125rem;
    color:var(--ink-soft);
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .board-tag{
    color:var(--ink);
    background:var(--mark-soft);
    padding:1px 7px;
    border-radius:2px;
    font-size:0.75rem;
    font-weight:500;
  }
  .open-btn{
    flex:0 0 auto;
    border:1px solid var(--ink);
    background:var(--paper-raised);
    color:var(--ink);
    border-radius:2px;
    padding:10px 14px;
    font-weight:700;
    white-space:nowrap;
  }
  .open-btn:hover{background:var(--ink);color:var(--paper);}

  .empty{
    padding:56px 0;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty strong{display:block;color:var(--ink);font-family:var(--serif);font-size:1.0625rem;margin-bottom:6px;}

  /* ---------- 상세 ---------- */
  .detail-head{padding:24px 0 16px;border-bottom:1px solid var(--rule);}
  .detail-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:1.625rem;
    line-height:1.35;
    margin:10px 0 8px;
    word-break:break-word;
  }
  .detail-body{
    padding:22px 0 28px;
    border-bottom:1px solid var(--rule);
    white-space:pre-wrap;
    word-break:break-word;
    font-family:var(--serif);
    font-weight:500;
    line-height:1.85;
  }
  .comment-head{
    padding:22px 0 8px;
    font-size:0.9375rem;
    font-weight:700;
  }
  .comment-list{list-style:none;margin:0;padding:0;}
  .comment-item{
    padding:14px 0;
    border-bottom:1px solid var(--rule);
  }
  .comment-meta{
    font-size:0.8125rem;
    color:var(--ink-soft);
    display:flex;
    gap:14px;
    margin-bottom:4px;
  }
  .comment-text{margin:0;white-space:pre-wrap;word-break:break-word;}
  .comment-empty{padding:18px 0;color:var(--ink-soft);border-bottom:1px solid var(--rule);font-size:0.9375rem;}

  /* ---------- 폼 ---------- */
  .form{padding:24px 0 0;}
  .form h2{
    font-family:var(--serif);
    font-size:1.375rem;
    margin:0 0 4px;
  }
  .form .form-hint{margin:0 0 20px;color:var(--ink-soft);font-size:0.875rem;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:0.875rem;
    font-weight:500;
    margin-bottom:6px;
  }
  .field input[type="text"],
  .field textarea,
  .field select{
    width:100%;
    border:1px solid var(--rule);
    background:var(--paper-raised);
    border-radius:2px;
    padding:10px 12px;
    font-family:inherit;
  }
  .field textarea{min-height:190px;resize:vertical;line-height:1.7;}
  .check{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:0.9375rem;
  }
  .check input{margin-top:4px;}
  .check-hint{margin:6px 0 0 24px;font-size:0.8125rem;color:var(--ink-soft);}
  .form-actions{display:flex;gap:8px;padding:8px 0 0;}
  .error{
    color:var(--warn);
    font-size:0.875rem;
    margin:0 0 14px;
    padding:10px 12px;
    border:1px solid var(--warn);
    border-radius:2px;
  }
  .error[hidden]{display:none;}

  .comment-form{padding:20px 0 0;}
  .comment-form textarea{min-height:96px;}

  @media (max-width:520px){
    .post-item{flex-direction:column;gap:12px;}
    .open-btn{width:100%;}
    .masthead h1{font-size:1.75rem;}
    .detail-title{font-size:1.375rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>익명 게시판</h1>
    <p>고등학생끼리 묻고 답하는 곳</p>
  </header>

  <main id="app"></main>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- 데이터 ---------------- */
  var BOARDS = ["입시", "잡담", "고민", "연애"];
  var ALL = "전체 게시판";

  var seq = 0;
  function nextId() { seq += 1; return seq; }

  var posts = [
    {
      id: nextId(), board: "입시",
      title: "6모 끝나고 생기부 다시 손보는 중인데 이게 맞나",
      body: "동아리 활동이랑 세특 연결이 약한 것 같아서 다시 정리하고 있어요.\n선생님은 지금도 괜찮다고 하시는데 제가 봐도 내용이 붕 떠 보여서요.\n3학년 되기 전에 갈아엎어 본 사람 있나요?",
      author: "익명", createdAt: Date.now() - 1000 * 60 * 42,
      comments: [
        { id: nextId(), author: "익명", body: "저도 작년에 다 엎었는데 결국 세특 문장 몇 개만 바뀌더라고요. 활동 자체를 하나 더 하는 게 나았어요.", createdAt: Date.now() - 1000 * 60 * 30 },
        { id: nextId(), author: "야자탈출", body: "담임쌤이 괜찮다 하시면 그냥 두고 성적 올리는 게 이득임", createdAt: Date.now() - 1000 * 60 * 12 }
      ]
    },
    {
      id: nextId(), board: "고민",
      title: "친구랑 3년 붙어다녔는데 요즘 같이 있는 게 힘들어요",
      body: "싸운 것도 아닌데 말 섞는 게 피곤해요.\n티 내면 상처받을 것 같아서 그냥 웃고 있는데, 이런 것도 정리해야 하는 관계인가 싶어서 적어봅니다.",
      author: "익명", createdAt: Date.now() - 1000 * 60 * 60 * 5,
      comments: [
        { id: nextId(), author: "익명", body: "거리 두는 거랑 손절하는 건 달라요. 반 바뀌면 자연스럽게 정리되기도 하고요.", createdAt: Date.now() - 1000 * 60 * 60 * 4 }
      ]
    },
    {
      id: nextId(), board: "잡담",
      title: "급식에 탕수육 나오는 날만 등교 속도 두 배 되는 사람",
      body: "오늘 그 날이었는데 4교시 이동수업 때문에 늦게 가서 소스만 남아 있었습니다. 그냥 그렇다고요.",
      author: "3반김밥", createdAt: Date.now() - 1000 * 60 * 60 * 20,
      comments: []
    },
    {
      id: nextId(), board: "연애",
      title: "고백은 수능 끝나고가 국룰인가요",
      body: "같은 학원 다니는 앤데 지금 말하면 서로 공부에 방해될 것 같기도 하고, 미루다 놓칠 것 같기도 하고요.\n다들 어떻게 했는지 궁금해요.",
      author: "익명", createdAt: Date.now() - 1000 * 60 * 60 * 26,
      comments: [
        { id: nextId(), author: "익명", body: "미루면 그 사이에 다른 사람 생기더라는 게 제 경험입니다", createdAt: Date.now() - 1000 * 60 * 60 * 25 },
        { id: nextId(), author: "익명", body: "저는 끝나고 했는데 만족해요. 어차피 지금 말해도 제대로 못 만나요.", createdAt: Date.now() - 1000 * 60 * 60 * 22 }
      ]
    },
    {
      id: nextId(), board: "입시",
      title: "정시 준비하면서 내신 놓는 거 어떻게 생각하세요",
      body: "2학년인데 내신은 이미 애매하고 모고는 잘 나오는 편이라 고민이에요.\n학교에서는 둘 다 잡으라고 하는데 시간이 안 돼요.",
      author: "익명", createdAt: Date.now() - 1000 * 60 * 60 * 49,
      comments: []
    }
  ];

  /* ---------------- 상태 ---------------- */
  var state = {
    view: "list",        // list | detail | write
    board: ALL,          // 선택한 게시판 (미선택 = 전체 게시판)
    query: "",           // 검색어
    scope: "all",        // all = 전 범위, board = 게시판 내
    openPostId: null,
    formError: "",
    commentError: "",
    draft: { title: "", body: "", useNickname: false, nickname: "" }
  };

  var app = document.getElementById("app");

  /* ---------------- 유틸 ---------------- */
  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function timeAgo(ts) {
    var diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "방금 전";
    if (diff < 3600) return Math.floor(diff / 60) + "분 전";
    if (diff < 86400) return Math.floor(diff / 3600) + "시간 전";
    return Math.floor(diff / 86400) + "일 전";
  }

  function preview(body) {
    var one = body.replace(/\s+/g, " ").trim();
    return one.length > 90 ? one.slice(0, 90) + "…" : one;
  }

  function displayName(useNickname, nickname) {
    var trimmed = nickname.trim();
    if (useNickname && trimmed) return trimmed;
    return "익명";
  }

  function findPost(id) {
    for (var i = 0; i < posts.length; i++) if (posts[i].id === id) return posts[i];
    return null;
  }

  // 게시판 선택 + 검색 범위를 함께 적용한 목록
  function visiblePosts() {
    var q = state.query.trim().toLowerCase();
    var searching = q.length > 0;
    // 전 범위 검색이면 선택한 게시판과 상관없이 모든 게시판을 뒤진다.
    var ignoreBoard = searching && state.scope === "all";

    return posts.filter(function (p) {
      if (!ignoreBoard && state.board !== ALL && p.board !== state.board) return false;
      if (!searching) return true;
      return (p.title + " " + p.body).toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return b.createdAt - a.createdAt; });
  }

  /* ---------------- 화면 ---------------- */
  function boardsHtml() {
    var list = [ALL].concat(BOARDS);
    return '<nav class="boards" aria-label="게시판 선택">' + list.map(function (b) {
      return '<button type="button" class="board-btn" data-board="' + esc(b) + '" aria-pressed="' +
        (state.board === b ? "true" : "false") + '">' + esc(b) + "</button>";
    }).join("") + "</nav>";
  }

  function toolbarHtml() {
    var scopeDisabled = state.board === ALL;
    return '' +
      '<div class="toolbar">' +
        '<select class="search-scope" id="scope" aria-label="검색 범위"' + (scopeDisabled ? " disabled" : "") + ">" +
          '<option value="all"' + (state.scope === "all" ? " selected" : "") + ">전 범위 검색</option>" +
          '<option value="board"' + (state.scope === "board" ? " selected" : "") + ">" +
            esc(state.board === ALL ? "게시판 내 검색" : state.board + " 게시판 내 검색") +
          "</option>" +
        "</select>" +
        '<input class="search-input" id="query" type="text" placeholder="제목과 내용으로 검색" value="' + esc(state.query) + '" aria-label="검색어">' +
        '<button type="button" class="btn" id="write">글 쓰기</button>' +
      "</div>";
  }

  function noteHtml(count) {
    var where = state.board === ALL ? "전체 게시판" : state.board + " 게시판";
    if (state.query.trim()) {
      var scopeLabel = (state.scope === "board" && state.board !== ALL) ? where + " 안에서" : "전체 게시판에서";
      return '<p class="result-note">' + scopeLabel + " ‘" + esc(state.query.trim()) + "’ 검색 결과 " + count + "개</p>";
    }
    return '<p class="result-note">' + esc(where) + " · 글 " + count + "개</p>";
  }

  function resultsHtml() {
    var list = visiblePosts();
    var html = noteHtml(list.length);

    if (list.length === 0) {
      html += state.query.trim()
        ? '<div class="empty"><strong>검색 결과가 없어요</strong>다른 단어로 찾거나 검색 범위를 넓혀 보세요.</div>'
        : '<div class="empty"><strong>아직 올라온 글이 없어요</strong>첫 글을 남겨 보세요.</div>';
    } else {
      html += '<ul class="post-list">' + list.map(function (p) {
        return '' +
          '<li class="post-item">' +
            '<div class="post-main">' +
              '<h2 class="post-title">' + esc(p.title) + "</h2>" +
              '<p class="post-preview">' + esc(preview(p.body)) + "</p>" +
              '<div class="post-meta">' +
                '<span class="board-tag">' + esc(p.board) + "</span>" +
                "<span>" + esc(p.author) + "</span>" +
                "<span>" + timeAgo(p.createdAt) + "</span>" +
                "<span>댓글 " + p.comments.length + "</span>" +
              "</div>" +
            "</div>" +
            '<button type="button" class="open-btn" data-open="' + p.id + '">글 열람하기</button>' +
          "</li>";
      }).join("") + "</ul>";
    }
    return html;
  }

  // 검색어를 칠 때는 이 부분만 갈아 끼운다. 검색창 자체를 다시 그리면
  // 한글 조합(모아쓰기)이 중간에 끊겨 자모가 따로 입력된다.
  function renderResults() {
    var box = document.getElementById("results");
    if (box) box.innerHTML = resultsHtml();
  }

  function renderList() {
    app.innerHTML = boardsHtml() + toolbarHtml() + '<div id="results"></div>';
    renderResults();
  }

  function renderDetail() {
    var p = findPost(state.openPostId);
    if (!p) { state.view = "list"; return render(); }

    var comments = p.comments.length === 0
      ? '<p class="comment-empty">아직 댓글이 없어요. 먼저 말을 걸어 보세요.</p>'
      : '<ul class="comment-list">' + p.comments.map(function (c) {
          return '' +
            '<li class="comment-item">' +
              '<div class="comment-meta"><span>' + esc(c.author) + "</span><span>" + timeAgo(c.createdAt) + "</span></div>" +
              '<p class="comment-text">' + esc(c.body) + "</p>" +
            "</li>";
        }).join("") + "</ul>";

    app.innerHTML = '' +
      '<div class="detail-head">' +
        '<button type="button" class="btn-text" id="back">← 목록으로</button>' +
        '<h2 class="detail-title">' + esc(p.title) + "</h2>" +
        '<div class="post-meta">' +
          '<span class="board-tag">' + esc(p.board) + "</span>" +
          "<span>" + esc(p.author) + "</span>" +
          "<span>" + timeAgo(p.createdAt) + "</span>" +
        "</div>" +
      "</div>" +
      '<div class="detail-body">' + esc(p.body) + "</div>" +
      '<h3 class="comment-head">댓글 ' + p.comments.length + "</h3>" +
      comments +
      '<form class="comment-form" id="comment-form" novalidate>' +
        '<p class="error" id="comment-error"' + (state.commentError ? "" : " hidden") + ">" + esc(state.commentError) + "</p>" +
        '<div class="field">' +
          '<label for="c-body">댓글</label>' +
          '<textarea id="c-body" placeholder="같은 학교 친구에게 말하듯 편하게 적어 주세요"></textarea>' +
        "</div>" +
        '<div class="field">' +
          '<label class="check"><input type="checkbox" id="c-use-nick"> 닉네임을 공개할게요</label>' +
          '<p class="check-hint">공개하지 않으면 ‘익명’으로 표시돼요.</p>' +
          '<input type="text" id="c-nick" placeholder="닉네임" hidden>' +
        "</div>" +
        '<div class="form-actions"><button type="submit" class="btn">댓글 남기기</button></div>' +
      "</form>";
  }

  function renderWrite() {
    var d = state.draft;
    app.innerHTML = '' +
      '<form class="form" id="post-form" novalidate>' +
        '<button type="button" class="btn-text" id="back">← 목록으로</button>' +
        "<h2>글 쓰기</h2>" +
        '<p class="form-hint">올린 글은 같은 게시판을 보는 고등학생 모두에게 보여요.</p>' +
        '<p class="error" id="post-error"' + (state.formError ? "" : " hidden") + ">" + esc(state.formError) + "</p>" +
        '<div class="field">' +
          '<label for="p-board">게시판</label>' +
          '<select id="p-board">' + BOARDS.map(function (b) {
            var sel = (state.board !== ALL ? state.board : BOARDS[0]) === b ? " selected" : "";
            return '<option value="' + esc(b) + '"' + sel + ">" + esc(b) + "</option>";
          }).join("") + "</select>" +
        "</div>" +
        '<div class="field">' +
          '<label for="p-title">제목</label>' +
          '<input type="text" id="p-title" value="' + esc(d.title) + '" placeholder="무슨 이야기인지 한 줄로">' +
        "</div>" +
        '<div class="field">' +
          '<label for="p-body">내용</label>' +
          '<textarea id="p-body" placeholder="하고 싶은 이야기를 적어 주세요">' + esc(d.body) + "</textarea>" +
        "</div>" +
        '<div class="field">' +
          '<label class="check"><input type="checkbox" id="p-use-nick"' + (d.useNickname ? " checked" : "") + "> 닉네임을 공개할게요</label>" +
          '<p class="check-hint">공개하지 않으면 ‘익명’으로 표시돼요.</p>' +
          '<input type="text" id="p-nick" placeholder="닉네임" value="' + esc(d.nickname) + '"' + (d.useNickname ? "" : " hidden") + ">" +
        "</div>" +
        '<div class="form-actions">' +
          '<button type="submit" class="btn">글 올리기</button>' +
          '<button type="button" class="btn btn-quiet" id="cancel">취소</button>' +
        "</div>" +
      "</form>";
  }

  function render() {
    if (state.view === "detail") renderDetail();
    else if (state.view === "write") renderWrite();
    else renderList();
  }

  /* ---------------- 이벤트 ---------------- */
  app.addEventListener("click", function (e) {
    var boardBtn = e.target.closest("[data-board]");
    if (boardBtn) {
      state.board = boardBtn.getAttribute("data-board");
      if (state.board === ALL) state.scope = "all";
      render();
      return;
    }

    var openBtn = e.target.closest("[data-open]");
    if (openBtn) {
      state.openPostId = Number(openBtn.getAttribute("data-open"));
      state.commentError = "";
      state.view = "detail";
      render();
      window.scrollTo(0, 0);
      return;
    }

    if (e.target.id === "write") {
      state.formError = "";
      state.view = "write";
      render();
      window.scrollTo(0, 0);
      return;
    }

    if (e.target.id === "back" || e.target.id === "cancel") {
      state.view = "list";
      state.formError = "";
      state.draft = { title: "", body: "", useNickname: false, nickname: "" };
      render();
      return;
    }
  });

  app.addEventListener("input", function (e) {
    if (e.target.id !== "query") return;
    state.query = e.target.value;
    // 검색창은 그대로 두고 결과만 갱신하므로 조합 중인 글자가 깨지지 않는다.
    renderResults();
  });

  // 한글 IME가 한 글자를 완성한 시점에도 결과를 한 번 더 맞춰 준다.
  app.addEventListener("compositionend", function (e) {
    if (e.target.id !== "query") return;
    state.query = e.target.value;
    renderResults();
  });

  app.addEventListener("change", function (e) {
    if (e.target.id === "scope") {
      state.scope = e.target.value;
      render();
      return;
    }
    if (e.target.id === "p-use-nick") {
      var nick = document.getElementById("p-nick");
      nick.hidden = !e.target.checked;
      if (e.target.checked) nick.focus();
      return;
    }
    if (e.target.id === "c-use-nick") {
      var cnick = document.getElementById("c-nick");
      cnick.hidden = !e.target.checked;
      if (e.target.checked) cnick.focus();
    }
  });

  app.addEventListener("submit", function (e) {
    e.preventDefault();

    if (e.target.id === "post-form") {
      var title = document.getElementById("p-title").value;
      var body = document.getElementById("p-body").value;
      var useNick = document.getElementById("p-use-nick").checked;
      var nick = document.getElementById("p-nick").value;
      var board = document.getElementById("p-board").value;

      state.draft = { title: title, body: body, useNickname: useNick, nickname: nick };

      if (!title.trim() && !body.trim()) state.formError = "제목과 내용을 모두 적어야 글이 올라가요.";
      else if (!title.trim()) state.formError = "제목이 비어 있어요. 제목을 적어 주세요.";
      else if (!body.trim()) state.formError = "내용이 비어 있어요. 내용을 적어 주세요.";
      else if (useNick && !nick.trim()) state.formError = "닉네임을 공개하려면 닉네임을 적어 주세요. 공개하지 않으려면 체크를 풀어 주세요.";
      else state.formError = "";

      if (state.formError) { render(); return; }

      var post = {
        id: nextId(),
        board: board,
        title: title.trim(),
        body: body.trim(),
        author: displayName(useNick, nick),
        createdAt: Date.now(),
        comments: []
      };
      posts.push(post);

      state.draft = { title: "", body: "", useNickname: false, nickname: "" };
      state.openPostId = post.id;
      state.commentError = "";
      state.view = "detail";
      render();
      window.scrollTo(0, 0);
      return;
    }

    if (e.target.id === "comment-form") {
      var cBody = document.getElementById("c-body").value;
      var cUseNick = document.getElementById("c-use-nick").checked;
      var cNick = document.getElementById("c-nick").value;
      var p = findPost(state.openPostId);
      if (!p) return;

      if (!cBody.trim()) state.commentError = "내용이 비어 있어요. 댓글을 적어 주세요.";
      else if (cUseNick && !cNick.trim()) state.commentError = "닉네임을 공개하려면 닉네임을 적어 주세요.";
      else state.commentError = "";

      if (state.commentError) { render(); return; }

      p.comments.push({
        id: nextId(),
        author: displayName(cUseNick, cNick),
        body: cBody.trim(),
        createdAt: Date.now()
      });
      state.commentError = "";
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
