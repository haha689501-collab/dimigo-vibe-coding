<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>게임 장르 쇼릴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one 16:9 arcade stage, transport bar under it, genre chips as chapters. Deliberately single dark theme. */
:root{
  --bg:#0c0a16; --panel:#17132b; --panel2:#201b3a; --line:#2c2650; --fg:#f3f0ff; --muted:#9d96c2; --gold:#ffc23d;
  --display:"Do Hyeon","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:7%;background:linear-gradient(180deg,rgba(12,10,22,0) 40%,rgba(12,10,22,.6));border:0;cursor:pointer;color:var(--fg);font:inherit}
.start[hidden]{display:none}
.start .disc{width:clamp(56px,9vw,88px);height:clamp(56px,9vw,88px);border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,194,61,.18),0 0 40px rgba(255,194,61,.45);transition:transform .15s}
.start:hover .disc{transform:scale(1.06)}
.start .disc::after{content:"";margin-left:12%;border-style:solid;border-width:14px 0 14px 24px;border-color:transparent transparent transparent #0c0a16}
.start .lbl{font-family:var(--mono);font-size:clamp(11px,1.4vw,14px);letter-spacing:.12em;background:rgba(12,10,22,.7);padding:6px 12px;border-radius:999px}
.start:focus-visible .disc{outline:3px solid #fff;outline-offset:6px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.btn:hover{background:var(--panel2)}
.btn:focus-visible,.chip:focus-visible,.prog:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn svg{width:18px;height:18px;fill:currentColor}
.time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px}
.prog{flex:1 1 220px;min-width:0;display:flex;gap:2px;height:14px;cursor:pointer;align-items:center}
.seg{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;min-width:0}
.seg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer}
.chip b{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--panel))}
.cap{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;gap:6px;flex-direction:column}
.cap h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;color:var(--c)}
.cap p{margin:0;color:var(--muted);font-size:14px}
.cap ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.cap li{font-size:13px;font-weight:600;border:1px solid var(--c);border-radius:999px;padding:3px 10px}
.note{font-size:13px;color:var(--muted);margin:0}
@media (max-width:720px){.cap.on{display:flex}.time{min-width:auto}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>게임 장르 쇼릴</h1>
    <span class="sub">23 Genres · Motion Reel · 174 BPM</span>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="게임 장르 23가지를 소개하는 모션그래픽"></canvas>
    <button class="start" id="start" type="button" aria-label="모션그래픽 재생">
      <span class="disc"></span>
      <span class="lbl" id="startLbl">재생 · 음악과 효과음이 함께 나와요</span>
    </button>
  </div>

  <div class="bar">
    <button class="btn" id="prev" type="button" aria-label="이전 장르"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="btn" id="play" type="button" aria-label="재생"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
    <button class="btn" id="next" type="button" aria-label="다음 장르"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <span class="time" id="time">00:00 / 01:45</span>
    <div class="prog" id="prog" role="slider" tabindex="0" aria-label="재생 위치"></div>
    <button class="btn" id="mute" type="button" aria-label="소리 끄기"><svg viewBox="0 0 24 24" id="muteIco"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="cap" id="cap"></div>
  <p class="note">스페이스바로 재생·일시정지, 좌우 화살표로 장르를 넘길 수 있어요. 장면은 174 BPM 배경음악의 마디에 맞춰 바뀝니다.</p>
</div>

<script>
(()=>{
const SRC=(document.currentScript&&document.currentScript.textContent)||'';
const W=1280,H=720,VX=560,VY=64,VW=680,VH=592,CX=VX+VW/2,CY=VY+VH/2;
const BPM=174,BEAT=60/BPM,S16=BEAT/4,BAR=BEAT*4,LA=0.12,TR=0.3;
const cv=document.getElementById('cv');const g=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG='#0c0a16';

const G=[
{name:'FPS',en:'FIRST-PERSON SHOOTER',c:'#ff4d3d',c2:'#ffd23d',desc:'내 눈이 곧 총구가 되는 1인칭 슈팅',f:['1인칭 시점','에임과 반응 속도','무기·탄약 관리']},
{name:'전략',en:'STRATEGY',c:'#2ee6c5',c2:'#ff5c8a',desc:'자원을 모으고 판을 읽어 큰 그림을 그린다',f:['자원 관리','유닛 지휘','장기적인 계획']},

{name:'실시간',en:'REAL-TIME',c:'#3d8bff',c2:'#3dffd0',desc:'기다려 주지 않는다. 모든 일이 동시에',f:['멈추지 않는 시간','동시다발 상황','순간 판단']},
{name:'턴제',en:'TURN-BASED',c:'#a26bff',c2:'#ff6b6b',desc:'번갈아 한 수씩, 신중하게 수를 둔다',f:['번갈아 행동','생각할 여유','수 싸움']},
{name:'격투',en:'FIGHTING',c:'#ff3d9a',c2:'#3dd9ff',desc:'1대1, 콤보와 타이밍의 정면 승부',f:['1:1 대결','콤보·커맨드','거리와 타이밍']},
{name:'리듬',en:'RHYTHM',c:'#b6ff3d',c2:'#3dc8ff',desc:'음악에 맞춰 정확한 순간에 입력',f:['박자 판정','노트 패턴','음악과 싱크']},
{name:'탄막',en:'BULLET HELL',c:'#ff5cf0',c2:'#5ce1ff',desc:'화면을 덮은 총알 사이 좁은 틈으로',f:['패턴 읽기','좁은 틈 회피','그레이즈']},
{name:'로그라이트',en:'ROGUELITE',c:'#ff8a3d',c2:'#ffd23d',desc:'죽어도 괜찮아, 더 강해져서 다시',f:['무작위 맵','죽음과 재도전','영구 성장']},
{name:'플랫포머',en:'PLATFORMER',c:'#3dd9ff',c2:'#ffd23d',desc:'뛰고 밟고 넘어서 깃발까지',f:['점프 액션','발판 이동','수집 요소']},
{name:'소울라이크',en:'SOULSLIKE',c:'#e0b56a',c2:'#ff3d4d',desc:'죽으면서 배우는 처절한 보스전',f:['높은 난이도','스태미나 관리','패턴 학습'],mood:'dark'},
{name:'메트로배니아',en:'METROIDVANIA',c:'#7a6bff',c2:'#3dffd0',desc:'새 능력을 얻으면 막혔던 길이 열린다',f:['능력 해금','넓어지는 맵','되돌아가는 탐험']},

{name:'배틀로얄',en:'BATTLE ROYALE',c:'#c43dff',c2:'#ffd23d',desc:'100명 중 마지막까지 살아남는 단 1명',f:['줄어드는 자기장','생존 경쟁','최후의 1인']},
{name:'MOBA',en:'BATTLE ARENA',c:'#ff4d6d',c2:'#3da0ff',desc:'팀을 이뤄 라인을 밀고 적 기지를 부순다',f:['3개 라인','레벨·스킬 성장','타워 철거']},
{name:'레이싱',en:'RACING',c:'#ffe03d',c2:'#ff3d6e',desc:'한 대라도 더 추월해서 결승선까지',f:['속도감','드리프트·부스터','순위 경쟁']},
{name:'타워 디펜스',en:'TOWER DEFENSE',c:'#ff9f1c',c2:'#3dd9ff',desc:'길목에 타워를 세워 몰려오는 적을 막는다',f:['타워 배치','웨이브 방어','경로 활용']},
{name:'경영 시뮬레이션',en:'MANAGEMENT SIM',c:'#2ee6a0',c2:'#ffd23d',desc:'돈을 벌어 더 크게, 더 많이',f:['수익 관리','시설 확장','성장 그래프']},
{name:'샌드박스',en:'SANDBOX · CRAFTING',c:'#c98a4b',c2:'#6dd34d',desc:'모으고 만들고 쌓아서 나만의 세계를',f:['자원 채집','조합 제작','자유로운 건설']},

{name:'호러',en:'HORROR',c:'#ff2e2e',c2:'#e8e8e8',desc:'손전등 하나에 의지하는 어둠 속 공포',f:['제한된 시야','긴장감 연출','점프스케어'],mood:'drop'},
{name:'비주얼 노벨',en:'VISUAL NOVEL',c:'#ff9ec7',c2:'#a8c8ff',desc:'선택 하나로 이야기가 갈라진다',f:['대사와 연출','선택지','루트 분기'],mood:'soft'},
{name:'퍼즐',en:'PUZZLE',c:'#4d9bff',c2:'#ffd23d',desc:'맞추고 터뜨리고 연쇄로 이어간다',f:['규칙 파악','연쇄 반응','클리어의 쾌감']},
];

/* ---------- helpers ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eback=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const hsh=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const mod=(v,m)=>((v%m)+m)%m;
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${clamp(a)})`}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const F={d:s=>`${s}px "Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif`,b:(w,s)=>`${w} ${s}px "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif`,m:(w,s)=>`${w} ${s}px "JetBrains Mono",Menlo,Consolas,monospace`};
const hasLS='letterSpacing' in g;
function txt(s,x,y,font,col,align,ls){g.font=font;g.fillStyle=col;g.textAlign=align||'left';if(ls&&hasLS)g.letterSpacing=ls+'px';g.fillText(s,x,y);if(ls&&hasLS)g.letterSpacing='0px'}
function outl(s,x,y,font,col,stroke,lw){g.font=font;g.textAlign='center';g.lineWidth=lw||10;g.lineJoin='round';g.strokeStyle=stroke||BG;g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}
function star(x,y,r1,r2,n,rot){g.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}g.closePath()}
function circ(x,y,r,col){g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2);g.fillStyle=col;g.fill()}
function ring(x,y,r,col,w){g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function line(x1,y1,x2,y2,col,w){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function clipArea(){rr(VX,VY,VW,VH,20);g.clip()}
function kf(arr,t){for(let i=0;i<arr.length-1;i++){const a=arr[i],b=arr[i+1];if(t<=b[0]){const p=eio((t-a[0])/((b[0]-a[0])||1));return a.slice(1).map((v,j)=>lerp(v,b[j+1],p))}}return arr[arr.length-1].slice(1)}
const kf1=(arr,t)=>kf(arr,t)[0];
function burst(x,y,r,col,n,w){g.strokeStyle=col;g.lineWidth=w||3;g.lineCap='round';for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.beginPath();g.moveTo(x+Math.cos(a)*r*.45,y+Math.sin(a)*r*.45);g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.stroke()}}
function wrapText(s,x,y,maxW,lh,font,col){g.font=font;const words=s.split(' ');let ln='',yy=y;for(const w of words){const t=ln?ln+' '+w:w;if(g.measureText(t).width>maxW&&ln){txt(ln,x,yy,font,col);ln=w;yy+=lh}else ln=t}if(ln)txt(ln,x,yy,font,col)}
function heartPath(x,y,r){g.beginPath();g.moveTo(x,y+r);g.bezierCurveTo(x-r*1.6,y-r*0.2,x-r*0.8,y-r*1.4,x,y-r*0.5);g.bezierCurveTo(x+r*0.8,y-r*1.4,x+r*1.6,y-r*0.2,x,y+r);g.closePath()}
function quad(x1,y1,w1,x2,y2,w2,col){g.beginPath();g.moveTo(x1-w1,y1);g.lineTo(x1+w1,y1);g.lineTo(x2+w2,y2);g.lineTo(x2-w2,y2);g.closePath();g.fillStyle=col;g.fill()}
function mkPoly(P){const seg=[];let L=0;for(let i=0;i<P.length-1;i++){const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);seg.push([L,l]);L+=l}
  return{P,L,at(d){d=clamp(d,0,L);for(let i=0;i<seg.length;i++){if(d<=seg[i][0]+seg[i][1]+1e-9){const f=seg[i][1]?(d-seg[i][0])/seg[i][1]:0;return[lerp(P[i][0],P[i+1][0],f),lerp(P[i][1],P[i+1][1],f)]}}return P[P.length-1].slice()}}}
function confetti(x,y,e,n,cols,spread){for(let k=0;k<n;k++){const px=x+(hsh(k)-0.5)*spread*e,py=y-260*e*hsh(k*3)+420*e*e;g.save();g.translate(px,py);g.rotate(e*8+k);g.fillStyle=cols[k%cols.length];g.fillRect(-4,-2,8,4);g.restore()}}
function banner(x,y,w,s,col,q){g.save();g.translate(x,y);g.scale(q,q);rr(-w/2,-38,w,76,18);g.fillStyle='rgba(12,10,22,.92)';g.fill();g.strokeStyle=col;g.lineWidth=3;g.stroke();txt(s,0,14,F.d(42),col,'center');g.restore()}

/* ---------- audio ---------- */
const A={ac:null,m:null,sfx:null,mus:null,dly:null,nb:null,muted:false};
let AT=0,DEST=null;
function audioInit(){
  if(A.ac){if(A.ac.state==='suspended')A.ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const ac=new AC();A.ac=ac;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=5;comp.attack.value=0.003;comp.release.value=0.2;
    A.m=ac.createGain();A.m.gain.value=A.muted?0:0.8;A.m.connect(comp);comp.connect(ac.destination);
    const len=ac.sampleRate*2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.nb=b;
    const rl=Math.floor(ac.sampleRate*2.2),ir=ac.createBuffer(2,rl,ac.sampleRate);for(let ch=0;ch<2;ch++){const x=ir.getChannelData(ch);for(let i=0;i<rl;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3)}

/* ---------- PUZZLE ---------- */
const PZC=['#4d9bff','#ffd23d','#ff4d6d','#3dffa0','#c46bff'];
const PZ=(()=>{const C=7,R=7,gems=[],grid=[];let id=0;const mk=(c,t0,r0)=>{const o={id:id++,c,kf:[[t0,r0]],die:Infinity,col:0};gems.push(o);return o};
  for(let c=0;c<C;c++){grid[c]=[];for(let r=0;r<R;r++){const o=mk(c,0,r);o.col=(c+2*r)%5;grid[c][r]=o}}
  const a=grid[3][5],b=grid[3][6];a.kf.push([0.55,5],[0.8,6]);b.kf.push([0.55,6],[0.8,5]);grid[3][5]=b;grid[3][6]=a;
  const CL=[[0.9,[[2,6],[3,6],[4,6]]],[1.7,[[3,4],[3,5],[3,6]]],[2.5,[[0,6],[1,6],[2,6]]],[3.3,[[4,4],[5,4],[6,4]]],[4.1,[[1,5],[2,5],[3,5],[4,5],[5,5]]]],GC=[0,2,1,3,4];
  CL.forEach(([t,cells],k)=>{const set=cells.map(([c,r])=>grid[c][r]);set.forEach(o=>{o.col=GC[k];o.die=t+0.15});
    [...new Set(cells.map(x=>x[0]))].forEach(c=>{const keep=grid[c].filter(o=>!set.includes(o)),n=R-keep.length,nw=[];for(let j=0;j<n;j++){const o=mk(c,t+0.15,j-n);o.col=Math.floor(hsh(o.id*3.7)*5);nw.push(o)}
      nw.concat(keep).forEach((o,r)=>{const cur=o.kf[o.kf.length-1][1];if(cur!==r){const tf=t+0.15;o.kf.push([tf,cur],[tf+0.14+0.04*(r-cur),r])}});grid[c]=nw.concat(keep)})});

/* ---------- player ---------- */
let T=3.0,playing=false,lastNow=performance.now(),curI=-1,eptr=0,mstep=0;
const $=id=>document.getElementById(id);
const startBtn=$('start'),playBtn=$('play'),playIco=$('playIco'),muteBtn=$('mute'),muteIco=$('muteIco'),progEl=$('prog'),timeEl=$('time'),chips=$('chips'),cap=$('cap');

function setPlayIcon(){playIco.innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';playBtn.setAttribute('aria-label',playing?'일시정지':'재생')}
