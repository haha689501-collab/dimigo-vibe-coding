<title>야간 자습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 320x192 도트 화면 하나를 중앙에 두고 그 위에 DOM 대화창을 얹는다. 터치 기기에는 아래에 패드가 붙는다. */
:root{
  --bg:#0b0a12; --panel:#14122b; --panel2:#1d1a3d; --edge:#8a85d0; --edge2:#2f2b63;
  --ink:#ece9f7; --dim:#a29fbd; --accent:#e8c872; --bad:#e0645a; --good:#78cf93;
  --paper:#ece4cf; --paperink:#2b2519; --paperdim:#6d634d;
  --font:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --pix:'DotGothic16','Gowun Dodum','Malgun Gothic',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-inline:16px;padding-block:6px}
#stage{position:relative;width:960px;height:576px;max-width:100%;background:#000;box-shadow:0 0 0 2px var(--edge2),0 14px 44px #000b;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;font-size:max(13px,calc(var(--u,3px) * 5.4))}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#cv.glitch{animation:glitch .5s steps(7)}
#cv.flick{animation:flick .6s steps(9)}
@keyframes glitch{0%{transform:translate(0,0);filter:none}15%{transform:translate(-4px,1px);filter:hue-rotate(90deg) saturate(2)}30%{transform:translate(5px,-2px);filter:invert(.25)}45%{transform:translate(-2px,0);filter:hue-rotate(-60deg)}60%{transform:translate(3px,2px);filter:saturate(3)}80%{transform:translate(-1px,-1px);filter:none}100%{transform:none;filter:none}}
@keyframes flick{0%,100%{filter:none}12%{filter:brightness(.25)}25%{filter:brightness(1.3)}40%{filter:brightness(.4)}55%{filter:none}70%{filter:brightness(.3)}85%{filter:brightness(1.1)}}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}
#hud{position:absolute;left:.6em;top:.5em;font-family:var(--pix);font-size:.78em;color:var(--dim);text-shadow:1px 1px 0 #000;z-index:10;pointer-events:none}
#phoneBtn{position:absolute;right:.6em;top:.45em;z-index:12;font:inherit;font-size:.74em;color:var(--ink);background:rgba(20,18,43,.88);border:2px solid var(--edge2);padding:.2em .7em;cursor:pointer}
#phoneBtn:hover{border-color:var(--edge)}
#phoneBtn i{display:inline-block;width:.6em;height:.6em;background:var(--bad);margin-left:.4em;border-radius:50%}
#keyHud{position:absolute;right:.6em;top:2.2em;z-index:11;font-family:var(--pix);font-size:.74em;color:var(--accent);text-shadow:1px 1px 0 #000;pointer-events:none}
#bellHud{position:absolute;left:0;right:0;top:18%;text-align:center;z-index:11;font-family:var(--pix);font-size:1.3em;letter-spacing:.1em;text-shadow:2px 2px 0 #000;pointer-events:none}
#bellHud.warn{color:var(--accent)}
#bellHud.ring{color:var(--bad);animation:shake .12s steps(2) infinite}
@keyframes shake{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}
#toast{position:absolute;left:50%;top:2.4em;transform:translateX(-50%);z-index:50;background:rgba(12,10,30,.95);border:2px solid var(--edge);padding:.3em .9em;font-size:.82em;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#dialog{z-index:62!important;position:absolute;left:.9em;right:.9em;bottom:.7em;min-height:4.6em;padding:.75em 1em;background:rgba(12,10,30,.95);border:2px solid var(--edge);box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--edge2);line-height:1.5;z-index:30;cursor:pointer}
#dname{position:absolute;top:-1.3em;left:.8em;background:var(--edge2);border:2px solid var(--edge);padding:0 .6em;font-size:.82em;line-height:1.4}
#dtext{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
#dnext{position:absolute;right:.7em;bottom:.2em;color:var(--accent);animation:bob .7s steps(2) infinite}
@keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(3px)}}
#choices{z-index:63!important;position:absolute;right:.9em;bottom:6.4em;min-width:9em;max-width:76%;padding:.35em;background:rgba(12,10,30,.97);border:2px solid var(--edge);box-shadow:0 0 0 2px #000;z-index:35}
.opt{position:relative;padding:.25em .8em .25em 1.5em;cursor:pointer;line-height:1.35}
.opt.on{background:var(--edge2);color:var(--accent)}
.opt.on::before{content:'▶';position:absolute;left:.4em;top:.32em;font-size:.75em}
#paper,#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;max-height:92%;overflow:auto;box-sizing:border-box}
#paper{width:min(90%,23em);background:var(--paper);color:var(--paperink);padding:.9em 1.2em;box-shadow:.3em .3em 0 #000a;border:2px solid #000;font-size:.92em;line-height:1.5}
#paper h3{margin:0 0 .5em;font-size:1.05em;border-bottom:2px solid var(--paperink);padding-bottom:.2em}
#paper p{margin:.4em 0}
#paper ol,#paper ul{margin:.3em 0;padding-left:1.4em}
#paper li{margin:.15em 0}
#paper .small{font-size:.82em;color:var(--paperdim)}
.ros{border-collapse:collapse;width:100%;font-size:.95em;color:var(--paperink)}
.ros th,.ros td{border:1px solid var(--paperdim);padding:.12em .5em;text-align:left}
.ros th{background:#d9d0b4}
.ros .abs{color:#9a3a30;font-weight:bold}
.ros .blank{background:repeating-linear-gradient(135deg,#e6dcc0 0 4px,#ece4cf 4px 8px)}
.pfoot{margin-top:.6em;font-size:.76em;color:var(--dim);text-align:center}
#paper .pfoot{color:var(--paperdim)}
#panel{width:min(92%,26em);background:var(--panel);border:2px solid var(--edge);box-shadow:0 0 0 2px #000;padding:.8em 1em;color:var(--ink)}
#panel h3{margin:0 0 .6em;font-size:1em;font-family:var(--pix);letter-spacing:.06em;color:var(--accent)}
.cap{font-size:.84em;color:var(--dim);text-align:center;margin:.3em 0}
.bkrow{display:flex;gap:.45em;justify-content:center;margin:.4em 0}
.bk{width:2.1em;height:3.3em;border:2px solid #000;position:relative;cursor:pointer;box-shadow:inset 0 .5em 0 rgba(255,255,255,.18),inset -.3em 0 0 rgba(0,0,0,.22)}
.bk::after{content:'';position:absolute;left:.4em;right:.4em;top:1.2em;height:.2em;background:rgba(255,255,255,.7)}
.bk.on{outline:2px solid var(--accent);transform:translateY(-.25em)}
.bk.used{opacity:.12;pointer-events:none}
.slt{width:2.1em;height:3.3em;border:2px dashed var(--edge2);box-sizing:border-box}
.slt.f{border:2px solid #000;box-shadow:inset 0 .5em 0 rgba(255,255,255,.18)}
.card{margin:.4em auto;width:fit-content;background:var(--paper);color:var(--paperink);padding:.25em .8em;border:2px solid #000;font-size:.9em}
.msg{min-height:1.4em;text-align:center;font-size:.86em;color:var(--bad)}
.dials{display:flex;gap:1em;justify-content:center;margin:.6em 0}
.dial{text-align:center;cursor:pointer}
.dial .dg{font-family:var(--pix);font-size:2.3em;line-height:1.1;border:2px solid var(--edge);padding:.05em .4em;background:#0b0a1e}
.dial.on .dg{border-color:var(--accent);color:var(--accent)}
.dial small{display:block;color:var(--dim);font-size:.78em;margin-top:.2em}
.numrow{display:flex;gap:1em;justify-content:center;align-items:center;margin:.4em 0}
.numrow .num{font-family:var(--pix);font-size:2.2em;min-width:2.6em;text-align:center}
.btn{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--edge);padding:.15em .8em;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.keys{display:flex;gap:.5em;justify-content:center}
.kslot{border:2px solid var(--edge2);padding:.3em .3em .2em;text-align:center;cursor:pointer;width:4.7em;background:#0e0c22}
.kslot.on{border-color:var(--accent)}
.kslot canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.kslot .kt{font-size:.8em;color:var(--dim);margin-top:.15em;min-height:1.3em}
.knote{margin:.6em 0 .2em;min-height:2.8em;font-size:.9em;line-height:1.45;text-align:center}
#phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94%,25em);height:min(94%,29em);background:#0d0c1b;border:3px solid #5a567e;border-radius:.9em;display:flex;flex-direction:column;padding:.6em .8em;z-index:45;box-shadow:0 0 0 3px #000,0 1em 2em #000a;box-sizing:border-box}
.ph-head{display:flex;justify-content:space-between;font-size:.8em;color:var(--dim);padding-bottom:.3em}
.ph-tabs{display:flex;gap:.3em;margin-bottom:.4em}
.ph-tabs button{flex:1;font:inherit;font-size:.9em;color:var(--dim);background:var(--panel);border:2px solid var(--edge2);padding:.2em 0;cursor:pointer}
.ph-tabs button.on{color:var(--accent);border-color:var(--accent)}
.ph-body{flex:1;overflow:auto;font-size:.88em;line-height:1.5;padding-right:.2em}
.ph-body h4{margin:.6em 0 .2em;font-size:.95em;color:var(--accent)}
.ph-body h4:first-child{margin-top:0}
.rl{display:flex;gap:.5em;margin:.12em 0}
.rl b{flex:0 0 1.2em}
.rl.ok{color:var(--good)}
.rl.no{color:var(--ink)}
.dim{color:var(--dim)}
.code{font-family:var(--pix);letter-spacing:.2em;color:var(--accent)}
.bub{margin:.35em 0;padding:.3em .6em;background:var(--panel2);border-radius:.5em;max-width:92%}
.bub small{display:block;color:var(--dim);font-size:.78em}
.hi{padding:.3em .5em;margin:.3em 0;border:2px solid var(--edge2);cursor:pointer}
.hi.on{border-color:var(--accent)}
.hi.done{opacity:.55}
.hi .ht{color:#cbd9ff;margin-top:.2em;padding-left:.5em;border-left:2px solid var(--edge)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:55}
#title,#end{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;text-align:center;padding:1em;background:radial-gradient(circle at 20% 25%,#26224f 0,transparent 35%),radial-gradient(circle at 80% 70%,#2d1f40 0,transparent 40%),#07060f}
#end{z-index:58}
.ttl{font-family:var(--pix);font-size:3.4em;letter-spacing:.2em;margin:0;text-shadow:.06em .06em 0 #3a3470}
.sub{font-family:var(--pix);color:var(--accent);letter-spacing:.3em;font-size:1em}
.start{margin-top:1.2em;color:var(--ink);animation:blink 1.1s steps(2) infinite;cursor:pointer}
@keyframes blink{50%{opacity:.2}}
.tin{color:var(--dim);font-size:.8em;line-height:1.7;max-width:30em}
.stat{font-family:var(--pix);color:var(--ink);line-height:1.9}
#pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;padding:2px 6px;box-sizing:border-box}
#app.touch #pad{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px}
.pb{font:inherit;font-size:20px;color:var(--ink);background:var(--panel2);border:2px solid #4b4690;border-radius:10px;touch-action:none;-webkit-user-select:none;user-select:none}
.pb:active{background:#34307a}
.abtns{display:flex;gap:14px}
.abtns .pb{width:64px;height:64px;border-radius:50%;font-size:15px;white-space:nowrap;padding:0}
#app.touch #help{display:none}
#help{margin:0;font-size:.74rem;color:var(--dim);text-align:center;line-height:1.5}
@media (prefers-reduced-motion:reduce){#dnext,.start{animation:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv" width="320" height="192"></canvas>
    <div id="vig"></div>
    <div id="hud"><span id="place"></span></div>
    <button id="phoneBtn" type="button">휴대폰<i id="badge" hidden></i></button>
    <div id="keyHud" hidden></div>
    <div id="bellHud" hidden></div>
    <div id="toast" hidden></div>
    <div id="dialog" hidden><div id="dname"></div><div id="dtext"></div><div id="dnext">▼</div></div>
    <div id="choices" hidden></div>
    <div id="paper" hidden></div>
    <div id="panel" hidden></div>
    <div id="phone" hidden></div>
    <div id="fade"></div>
    <div id="end" hidden></div>
    <div id="title">
      <h1 class="ttl">야간 자습</h1>
      <div class="sub">1 F</div>
      <p class="tin">방마다 규칙이 붙어 있다.<br>그리고 규칙은 이미 어겨져 있다.</p>
      <div class="start" id="startBtn">Z · Enter · 터치로 시작</div>
      <p class="tin" style="margin-top:1em">가제 · 쯔꾸르풍 추리 프로토타입</p>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <span></span><button class="pb" data-a="up" type="button" aria-label="위">▲</button><span></span>
      <button class="pb" data-a="left" type="button" aria-label="왼쪽">◀</button><span></span><button class="pb" data-a="right" type="button" aria-label="오른쪽">▶</button>
      <span></span><button class="pb" data-a="down" type="button" aria-label="아래">▼</button><span></span>
    </div>
    <div class="abtns">
      <button class="pb" data-a="cancel" type="button">휴대폰</button>
      <button class="pb" data-a="ok" type="button">조사</button>
    </div>
  </div>
  <p id="help">이동 방향키·WASD &nbsp;·&nbsp; 조사/확인 Z &nbsp;·&nbsp; 휴대폰/취소 X &nbsp;·&nbsp; 소리 M</p>
</div>
<script>
'use strict';
/* ===== 기본 ===== */
const T = 16, VW = 320, VH = 192;
const cv = document.getElementById('cv');
const main = cv.getContext('2d');
main.imageSmoothingEnabled = false;
let c = main;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DX = { u: 0, d: 0, l: -1, r: 1 }, DY = { u: -1, d: 1, l: 0, r: 0 };
const G = { playing: false, map: 'hub', t: 0 };
const P = { x: 4, y: 4, px: 64, py: 64, dir: 'd', moving: false, prog: 0, sx: 0, sy: 0, nx: 0, ny: 0 };
let busyN = 0;
const isBusy = () => busyN > 0;
async function withBusy(fn) { busyN++; try { return await fn(); } finally { busyN--; } }

/* ===== 소리 ===== */

/* ===== 화면 크기 ===== */
function fit() {
  const app = $('app'), st = $('stage'), pad = $('pad'), help = $('help');
  const touch = matchMedia('(pointer:coarse)').matches || innerWidth < 640;
  app.classList.toggle('touch', touch);
  const extra = (touch ? pad.offsetHeight + 8 : 0) + help.offsetHeight + 24;
  const aw = Math.min(innerWidth - 32, 1400), ah = innerHeight - extra - 12;
  let u = Math.min(aw / VW, ah / VH);
  if (u >= 2) u = Math.floor(u * 2) / 2;
  u = Math.max(u, 0.8);
  st.style.width = VW * u + 'px';
  st.style.height = VH * u + 'px';
  st.style.setProperty('--u', u + 'px');
}
addEventListener('resize', fit);

/* ===== 입력 ===== */
const held = { up: false, down: false, left: false, right: false };
const modals = [];
const pushModal = f => modals.push(f);
const popModal = f => { const i = modals.lastIndexOf(f); if (i >= 0) modals.splice(i, 1); };
function press(a) {
  initAudio();
  if (modals.length) { modals[modals.length - 1](a); return; }
  if (!G.playing || isBusy()) return;
  if (a === 'ok') interact();
  else if (a === 'cancel' || a === 'menu') openPhone();
}
const KEY = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', z: 'ok', enter: 'ok', ' ': 'ok', x: 'cancel', escape: 'cancel', backspace: 'cancel', tab: 'menu', p: 'menu', c: 'menu' };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r' && !e.repeat) {
    if (typeof G !== 'undefined' && G.started && Date.now() - (window.__rT || 0) < 1500) {
      try { sessionStorage.setItem('autostart', '1'); } catch (_) {}
      location.reload(); return;
    }
    window.__rT = Date.now();
    if (G.started) toast('R을 한 번 더 누르면 처음부터 다시 시작');
    return;
  }
  if (k === '7' && !e.repeat) { const n = Date.now(); if (n - (window.__sT || 0) < 600) { window.__sT = 0; if (window.openDebug) window.openDebug(); } else window.__sT = n; return; }
  if (k === 'm') { muted = !muted; toast(muted ? '소리 끔' : '소리 켬'); return; }
  const a = KEY[k]; if (!a) return;
  e.preventDefault();
  if (a in held) { held[a] = true; if (modals.length) press(a); return; }
  if (e.repeat) return;
  press(a);
});
addEventListener('keyup', e => { const a = KEY[e.key.toLowerCase()]; if (a && a in held) held[a] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
document.querySelectorAll('.pb').forEach(b => {
  const a = b.dataset.a;
  const down = e => { e.preventDefault(); initAudio(); if (a in held) { held[a] = true; if (modals.length) press(a); } else press(a); };
  const up = () => { if (a in held) held[a] = false; };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up);
  b.addEventListener('pointercancel', up);
});
function heldDir() {
  if (held.up) return 'u'; if (held.down) return 'd'; if (held.left) return 'l'; if (held.right) return 'r'; return null;
}

/* ===== 효과 ===== */
function fx(cls, ms) {
  cv.classList.remove(cls); void cv.offsetWidth; cv.classList.add(cls);
  setTimeout(() => cv.classList.remove(cls), ms);
}
let toastT = null;
function toast(t) {
  const e = $('toast'); e.textContent = t; e.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { e.hidden = true; }, 2600);
}
async function fadeTo(a, ms) {
  ms = ms || 240;
  const f = $('fade'); f.style.transition = 'opacity ' + ms + 'ms linear'; f.style.opacity = a;
  await sleep(ms + 30);
}

/* ===== 대화창 ===== */
let typingTimer = null;
function setDialog(line) {
  const n = typeof line === 'object' ? line.n : '';
  const text = typeof line === 'object' ? line.t : line;
  $('dialog').hidden = false;
  $('dname').textContent = n || ''; $('dname').style.display = n ? 'block' : 'none';
  $('dtext').textContent = text; $('dnext').style.visibility = 'hidden';
}
function hideDialog() { clearInterval(typingTimer); $('dialog').hidden = true; }
function showLine(line) {
  return new Promise(res => {
    const text = typeof line === 'object' ? line.t : line;
    setDialog(line);
    $('dtext').textContent = '';
    let i = 0, done = false;
    clearInterval(typingTimer);
    const finish = () => { clearInterval(typingTimer); $('dtext').textContent = text; done = true; $('dnext').style.visibility = 'visible'; };
    typingTimer = setInterval(() => {
      i++; $('dtext').textContent = text.slice(0, i);
      if (i % 3 === 0) sfx('blip');
      if (i >= text.length) finish();
    }, 24);
    const h = a => {
      if (a === 'ok' || a === 'cancel') {
        if (!done) finish();
        else { popModal(h); res(); }
      }
    };
    pushModal(h);
  });
}
async function say(...lines) {
  lines = lines.flat();
  for (const l of lines) await showLine(l);
  hideDialog();
}
$('dialog').addEventListener('click', () => press('ok'));

/* ===== 선택지 ===== */
function choose(opts, o) {
  const cancel = o && o.cancel !== undefined ? o.cancel : null;
  return new Promise(res => {
    const box = $('choices'); box.innerHTML = ''; let idx = (o && o.start) || 0;
    const els = opts.map((t, i) => {
      const d = document.createElement('div'); d.className = 'opt'; d.textContent = t;
      d.addEventListener('click', () => close(i));
      d.addEventListener('mouseenter', () => { idx = i; draw(); });
      box.appendChild(d); return d;
    });
    const draw = () => els.forEach((e, i) => e.classList.toggle('on', i === idx));
    const close = v => { popModal(h); box.hidden = true; sfx('ok'); res(v); };
    const h = a => {
      if (a === 'up') { idx = (idx + opts.length - 1) % opts.length; draw(); sfx('move'); }
      else if (a === 'down') { idx = (idx + 1) % opts.length; draw(); sfx('move'); }
      else if (a === 'ok') close(idx);
      else if (a === 'cancel' && cancel !== null) close(cancel);
    };
    box.hidden = false; draw(); pushModal(h);
  });
}
async function ask(q, opts) {
  setDialog(q);
  const r = await choose(opts, { cancel: opts.length - 1 });
  hideDialog();
  return r;
}

/* ===== 종이(안내문·명단) ===== */
function paper(title, html) {
  return new Promise(res => {
    const p = $('paper');
    p.innerHTML = '<h3>' + title + '</h3>' + html + '<div class="pfoot">Z · X 닫기</div>';
    p.scrollTop = 0; p.hidden = false; sfx('paper');
    const h = a => { if (a === 'ok' || a === 'cancel') { popModal(h); p.hidden = true; p.onclick = null; res(); } };
    p.onclick = () => h('ok');
    pushModal(h);
  });
}

/* ===== 숫자 고르기 ===== */
function pickNumber(label, min, max, init, suffix) {
  return new Promise(res => {
    const p = $('panel'); let v = init; suffix = suffix || '';
    const draw = () => {
      p.innerHTML = '<h3>' + label + '</h3><div class="numrow"><button class="btn" data-d="-1" type="button">◀</button><div class="num">' + v + suffix + '</div><button class="btn" data-d="1" type="button">▶</button></div><div style="text-align:center"><button class="btn" id="numok" type="button">확정</button></div><div class="pfoot">←→ 조절 · ↑↓ 5씩 · Z 확정 · X 취소</div>';
      p.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { v = clamp(v + (+b.dataset.d), min, max); sfx('move'); draw(); }));
      $('numok').addEventListener('click', () => close(v));
    };
    const close = r => { popModal(h); p.hidden = true; sfx('ok'); res(r); };
    const h = a => {
      if (a === 'left') { v = clamp(v - 1, min, max); sfx('move'); draw(); }
      else if (a === 'right') { v = clamp(v + 1, min, max); sfx('move'); draw(); }
      else if (a === 'up') { v = clamp(v + 5, min, max); sfx('move'); draw(); }
      else if (a === 'down') { v = clamp(v - 5, min, max); sfx('move'); draw(); }
      else if (a === 'ok') close(v);
      else if (a === 'cancel') close(null);
    };
    p.hidden = false; draw(); pushModal(h);
  });
}

    else if (kind === 'caf') { hum(60, 0.03); hum(120, 0.012, 'triangle'); loop(true, 'lowpass', 160, 0, 0.4); }

  if (ST.lib.shelfDone) { await say('책들이 반납 카드 날짜순으로 꽂혀 있다.'); return; }
  const r = await bookPanel();
  if (r === 'death') { await deathLib(); return; }
  if (r === 'ok') {
    ST.lib.shelfDone = true; sfx('good');
    await say('책이 한 권씩 서가에 들어가자 낮은 소리가 났다.', '…제자리를 찾은 것 같다.');
    await check('lib');
  }
}
async function counterAct(fx_) {
  if (fx_ === 14) { await roster(); return; }
  if (fx_ === 15) { await ledger(); return; }
  if (fx_ === 13) { await say('스탠드가 켜져 있다. 전구가 뜨겁다. 방금 누가 켠 것처럼.'); return; }
  await say('호출벨을 눌렀다. 소리는 나지 않았는데, 어딘가에서 의자 끄는 소리가 대답하듯 들렸다.');
}
function roster() {

async function ledger() {
  addNote('도서관 출입 장부 마지막 퇴실자: 10/1 박서연 · 10/2 김도윤 · 10/3 정우진 · 10/4 최민서 (오늘은 10/5)');
  await paper('야간 자습 출입 장부', '<table class="ros"><tr><th>날짜</th><th>마지막 퇴실자</th></tr><tr><td>10월 1일</td><td>박서연</td></tr><tr><td>10월 2일</td><td>김도윤</td></tr><tr><td>10월 3일</td><td>정우진</td></tr><tr><td>10월 4일</td><td>최민서</td></tr><tr><td>10월 5일</td><td class="' + (ST.lib.ledger ? '' : 'blank') + '">' + (ST.lib.ledger ? '강한결' : '&nbsp;') + '</td></tr></table><p class="small">마지막으로 나가는 사람이 이름을 씁니다.</p>');
  if (ST.lib.ledger) { await say('오늘 칸에는 내 이름이 적혀 있다.'); return; }
  const a = await ask('오늘 칸에 이름을 쓸까?', ['이름을 쓴다', '그만둔다']);
  if (a !== 0) return;
  const names = ROSTER.map(r => r[1]);
  const i = await choose(names.concat(['취소']), { cancel: names.length });
  if (i === names.length) return;
  const nm = names[i];
  if (nm === '강한결') {
    ST.lib.ledger = true; sfx('good');
    await say('"강한결"', '오늘 칸에 내 이름을 적었다. 잉크가 번지듯 천천히 마른다.');
    await check('lib');
  } else if (nm === '이하준') {
    await mistake('이하준은 오늘 오지 않았다. 신청서에도 결석으로 되어 있다.');
  } else {
    await mistake(nm + '은(는) 이미 퇴실 확인을 받았다. 마지막으로 나가는 사람이 아니다.');
  }
}
async function chairAct(id) {
  const has = ST.lib.chairs.has(id);
  if (has) {
    await say('의자 등받이에 번호표가 붙어 있다. [' + id + '번]');
    const a = await ask('이 의자를 책상 밑으로 치울까?', ['치운다', '그대로 둔다']);
    if (a === 0) { ST.lib.chairs.delete(id); sfx('chair'); await say(id + '번 의자를 책상 밑으로 밀어 넣었다.'); await check('lib'); }
  } else {
    const a = await ask(id + '번 자리의 의자가 치워져 있다. 다시 꺼낼까?', ['꺼낸다', '그대로 둔다']);

}

/* ===== 화장실 ===== */
async function stallAct(n, s) {
  const d = ST.wc.door;
  if (d[n] === 'o') {
    const inside = P.y <= 4 && P.x >= s[0] && P.x <= s[1];
    if (inside) {
      if (n === 3) { await say('안에서 문을 닫으면 나올 수 없을 것 같다.'); return; }
      const a = await ask('안에서 문을 잠글까? 나올 수 없을 것 같다.', ['잠근다', '그만둔다']);
      if (a === 0) { ST.mistakes++; await deathWc(n, s); }
      return;
    }
    d[n] = 'c'; sfx('stall'); await say(n + '번 칸의 문을 닫았다.');
  } else {
    d[n] = 'o'; sfx('stall'); await say(n + '번 칸의 문을 열었다.');
  }
  await check('wc');
}

async function faucetAct(fx_) {

  const f = ST.wc.faucet;
  if (f[i]) { f[i] = false; sfx('tap'); await say('수도를 잠갔다. 물소리가 멎었다.'); await check('wc'); }
  else {
    const q = await ask((i + 1) + '번 수도는 잠겨 있다. 틀어 볼까?', ['튼다', '그만둔다']);
    if (q !== 0) return;
    f[i] = true; sfx('water');

async function switchPanel() {
  await say('스위치 패널이다. 덮개에 "절대 켜지 마시오"라고 쓰여 있다.');
  const names = ['1 조리실', '2 배식대', '3 냉장 구역', '4 식당 홀'];
  let last = 0;
  while (true) {
    const L = ST.caf.light;
    const i = await choose(names.map((n, k) => n + '  [' + (L[k] ? 'ON' : 'OFF') + ']').concat(['닫는다']), { cancel: 4, start: last });
    last = i;
    if (i === 4) break;

      const now = Date.now(); ST.caf.flk = (ST.caf.flk || []).filter(ts => now - ts < 5000); ST.caf.flk.push(now);
      if (ST.caf.flk.length >= 4) { ST.caf.flk = []; ST.mistakes++; $('panel').hidden = true; await deathCafHand(L.slice()); return; }

    if (L.every(Boolean)) {
      ST.mistakes++; $('panel').hidden = true;
      await deathCaf(i); return;
    }

/* ===== 패널: 책 ===== */
function bookPanel() {
  return new Promise(res => {
    const p = $('panel'); let placed = [], cur = 0, msg = '';
    const nextFree = dir => { for (let k = 1; k <= BOOKS.length; k++) { const i = (cur + dir * k + BOOKS.length * 2) % BOOKS.length; if (!placed.includes(BOOKS[i].id)) return i; } return cur; };
    const close = r => { popModal(h); p.hidden = true; res(r); };
    const place = () => {
      const b = BOOKS[cur]; if (placed.includes(b.id)) return;
      placed.push(b.id); sfx('book'); msg = '';
      if (placed.length === BOOKS.length) {
        if (placed.every((id, i) => id === CORRECT[i])) { close('ok'); return; }
        ST.mistakes++; close('death'); return;
      } else cur = nextFree(1);
      render();
    };
    const render = () => {
      const cb = BOOKS[cur]; (ST.bookSeen = ST.bookSeen || {})[cb.id] = cb.date;
      p.innerHTML = '<h3>반납 카트의 책</h3><div class="cap">반납 카드의 날짜가 빠른 책부터, 서가의 왼쪽부터 꽂는다.</div><div class="msg">' + msg + '</div><div class="bkrow">' +
        BOOKS.map((b, i) => '<div class="bk' + (i === cur ? ' on' : '') + (placed.includes(b.id) ? ' used' : '') + '" data-i="' + i + '" style="background:' + b.color + '"></div>').join('') +
        '</div><div class="card">반납 카드 · ' + cb.date + '</div><div class="cap">서가 (왼쪽 → 오른쪽)</div><div class="bkrow">' +
        [0, 1, 2, 3, 4].map(i => placed[i] ? '<div class="slt f" style="background:' + BOOK_BY_ID[placed[i]].color + '"></div>' : '<div class="slt"></div>').join('') +
        '</div><div class="pfoot">←→ 책 고르기 · Z 꽂기 · X 되돌리기/닫기</div>';
      p.querySelectorAll('.bk').forEach(el => el.addEventListener('click', () => { const i = +el.dataset.i; if (i === cur) place(); else { cur = i; render(); } }));
    };
    const h = a => {
      if (a === 'left') { cur = nextFree(-1); sfx('move'); render(); }
      else if (a === 'right') { cur = nextFree(1); sfx('move'); render(); }
      else if (a === 'ok') place();
      else if (a === 'cancel') { if (placed.length) { placed.pop(); cur = BOOKS.findIndex(b => !placed.includes(b.id)); sfx('book'); render(); } else close(null); }
    };
    p.hidden = false; render(); pushModal(h);
  });
}

/* ===== 패널: 열쇠함 다이얼 ===== */
function codePanel(labels) {
  return new Promise(res => {
    const p = $('panel'); const d = [0, 0, 0]; let sel = 0; labels = labels || ['도서관', '화장실', '급식실'];
    const close = r => { popModal(h); p.hidden = true; res(r); };
    const render = () => {
      p.innerHTML = '<h3>열쇠함 다이얼</h3><div class="dials">' + d.map((v, i) => '<div class="dial' + (i === sel ? ' on' : '') + '" data-i="' + i + '"><div class="dg">' + v + '</div><small>' + labels[i] + '</small></div>').join('') + '</div><div style="text-align:center"><button class="btn" id="cdok" type="button">돌려 본다</button></div><div class="pfoot">←→ 칸 · ↑↓ 숫자 · Z 확인 · X 취소</div>';
      p.querySelectorAll('.dial').forEach(el => el.addEventListener('click', () => { const i = +el.dataset.i; if (sel === i) d[i] = (d[i] + 1) % 10; sel = i; sfx('move'); render(); }));
      $('cdok').addEventListener('click', () => { sfx('ok'); close(d.join('')); });
    };
    const h = a => {
      if (a === 'left') { sel = (sel + 2) % 3; sfx('move'); render(); }
      else if (a === 'right') { sel = (sel + 1) % 3; sfx('move'); render(); }
      else if (a === 'up') { d[sel] = (d[sel] + 1) % 10; sfx('move'); render(); }
      else if (a === 'down') { d[sel] = (d[sel] + 9) % 10; sfx('move'); render(); }
      else if (a === 'ok') { sfx('ok'); close(d.join('')); }
      else if (a === 'cancel') close(null);
    };
    p.hidden = false; render(); pushModal(h);
  });
}

/* ===== 패널: 열쇠 고르기 ===== */
function drawKey(cn, k, empty) {
  const g = cn.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 40, 22);
  g.fillStyle = '#3a3750'; g.fillRect(1, 0, 6, 2);
  if (empty) { g.fillStyle = '#26233a'; g.fillRect(3, 3, 2, 12); return; }
  g.fillStyle = '#7a7690'; g.fillRect(3, 2, 2, 2);
  const m = k.metal;
  g.fillStyle = m;
  if (k.head === 'round') { g.fillRect(3, 4, 8, 8); g.fillRect(2, 5, 10, 6); g.fillStyle = '#141120'; g.fillRect(6, 7, 2, 2); }
  else if (k.head === 'tri') { for (let i = 0; i < 8; i++) g.fillRect(7 - i, 3 + i, 2 + i * 2, 1); g.fillStyle = '#141120'; g.fillRect(6, 8, 2, 2); }
  else { g.fillRect(2, 4, 10, 8); g.fillStyle = '#141120'; g.fillRect(5, 6, 4, 4); }
  g.fillStyle = m; g.fillRect(12, 7, 24, 2); g.fillRect(27, 9, 3, 3); g.fillRect(32, 9, 3, 4);
  if (k.gloss) {
    g.fillStyle = '#ffffff'; g.fillRect(3, 5, 5, 1); g.fillRect(14, 7, 12, 1);
    g.fillStyle = 'rgba(110,80,50,.6)'; g.fillRect(4, 11, 2, 1); g.fillRect(8, 10, 1, 1); g.fillRect(17, 8, 2, 1); g.fillRect(23, 8, 1, 1);
  }
  if (k.dust) { g.fillStyle = 'rgba(190,190,180,.75)'; [[4, 5], [8, 6], [14, 7], [20, 7], [29, 10], [6, 10], [10, 9], [33, 10]].forEach(q => g.fillRect(q[0], q[1], 2, 1)); g.fillRect(3, 4, 8, 1); }
  if (k.rust) { g.fillStyle = '#a8531e'; [[4, 6], [9, 8], [15, 7], [22, 8], [30, 10], [7, 10], [34, 11]].forEach(q => g.fillRect(q[0], q[1], 2, 2)); }
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(12, 9, 24, 1);
}
function keyPanel(list) {
  list = list || KEYS;
  return new Promise(res => {
    const p = $('panel'); let cur = 0;
    const close = () => { popModal(h); p.hidden = true; res(); };
    const take = () => { const k = list[cur]; ST.key = (ST.key === k.id) ? null : k.id; sfx('key'); updateKeyHud(); render(); };
    const render = () => {
      const k = list[cur], held = ST.key;
      const act = held === k.id ? '되돌려 놓기' : (held ? '바꿔서 꺼내기' : '꺼내기');
      p.innerHTML = '<h3>열쇠함</h3><div class="cap">열쇠는 한 번에 하나만 꺼낼 수 있다.</div><div class="keys">' +
        list.map((q, i) => '<div class="kslot' + (i === cur ? ' on' : '') + '" data-i="' + i + '"><canvas width="40" height="22" data-k="' + q.id + '"></canvas><div class="kt">' + q.id + ' · ' + (q.tag ? '「' + q.tag + '」' : '「 」') + '</div></div>').join('') +
        '</div><div class="knote">' + k.note + '</div><div class="cap">지금 가진 열쇠: ' + (held || '없음') + '</div><div style="text-align:center"><button class="btn" id="kact" type="button">' + act + '</button></div><div class="pfoot">←→ 살펴보기 · Z ' + act + ' · X 닫기</div>';
      p.querySelectorAll('canvas').forEach(cn => { const q = list.find(z => z.id === cn.dataset.k); drawKey(cn, q, ST.key === q.id); });
      p.querySelectorAll('.kslot').forEach(el => el.addEventListener('click', () => { cur = +el.dataset.i; sfx('move'); render(); }));
      $('kact').addEventListener('click', take);
    };
    const h = a => {

/* ===== 이동·조사 ===== */
async function interact() {
  await withBusy(async () => {
    const M = MAPS[G.map];
    const fx_ = P.x + DX[P.dir], fy_ = P.y + DY[P.dir];
    const o = objAt(M, fx_, fy_);
    if (o && o.act) await o.act(o, fx_, fy_);
  });
}
function tryMove(d) {
  const M = MAPS[G.map]; P.dir = d;
  const nx = P.x + DX[d], ny = P.y + DY[d];
  if (G.map === 'yard' && bell.phase === 'ring') { bellViolate(); return; }
  const w = warpAt(M, nx, ny);
  if (w && w.cond) { const r = w.cond(); if (r !== true) { withBusy(typeof r === 'function' ? r : () => say(r)); return; } }
  if (tileSolid(M, nx, ny) || objSolidAt(M, nx, ny)) return;
  P.moving = true; P.prog = 0; P.sx = P.px; P.sy = P.py; P.nx = nx; P.ny = ny;
}
function stepMove(dt) {
  P.prog = Math.min(16, P.prog + dt * 0.085);
  P.px = P.sx + DX[P.dir] * P.prog; P.py = P.sy + DY[P.dir] * P.prog;
  if (P.prog >= 16) {
    P.moving = false; P.x = P.nx; P.y = P.ny; P.px = P.x * 16; P.py = P.y * 16;
    { const M0 = MAPS[G.map], ch = M0.t[P.y] && M0.t[P.y][P.x]; SND.step(ch === 'd' ? 'dirt' : ch === 'g' ? 'grass' : M0.floor, (P.x + P.y) & 1); }
    const w = warpAt(MAPS[G.map], P.x, P.y);
    if (w) goMap(w.to, w.tx, w.ty, w.dir);
  }
}
async function goMap(id, tx, ty, dir, instant) {
  await withBusy(async () => {
    if (!instant) { const f0 = (MAPS[G.map] && MAPS[G.map].fl) || 1, f1 = (MAPS[id] && MAPS[id].fl) || 1; sfx(f0 !== f1 ? 'stairs' : 'door'); await fadeTo(1, 220); }
    const M = MAPS[id]; ensureBase(M); ambStart(ambFor(id));
    G.map = id; P.x = tx; P.y = ty; P.px = tx * 16; P.py = ty * 16; P.dir = dir; P.moving = false;
    $('place').textContent = M.place;
    if (id === 'yard') bellReset(); else hideBell();
    if (!instant) await fadeTo(0, 220);
    if (M.onEnter) await M.onEnter();
  });
}

/* ===== 운동장 종소리 ===== */
function showBell(k) { /* 화면 문구 없음 (소리·붉은 화면으로만 알린다) */ }
function hideBell() { $('bellHud').hidden = true; }
function bellReset() { bell.phase = 'idle'; bell.t = 3500; bell.violated = false; hideBell(); }
let bellAcc = 0;
function updateBell(dt) {
  bell.t -= dt;
  if (bell.phase === 'ring') { bellAcc += dt; if (bellAcc > 430) { bellAcc = 0; SND.clang(0.6); } } else bellAcc = 0;
  if (bell.t > 0) return;
  if (bell.phase === 'idle') { bell.phase = 'warn'; bell.t = 1800; showBell('warn'); sfx('warn'); }
  else if (bell.phase === 'warn') { bell.phase = 'ring'; bell.t = 3200; bell.violated = false; bell.startX = P.x; showBell('ring'); sfx('bell'); }
  else if (bell.phase === 'ring') endRing();
}
function endRing() {
  bell.phase = 'idle'; bell.t = 6500; hideBell();
  if (bell.violated) return;
  if (bell.startX >= 6) {
    ST.yard.bellOK++; sfx('good'); toast('종소리가 멎었다. (' + Math.min(ST.yard.bellOK, 1) + '/1)');
    withBusy(() => check('yard'));
  } else toast('종소리가 멎었다. 더 안쪽에서 견뎌야 할 것 같다.');
}
function bellViolate() {

  bell.violated = true; ST.bellFails++; hideBell();

}

/* ===== 그리기·루프 ===== */
function render() {
  const M = MAPS[G.map]; c = main;
  c.fillStyle = '#000'; c.fillRect(0, 0, VW, VH);
  if (!M || !M.base) return;
  const cut = G.cut, cam = camera(M);
  c.save();
  if (cut) {
    const t = cut.t || 0, sh = cut.shake ? cut.shake(t) : 0;
    if (sh) c.translate(Math.round((Math.random() - 0.5) * sh), Math.round((Math.random() - 0.5) * sh));
    const z = cut.zoom ? cut.zoom(t) : null;
    if (z && z.s !== 1) { const zx = z.fx - cam.x, zy = z.fy - cam.y; c.translate(zx, zy); c.scale(z.s, z.s); c.translate(-zx, -zy); }
  }
  c.save(); c.translate(-cam.x, -cam.y); c.drawImage(M.base, 0, 0);
  const vis = M.objs.filter(o => !(o.hide && o.hide()) && !(cut && cut.hideObj && cut.hideObj(o)));
  vis.filter(o => o.flat).forEach(o => o.draw(o));
  const list = vis.filter(o => !o.flat).map(o => ({ y: (o.y + o.h) * 16, f: () => o.draw(o) }));
  if (!(cut && cut.hidePlayer)) list.push({ y: P.py + 16, f: drawPlayer });
  list.sort((a, b) => a.y - b.y);
  list.forEach(e => e.f());
  if (cut) cut.fn(cut.t || 0);
  c.restore();
  if (M.overlay) M.overlay(cam);
  c.restore();
  if (cut) drawCutOverlay(cut);
}
function update(dt) {
  if (P.moving) stepMove(dt);
  else if (!isBusy() && !modals.length) { const d = heldDir(); if (d) tryMove(d); }
  if (G.map === 'yard' && !isBusy() && !modals.length) updateBell(dt);
  if (!isBusy() && !modals.length) ghostTick(dt);
  ambTick(dt);
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  G.t += dt;
  if (G.playing) update(dt);
  render();
  requestAnimationFrame(frame);
}
