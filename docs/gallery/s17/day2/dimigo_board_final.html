<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디미고 민원 게시판</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --like: #ef4444;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --reject: #6b7280;
    --reject-bg: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .right { display: flex; align-items: center; gap: 10px; }
  .who { font-size: 12px; color: var(--muted); }
  .who b { color: var(--text); }
  .link { border: none; background: none; font-size: 14px; color: var(--primary); cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; }

  .section-title { font-size: 13px; color: var(--muted); margin: 8px 0 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; word-break: break-word; }
  .card p { font-size: 14px; line-height: 1.6; color: #374151; white-space: pre-wrap; word-break: break-word; }
  .card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; gap: 8px; }
  .card .meta .time { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn-like {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .btn-like.on { border-color: var(--like); color: var(--like); background: #fef2f2; }
  .btn-del { border: none; background: none; color: var(--danger); font-size: 13px; cursor: pointer; padding: 6px 4px; }
  .btn-status {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text);
  }
  .btn-status.improve.on { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
  .btn-status.reject.on { border-color: var(--reject); color: var(--reject); background: var(--reject-bg); }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; margin-right: 4px; }
  .badge.draft { background: #fff7ed; color: #c2410c; }
  .badge.improve { background: var(--ok-bg); color: var(--ok); }
  .badge.reject { background: var(--reject-bg); color: var(--reject); }
  .draft-card { border-style: dashed; cursor: pointer; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 48px 0; line-height: 1.6; }

  .fab {
    position: fixed; right: 20px; bottom: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--primary); color: #fff; border: none;
    font-size: 28px; line-height: 1; cursor: pointer;
    box-shadow: 0 6px 16px rgba(37,99,235,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .fab:hover { background: var(--primary-dark); }

  section { display: none; }
  section.show { display: block; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-size: 15px; font-family: inherit; background: #fff;
  }
  .field textarea { min-height: 200px; resize: vertical; line-height: 1.6; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--text); }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.primary:hover { background: var(--primary-dark); }
  .notice { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .error { color: var(--danger); font-size: 13px; margin-top: 6px; min-height: 18px; }
  .accounts { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .accounts code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="headerTitle">디미고 민원 게시판</h1>
    <div class="sub">학교에서 불편한 점을 익명으로 남겨주세요</div>
  </div>
  <div class="right">
    <span class="who" id="who" style="display:none"></span>
    <button class="link" id="btnBack" style="display:none">← 게시판</button>
    <button class="link" id="btnLogout" style="display:none">로그아웃</button>
  </div>
</header>

<main>
  <!-- 로그인 화면 -->
  <section id="login">
    <div class="card">
      <div class="field">
        <label for="inId">아이디</label>
        <input id="inId" type="text" placeholder="아이디" autocomplete="username">
      </div>
      <div class="field">
        <label for="inPw">비밀번호</label>
        <input id="inPw" type="password" placeholder="비밀번호" autocomplete="current-password">
      </div>
      <div class="error" id="loginError"></div>
      <div class="btns">
        <button class="btn primary" id="btnLogin">로그인</button>
      </div>
      <div class="accounts">
        테스트 계정 (비밀번호 모두 <code>1234</code>)<br>
        학생: <code>student1</code>, <code>student2</code> · 학생회: <code>council</code> · 선생님: <code>teacher</code>
      </div>
    </div>
  </section>

  <!-- 게시판 화면 -->
  <section id="board">
    <div id="draftArea"></div>
    <div id="postList"></div>
  </section>

  <!-- 글쓰기 화면 -->
  <section id="write">
    <div class="card">
      <div class="field">
        <label for="inTitle">제목</label>
        <input id="inTitle" type="text" placeholder="어떤 점이 불편했나요?" maxlength="60">
      </div>
      <div class="field">
        <label for="inContent">내용</label>
        <textarea id="inContent" placeholder="상황과 바라는 점을 적어주세요."></textarea>
      </div>
      <div class="error" id="writeError"></div>
      <div class="btns">
        <button class="btn" id="btnDiscard">작성 취소</button>
        <button class="btn primary" id="btnPublish">게시하기</button>
      </div>
      <div class="notice">
        · 게시글은 익명으로 올라가며, 작성자는 표시되지 않습니다.<br>
        · 게시 후에는 수정할 수 없고, 삭제만 가능합니다.<br>
        · 작성 중인 글은 자동으로 저장되어, 나갔다 들어와도 이어서 쓸 수 있습니다. 게시 전까지는 나에게만 보입니다.
      </div>
    </div>
  </section>
</main>

<button class="fab" id="btnWrite" title="글 쓰기" aria-label="글 쓰기" style="display:none">+</button>

<script>
(function () {
  // ---------- 계정 (데모용 고정 계정) ----------
  const ACCOUNTS = {
    student1: { pw: '1234', name: '학생1', role: 'student' },
    student2: { pw: '1234', name: '학생2', role: 'student' },
    council:  { pw: '1234', name: '학생회', role: 'council' },
    teacher:  { pw: '1234', name: '선생님', role: 'teacher' },
  };
  const canJudge = (role) => role === 'teacher' || role === 'council';

  // ---------- 저장소 (localStorage = 공용 DB, sessionStorage = 로그인 세션) ----------
  const DB_KEY = 'dimigo_board_v1';
  const SESSION_KEY = 'dimigo_session';

  function loadDB() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { posts: [], likes: {}, drafts: {}, nextId: 1 };
  }
  function saveDB() {
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {}
  }
  let db = loadDB();
  // 다른 탭(다른 계정)에서 바뀐 내용을 즉시 반영
  window.addEventListener('storage', (e) => {
    if (e.key === DB_KEY) { db = loadDB(); if (currentUser && board.classList.contains('show')) renderBoard(); }
  });

  let currentUser = null; // { id, name, role }

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const login = $('login'), board = $('board'), write = $('write');
  const postList = $('postList'), draftArea = $('draftArea');
  const inId = $('inId'), inPw = $('inPw'), loginError = $('loginError');
  const inTitle = $('inTitle'), inContent = $('inContent'), writeError = $('writeError');
  const btnWrite = $('btnWrite'), btnBack = $('btnBack'), btnLogout = $('btnLogout');
  const headerTitle = $('headerTitle'), who = $('who');

  // ---------- 화면 전환 ----------
  function showOnly(sec) {
    [login, board, write].forEach(s => s.classList.toggle('show', s === sec));
  }

  function showLogin() {
    currentUser = null;
    sessionStorage.removeItem(SESSION_KEY);
    showOnly(login);
    btnWrite.style.display = 'none';
    btnBack.style.display = 'none';
    btnLogout.style.display = 'none';
    who.style.display = 'none';
    headerTitle.textContent = '디미고 민원 게시판';
    inPw.value = '';
    loginError.textContent = '';
    inId.focus();
  }

  function showBoard() {
    db = loadDB();
    showOnly(board);
    btnWrite.style.display = '';
    btnBack.style.display = 'none';
    btnLogout.style.display = '';
    who.style.display = '';
    who.innerHTML = `<b>${escapeHtml(currentUser.name)}</b>`;
    headerTitle.textContent = '디미고 민원 게시판';
    renderBoard();
  }

  function showWrite() {
    showOnly(write);
    btnWrite.style.display = 'none';
    btnBack.style.display = '';
    headerTitle.textContent = '글 쓰기';
    const d = db.drafts[currentUser.id];
    inTitle.value = d ? d.title : '';
    inContent.value = d ? d.content : '';
    writeError.textContent = '';
    inTitle.focus();
  }

  // ---------- 로그인 ----------
  function doLogin() {
    const id = inId.value.trim();
    const pw = inPw.value;
    const acc = ACCOUNTS[id];
    if (!acc || acc.pw !== pw) {
      loginError.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
      return;
    }
    currentUser = { id, name: acc.name, role: acc.role };
    sessionStorage.setItem(SESSION_KEY, id);
    showBoard();
  }

  // ---------- 글 작성 ----------
  // 입력할 때마다 자동 저장 → 나갔다 들어와도 이어서 작성 가능. 게시 전까지 나에게만 보임.
  function autoSaveDraft() {
    const title = inTitle.value, content = inContent.value;
    if (!title.trim() && !content.trim()) delete db.drafts[currentUser.id];
    else db.drafts[currentUser.id] = { title, content };
    saveDB();
  }

  function discardDraft() {
    if (inTitle.value.trim() || inContent.value.trim()) {
      if (!confirm('작성 중인 글을 지울까요?')) return;
    }
    delete db.drafts[currentUser.id];
    saveDB();
    inTitle.value = ''; inContent.value = '';
    showBoard();
  }

  function publish() {
    const title = inTitle.value.trim();
    const content = inContent.value.trim();
    if (!title || !content) {
      writeError.textContent = '제목과 내용을 모두 입력해야 게시할 수 있습니다.';
      return;
    }
    db.posts.unshift({
      id: db.nextId++,
      title, content,
      likes: 0,
      status: null,              // null | 'improve' | 'reject'
      createdAt: Date.now(),
      authorId: currentUser.id   // 삭제 권한 확인용. 화면에는 절대 표시하지 않음
    });
    delete db.drafts[currentUser.id];
    saveDB();
    inTitle.value = ''; inContent.value = '';
    showBoard();
  }

  // ---------- 공감 / 삭제 / 개선·기각 ----------
  function toggleLike(id) {
    const post = db.posts.find(p => p.id === id);
    if (!post) return;
    const mine = new Set(db.likes[currentUser.id] || []);
    if (mine.has(id)) { mine.delete(id); post.likes--; }
    else { mine.add(id); post.likes++; }
    db.likes[currentUser.id] = [...mine];
    saveDB();
    renderBoard();
  }

  function deletePost(id) {
    const post = db.posts.find(p => p.id === id);
    if (!post || post.authorId !== currentUser.id) return;
    if (!confirm('이 글을 삭제할까요? 삭제한 글은 되돌릴 수 없습니다.')) return;
    db.posts = db.posts.filter(p => p.id !== id);
    Object.keys(db.likes).forEach(u => { db.likes[u] = (db.likes[u] || []).filter(x => x !== id); });
    saveDB();
    renderBoard();
  }

  function setStatus(id, status) {
    if (!canJudge(currentUser.role)) return;
    const post = db.posts.find(p => p.id === id);
    if (!post) return;
    post.status = post.status === status ? null : status; // 같은 버튼 다시 누르면 해제
    saveDB();
    renderBoard();
  }

  // ---------- 렌더링 ----------
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  const STATUS_LABEL = { improve: '개선', reject: '기각' };

  function renderBoard() {
    // 작성 중인 글 (나에게만 보임)
    const draft = db.drafts[currentUser.id];
    if (draft) {
      const t = draft.title.trim() || '(제목 없음)';
      const c = draft.content.trim() || '(내용 없음)';
      draftArea.innerHTML = `
        <div class="section-title">작성 중 · 나에게만 보임</div>
        <div class="card draft-card" id="draftCard">
          <span class="badge draft">게시 전</span>
          <h2>${escapeHtml(t)}</h2>
          <p>${escapeHtml(c)}</p>
          <div class="meta"><span class="time">눌러서 이어서 작성</span></div>
        </div>`;
      $('draftCard').addEventListener('click', showWrite);
    } else {
      draftArea.innerHTML = '';
    }

    // 게시글 목록 (모든 계정에 공통)
    if (db.posts.length === 0) {
      postList.innerHTML = `<div class="empty">아직 올라온 민원이 없어요.<br>오른쪽 아래 + 버튼으로 첫 글을 남겨보세요.</div>`;
      return;
    }
    const myLikes = new Set(db.likes[currentUser.id] || []);
    const judge = canJudge(currentUser.role);
    postList.innerHTML = `<div class="section-title">전체 민원 ${db.posts.length}건</div>` +
      db.posts.map(p => `
        <article class="card" data-id="${p.id}">
          ${p.status ? `<span class="badge ${p.status}">${STATUS_LABEL[p.status]}</span>` : ''}
          <h2>${escapeHtml(p.title)}</h2>
          <p>${escapeHtml(p.content)}</p>
          <div class="meta">
            <span class="time">${formatTime(p.createdAt)}</span>
            <div class="actions">
              ${judge ? `
                <button class="btn-status improve ${p.status === 'improve' ? 'on' : ''}" data-act="improve">개선</button>
                <button class="btn-status reject ${p.status === 'reject' ? 'on' : ''}" data-act="reject">기각</button>` : ''}
              ${p.authorId === currentUser.id ? `<button class="btn-del" data-act="del">삭제</button>` : ''}
              <button class="btn-like ${myLikes.has(p.id) ? 'on' : ''}" data-act="like">
                ${myLikes.has(p.id) ? '❤️' : '🤍'} 공감 ${p.likes}
              </button>
            </div>
          </div>
        </article>`).join('');
  }

  // ---------- 이벤트 ----------
  $('btnLogin').addEventListener('click', doLogin);
  inPw.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  inId.addEventListener('keydown', (e) => { if (e.key === 'Enter') inPw.focus(); });
  btnLogout.addEventListener('click', showLogin);

  btnWrite.addEventListener('click', showWrite);
  btnBack.addEventListener('click', () => { autoSaveDraft(); showBoard(); });
  inTitle.addEventListener('input', autoSaveDraft);
  inContent.addEventListener('input', autoSaveDraft);
  $('btnDiscard').addEventListener('click', discardDraft);
  $('btnPublish').addEventListener('click', publish);

  postList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = Number(btn.closest('article').dataset.id);
    const act = btn.dataset.act;
    if (act === 'like') toggleLike(id);
    else if (act === 'del') deletePost(id);
    else if (act === 'improve' || act === 'reject') setStatus(id, act);
  });

  // ---------- 초기 화면 ----------
  const savedId = sessionStorage.getItem(SESSION_KEY);
  if (savedId && ACCOUNTS[savedId]) {
    currentUser = { id: savedId, name: ACCOUNTS[savedId].name, role: ACCOUNTS[savedId].role };
    showBoard();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
