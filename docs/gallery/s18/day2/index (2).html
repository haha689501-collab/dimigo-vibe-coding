<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>익명 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EAEE;
  --sheet:#FFFFFF;
  --sheet-2:#F4F6F8;
  --ink:#16202C;
  --ink-soft:#5D6C7C;
  --line:#D3D9E0;
  --line-soft:#E4E8ED;
  --mark:#D9F25E;
  --up:#1D7A4C;
  --down:#B23C3C;
  --focus:#2F6BFF;
  --shadow:0 1px 0 rgba(22,32,44,.06);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Nanum Myeongjo","Apple SD Gothic Neo",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141A;
    --sheet:#19202A;
    --sheet-2:#222B37;
    --ink:#E6EBF0;
    --ink-soft:#93A2B2;
    --line:#2B3542;
    --line-soft:#232C37;
    --mark:#9FC13A;
    --up:#5BC98C;
    --down:#E2807B;
    --focus:#7AA2FF;
    --shadow:0 1px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0F141A;
  --sheet:#19202A;
  --sheet-2:#222B37;
  --ink:#E6EBF0;
  --ink-soft:#93A2B2;
  --line:#2B3542;
  --line-soft:#232C37;
  --mark:#9FC13A;
  --up:#5BC98C;
  --down:#E2807B;
  --focus:#7AA2FF;
  --shadow:0 1px 0 rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
mark{
  background:linear-gradient(transparent 58%, var(--mark) 58%);
  color:inherit;
  border-radius:1px;
  padding:0 .06em;
}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  background:var(--sheet);
  position:sticky;top:0;z-index:20;
}
.wordmark{display:flex;align-items:baseline;gap:10px;min-width:0}
.wordmark h1{
  font-family:var(--serif);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;
  margin:0;white-space:nowrap;
}
.wordmark p{margin:0;font-size:.8rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.wordmark p{display:none}}

.btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--sheet);
  padding:9px 16px;
  border-radius:999px;
  font-weight:600;font-size:.9rem;
  cursor:pointer;
  white-space:nowrap;
}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-quiet{
  background:transparent;color:var(--ink);border:1px solid var(--line);
}
.btn-quiet:hover{background:var(--sheet-2);opacity:1}
.btn-text{
  background:none;border:none;padding:4px 6px;color:var(--ink-soft);
  font-size:.82rem;cursor:pointer;border-radius:6px;
}
.btn-text:hover{color:var(--ink);background:var(--sheet-2)}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;min-height:calc(100dvh - 60px)}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:minmax(320px,400px) 1fr;align-items:start}
  .list-pane{border-right:1px solid var(--line);min-height:calc(100dvh - 60px)}
}
@media (max-width:899px){
  .shell[data-view="detail"] .list-pane{display:none}
  .shell[data-view="list"] .detail-pane{display:none}
}

/* ---------- search + list ---------- */
.list-pane{padding:20px 16px 40px;min-width:0}
.search{margin:0 0 6px}
.search-row{display:flex;gap:8px}
.search-field{
  position:relative;flex:1;min-width:0;
}
.search-field input{
  width:100%;
  background:var(--sheet);
  border:1px solid var(--line);
  border-bottom-width:3px;
  border-radius:10px;
  padding:13px 38px 13px 14px;
  font-size:1rem;
}
.search-field input::placeholder{color:var(--ink-soft)}
.search-clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  border:none;background:none;color:var(--ink-soft);cursor:pointer;
  font-size:1.1rem;line-height:1;padding:6px;border-radius:50%;
}
.search-clear:hover{color:var(--ink)}
.list-meta{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:.82rem;color:var(--ink-soft);
  padding:10px 2px 8px;border-bottom:1px solid var(--line);
}
.post-list{list-style:none;margin:0;padding:0}
.post-item{border-bottom:1px solid var(--line-soft)}
.post-btn{
  display:block;width:100%;text-align:left;
  background:none;border:none;cursor:pointer;
  padding:14px 10px;border-radius:8px;
}
.post-btn:hover{background:var(--sheet-2)}
.post-item[aria-current="true"] .post-btn{background:var(--sheet);box-shadow:var(--shadow)}
.post-item[aria-current="true"] .post-title{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:4px;text-underline-offset:3px}
.post-title{
  font-family:var(--serif);font-weight:700;font-size:1.12rem;line-height:1.35;
  margin:0 0 5px;word-break:break-word;
}
.post-snippet{
  margin:0 0 7px;font-size:.88rem;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.post-foot{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--ink-soft)}
.empty{
  padding:40px 16px;text-align:center;color:var(--ink-soft);font-size:.92rem;
}
.empty strong{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--ink);margin-bottom:6px}

/* ---------- detail ---------- */
.detail-pane{padding:20px 20px 60px;min-width:0}
@media (min-width:900px){.detail-pane{padding:28px 32px 80px}}
.back{margin-bottom:10px}
@media (min-width:900px){.back{display:none}}
.sheet{
  background:var(--sheet);
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px 20px;
  box-shadow:var(--shadow);
}
@media (min-width:900px){.sheet{padding:30px 32px}}
.detail-title{
  font-family:var(--serif);font-weight:800;
  font-size:clamp(1.4rem,1.1rem + 1.4vw,2rem);
  line-height:1.3;margin:0 0 14px;word-break:break-word;
}
.byline{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:16px;
  border-bottom:1px solid var(--line-soft);
  font-size:.9rem;
}
.who{font-weight:600}
.when{color:var(--ink-soft);font-size:.82rem}
.detail-body{
  margin:0;white-space:pre-wrap;word-break:break-word;
  font-size:1rem;line-height:1.75;max-width:68ch;
}
.attach{
  margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--sheet-2);
}
.attach img{display:block;max-width:100%;height:auto;border-radius:6px}
.attach a{color:var(--ink);font-size:.88rem;word-break:break-all}
.attach .attach-meta{font-size:.76rem;color:var(--ink-soft);margin-top:6px}
.actions{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);
}
.react{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--sheet);
  border-radius:999px;padding:7px 14px;font-size:.86rem;font-weight:500;cursor:pointer;
}
.react:hover{background:var(--sheet-2)}
.react[aria-pressed="true"]{border-color:currentColor;font-weight:600}
.react.up[aria-pressed="true"]{color:var(--up)}
.react.down[aria-pressed="true"]{color:var(--down)}
.spacer{flex:1}
.flag{font-size:.76rem;color:var(--down);align-self:center}

/* ---------- comments ---------- */
.comment-form{margin-top:22px}
.comment-form label{display:block;font-size:.86rem;font-weight:600;margin-bottom:8px}
.comment-row{display:flex;gap:8px;align-items:flex-start}
.comment-row textarea{
  flex:1;min-width:0;resize:vertical;min-height:52px;
  background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 13px;
  font-size:.95rem;line-height:1.5;
}
.comment-count{
  font-size:.86rem;font-weight:600;margin:26px 0 10px;
  padding-bottom:8px;border-bottom:1px solid var(--line);
}
.comments{list-style:none;margin:0;padding:0}
.comment{padding:14px 2px;border-bottom:1px solid var(--line-soft)}
.comment .who{font-size:.86rem}
.comment p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:.95rem;max-width:64ch}
.placeholder{
  border:1px dashed var(--line);border-radius:14px;padding:50px 24px;text-align:center;color:var(--ink-soft);
}
.placeholder strong{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--ink);margin-bottom:8px}

/* ---------- composer dialog ---------- */
dialog{
  border:1px solid var(--line);border-radius:16px;padding:0;
  background:var(--sheet);color:var(--ink);
  width:min(560px,calc(100vw - 32px));
  box-shadow:0 20px 60px rgba(10,15,22,.28);
}
dialog::backdrop{background:rgba(12,18,26,.5)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.dialog-head h2{font-family:var(--serif);font-size:1.2rem;margin:0}
.dialog-body{padding:16px 20px 20px;display:grid;gap:14px}
.field label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.field input[type="text"],.field textarea{
  width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;font-size:.98rem;
}
.field textarea{min-height:140px;resize:vertical;line-height:1.6}
.hint{font-size:.76rem;color:var(--ink-soft);margin-top:6px}
.error{font-size:.82rem;color:var(--down);margin-top:6px;min-height:1.2em}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px}
input[type="file"]{font-size:.85rem;max-width:100%}

/* ---------- toast / banner ---------- */
.banner{
  background:var(--sheet-2);border-bottom:1px solid var(--line);
  padding:10px 20px;font-size:.85rem;color:var(--ink-soft);text-align:center;
}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  padding:11px 18px;border-radius:999px;font-size:.87rem;font-weight:500;
  z-index:60;max-width:calc(100vw - 32px);text-align:center;
}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wordmark">
    <h1>익명 게시판</h1>
    <p>이름 없이 묻고, 이름 없이 답하는 곳</p>
  </div>
  <button class="btn" id="newPostBtn" type="button">새 글 쓰기</button>
</header>

<div id="banner" hidden class="banner"></div>

<main class="shell" id="shell" data-view="list">
  <section class="list-pane" aria-label="글 목록">
    <form class="search" id="searchForm" role="search">
      <label class="visually-hidden" for="searchInput">글 검색</label>
      <div class="search-row">
        <div class="search-field">
          <input id="searchInput" type="search" autocomplete="off" placeholder="제목과 내용에서 검색">
          <button class="search-clear" id="searchClear" type="button" hidden aria-label="검색어 지우기">×</button>
        </div>
        <button class="btn" type="submit">검색하기</button>
      </div>
    </form>
    <div class="list-meta">
      <span id="listCount">불러오는 중</span>
      <span id="listSort">최신순</span>
    </div>
    <ul class="post-list" id="postList"></ul>
    <div class="empty" id="listEmpty" hidden></div>
  </section>

  <section class="detail-pane" aria-label="글 읽기" aria-live="polite">
    <button class="btn-quiet btn back" id="backBtn" type="button">← 목록</button>
    <div id="detail"></div>
  </section>
</main>

<dialog id="composer" aria-labelledby="composerTitle">
  <div class="dialog-head">
    <h2 id="composerTitle">새 글 쓰기</h2>
    <button class="btn-text" id="composerClose" type="button">닫기</button>
  </div>
  <div class="dialog-body">
    <div class="field">
      <label for="postTitle">제목</label>
      <input id="postTitle" type="text" maxlength="120" autocomplete="off" placeholder="무엇에 대한 글인가요?">
      <div class="error" id="titleError"></div>
    </div>
    <div class="field">
      <label for="postBody">내용</label>
      <textarea id="postBody" maxlength="8000" placeholder="함께 이야기하고 싶은 내용을 적어 주세요."></textarea>
    </div>
    <div class="field" id="fileField">
      <label for="postFile">파일 첨부</label>
      <input id="postFile" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml,application/pdf">
      <p class="hint">이미지(PNG·JPG·GIF·WebP·SVG) 또는 PDF 1개, 2MB까지. 파일은 이 브라우저에 함께 저장됩니다.</p>
      <div class="error" id="fileError"></div>
    </div>
  </div>
  <div class="dialog-foot">
    <button class="btn btn-quiet" id="composerCancel" type="button">취소</button>
    <button class="btn" id="composerSubmit" type="button">글 올리기</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var MAX_FILE = 2 * 1024 * 1024;
  var OK_TYPES = ["image/png","image/jpeg","image/gif","image/webp","image/svg+xml","application/pdf"];
  var STORE_KEY = "anonboard.store.v1";
  var VIEWER_KEY = "anonboard.viewer.v1";

  var state = {
    posts: [], loaded: false,
    query: "", selectedId: null,
    comments: []
  };

  var el = {
    shell: document.getElementById("shell"),
    banner: document.getElementById("banner"),
    list: document.getElementById("postList"),
    listEmpty: document.getElementById("listEmpty"),
    listCount: document.getElementById("listCount"),
    detail: document.getElementById("detail"),
    search: document.getElementById("searchInput"),
    searchForm: document.getElementById("searchForm"),
    searchClear: document.getElementById("searchClear"),
    backBtn: document.getElementById("backBtn"),
    newPostBtn: document.getElementById("newPostBtn"),
    composer: document.getElementById("composer"),
    title: document.getElementById("postTitle"),
    body: document.getElementById("postBody"),
    file: document.getElementById("postFile"),
    fileField: document.getElementById("fileField"),
    titleError: document.getElementById("titleError"),
    fileError: document.getElementById("fileError"),
    submit: document.getElementById("composerSubmit")
  };

  /* ---------- storage ---------- */

  var memoryOnly = false;

  var viewerId = (function () {
    try {
      var v = localStorage.getItem(VIEWER_KEY);
      if (!v) {
        v = "v" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem(VIEWER_KEY, v);
      }
      return v;
    } catch (e) {
      memoryOnly = true;
      return "v" + Math.random().toString(36).slice(2, 10);
    }
  })();

  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.posts)) return [];
      return parsed.posts;
    } catch (e) {
      return [];
    }
  }

  function saveStore() {
    if (memoryOnly) return true;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ posts: state.posts }));
      return true;
    } catch (e) {
      toast("저장 공간이 가득 찼습니다. 첨부가 있는 오래된 글을 지워 주세요.");
      return false;
    }
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ---------- helpers ---------- */

  function node(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function marked(text, q) {
    var frag = document.createDocumentFragment();
    text = text || "";
    if (!q) { frag.appendChild(document.createTextNode(text)); return frag; }
    var hay = text.toLowerCase(), needle = q.toLowerCase(), i = 0;
    while (true) {
      var idx = hay.indexOf(needle, i);
      if (idx < 0) { frag.appendChild(document.createTextNode(text.slice(i))); break; }
      if (idx > i) frag.appendChild(document.createTextNode(text.slice(i, idx)));
      var m = document.createElement("mark");
      m.textContent = text.slice(idx, idx + needle.length);
      frag.appendChild(m);
      i = idx + needle.length;
    }
    return frag;
  }

  function when(ms) {
    if (!ms) return "";
    var diff = Date.now() - ms;
    if (diff < 60000) return "방금";
    if (diff < 3600000) return Math.floor(diff / 60000) + "분 전";
    if (diff < 86400000) return Math.floor(diff / 3600000) + "시간 전";
    var d = new Date(ms);
    var y = new Date().getFullYear() === d.getFullYear();
    return (y ? "" : d.getFullYear() + "년 ") + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  }

  function fileSize(bytes) {
    if (!bytes && bytes !== 0) return "";
    if (bytes < 1024) return bytes + "B";
    if (bytes < 1048576) return Math.round(bytes / 1024) + "KB";
    return (bytes / 1048576).toFixed(1) + "MB";
  }

  function countVotes(post, kind) {
    var v = post.votes || {}, n = 0;
    for (var k in v) if (v[k] === kind) n++;
    return n;
  }
  function myVote(post) { return (post.votes || {})[viewerId] || "none"; }
  function reportCount(post) {
    var r = post.reports || {}, n = 0;
    for (var k in r) if (r[k]) n++;
    return n;
  }
  function findPost(id) {
    for (var i = 0; i < state.posts.length; i++) if (state.posts[i].id === id) return state.posts[i];
    return null;
  }

  var toastTimer = null;
  function toast(msg) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var t = node("div", "toast", msg);
    t.setAttribute("role", "status");
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 3000);
  }

  function banner(msg) {
    if (!msg) { el.banner.hidden = true; return; }
    el.banner.textContent = msg;
    el.banner.hidden = false;
  }

  /* ---------- filtering ---------- */

  function visiblePosts() {
    var q = state.query.trim().toLowerCase();
    var rows = state.posts.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    if (!q) return rows;
    return rows.filter(function (p) {
      return (p.title || "").toLowerCase().indexOf(q) >= 0 ||
             (p.body || "").toLowerCase().indexOf(q) >= 0;
    });
  }

  function snippetFor(post, q) {
    var body = post.body || "";
    if (!q) return body.slice(0, 120);
    var idx = body.toLowerCase().indexOf(q.toLowerCase());
    if (idx < 0) return body.slice(0, 120);
    var start = Math.max(0, idx - 30);
    return (start > 0 ? "…" : "") + body.slice(start, start + 130);
  }

  /* ---------- render: list ---------- */

  function renderList() {
    var q = state.query.trim();
    var rows = visiblePosts();
    el.list.textContent = "";

    el.listCount.textContent = q
      ? rows.length + "개 찾음 · 전체 " + state.posts.length + "개"
      : "글 " + state.posts.length + "개";

    if (!rows.length) {
      el.listEmpty.hidden = false;
      el.listEmpty.textContent = "";
      if (q) {
        el.listEmpty.appendChild(node("strong", null, "찾는 글이 없어요"));
        el.listEmpty.appendChild(node("div", null, "다른 낱말로 검색하거나, 직접 글을 올려 보세요."));
      } else {
        el.listEmpty.appendChild(node("strong", null, "아직 글이 없어요"));
        el.listEmpty.appendChild(node("div", null, "첫 글을 올리면 여기에 쌓입니다."));
      }
      return;
    }
    el.listEmpty.hidden = true;

    rows.forEach(function (post) {
      var li = node("li", "post-item");
      if (post.id === state.selectedId) li.setAttribute("aria-current", "true");

      var btn = node("button", "post-btn");
      btn.type = "button";

      var h = node("h3", "post-title");
      h.appendChild(marked(post.title || "(제목 없음)", q));
      btn.appendChild(h);

      var snip = snippetFor(post, q);
      if (snip) {
        var p = node("p", "post-snippet");
        p.appendChild(marked(snip, q));
        btn.appendChild(p);
      }

      var foot = node("div", "post-foot");
      foot.appendChild(node("span", null, "익명"));
      foot.appendChild(node("span", null, when(post.createdAt)));
      foot.appendChild(node("span", null, "댓글 " + ((post.comments || []).length)));
      var ups = countVotes(post, "up");
      if (ups) foot.appendChild(node("span", null, "좋아요 " + ups));
      if (post.file) foot.appendChild(node("span", null, "첨부"));
      btn.appendChild(foot);

      btn.addEventListener("click", function () { selectPost(post.id); });
      li.appendChild(btn);
      el.list.appendChild(li);
    });
  }

  /* ---------- render: detail ---------- */

  function renderDetail() {
    var post = findPost(state.selectedId);
    var prev = document.getElementById("commentInput");
    var draft = prev ? prev.value : "";
    var draftFocused = prev ? document.activeElement === prev : false;
    var caret = prev ? prev.selectionStart : 0;
    el.detail.textContent = "";

    if (!post) {
      var ph = node("div", "placeholder");
      ph.appendChild(node("strong", null, state.selectedId ? "글을 찾을 수 없어요" : "왼쪽에서 글을 고르세요"));
      ph.appendChild(node("div", null, state.selectedId
        ? "삭제된 글입니다."
        : "제목을 누르면 글과 댓글이 여기에 열립니다."));
      el.detail.appendChild(ph);
      return;
    }

    var q = state.query.trim();
    var comments = post.comments || [];
    var sheet = node("article", "sheet");

    var h = node("h2", "detail-title");
    h.appendChild(marked(post.title || "(제목 없음)", q));
    sheet.appendChild(h);

    var by = node("div", "byline");
    by.appendChild(node("span", "who", "익명:"));
    by.appendChild(node("span", "when", when(post.createdAt)));
    sheet.appendChild(by);

    var body = node("p", "detail-body");
    body.appendChild(marked(post.body || "", q));
    sheet.appendChild(body);

    if (post.file && post.file.dataUrl) {
      var box = node("div", "attach");
      if ((post.file.type || "").indexOf("image/") === 0) {
        var img = document.createElement("img");
        img.src = post.file.dataUrl;
        img.alt = post.file.name || "첨부 이미지";
        box.appendChild(img);
      }
      var a = document.createElement("a");
      a.href = post.file.dataUrl;
      a.download = post.file.name || "attachment";
      a.textContent = post.file.name || "첨부 파일";
      box.appendChild(a);
      box.appendChild(node("div", "attach-meta", fileSize(post.file.size)));
      sheet.appendChild(box);
    }

    var actions = node("div", "actions");
    var mine = myVote(post);

    var up = node("button", "react up");
    up.type = "button";
    up.setAttribute("aria-pressed", mine === "up" ? "true" : "false");
    up.appendChild(node("span", null, "좋아요"));
    up.appendChild(node("strong", null, String(countVotes(post, "up"))));
    up.addEventListener("click", function () { vote(post, "up"); });

    var down = node("button", "react down");
    down.type = "button";
    down.setAttribute("aria-pressed", mine === "down" ? "true" : "false");
    down.appendChild(node("span", null, "싫어요"));
    down.appendChild(node("strong", null, String(countVotes(post, "down"))));
    down.addEventListener("click", function () { vote(post, "down"); });

    actions.appendChild(up);
    actions.appendChild(down);

    var rc = reportCount(post);
    if (rc) actions.appendChild(node("span", "flag", "신고 " + rc + "건"));

    actions.appendChild(node("div", "spacer"));

    var reported = !!(post.reports || {})[viewerId];
    var rep = node("button", "btn-text", reported ? "신고 취소" : "신고");
    rep.type = "button";
    rep.addEventListener("click", function () { report(post, !reported); });
    actions.appendChild(rep);

    if (post.ownerId === viewerId) {
      var del = node("button", "btn-text", "삭제");
      del.type = "button";
      del.addEventListener("click", function () { removePost(post); });
      actions.appendChild(del);
    }
    sheet.appendChild(actions);

    var form = node("div", "comment-form");
    var lab = node("label", null, "익명: 댓글 남기기");
    lab.setAttribute("for", "commentInput");
    form.appendChild(lab);
    var row = node("div", "comment-row");
    var ta = document.createElement("textarea");
    ta.id = "commentInput";
    ta.placeholder = "생각을 이어서 적어 주세요.";
    ta.maxLength = 2000;
    var send = node("button", "btn", "등록");
    send.type = "button";
    send.addEventListener("click", function () { addComment(post, ta); });
    ta.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); addComment(post, ta); }
    });
    row.appendChild(ta);
    row.appendChild(send);
    form.appendChild(row);
    sheet.appendChild(form);

    sheet.appendChild(node("h3", "comment-count", "댓글 " + comments.length));

    if (!comments.length) {
      sheet.appendChild(node("p", "post-snippet", "아직 댓글이 없어요. 첫 댓글을 남겨 보세요."));
    } else {
      var ul = node("ul", "comments");
      comments.forEach(function (c) {
        var li = node("li", "comment");
        var head = node("div");
        head.appendChild(node("span", "who", "익명:"));
        head.appendChild(document.createTextNode(" "));
        head.appendChild(node("span", "when", when(c.createdAt)));
        li.appendChild(head);
        li.appendChild(node("p", null, c.body || ""));
        ul.appendChild(li);
      });
      sheet.appendChild(ul);
    }

    el.detail.appendChild(sheet);

    if (draft) {
      ta.value = draft;
      if (draftFocused) {
        ta.focus();
        try { ta.setSelectionRange(caret, caret); } catch (e) {}
      }
    }
  }

  function render() { renderList(); renderDetail(); }

  /* ---------- actions ---------- */

  function selectPost(id) {
    state.selectedId = id;
    el.shell.setAttribute("data-view", "detail");
    render();
    if (window.innerWidth < 900) window.scrollTo(0, 0);
  }

  function vote(post, kind) {
    if (!post.votes) post.votes = {};
    post.votes[viewerId] = myVote(post) === kind ? "none" : kind;
    saveStore();
    render();
  }

  function report(post, on) {
    if (on && !window.confirm("이 글을 신고할까요?")) return;
    if (!post.reports) post.reports = {};
    post.reports[viewerId] = !!on;
    saveStore();
    toast(on ? "신고했습니다." : "신고를 취소했습니다.");
    render();
  }

  function addComment(post, ta) {
    var text = ta.value.trim();
    if (!text) { ta.focus(); toast("댓글 내용을 입력해 주세요."); return; }
    if (!post.comments) post.comments = [];
    post.comments.push({ id: newId(), body: text, createdAt: Date.now() });
    ta.value = "";
    saveStore();
    render();
    var live = document.getElementById("commentInput");
    if (live) live.focus();
  }

  function removePost(post) {
    if (!window.confirm("이 글과 댓글을 모두 지울까요? 되돌릴 수 없습니다.")) return;
    state.posts = state.posts.filter(function (p) { return p.id !== post.id; });
    state.selectedId = null;
    el.shell.setAttribute("data-view", "list");
    saveStore();
    toast("글을 지웠습니다.");
    render();
  }

  /* ---------- composer ---------- */

  function openComposer() {
    el.titleError.textContent = "";
    el.fileError.textContent = "";
    if (typeof el.composer.showModal === "function") el.composer.showModal();
    else el.composer.setAttribute("open", "");
    setTimeout(function () { el.title.focus(); }, 30);
  }
  function closeComposer() {
    if (typeof el.composer.close === "function") el.composer.close();
    else el.composer.removeAttribute("open");
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error("read")); };
      r.readAsDataURL(file);
    });
  }

  function submitPost() {
    var title = el.title.value.trim();
    var body = el.body.value.trim();
    el.titleError.textContent = "";
    el.fileError.textContent = "";

    if (!title) {
      el.titleError.textContent = "제목을 입력해야 글을 올릴 수 있어요.";
      el.title.focus();
      return;
    }

    var file = el.file && el.file.files && el.file.files[0];
    if (file) {
      if (file.size > MAX_FILE) {
        el.fileError.textContent = "파일은 2MB까지 올릴 수 있어요. (" + fileSize(file.size) + ")";
        return;
      }
      if (OK_TYPES.indexOf(file.type) < 0) {
        el.fileError.textContent = "이미지나 PDF 파일만 올릴 수 있어요.";
        return;
      }
    }

    el.submit.disabled = true;
    el.submit.textContent = "올리는 중";

    var reading = file
      ? readFile(file).then(function (dataUrl) {
          return { name: file.name, type: file.type, size: file.size, dataUrl: dataUrl };
        })
      : Promise.resolve(null);

    reading.then(function (fileMeta) {
      var post = {
        id: newId(),
        title: title,
        body: body,
        createdAt: Date.now(),
        ownerId: viewerId,
        votes: {},
        reports: {},
        comments: [],
        file: fileMeta
      };
      state.posts.push(post);
      if (!saveStore()) {
        state.posts.pop();
        el.fileError.textContent = "저장 공간이 부족해 글을 올리지 못했습니다.";
        return;
      }
      el.title.value = "";
      el.body.value = "";
      if (el.file) el.file.value = "";
      closeComposer();
      toast("글을 올렸습니다.");
      selectPost(post.id);
    }).catch(function () {
      el.fileError.textContent = "파일을 읽지 못했습니다. 다시 시도해 주세요.";
    }).then(function () {
      el.submit.disabled = false;
      el.submit.textContent = "글 올리기";
    });
  }

  /* ---------- events ---------- */

  el.newPostBtn.addEventListener("click", openComposer);
  document.getElementById("composerClose").addEventListener("click", closeComposer);
  document.getElementById("composerCancel").addEventListener("click", closeComposer);
  el.submit.addEventListener("click", submitPost);
  el.title.addEventListener("input", function () { el.titleError.textContent = ""; });

  el.searchForm.addEventListener("submit", function (e) { e.preventDefault(); });
  el.search.addEventListener("input", function () {
    state.query = el.search.value;
    el.searchClear.hidden = !el.search.value;
    render();
  });
  el.searchClear.addEventListener("click", function () {
    el.search.value = "";
    state.query = "";
    el.searchClear.hidden = true;
    el.search.focus();
    render();
  });
  el.backBtn.addEventListener("click", function () {
    el.shell.setAttribute("data-view", "list");
    window.scrollTo(0, 0);
  });

  /* ---------- boot ---------- */

  state.posts = loadStore();
  state.loaded = true;
  banner(memoryOnly
    ? "이 브라우저에서는 저장이 막혀 있어 새로고침하면 글이 사라집니다."
    : "글과 댓글은 이 브라우저에만 저장됩니다.");
  render();
})();
</script>
</body>
</html>
