<title>레시피 필름</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: search on top, a 16:9 cooking film as the hero, the recipe sheet (ingredients + clickable steps) beside it on wide screens and below it on phones. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --ink:#1b2622; --muted:#5b6a63; --line:#d3ddd7;
  --accent:#e08a26; --accent-ink:#1d1206; --green:#2f5d50; --green-soft:#dfeae4; --danger:#b3412b;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#19231f; --ink:#e6eee9; --muted:#9aaba3; --line:#2b3a34;
  --accent:#f0a447; --accent-ink:#1d1206; --green:#83c6ae; --green-soft:#1f3029; --danger:#f0806a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#19231f; --ink:#e6eee9; --muted:#9aaba3; --line:#2b3a34;
  --accent:#f0a447; --accent-ink:#1d1206; --green:#83c6ae; --green-soft:#1f3029; --danger:#f0806a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(30px,5vw,40px);line-height:1.1;color:var(--green);letter-spacing:.01em}
.logo b{color:var(--accent);font-weight:400}
.tag{color:var(--muted);font-size:15px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 240px;min-width:0;font:inherit;font-size:17px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,a:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--green)}
.chip small{color:var(--muted);margin-left:4px}
.status{margin:0;min-height:1.6em;color:var(--muted);font-size:14px}
.status.err{color:var(--danger)}
.status.busy::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.status.busy::after{animation:none;content:"..."}}

.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:980px){.stage{grid-template-columns:minmax(0,1fr) 360px}}
.player{display:flex;flex-direction:column;gap:10px;min-width:0}
.screen{position:relative;border-radius:14px;overflow:hidden;background:#1d2c27;aspect-ratio:16/9;max-width:100%;box-shadow:0 10px 30px rgba(20,40,30,.18)}
.screen canvas{display:block;width:100%;height:100%;cursor:pointer}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;background:rgba(240,164,71,.95);color:#1d1206;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.bigplay svg{width:30px;height:30px;margin-left:5px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl{font:inherit;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ctl:hover{border-color:var(--green)}
.ctl:disabled{opacity:.5;cursor:default}
.ctl svg{width:16px;height:16px}
.ctl[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
#play{width:40px;justify-content:center;padding:8px 0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:92px}
#seek{flex:1 1 160px;min-width:120px;accent-color:var(--accent)}
.note{margin:0;color:var(--muted);font-size:13px;min-height:1.4em}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.badge{align-self:flex-start;font-size:12px;letter-spacing:.06em;color:var(--green);background:var(--green-soft);border-radius:6px;padding:2px 8px}
.sheet h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
.sheet .sum{margin:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.facts div{background:var(--bg);border-radius:10px;padding:8px 10px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:700;font-size:15px}
.sheet h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:6px 0 0;font-weight:700}
.ings{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.ings li{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ings .sw{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ings .nm{flex:1;min-width:0}
.ings .am{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.steps button:hover{background:var(--bg)}
.steps button:focus-visible{outline:3px solid var(--green);outline-offset:1px}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.steps .t{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.steps .t small{font-weight:500;color:var(--muted);font-size:12px}
.steps .x{color:var(--muted);font-size:14px;line-height:1.5}
.steps li.on button{background:var(--green-soft);border-color:var(--green)}
.steps li.on .n{background:var(--accent);color:var(--accent-ink)}
.yt{color:var(--green);font-weight:500;text-decoration:none;font-size:14px}
.yt:hover{text-decoration:underline}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo">레시피 <b>필름</b></span>
      <span class="tag">음식 이름을 넣으면 만드는 과정을 한 편의 영상으로 보여드려요</span>
    </div>
    <form id="search" class="search" autocomplete="off">
      <label for="q" class="sr">음식 이름</label>
      <input id="q" name="q" type="search" placeholder="예: 된장찌개, 까르보나라, 팬케이크" maxlength="40">
      <button id="go" class="btn" type="submit">영상 만들기</button>
    </form>
    <div class="chips" id="chips"></div>
    <p class="status" id="status" role="status"></p>
  </header>

  <main class="stage">
    <section class="player" aria-label="요리 영상">
      <div class="screen">
        <canvas id="cv" width="1280" height="720" role="img" aria-label="요리 과정 영상"></canvas>
        <button id="bigplay" class="bigplay" aria-label="영상 재생"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></button>
      </div>
      <div class="controls">
        <button id="play" class="ctl" aria-label="재생"></button>
        <span id="time" class="time">0:00 / 0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
        <button id="voice" class="ctl" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>음성 해설
        </button>
        <button id="save" class="ctl" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11m-5-5l5 5 5-5M5 20h14"/></svg><span>영상 저장</span>
        </button>
      </div>
      <p class="note" id="note"></p>
    </section>

    <aside class="sheet" aria-label="레시피">
      <span class="badge" id="r-badge" hidden>예시 레시피</span>
      <h1 id="r-title"></h1>
      <p class="sum" id="r-sum"></p>
      <dl class="facts">
        <div><dt>총 시간</dt><dd id="f-time">-</dd></div>
        <div><dt>분량</dt><dd id="f-serv">-</dd></div>
        <div><dt>난이도</dt><dd id="f-diff">-</dd></div>
      </dl>
      <h2>재료</h2>
      <ul class="ings" id="ings"></ul>
      <h2>순서 <span style="font-weight:400;letter-spacing:0">· 누르면 그 장면으로 이동해요</span></h2>
      <ol class="steps" id="steps"></ol>
      <a id="yt" class="yt" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">유튜브에서 실제 요리 영상 찾아보기 ↗</a>
    </aside>
  </main>
</div>

<script>
(() => {

    steps:[

  "계란볶음밥": {

    ingredients:[
      {name:"밥",amount:"1공기(200g)",shape:"grain",color:"#f6f3ea"},

      {name:"소금",amount:"약간",shape:"powder",color:"#f4f4f0"},

    ],
    steps:[
      {title:"파 썰기",text:"대파를 0.5cm 두께로 송송 썰어 준비해요.",action:"chop",time:"2분",items:["대파"]},
      {title:"파기름 내기",text:"팬에 식용유 2큰술을 두르고 약불에서 대파를 1분간 볶아 향을 내요.",action:"fry",time:"2분",items:["식용유","대파"],color:"#e2c25d"},
      {title:"달걀 스크램블",text:"파를 한쪽으로 밀고 달걀을 깨 넣어 반쯤 익을 때까지 저어요.",action:"fry",time:"1분",items:["달걀"],color:"#f2d27a"},
      {title:"밥 볶기",text:"밥을 넣고 센불에서 달걀과 섞으며 2분간 고슬하게 볶아요.",action:"fry",time:"2분",items:["밥","달걀","대파"],color:"#efd9a0"},

};
const CHIPS = [["김치찌개",true],["계란볶음밥",true],["된장찌개"],["까르보나라"],["팬케이크"],["마라탕"]];

// ---------- DOM
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const W = 1280, H = 720;
const F_DISP = '"Black Han Sans","Noto Sans KR",sans-serif';
const F_BODY = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const ACC = "#f0a447";
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';

// ---------- capabilities (absent outside a Claude viewer)
const use = name => (window.claude && typeof window.claude.use === "function")
  ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
const sampleP = use("sample"), ttsP = use("tts"), dlP = use("downloads");
let sampleBlocked = false, tts = null, dl = null;

// ---------- state
let recipe = null, scenes = [], total = 0, t = 0, playing = false, last = 0, curScene = -1;
let loading = false, loadingQ = "", ctl = null, voiceOn = false;
let exporting = null; // {rec, chunks, endAt, cancelled}

// ---------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const validHex = c => typeof c === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c.trim()) ? c.trim() : null;
function hashColor(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return hsl2hex(h % 360, 55, 62); }
function hsl2hex(h, s, l) { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, "0");
  return "#" + f(0) + f(8) + f(4); }
function shade(hex, amt) {
  let h = hex.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const tgt = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (tgt - r) * p); g = Math.round(g + (tgt - g) * p); b = Math.round(b + (tgt - b) * p);
  return `rgb(${r},${g},${b})`;
}
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  const words = text.split(/\s+/).filter(Boolean), lines = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width <= maxW) { line = test; continue; }
    if (line) lines.push(line);
    if (ctx.measureText(w).width <= maxW) line = w;
    else { line = ""; for (const ch of w) { if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; } else line += ch; } }
  }
  if (line) lines.push(line);
  return lines;
}
function fitFont(text, family, weight, size, maxW, min = 20) {
  let s = size; do { ctx.font = `${weight} ${s}px ${family}`; if (ctx.measureText(text).width <= maxW) break; s -= 4; } while (s > min);
  return s;
}

  "difficulty": "쉬움 | 보통 | 어려움 중 하나",
  "ingredients": [{"name": "돼지고기 앞다리살", "amount": "200g", "shape": "meat", "color": "#e39a8a"}],
  "steps": [{"title": "고기 볶기", "text": "냄비에 식용유 1큰술을 두르고 중불에서 고기 겉면이 익을 때까지 볶아요.", "action": "fry", "time": "3분", "items": ["돼지고기 앞다리살"], "color": "#8a4b33"}]
}

규칙:
- ingredients 4~12개. amount에는 구체적인 분량(g, ml, 큰술, 개 등).
- shape는 round, long, leaf, cube, grain, liquid, meat, egg, noodle, powder 중 재료 모양에 가장 가까운 것.
- color는 그 재료의 실제 색에 가까운 #rrggbb.
- steps 4~8개, 실제 조리 순서대로. text는 70자 이내의 해요체로, 불 세기·시간·분량을 구체적으로.
- action은 wash, chop, mix, boil, fry, bake, pour, season, grill, steam, rest, plate 중 그 단계의 핵심 동작.
- items는 그 단계에서 다루는 재료 이름 1~4개, ingredients의 name과 똑같이 표기.
- color(단계)는 그 단계에서 냄비·팬·볼에 담긴 국물이나 반죽의 색 #rrggbb. 해당 없으면 생략.
- 마지막 단계의 action은 plate.`;
}
const ERR = {
  not_granted: "Claude 사용을 허용해야 새 레시피를 만들 수 있어요. 지금은 예시 레시피만 볼 수 있어요.",
  sampling_disabled: "이 계정에서는 Claude를 쓸 수 없어서 예시 레시피만 볼 수 있어요.",
  rate_limited: "요청이 많아요. 잠시 뒤에 다시 검색해 주세요.",
  session_expired: "로그인이 만료됐어요. 다시 로그인한 뒤 검색해 주세요.",
  refused: "이 검색어로는 레시피를 만들 수 없어요. 다른 음식을 입력해 주세요.",
  invalid_json: "레시피 형식이 어긋났어요. 같은 음식을 한 번 더 검색해 주세요.",
  empty_completion: "답을 받지 못했어요. 다시 검색해 주세요.",
  prompt_too_large: "검색어를 더 짧게 입력해 주세요."
};
const PERMANENT = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
async function search(q) {
  q = (q || "").trim().slice(0, 40);
  if (!q || exporting) return;
  const ex = EXAMPLES[q.replace(/\s+/g, "")];
  const sample = sampleBlocked ? null : await sampleP;
  if (!sample) {
    if (ex) { loadRecipe({ ...ex, example: true }, true); setStatus(""); return; }
    setStatus("이 화면에서는 새 레시피를 만들 수 없어요. claude.ai에서 열거나 예시 레시피를 눌러 보세요.", "err"); return;
  }
  if (ctl) ctl.abort();
  const my = ctl = new AbortController();
  loading = true; loadingQ = q; playing = false; stopVoice(); updatePlayUI();
  $("go").disabled = true;
  setStatus(`‘${q}’ 레시피를 정리하고 영상을 만드는 중`, "busy");
  try {
    const raw = await sample.json(promptFor(q), { signal: my.signal });
    const r = normalize(raw, q);
    loading = false; loadRecipe(r, true);
    setStatus(`‘${r.title}’ 영상이 준비됐어요. 단계 목록을 누르면 그 장면으로 이동해요.`);
  } catch (e) {
    if (my !== ctl) return;
    loading = false; updatePlayUI();
    const code = e && e.code;
    if (code === "cancelled") { setStatus(""); return; }
    if (code === "not_food") { setStatus(e.message || "음식 이름을 입력해 주세요.", "err"); return; }
    if (PERMANENT.includes(code)) sampleBlocked = true;
    if (ex) { loadRecipe({ ...ex, example: true }, true); }
    setStatus(ERR[code] || "연결이 잠깐 끊겼어요. 다시 검색해 주세요.", "err");
  } finally {
    if (my === ctl) { ctl = null; $("go").disabled = false; }
  }
}
$("search").addEventListener("submit", e => { e.preventDefault(); search($("q").value); });
$("chips").replaceChildren(...CHIPS.map(([name, ex]) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = name;
  if (ex) { const sm = document.createElement("small"); sm.textContent = "예시"; b.append(sm); }
  b.addEventListener("click", () => {
    $("q").value = name;
    if (ex) { if (ctl) ctl.abort(); loading = false; loadRecipe({ ...EXAMPLES[name], example: true }, true); setStatus(""); }
    else search(name);
  });
  return b;
}));

// ---------- export to .webm
async function exportVideo() {
  if (exporting) { exporting.cancelled = true; if (exporting.rec.state === "recording") exporting.rec.stop(); return; }
  if (!recipe || loading || !dl) return;
  if (typeof MediaRecorder === "undefined" || !cv.captureStream) { noteEl.textContent = "이 브라우저는 영상 녹화를 지원하지 않아요. Chrome이나 Edge에서 열어 주세요."; return; }
  const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  let rec;
  try { rec = new MediaRecorder(cv.captureStream(30), mime ? { mimeType: mime, videoBitsPerSecond: 5e6 } : {}); }
  catch (_) { noteEl.textContent = "이 브라우저에서는 녹화를 시작할 수 없어요."; return; }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(res => rec.onstop = res);
  stopVoice();
  exporting = { rec, chunks, endAt: 0, cancelled: false };
  t = 0; curScene = -1; playing = true; updatePlayUI();
  noteEl.textContent = `영상을 실시간으로 녹화하고 있어요 (약 ${fmt(total)}). 이 탭을 열어 두세요.`;
  rec.start(500);
  await done;
  const cancelled = exporting.cancelled; exporting = null; playing = false; updatePlayUI();
  saveBtn.lastElementChild.textContent = "영상 저장";
  if (cancelled) { noteEl.textContent = "녹화를 중지했어요."; return; }
  const blob = new Blob(chunks, { type: "video/webm" });
  const name = recipe.title.replace(/[\\/:*?"<>|]+/g, "").trim() || "recipe";
  try { await dl.save({ filename: `${name} 만들기.webm`, data: blob }); noteEl.textContent = `‘${name} 만들기.webm’을 저장했어요.`; }
  catch (e) {
    const c = e && e.code;
    noteEl.textContent = c === "declined" ? "저장을 취소했어요." : c === "rate_limited" ? "저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요." : "이 화면에서는 파일을 저장할 수 없어요.";
    if (["unavailable", "not_granted", "capability_disabled", "capability_removed"].includes(c)) saveBtn.hidden = true;
  }
}
saveBtn.addEventListener("click", exportVideo);

// ---------- boot
loadRecipe({ ...EXAMPLES["김치찌개"], example: true }, false);
setStatus("예시로 김치찌개 영상을 띄워 뒀어요. 만들고 싶은 음식을 검색해 보세요.");
updatePlayUI();
requestAnimationFrame(frame);
ttsP.then(x => { tts = x; if (tts) { voiceBtn.hidden = false; if (tts.onState) try { tts.onState(() => {}); } catch (_) {} } });
dlP.then(x => { dl = x; if (dl && typeof MediaRecorder !== "undefined") saveBtn.hidden = false; });
})();
</script>
