<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>ORBIT LAB — 우주·로켓 3D 학습 플랫폼</title>
<style>
:root{--bg:#05070f;--panel:rgba(12,18,36,.74);--line:rgba(140,170,255,.18);--tx:#e8eeff;--mut:#9aa6c8;--acc:#5ad1ff;--acc2:#ff8a3d;--ok:#4be39a;--bad:#ff5d6c;--r:16px;--top:56px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:60;background:linear-gradient(rgba(5,7,15,.92),rgba(5,7,15,.6));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo b{font-size:17px;letter-spacing:.14em}
.logo small{color:var(--mut);font-size:11.5px;display:block;letter-spacing:.02em}
.logo svg{width:28px;height:28px}
.tabs{display:flex;gap:2px;margin:0 auto}
.tab{background:none;border:0;color:var(--mut);padding:8px 11px;border-radius:10px;font-size:13.5px;display:flex;align-items:center;gap:6px;transition:.2s;white-space:nowrap}
.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);background:rgba(90,209,255,.12);box-shadow:inset 0 0 0 1px rgba(90,209,255,.35)}
.langsel{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
.langsel option{background:#0b1022}
main{position:fixed;top:var(--top);left:0;right:0;bottom:0}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(1.015);transition:opacity .5s ease,transform .5s ease,visibility .5s}
.view.active{opacity:1;visibility:visible;transform:none}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
canvas.full{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);padding:11px 18px;border-radius:12px;font-size:14.5px;font-weight:600;transition:.2s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:linear-gradient(135deg,#ff9a4a,#ff5f3d);border-color:transparent;color:#fff;box-shadow:0 8px 30px rgba(255,110,60,.35)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.cy{background:linear-gradient(135deg,#46c8ff,#4a7dff);border-color:transparent;color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.hidden{display:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:rgba(90,209,255,.12);color:var(--acc);border:1px solid rgba(90,209,255,.3)}
.sw{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:20px;background:rgba(255,255,255,.15);position:relative;transition:.2s;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--acc)}
.sw input:checked::after{left:18px}
input[type=range]{accent-color:var(--acc);width:100%}
/* HOME */
#v-home{background:#000}
.hero{position:absolute;left:clamp(16px,6vw,90px);top:50%;transform:translateY(-50%);max-width:560px;transition:opacity .6s,transform .6s;pointer-events:none}
.hero>*{pointer-events:auto}
.hero.gone{opacity:0;transform:translate(-30px,-50%);pointer-events:none}
.hero.gone>*{pointer-events:none}
.kicker{color:var(--acc);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(30px,4.6vw,56px);line-height:1.12;font-weight:800;letter-spacing:-.02em;margin-bottom:16px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.hero p{color:#c6d0ee;font-size:clamp(14.5px,1.4vw,17px);line-height:1.6;margin-bottom:26px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,18vw,200px);font-weight:900;color:#fff;pointer-events:none;text-shadow:0 0 50px rgba(255,140,60,.8)}
.countdown span{animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}30%{opacity:1}100%{transform:scale(.9);opacity:.15}}
.hud{position:absolute;left:16px;top:16px;padding:14px 16px;min-width:220px;font-variant-numeric:tabular-nums}
.hud .tp{font-size:28px;font-weight:800;letter-spacing:.04em}
.hud .row{display:flex;justify-content:space-between;gap:20px;font-size:13.5px;margin-top:6px;color:var(--mut)}
.hud .row b{color:var(--tx)}
.hud .ph{margin-top:8px;color:var(--acc2);font-weight:700;font-size:14px}
.hud .note{margin-top:10px;font-size:11px;color:var(--mut);max-width:240px;line-height:1.4}
.toast{position:absolute;left:50%;top:22px;transform:translate(-50%,-20px);padding:10px 18px;border-radius:999px;background:rgba(255,138,61,.16);border:1px solid rgba(255,138,61,.5);color:#ffd2b3;font-weight:700;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.card{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:22px 24px;width:min(560px,calc(100% - 32px));text-align:center;animation:rise .7s ease}
.card h2{font-size:26px;margin-bottom:8px}
.card p{color:var(--mut);margin-bottom:16px;line-height:1.5}
.card .btns{justify-content:center}
@keyframes rise{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .8s}
/* STRUCTURE */
#v-struct,#v-solar{background:radial-gradient(ellipse at 50% 40%,#13204a 0%,#070b1c 55%,#03040a 100%)}
.side{position:absolute;right:16px;top:16px;width:340px;max-height:calc(100% - 32px);overflow:auto;padding:18px}
.side h2{font-size:19px;margin-bottom:6px}
.side .hint{color:var(--mut);font-size:13px;line-height:1.5;margin-bottom:14px}
.ctrl{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.ctrl label.rg{font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.info{border-top:1px solid var(--line);padding-top:14px;min-height:120px}
.info h3{font-size:17px;margin:8px 0}
.info p{color:#c9d2ee;font-size:14px;line-height:1.6}
.info .spec{margin-top:10px;font-size:12.5px;color:var(--acc);font-family:ui-monospace,Menlo,Consolas,monospace}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.parts button{font-size:12px;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.parts button.on{background:rgba(90,209,255,.18);border-color:var(--acc)}
.legend{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--mut);padding:8px 12px}
/* LEARN */
#v-learn{background:radial-gradient(ellipse at 20% 0%,#1a2457 0%,#080c1e 50%,#04050c 100%)}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
.wrap h2{font-size:clamp(24px,3vw,34px);margin-bottom:8px}
.sub{color:var(--mut);line-height:1.6;margin-bottom:18px;max-width:720px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:13.5px;color:var(--mut)}
.bar{flex:1;max-width:360px;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8c7dff);transition:width .6s}
.mapbox{position:relative}
#mapSvg{position:absolute;inset:0;pointer-events:none;overflow:visible}
#mapSvg path{fill:none;stroke:rgba(140,170,255,.25);stroke-width:2;stroke-dasharray:5 6}
#mapSvg path.d{stroke:rgba(75,227,154,.7);stroke-dasharray:none}
.level{position:relative;margin-bottom:34px}
.lvh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lvh .lt{font-size:12px;font-weight:800;letter-spacing:.1em;padding:4px 10px;border-radius:8px}
.lvh h3{font-size:17px}
.nodes{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;min-width:230px;max-width:280px;flex:1;border-radius:16px;background:rgba(14,22,46,.85);border:1px solid var(--line);text-align:left;transition:.25s}
.node:hover{transform:translateY(-3px);border-color:rgba(90,209,255,.6);box-shadow:0 10px 30px rgba(40,120,255,.2)}
.node .dot{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:rgba(255,255,255,.07);border:2px solid rgba(140,170,255,.4)}
.node.done .dot{background:var(--ok);border-color:var(--ok);color:#05200f}
.node .nt{font-size:14.5px;font-weight:600;line-height:1.3}
.node .nk{display:block;font-size:11.5px;color:var(--mut);font-weight:400;margin-top:2px}
.lesson{position:fixed;top:calc(var(--top) + 12px);right:12px;bottom:12px;width:min(480px,calc(100% - 24px));z-index:40;overflow-y:auto;padding:22px;transform:translateX(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.lesson.open{transform:none}
.lesson .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:18px}
.lesson h2{font-size:22px;margin:10px 44px 10px 0;line-height:1.3}
.lesson p.b{color:#cbd4f0;line-height:1.7;font-size:14.5px}
.sec{margin-top:18px}
.sec h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.formula{padding:14px 16px;border-radius:12px;background:rgba(90,209,255,.07);border:1px solid rgba(90,209,255,.25);font-family:"Cambria Math","Times New Roman",serif;font-size:19px;line-height:1.6;overflow-x:auto;white-space:nowrap}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.calc input,.qa input{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;width:100%}
.cres{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;color:#ffe2a8}
.q{line-height:1.6;font-size:14.5px}
.qa{display:flex;gap:8px;margin-top:10px}
.qa span{align-self:center;color:var(--mut);font-size:13px;white-space:nowrap}
.fb{margin-top:10px;font-size:14px;min-height:20px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.solb{margin-top:10px;padding:12px;border-radius:10px;background:rgba(255,255,255,.04);font-size:14px;line-height:1.7;font-family:ui-monospace,Menlo,Consolas,monospace}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* SIM */
#v-sim{background:linear-gradient(180deg,#081028,#04060d)}
.simgrid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;max-width:1300px;margin:0 auto;padding:18px}
.simgrid .panel{padding:16px}
.simgrid h2{font-size:21px;margin-bottom:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.stg-h{font-weight:700;font-size:13.5px;margin-bottom:8px;color:var(--acc2)}
.stg-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stg label,.pl label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mut)}
.stg input,.stg select,.pl input{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13.5px;width:100%}
.stg select option{background:#0b1022}
textarea.code{width:100%;min-height:230px;resize:vertical;background:#03060f;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;color:#bfe9ff;tab-size:2}
.help{font-size:12px;color:var(--mut);line-height:1.6;margin:8px 0 12px}
.help code{color:#ffd28a;font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.kpi small{display:block;color:var(--mut);font-size:11.5px;margin-bottom:4px}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.verdict{padding:12px 14px;border-radius:12px;font-weight:700;margin-bottom:12px}
.verdict.ok{background:rgba(75,227,154,.12);color:var(--ok);border:1px solid rgba(75,227,154,.4)}
.verdict.no{background:rgba(255,93,108,.12);color:var(--bad);border:1px solid rgba(255,93,108,.4)}
.verdict.mid{background:rgba(255,190,80,.12);color:#ffcf6a;border:1px solid rgba(255,190,80,.4)}
.trajwrap{position:relative;height:340px;border-radius:12px;overflow:hidden;background:#02040b;border:1px solid var(--line)}
.trajwrap canvas{width:100%;height:100%;display:block}
.trajtabs{position:absolute;top:8px;left:8px;display:flex;gap:6px}
.tele{position:absolute;right:10px;top:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;text-align:right;color:#bfe9ff;line-height:1.6}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.charts canvas{width:100%;height:170px;display:block;background:#02040b;border:1px solid var(--line);border-radius:12px}
.evlog{margin-top:10px;font-size:12.5px;color:var(--mut);font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.7}
/* SOLAR */
.labelbox{position:absolute;left:16px;bottom:16px;padding:12px 14px;width:min(330px,calc(100% - 32px))}
/* GAME */
#v-game{background:#000}
.ghud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.ghud .panel{padding:10px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.meter{width:120px;height:7px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .2s}
.gstat{display:flex;gap:16px}
.gstat div small{display:block;color:var(--mut);font-size:11px}
.gstat div b{font-size:16px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(10,20,50,.55),rgba(0,0,0,.85));z-index:5;padding:16px}
.overlay .panel{padding:26px;max-width:520px;text-align:center}
.overlay h2{font-size:28px;margin-bottom:10px}
.overlay p{color:#c6d0ee;line-height:1.6;margin-bottom:10px}
.overlay .keys{font-size:13px;color:var(--mut);margin-bottom:16px}
.overlay .opts{display:flex;flex-direction:column;gap:10px;align-items:center;margin:14px 0 18px}
.overlay .opts small{color:var(--mut);font-size:12px;max-width:380px}
.gwarn{position:absolute;left:50%;top:30%;transform:translateX(-50%);color:#ffcf6a;font-weight:800;font-size:18px;text-shadow:0 0 20px rgba(0,0,0,.9);pointer-events:none;text-align:center}
.touch{position:absolute;inset:auto 0 0 0;height:190px;pointer-events:none;display:none}
.joy{position:absolute;left:22px;bottom:22px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(90,209,255,.45);border:1px solid rgba(255,255,255,.4)}
.tbtns{position:absolute;right:20px;bottom:24px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
.tbtns button{width:92px;height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(255,138,61,.35);font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none}
.tbtns button.br{background:rgba(90,209,255,.3)}
.gcam{position:absolute;right:12px;bottom:12px;width:150px;border-radius:12px;transform:scaleX(-1);opacity:.85;border:1px solid var(--line)}
@media (pointer:coarse){.touch{display:block}}
/* CAMERA */
#v-cam{background:#000}
#camVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;width:max-content;max-width:calc(100% - 24px)}
.cinfo{position:absolute;left:16px;top:16px;padding:12px 14px;max-width:min(360px,calc(100% - 32px))}
.cinfo h2{font-size:18px;margin-bottom:6px}
.cinfo p{font-size:13px;color:#c6d0ee;line-height:1.5}
.cinfo small{display:block;margin-top:8px;color:var(--mut);font-size:11.5px}
.cstat{display:flex;gap:16px;margin-top:10px;font-size:13px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;color:var(--mut)}
.seg button.on{background:rgba(90,209,255,.2);color:var(--tx)}
/* RESPONSIVE */
@media (max-width:980px){.simgrid{grid-template-columns:1fr}.tab span{display:none}.tab{padding:8px}}
@media (max-width:760px){
 :root{--top:52px}
 .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(5,7,15,.94)}
 .logo small{display:none}
 .tabs{position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:rgba(5,7,15,.95);padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin:0;z-index:60}
 .tab{flex-direction:column;font-size:10px;padding:4px 2px;gap:2px;flex:1;min-width:0}
 .tab span{display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%}
 .langsel{margin-left:auto}
 main{bottom:calc(58px + env(safe-area-inset-bottom))}
 .side{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:44%;padding:14px}
 .hud{left:10px;top:10px;min-width:0;padding:10px 12px}.hud .tp{font-size:22px}.hud .note{display:none}
 .hero{left:16px;right:16px;top:auto;bottom:24px;transform:none}
 .hero.gone{transform:translateY(20px)}
 .legend{display:none}
 .charts{grid-template-columns:1fr}
 .node{min-width:0;max-width:none;flex-basis:100%}
 .lesson{left:0;right:0;width:auto;top:auto;bottom:0;height:86%;border-radius:20px 20px 0 0;transform:translateY(105%)}
 .gstat{gap:10px}.meter{width:80px}
 .labelbox{left:10px;right:10px;width:auto;bottom:10px}
 .gcam{width:100px;bottom:200px}
 .cinfo{left:10px;right:10px;max-width:none}
}
</style>
</head>
<body>
<header class="topbar">
 <div class="logo">
  <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ad1ff"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs><ellipse cx="16" cy="16" rx="14" ry="6" fill="none" stroke="url(#lg)" stroke-width="2" transform="rotate(-30 16 16)"/><circle cx="16" cy="16" r="5" fill="url(#lg)"/><circle cx="27" cy="9" r="2" fill="#fff"/></svg>
  <div><b>ORBIT LAB</b><small data-i18n="brand_sub"></small></div>
 </div>
 <nav class="tabs" id="tabs">
  <button class="tab on" data-v="home"><svg viewBox="0 0 24 24"><path d="M12 2c3 2 5 6 5 10l-2 4H9l-2-4c0-4 2-8 5-10z"/><circle cx="12" cy="9" r="1.6"/><path d="M9 16l-2 5 3-1.5M15 16l2 5-3-1.5"/></svg><span data-i18n="nav_home"></span></button>

/* ============================ 3D MATH ============================ */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l]};
const vlerp=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
const M3={I:()=>[1,0,0,0,1,0,0,0,1],
 rx(a){const c=Math.cos(a),s=Math.sin(a);return [1,0,0,0,c,-s,0,s,c]},
 ry(a){const c=Math.cos(a),s=Math.sin(a);return [c,0,s,0,1,0,-s,0,c]},
 rz(a){const c=Math.cos(a),s=Math.sin(a);return [c,-s,0,s,c,0,0,0,1]},
 mul(a,b){const r=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)r[i*3+j]=a[i*3]*b[j]+a[i*3+1]*b[3+j]+a[i*3+2]*b[6+j];return r},

const MI=M3.I();
function hash3(x,y,z){const h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return h-Math.floor(h)}
function noise3(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);const s=q=>q*q*(3-2*q);const u=s(x-xi),v=s(y-yi),w=s(z-zi);let r=0;for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++)r+=hash3(xi+a,yi+b,zi+c)*(a?u:1-u)*(b?v:1-v)*(c?w:1-w);return r*2-1}

/* ============================ MESHES ============================ */
function fNormal(V,f){return norm(cross(sub(V[f[1]],V[f[0]]),sub(V[f[2]],V[f[0]])))}
function fCenter(V,f){let c=[0,0,0];for(const i of f)c=add(c,V[i]);return mul(c,1/f.length)}
function finish(m){m.normals=m.faces.map(f=>fNormal(m.verts,f));return m}
function orientConvex(m){let c=[0,0,0];m.verts.forEach(v=>c=add(c,v));c=mul(c,1/m.verts.length);m.faces.forEach(f=>{if(dot(fNormal(m.verts,f),sub(fCenter(m.verts,f),c))<0)f.reverse()});return m}
/* Lathe: revolve a (r,y) profile around Y. Profile goes bottom-center → outward → up → top-center. */
function lathe(prof,seg,color,arc,start){
 arc=arc||Math.PI*2;start=start||0;const closed=arc>Math.PI*2-1e-6,cols=closed?seg:seg+1;
 const verts=[],faces=[];
 for(const [r,y] of prof)for(let j=0;j<cols;j++){const a=start+j/seg*arc;verts.push([r*Math.cos(a),y,r*Math.sin(a)])}
 for(let i=0;i<prof.length-1;i++){
  const [r0,y0]=prof[i],[r1,y1]=prof[i+1],dr=r1-r0,dy=y1-y0;if(r0===0&&r1===0)continue;
  for(let j=0;j<seg;j++){
   const j2=closed?(j+1)%seg:j+1,a=i*cols+j,b=i*cols+j2,c=(i+1)*cols+j2,d=(i+1)*cols+j;
   let f=r0===0?[a,c,d]:r1===0?[a,b,c]:[a,b,c,d];
   const tm=start+(j+.5)/seg*arc,exp=[dy*Math.cos(tm),-dr,dy*Math.sin(tm)];
   if(dot(fNormal(verts,f),exp)<0)f.reverse();faces.push(f);
  }
 }
 return finish({verts,faces,color});
}

function torus(R,r,su,sv,c){const verts=[],faces=[];for(let i=0;i<su;i++){const u=i/su*Math.PI*2;for(let j=0;j<sv;j++){const v=j/sv*Math.PI*2;verts.push([(R+r*Math.cos(v))*Math.cos(u),(R+r*Math.cos(v))*Math.sin(u),r*Math.sin(v)])}}
 for(let i=0;i<su;i++)for(let j=0;j<sv;j++){const i2=(i+1)%su,j2=(j+1)%sv;const f=[i*sv+j,i2*sv+j,i2*sv+j2,i*sv+j2];const fc=fCenter(verts,f);const tc=mul(norm([fc[0],fc[1],0]),R);if(dot(fNormal(verts,f),sub(fc,tc))<0)f.reverse();faces.push(f)}

function octa(s,c){return finish(orientConvex({verts:[[s,0,0],[-s,0,0],[0,s*1.4,0],[0,-s*1.4,0],[0,0,s],[0,0,-s]],faces:[[0,2,4],[4,2,1],[1,2,5],[5,2,0],[0,4,3],[4,1,3],[1,5,3],[5,0,3]],color:c}))}

function asteroidMesh(seed){const m=sphere(1,9,6,[120,112,104]);m.verts=m.verts.map(v=>mul(v,.72+.55*hash3(Math.round(v[0]*100)+seed*13,Math.round(v[1]*100),Math.round(v[2]*100))));orientConvex(m);finish(m);m.fcol=m.faces.map((f,i)=>{const k=.75+.35*hash3(i,seed,3);return [130*k,118*k,105*k]});return m}
function planetMesh(r,seg,rings,fn){const m=sphere(r,seg,rings,[255,255,255]);m.fcol=m.faces.map(f=>fn(norm(fCenter(m.verts,f))));return m}
const earthCol=c=>{const lat=Math.abs(c[1]);const n=noise3(c[0]*2.3+5,c[1]*2.3,c[2]*2.3)+.45*noise3(c[0]*6,c[1]*6+3,c[2]*6);if(lat>.9)return [236,242,250];if(n>.12)return lat>.62?[160,170,160]:n>.55?[160,128,86]:[64+n*40,128,70];return [28,74+n*30,170+n*40]};
function groundMesh(){const verts=[],faces=[],fcol=[];const N=14,S=36,o=-N*S/2;for(let i=0;i<N;i++)for(let j=0;j<N;j++){const x0=o+i*S,z0=o+j*S,k=verts.length;verts.push([x0,0,z0],[x0,0,z0+S],[x0+S,0,z0+S],[x0+S,0,z0]);faces.push([k,k+1,k+2,k+3]);const d=Math.hypot(x0+S/2,z0+S/2);const g=.82+.18*hash3(i,j,1);fcol.push(d<40?[96*g,100*g,104*g]:[58*g,96*g,62*g])}return finish({verts,faces,fcol,color:[80,110,80]})}

function clipNear(P,N){const o=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],ai=a[2]>=N,bi=b[2]>=N;if(ai)o.push(a);if(ai!==bi){const k=(N-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,N])}}return o}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
const SPR={};function sprite(col){if(SPR[col])return SPR[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,`rgba(${col},1)`);gr.addColorStop(.35,`rgba(${col},.5)`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(0,0,64,64);return SPR[col]=c}
class R3D{
 constructor(cv){this.cv=cv;this.ctx=cv.getContext('2d');this.cam={pos:[0,0,10],target:[0,0,0],up:[0,1,0],fov:50};this.near=.1;this.light=norm([.5,.8,.4]);this.amb=.28;this.fog=0;this.list=[];this.W=this.H=1;this.dpr=1}
 resize(){const r=this.cv.getBoundingClientRect();this.dpr=Math.min(window.devicePixelRatio||1,1.6);this.cssW=r.width;this.cssH=r.height;const W=Math.max(1,Math.round(r.width*this.dpr)),H=Math.max(1,Math.round(r.height*this.dpr));if(this.cv.width!==W||this.cv.height!==H){this.cv.width=W;this.cv.height=H}this.W=W;this.H=H}
 begin(){const c=this.cam,f=norm(sub(c.target,c.pos));let r=cross(f,c.up);if(len(r)<1e-6)r=cross(f,[0,0,1]);r=norm(r);this.f=f;this.r=r;this.u=cross(r,f);this.fl=this.H/2/Math.tan(c.fov*Math.PI/360);this.cx=this.W/2;this.cy=this.H/2;this.list=[]}
 camLight(){this.light=norm(add(add(mul(this.r,-.45),mul(this.u,.75)),mul(this.f,-.55)))}
 toCam(p){const d=sub(p,this.cam.pos);return [dot(d,this.r),dot(d,this.u),dot(d,this.f)]}
 sp(c){return [this.cx+c[0]*this.fl/c[2],this.cy-c[1]*this.fl/c[2]]}
 project(p){const c=this.toCam(p);if(c[2]<this.near)return null;const s=this.sp(c);return [s[0],s[1],c[2]]}
 add(o){
  const m=o.mesh,rot=o.rot||MI,sc=o.scale||1,pos=o.pos||[0,0,0],cp=this.cam.pos,N=this.near;
  const wv=m.verts.map(v=>add(pos,M3.ap(rot,[v[0]*sc,v[1]*sc,v[2]*sc]))),cv=wv.map(p=>this.toCam(p));
  const Lt=o.lightPos?norm(sub(o.lightPos,pos)):this.light,base=o.color||m.color,a=o.alpha==null?1:o.alpha;
  for(let i=0;i<m.faces.length;i++){
   const f=m.faces[i],n=M3.ap(rot,m.normals[i]);const facing=dot(n,sub(wv[f[0]],cp))<0;
   if(!facing&&!o.double)continue;
   let pts=f.map(k=>cv[k]),cl=false;for(const p of pts)if(p[2]<N){cl=true;break}
   if(cl){pts=clipNear(pts,N);if(pts.length<3)continue}
   let z=0;const s=pts.map(p=>{z+=p[2];return this.sp(p)});z/=pts.length;
   const fc=m.fcol?m.fcol[i]:base;let k;
   if(o.emis)k=1;else{let d=dot(facing?n:mul(n,-1),Lt);k=this.amb+(1-this.amb)*Math.max(0,d)}
   if(o.glowK)k=Math.min(1.25,k+o.glowK);
   if(this.fog)k*=clamp(1.15-z/this.fog,0,1);
   this.list.push({s,z:z+(o.zb||0),c:`rgb(${Math.min(255,fc[0]*k)|0},${Math.min(255,fc[1]*k)|0},${Math.min(255,fc[2]*k)|0})`,a,id:o.id});
  }
 }
 draw(){this.list.sort((a,b)=>b.z-a.z);const x=this.ctx;x.lineJoin='round';x.lineWidth=1;for(const p of this.list){x.globalAlpha=p.a;x.fillStyle=p.c;x.beginPath();x.moveTo(p.s[0][0],p.s[0][1]);for(let i=1;i<p.s.length;i++)x.lineTo(p.s[i][0],p.s[i][1]);x.closePath();x.fill();if(p.a>=1){x.strokeStyle=p.c;x.stroke()}}x.globalAlpha=1}
 pick(px,py){px*=this.dpr;py*=this.dpr;for(let i=this.list.length-1;i>=0;i--){const p=this.list[i];if(p.id!=null&&p.a>.3&&inPoly(px,py,p.s))return p.id}return null}
 stars(S,alpha=1){const x=this.ctx;for(const s of S){const c2=dot(s.d,this.f);if(c2<=.02)continue;const sx=this.cx+dot(s.d,this.r)*this.fl/c2,sy=this.cy-dot(s.d,this.u)*this.fl/c2;if(sx<0||sy<0||sx>this.W||sy>this.H)continue;x.globalAlpha=alpha*(.3+.7*s.b);x.fillStyle=s.c;const r=(.6+s.sz*1.4)*this.dpr;x.fillRect(sx,sy,r,r)}x.globalAlpha=1}
 spr(p,rad,col,a=1,mode='lighter'){const q=this.project(p);if(!q)return;const R=rad*this.fl/q[2];if(R<.4||q[0]<-R||q[0]>this.W+R||q[1]<-R||q[1]>this.H+R)return;const x=this.ctx;x.globalCompositeOperation=mode;x.globalAlpha=clamp(a,0,1);x.drawImage(sprite(col),q[0]-R,q[1]-R,R*2,R*2);x.globalAlpha=1;x.globalCompositeOperation='source-over'}
 line3(pts,style,w=1,closed=false){const x=this.ctx;x.strokeStyle=style;x.lineWidth=w*this.dpr;x.beginPath();let pen=false;for(const p of pts){const q=this.project(p);if(!q){pen=false;continue}if(!pen){x.moveTo(q[0],q[1]);pen=true}else x.lineTo(q[0],q[1])}if(closed&&pen&&pts.length){const q=this.project(pts[0]);if(q)x.lineTo(q[0],q[1])}x.stroke()}
 label(p,txt,col='#e8eeff',size=12,dy=-14){const q=this.project(p);if(!q)return;const x=this.ctx;x.font=`600 ${size*this.dpr}px system-ui,sans-serif`;x.textAlign='center';x.fillStyle='rgba(0,0,0,.55)';x.fillText(txt,q[0]+1,q[1]+dy*this.dpr+1);x.fillStyle=col;x.fillText(txt,q[0],q[1]+dy*this.dpr)}
 screenR(p,r){const q=this.project(p);return q?[q[0],q[1],r*this.fl/q[2]]:null}
}
function makeStars(n){const s=[];for(let i=0;i<n;i++){const z=Math.random()*2-1,a=Math.random()*Math.PI*2,r=Math.sqrt(1-z*z),b=Math.random();s.push({d:[r*Math.cos(a),z,r*Math.sin(a)],b,sz:Math.random()**3,c:b>.93?'#ffd9a8':b>.86?'#b0ccff':'#fff'})}return s}
class PS{constructor(){this.a=[]}
 emit(p,v,life,size,col,grow=1,mode='lighter'){if(this.a.length<1400)this.a.push({p:[...p],v:[...v],t:0,life,size,col,grow,mode})}
 step(dt,drag=0,grav){for(const q of this.a){q.t+=dt;q.p=add(q.p,mul(q.v,dt));if(drag)q.v=mul(q.v,Math.max(0,1-drag*dt));if(grav)q.v=add(q.v,mul(grav,dt))}this.a=this.a.filter(q=>q.t<q.life)}
 draw(R){for(const q of this.a){const k=q.t/q.life;R.spr(q.p,q.size*(1+k*q.grow),q.col,(1-k)*(q.mode==='lighter'?1:.55),q.mode)}}}
function orbitCtl(el,o){
 const P=new Map();let lastD=0,moved=0;
 el.addEventListener('pointerdown',e=>{el.setPointerCapture&&el.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===1)moved=0;o.idle=0});
 el.addEventListener('pointermove',e=>{if(!P.has(e.pointerId)||o.locked)return;const pr=P.get(e.pointerId),dx=e.clientX-pr[0],dy=e.clientY-pr[1];P.set(e.pointerId,[e.clientX,e.clientY]);
  if(P.size===1){o.yaw-=dx*.008;o.pitch=clamp(o.pitch+dy*.008,o.pmin==null?-1.45:o.pmin,1.45);moved+=Math.abs(dx)+Math.abs(dy)}
  else if(P.size===2){const [a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastD)o.dist=clamp(o.dist*lastD/d,o.min,o.max);lastD=d;moved+=20}o.idle=0});
 const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);lastD=0;if(moved<7&&o.onTap&&P.size===0){const r=el.getBoundingClientRect();o.onTap(e.clientX-r.left,e.clientY-r.top)}};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',e=>{P.delete(e.pointerId);lastD=0});
 el.addEventListener('wheel',e=>{if(o.locked)return;e.preventDefault();o.dist=clamp(o.dist*(1+e.deltaY*.001),o.min,o.max);o.idle=0},{passive:false});
}
const orbitPos=(o,t)=>{const c=Math.cos(o.pitch);return [t[0]+o.dist*c*Math.sin(o.yaw),t[1]+o.dist*Math.sin(o.pitch),t[2]+o.dist*c*Math.cos(o.yaw)]};

 q:{ko:'두 단 모두 Isp = 300 s, 질량비 3입니다. 전체 Δv는 몇 km/s인가요?',en:'Both stages have Isp = 300 s and a mass ratio of 3. What is the total Δv in km/s?',mn:'Хоёр шат хоёулаа Isp = 300 с, массын харьцаа 3. Нийт Δv хэдэн км/с вэ?'},a:6.46,u:'km/s',h:'2 × 300 × 9.80665 × ln 3',s:'Δv = 2 × 300 × 9.80665 × 1.0986 ≈ <b>6.46 km/s</b>'},
{id:'n10',lv:3,pre:['n5','n8'],go:'solar',t:{ko:'호만 전이 궤도',en:'Hohmann transfer orbit',mn:'Хоманы шилжилтийн тойрог зам'},
 b:{ko:'두 원궤도 사이를 가장 적은 Δv로 옮기는 방법은 두 궤도에 접하는 타원 궤도를 타는 것입니다. 지구에서 화성으로 갈 때도 이 원리를 쓰며, 약 26개월마다 오는 발사 기회(창)가 생기는 이유입니다.',en:'The cheapest two-burn way between two circular orbits is an ellipse tangent to both. Earth-to-Mars missions use it, which is why launch windows open roughly every 26 months.',mn:'Хоёр тойрог замын хооронд хамгийн бага Δv-ээр шилжих арга нь хоёуланд нь шүргэсэн эллипс зам юм. Дэлхийгээс Ангараг руу нисэхэд ашигладаг бөгөөд 26 сар орчим тутамд хөөргөлтийн боломж гардаг шалтгаан.'},
 f:'Δv₁ = √(μ/r₁)·(√(2r₂/(r₁+r₂)) − 1)',calc:{in:[['r1','r₁ (AU)',1],['r2','r₂ (AU)',1.524]],f:o=>{const mu=1.32712e20,A=1.495979e11,r1=o.r1*A,r2=o.r2*A,a=(r1+r2)/2;const d1=Math.sqrt(mu/r1)*(Math.sqrt(2*r2/(r1+r2))-1),d2=Math.sqrt(mu/r2)*(1-Math.sqrt(2*r1/(r1+r2)));return [d1/1000,'km/s',` · Δv₂ = ${(d2/1000).toFixed(2)} · t = ${(Math.PI*Math.sqrt(a**3/mu)/86400).toFixed(0)} d`]}},
 q:{ko:'태양 중심 궤도에서 지구(1 AU) → 화성(1.524 AU) 호만 전이의 첫 번째 분사 Δv₁은 몇 km/s인가요? (μ☉ = 1.327×10²⁰ m³/s², 1 AU = 1.496×10¹¹ m)',en:'For a heliocentric Hohmann transfer from Earth (1 AU) to Mars (1.524 AU), what is the first burn Δv₁ in km/s? (μ☉ = 1.327×10²⁰ m³/s², 1 AU = 1.496×10¹¹ m)',mn:'Нарны төвт Хоманы шилжилт: Дэлхий (1 AU) → Ангараг (1.524 AU). Эхний асаалтын Δv₁ хэдэн км/с вэ? (μ☉ = 1.327×10²⁰ м³/с², 1 AU = 1.496×10¹¹ м)'},a:2.94,u:'km/s',h:'√(μ/r₁) ≈ 29.8 km/s',s:'√(μ/r₁) ≈ 29.78 km/s · √(2×1.524/2.524) ≈ 1.0989 → Δv₁ ≈ 29.78 × 0.0989 ≈ <b>2.94 km/s</b>'},
{id:'n11',lv:4,pre:['n10'],go:'sim',t:{ko:'이체 문제와 궤도 요소',en:'Two-body problem & orbital elements',mn:'Хоёр биеийн бодлого ба тойрог замын элементүүд'},
 b:{ko:'두 물체의 운동방정식 r̈ = −μr/r³을 풀면 궤도는 원뿔곡선(원·타원·포물선·쌍곡선)이 됩니다. 궤도는 6개의 궤도 요소(a, e, i, Ω, ω, ν)로 완전히 기술되며, 극좌표 궤도 방정식으로 위치를 구할 수 있습니다.',en:'Solving the two-body equation r̈ = −μr/r³ gives conic-section orbits (circle, ellipse, parabola, hyperbola). An orbit is fully described by six elements (a, e, i, Ω, ω, ν), and the polar orbit equation gives the position.',mn:'Хоёр биеийн тэгшитгэл r̈ = −μr/r³-ийг бодоход тойрог зам нь конус огтлол (тойрог, эллипс, парабол, гипербол) болно. Зургаан элемент (a, e, i, Ω, ω, ν)-ээр бүрэн тодорхойлогдоно.'},
 f:'r̈ = −μ r / r³ &nbsp;→&nbsp; r(ν) = a(1 − e²) / (1 + e·cos ν)',calc:{in:[['a','a (km)',10000],['e','e',.2],['n','ν (°)',90]],f:o=>[o.a*(1-o.e*o.e)/(1+o.e*Math.cos(o.n*Math.PI/180)),'km',` · r_p = ${(o.a*(1-o.e)).toFixed(0)} · r_a = ${(o.a*(1+o.e)).toFixed(0)}`]},
 q:{ko:'a = 10,000 km, e = 0.2인 타원 궤도에서 진근점이각 ν = 90°일 때 궤도 반지름 r은 몇 km인가요?',en:'On an orbit with a = 10,000 km and e = 0.2, what is the radius r at true anomaly ν = 90° (km)?',mn:'a = 10,000 км, e = 0.2 эллипс зам дээр жинхэнэ аномали ν = 90° үед радиус r хэдэн км вэ?'},a:9600,u:'km',h:'cos 90° = 0',s:'r = 10,000 × (1 − 0.04) / (1 + 0) = <b>9,600 km</b> (semi-latus rectum p)'},
{id:'n12',lv:4,pre:['n4','n7'],go:'struct',t:{ko:'노즐 유동과 배기 속도',en:'Nozzle flow & exhaust velocity',mn:'Цоргоны урсгал ба гаргах хурд'},
 b:{ko:'연소실의 고온·고압 가스는 수축–확대(드 라발) 노즐의 목에서 음속에 도달한 뒤 확대부에서 초음속으로 가속됩니다. 등엔트로피 팽창을 가정하면 배기 속도는 연소 온도가 높고 분자량이 작을수록 커집니다. 액체수소 엔진의 Isp가 높은 이유입니다.',en:'Hot, high-pressure chamber gas reaches Mach 1 at the throat of a converging–diverging (de Laval) nozzle, then goes supersonic in the bell. Assuming isentropic expansion, exhaust velocity rises with chamber temperature and falls with molar mass — why hydrogen engines have high Isp.',mn:'Шаталтын камерын халуун, өндөр даралттай хий нарийсах–тэлэх (де Лаваль) цоргоны хоолойд дууны хурдад хүрч, тэлэх хэсэгт хэт авианы хурдтай болно. Температур өндөр, молийн масс бага байх тусам гаргах хурд их.'},
 f:'v<sub>e</sub> = √[ (2γ/(γ−1)) · (R·T₀/M) · (1 − (p<sub>e</sub>/p₀)<sup>(γ−1)/γ</sup>) ]',calc:{in:[['g','γ',1.2],['T','T₀ (K)',3500],['M','M (kg/mol)',.022],['p','pₑ/p₀',.001]],f:o=>{const v=Math.sqrt(2*o.g/(o.g-1)*8.314*o.T/o.M*(1-Math.pow(o.p,(o.g-1)/o.g)));return [v,'m/s',` · Isp ≈ ${(v/9.80665).toFixed(0)} s`]}},
 q:{ko:'γ = 1.2, T₀ = 3,500 K, M = 0.022 kg/mol 이고 이상적으로 완전 팽창(pₑ/p₀ → 0)한다고 할 때 배기 속도는 몇 m/s인가요? (R = 8.314 J/mol·K)',en:'With γ = 1.2, T₀ = 3,500 K, M = 0.022 kg/mol and ideal full expansion (pₑ/p₀ → 0), what is the exhaust velocity in m/s? (R = 8.314 J/mol·K)',mn:'γ = 1.2, T₀ = 3,500 K, M = 0.022 кг/моль, бүрэн тэлэлт (pₑ/p₀ → 0) гэвэл гаргах хурд хэдэн м/с вэ? (R = 8.314)'},a:3984,u:'m/s',h:'2γ/(γ−1) = 12',s:'vₑ = √(12 × 8.314 × 3500 / 0.022) = √(1.587e7) ≈ <b>3,984 m/s</b> (Isp ≈ 406 s)'},
{id:'n13',lv:4,pre:['n9'],go:'sim',t:{ko:'대기 비행: 동압과 상승 손실',en:'Atmospheric ascent: dynamic pressure & losses',mn:'Агаар мандлын нислэг: динамик даралт ба алдагдал'},
 b:{ko:'공기 밀도는 고도에 따라 줄고 속도는 늘기 때문에 동압 q = ½ρv²는 중간에 최대(Max Q)가 됩니다. 로켓은 이때 구조 하중을 줄이려 추력을 낮추기도 합니다. 또한 수직으로 오래 날수록 중력 손실이, 낮게 빨리 날수록 공기 손실이 커져 최적의 중력 선회 경로가 필요합니다.',en:'Air density falls with altitude while speed rises, so dynamic pressure q = ½ρv² peaks mid-ascent (Max Q); rockets often throttle down there. Flying vertical too long costs gravity loss, flying low and fast costs drag — hence an optimal gravity turn.',mn:'Өндөр нэмэгдэхэд агаарын нягт буурч, хурд өсдөг тул динамик даралт q = ½ρv² дунд хэсэгт дээд цэгтээ (Max Q) хүрнэ. Удаан босоо нисвэл таталцлын алдагдал, нам дор хурдан нисвэл агаарын алдагдал их болно.'},
 f:'q = ½ ρ v² &nbsp;&nbsp;|&nbsp;&nbsp; Δv<sub>loss</sub> = ∫ g sin γ dt + ∫ D/m dt',calc:{in:[['r','ρ (kg/m³)',.36],['v','v (m/s)',450]],f:o=>[.5*o.r*o.v*o.v/1000,'kPa']},
 q:{ko:'고도 약 11 km에서 공기 밀도가 0.36 kg/m³이고 로켓 속도가 450 m/s입니다. 동압은 몇 kPa인가요?',en:'At about 11 km the air density is 0.36 kg/m³ and the rocket flies at 450 m/s. What is the dynamic pressure in kPa?',mn:'11 км орчим өндөрт агаарын нягт 0.36 кг/м³, пуужингийн хурд 450 м/с. Динамик даралт хэдэн кПа вэ?'},a:36.5,u:'kPa',h:'q = 0.5 × ρ × v²',s:'q = 0.5 × 0.36 × 450² = 36,450 Pa ≈ <b>36.5 kPa</b>'},
{id:'n14',lv:4,pre:['n1','n13'],go:'sim',t:{ko:'자세 제어와 PID — 로켓 프로그래밍',en:'Attitude control & PID — programming a rocket',mn:'Байрлалын удирдлага ба PID — пуужин программчлал'},
 b:{ko:'로켓은 짐벌 엔진이나 반작용 휠로 토크를 만들어 회전합니다(τ = Iα). 비행 컴퓨터는 목표 자세와 현재 자세의 오차를 PID 제어기로 계산해 매 순간 엔진 각도를 조정합니다. 시뮬레이터의 비행 프로그램은 이런 유도(guidance) 명령의 단순한 형태입니다.',en:'Rockets rotate by producing torque with gimballed engines or reaction wheels (τ = Iα). The flight computer feeds the error between desired and actual attitude into a PID controller to adjust engine angle continuously. The simulator’s flight program is a simple form of these guidance commands.',mn:'Пуужин гимбалтай хөдөлгүүр эсвэл урвалын дугуйгаар эргэлтийн момент (τ = Iα) үүсгэж эргэнэ. Нислэгийн компьютер зорилтот болон одоогийн байрлалын зөрүүг PID удирдлагаар тооцож хөдөлгүүрийн өнцгийг тасралтгүй тохируулна.'},
 f:'τ = I·α &nbsp;&nbsp;|&nbsp;&nbsp; u(t) = K<sub>p</sub>e + K<sub>i</sub>∫e dt + K<sub>d</sub> de/dt',calc:{in:[['I','I (kg·m²)',4e6],['a','α (rad/s²)',.02]],f:o=>[o.I*o.a/1000,'kN·m']},
 q:{ko:'관성 모멘트가 4.0×10⁶ kg·m²인 로켓을 0.02 rad/s²로 회전 가속하려면 몇 kN·m의 토크가 필요한가요?',en:'What torque in kN·m is needed to give a rocket with moment of inertia 4.0×10⁶ kg·m² an angular acceleration of 0.02 rad/s²?',mn:'Инерцийн момент 4.0×10⁶ кг·м² пуужинд 0.02 рад/с² өнцгийн хурдатгал өгөхөд хэдэн кН·м момент хэрэгтэй вэ?'},a:80,u:'kN·m',h:'τ = I × α',s:'τ = 4.0e6 × 0.02 = 80,000 N·m = <b>80 kN·m</b>'}
];
const fmt=n=>{if(n==null||isNaN(n)||!isFinite(n))return '—';const a=Math.abs(n);if(a!==0&&(a>=1e7||a<1e-3))return n.toExponential(3);return n.toLocaleString(undefined,{maximumFractionDigits:a<10?3:a<1000?2:0})};
const Learn={
 init(){this.done=store.get('done',{});this.open=null;window.addEventListener('resize',()=>{if(cur==='learn')this.lines()})},
 enter(){this.render()},lang(){this.render();if(this.open)this.show(this.open)},
 render(){const lvC=['#5ad1ff','#8c7dff','#ff8a3d','#ff5d9a'];let h='';
  for(let lv=1;lv<=4;lv++){h+=`<div class="level"><div class="lvh"><span class="lt" style="background:${lvC[lv-1]}22;color:${lvC[lv-1]}">LEVEL ${lv} · ${t('lv'+lv)}</span><h3>${t('lvn'+lv)}</h3></div><div class="nodes">`;
   LESSONS.filter(n=>n.lv===lv).forEach(n=>{const i=LESSONS.indexOf(n)+1;h+=`<button class="node ${this.done[n.id]?'done':''}" id="nd-${n.id}" data-id="${n.id}"><span class="dot" style="${this.done[n.id]?'':`border-color:${lvC[lv-1]}`}">${this.done[n.id]?'✓':i}</span><span class="nt">${L(n.t)}<span class="nk">${n.u} · ${n.pre.length?n.pre.map(p=>LESSONS.findIndex(x=>x.id===p)+1).join(', ')+' →':'START'}</span></span></button>`});h+='</div></div>'}
  $('#mapLv').innerHTML=h;$$('#mapLv .node').forEach(b=>b.onclick=()=>this.show(b.dataset.id));
  const c=Object.keys(this.done).filter(k=>this.done[k]).length;$('#progBar').style.width=(c/LESSONS.length*100)+'%';$('#progTxt').textContent=`${c} / ${LESSONS.length}`;
  requestAnimationFrame(()=>this.lines())},
 lines(){const box=$('#mapBox'),svg=$('#mapSvg');if(!box.offsetParent)return;const br=box.getBoundingClientRect();svg.setAttribute('width',br.width);svg.setAttribute('height',br.height);let h='';
  LESSONS.forEach(n=>n.pre.forEach(p=>{const a=$('#nd-'+p+' .dot'),b=$('#nd-'+n.id+' .dot');if(!a||!b)return;const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();const x1=ra.left+ra.width/2-br.left,y1=ra.top+ra.height/2-br.top,x2=rb.left+rb.width/2-br.left,y2=rb.top+rb.height/2-br.top,my=(y1+y2)/2;
   h+=`<path class="${this.done[p]&&this.done[n.id]?'d':''}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"/>`}));svg.innerHTML=h},
 show(id){const n=LESSONS.find(x=>x.id===id);if(!n)return;this.open=id;const i=LESSONS.indexOf(n),nx=LESSONS[i+1];const el=$('#lesson');
  el.innerHTML=`<button class="x" id="lsX">×</button><span class="chip">LEVEL ${n.lv} · ${t('lv'+n.lv)} · #${i+1}</span>${this.done[id]?` <span class="chip" style="color:var(--ok);border-color:rgba(75,227,154,.4);background:rgba(75,227,154,.1)">✓</span>`:''}
  <h2>${L(n.t)}</h2><p class="b">${L(n.b)}</p>
  <div class="sec"><h4>${t('ls_formula')}</h4><div class="formula">${n.f}</div></div>
  <div class="sec"><h4>${t('ls_calc')}</h4><div class="calc">${n.calc.in.map(([k,l,v])=>`<label><span>${l}</span><input type="number" step="any" data-k="${k}" value="${v}"></label>`).join('')}</div><div class="cres" id="lsRes"></div></div>
  <div class="sec"><h4>${t('ls_prob')}</h4><p class="q">${L(n.q)}</p><div class="qa"><input id="lsAns" inputmode="decimal" placeholder="${t('ls_ans')}"><span>${n.u}</span><button class="btn cy sm" id="lsChk">${t('ls_check')}</button></div><div class="fb" id="lsFb"></div>
   <div class="row2"><button class="btn sm" id="lsHint">${t('ls_hint')}</button><button class="btn sm" id="lsSol">${t('ls_sol')}</button></div><div id="lsMore"></div><p style="font-size:11.5px;color:var(--mut);margin-top:8px">${t('ls_tol')}</p></div>
  ${n.pre.length?`<div class="sec"><h4>${t('ls_pre')}</h4><div class="row2" style="margin:0">${n.pre.map(p=>{const q=LESSONS.find(x=>x.id===p);return `<button class="btn sm" data-ls="${p}">${L(q.t)}</button>`}).join('')}</div></div>`:''}
  <div class="row2" style="margin-top:20px"><button class="btn pri sm" id="lsGo">${t('ls_go')}</button>${nx?`<button class="btn sm" data-ls="${nx.id}">${t('ls_next')}</button>`:''}</div>`;
  el.classList.add('open');el.scrollTop=0;
  const calc=()=>{const o={};$$('#lesson .calc input').forEach(i=>o[i.dataset.k]=parseFloat(i.value));const r=n.calc.f(o);$('#lsRes').textContent=`= ${fmt(r[0])} ${r[1]}${r[2]||''}`};calc();$$('#lesson .calc input').forEach(i=>i.oninput=calc);
  $('#lsX').onclick=()=>{el.classList.remove('open');this.open=null};
  const chk=()=>{const v=parseFloat(($('#lsAns').value||'').replace(/,/g,'').replace(/\s/g,''));const ok=!isNaN(v)&&Math.abs(v-n.a)<=Math.abs(n.a)*.02;const fb=$('#lsFb');fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?t('ls_ok'):t('ls_no');if(ok&&!this.done[id]){this.done[id]=1;store.set('done',this.done);this.render()}};
  $('#lsChk').onclick=chk;$('#lsAns').onkeydown=e=>{if(e.key==='Enter')chk()};
  $('#lsHint').onclick=()=>{$('#lsMore').innerHTML=`<div class="solb">💡 ${L(n.h)}</div>`};$('#lsSol').onclick=()=>{$('#lsMore').innerHTML=`<div class="solb">${n.s}</div>`};
  $('#lsGo').onclick=()=>go(n.go);$$('#lesson [data-ls]').forEach(b=>b.onclick=()=>this.show(b.dataset.ls))},
 leave(){}
};

/*SIM-START*/
const G0=9.80665,MU=3.986004418e14,RE=6371000,OMEGA=7.2921e-5;
const PROPS={kerolox:{name:'RP-1 / LOX',isl:282,ivac:311,iup:348},hydrolox:{name:'LH2 / LOX',isl:366,ivac:410,iup:450},methalox:{name:'CH4 / LOX',isl:327,ivac:356,iup:380},solid:{name:'Solid (APCP)',isl:242,ivac:268,iup:290}};
function parseProgram(src){const cmds=[],conds=[],errors=[];
 src.split('\n').forEach((raw,i)=>{const line=raw.replace(/#.*$/,'').trim();if(!line)return;const w=line.toLowerCase().split(/\s+/);
  if(w[0]==='at'){const time=parseFloat(w[1]),op=w[2];if(isNaN(time)){errors.push(i+1);return}
   if(op==='pitch'||op==='throttle'){const v=parseFloat(w[3]);if(isNaN(v)){errors.push(i+1);return}cmds.push({time,op,v})}else if(['stage','cut','ignite'].includes(op))cmds.push({time,op});else errors.push(i+1)}
  else if(w[0]==='when'){const v=w[1],cmp=w[2],val=parseFloat(w[3]),op=w[4];if(!['altitude','velocity','apoapsis','periapsis','vspeed'].includes(v)||!['>','<'].includes(cmp)||isNaN(val)||!['cut','ignite','stage'].includes(op)){errors.push(i+1);return}conds.push({v,cmp,val,op})}
  else errors.push(i+1)});

 arrow(){const R=this.R,P=this.planet,c=R.toCam(P.pos);const x=R.ctx;let sx,sy,on=false;if(c[2]>0){[sx,sy]=R.sp(c);on=sx>0&&sy>0&&sx<R.W&&sy<R.H}if(on)return;let ang=Math.atan2(-c[1],c[0]);if(c[2]<0&&Math.abs(c[0])<1e-3&&Math.abs(c[1])<1e-3)ang=Math.PI/2;
  const rx=R.W/2-40*R.dpr,ry=R.H/2-40*R.dpr,k=Math.min(rx/Math.abs(Math.cos(ang)||1e-6),ry/Math.abs(Math.sin(ang)||1e-6));const px=R.W/2+Math.cos(ang)*k,py=R.H/2+Math.sin(ang)*k;
  x.save();x.translate(px,py);x.rotate(ang);x.fillStyle='rgba(255,207,106,.9)';x.beginPath();const s=14*R.dpr;x.moveTo(s,0);x.lineTo(-s*.6,s*.7);x.lineTo(-s*.6,-s*.7);x.closePath();x.fill();x.restore()},
 idle(dt){const R=this.R;this.it=(this.it||0)+dt;R.cam.pos=[Math.sin(this.it*.1)*30,8,Math.cos(this.it*.1)*30];R.cam.target=[0,0,0];R.cam.up=[0,1,0];R.cam.fov=55;R.fog=0;R.begin();R.camLight();const x=R.ctx;x.fillStyle='#000206';x.fillRect(0,0,R.W,R.H);R.stars(this.stars,1);
  for(let i=0;i<6;i++)R.add({mesh:this.astM[i%5],pos:[Math.cos(i*1.1+this.it*.05)*16,Math.sin(i*2.1)*6,Math.sin(i*1.1+this.it*.05)*16],scale:1.5+i%3,rot:M3.ry(this.it*.3+i)});
  R.add({mesh:this.ring,pos:[0,0,0],rot:M3.mul(M3.ry(this.it*.4),M3.rx(.3)),glowK:.25});for(const pt of this.ship)R.add({mesh:pt.mesh,pos:add([0,Math.sin(this.it)*.4,0],pt.pos),rot:M3.mul(M3.ry(this.it*.6),pt.rot||MI)});R.draw()}
};

/* ============================ CAMERA PLAYGROUND ============================ */
const Cam={
 init(){this.R=new R3D($('#camCv'));this.rocket=buildRocket(16).filter(p=>p.id!=='turbopump'&&p.id!=='feedline');this.ps=new PS();this.mode=1;this.rx=0;this.ry=-4.5;this.vy=0;this.flying=false;this.count=0;this.cool=0;this.ptr=null;this.stars=makeStars(400);
  this.parts2=[];for(let i=0;i<220;i++)this.parts2.push({x:Math.random(),y:Math.random(),vx:rnd(-.05,.05),vy:rnd(-.05,.05),h:rnd(180,280)});
  $('#cStart').onclick=()=>Motion.active?this.stopCam():this.startCam();$$('#v-cam .seg button').forEach(b=>b.onclick=()=>{this.mode=+b.dataset.m;$$('#v-cam .seg button').forEach(c=>c.classList.toggle('on',c===b));$('#cHint').innerHTML=t('c_hint'+this.mode);$('#cHint').dataset.i18n='c_hint'+this.mode});
  $('#cSnap').onclick=()=>this.snap();const cv=$('#camCv');
  cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();this.ptr={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,t:performance.now()}});
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();this.ptr={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,t:performance.now()};if(!Motion.active&&this.ptr.y<.4)this.fire()})},
 async startCam(){try{await Motion.start($('#camVid'));$('#cStart').textContent=t('c_stop');$('#cStart').dataset.i18n='c_stop';$('#cMsg').textContent=t('c_priv')}catch(e){$('#cMsg').textContent=t('c_nocam')}},
 stopCam(){Motion.stop();$('#cStart').textContent=t('c_start');$('#cStart').dataset.i18n='c_start'},
 enter(){this.R.resize()},leave(){if(Motion.active&&!$('#gCamSteer').checked)this.stopCam()},
 fire(){if(this.flying||this.cool>0)return;this.flying=true;this.vy=0},
 snap(){const R=this.R,c=document.createElement('canvas');c.width=R.W;c.height=R.H;const x=c.getContext('2d');const v=$('#camVid');
  if(Motion.active&&v.videoWidth){const s=Math.max(c.width/v.videoWidth,c.height/v.videoHeight),w=v.videoWidth*s,h=v.videoHeight*s;x.save();x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,(c.width-w)/2,(c.height-h)/2,w,h);x.restore()}else{x.fillStyle='#02040b';x.fillRect(0,0,c.width,c.height)}
  x.drawImage(R.cv,0,0);x.fillStyle='rgba(255,255,255,.85)';x.font=`700 ${18*R.dpr}px system-ui`;x.fillText('ORBIT LAB',16*R.dpr,c.height-18*R.dpr);
  try{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='orbit-lab.png';document.body.appendChild(a);a.click();a.remove()}catch(e){}},
 frame(dt){const R=this.R;R.resize();Motion.update();const live=Motion.active;let cx=.5,cy=.5,en=0,top=0;
  if(live){cx=Motion.cx;cy=Motion.cy;en=Motion.energy;top=Motion.top}else if(this.ptr&&performance.now()-this.ptr.t<1500){cx=this.ptr.x;cy=this.ptr.y;en=.03}
  $('#cMeter').style.width=Math.min(100,en*1500)+'%';$('#cCount').textContent=this.count;
  const x=R.ctx;x.clearRect(0,0,R.W,R.H);
  if(!live){const g=x.createLinearGradient(0,0,0,R.H);g.addColorStop(0,'#050a1e');g.addColorStop(1,'#140a26');x.fillStyle=g;x.fillRect(0,0,R.W,R.H)}
  R.cam.pos=[0,5,22];R.cam.target=[0,5,0];R.cam.up=[0,1,0];R.cam.fov=50;R.begin();R.camLight();if(!live)R.stars(this.stars,.9);
  if(this.mode===1){const halfW=22*Math.tan(25*Math.PI/180)*R.W/R.H;this.rx=lerp(this.rx,(cx-.5)*2*halfW*.75,1-Math.exp(-dt*5));this.cool=Math.max(0,this.cool-dt);
   if(live&&top>.07)this.fire();
   if(this.flying){this.vy+=16*dt;this.ry+=this.vy*dt;for(let i=0;i<4;i++){const e=[this.rx+rnd(-.3,.3)*.55,this.ry-.1,0];this.ps.emit(e,[rnd(-1,1),-14-this.vy*.3,rnd(-1,1)],.45,.45,i%2?'255,140,60':'255,220,150',1.8)}
    if(this.ry>26){this.flying=false;this.count++;this.ry=-16;this.cool=1}}else{this.ry=lerp(this.ry,-4.5,1-Math.exp(-dt*3))}
   const sc=.55,rot=M3.ry(performance.now()/1000*.6);for(const p of this.rocket)R.add({mesh:p.mesh,pos:add([this.rx,this.ry,0],M3.ap(rot,mul(p.pos,sc))),rot:M3.mul(rot,p.rot),scale:sc,double:p.double});
   R.draw();this.ps.step(dt,.5);this.ps.draw(R);
   if(!this.flying){x.fillStyle='rgba(255,255,255,.18)';x.fillRect(0,R.H*.33,R.W,1*R.dpr)}}
  else{const ax=cx*R.cssW,ay=cy*R.cssH,G=600+en*90000,W=R.cssW,H=R.cssH,d=R.dpr;x.globalCompositeOperation='lighter';
   for(const p of this.parts2){const px=p.x*W,py=p.y*H,dx=ax-px,dy=ay-py,r2=dx*dx+dy*dy+900,r=Math.sqrt(r2);const a=G/r2;p.vx+=dx/r*a*dt;p.vy+=dy/r*a*dt;p.x+=p.vx*dt/W*60;p.y+=p.vy*dt/H*60;
    if(p.x<-.1||p.x>1.1||p.y<-.1||p.y>1.1){p.x=Math.random();p.y=Math.random()<.5?-.05:1.05;p.vx=rnd(-1,1);p.vy=rnd(-1,1)}
    x.fillStyle=`hsla(${p.h},90%,70%,.8)`;x.fillRect(p.x*W*d,p.y*H*d,2.2*d,2.2*d)}
   const gs=sprite('255,200,120');const rr=(30+en*900)*d;x.drawImage(gs,ax*d-rr,ay*d-rr,rr*2,rr*2);x.globalCompositeOperation='source-over'}}
};

/* ============================ ROUTER ============================ */
const VIEWS={home:Home,struct:Struct,learn:Learn,sim:Sim,solar:Solar,game:Game,cam:Cam};
let cur='home';
function go(v){if(!VIEWS[v])return;if(v!==cur){VIEWS[cur].leave&&VIEWS[cur].leave();$('#v-'+cur).classList.remove('active');cur=v;$('#v-'+v).classList.add('active')}
 $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if($('#lesson'))$('#lesson').classList.remove('open');Learn.open=null;
 requestAnimationFrame(()=>VIEWS[v].enter&&VIEWS[v].enter());try{history.replaceState(null,'','#'+v)}catch(e){}}
let lastT=performance.now();
function loop(now){const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;try{const V=VIEWS[cur];V.frame&&V.frame(dt)}catch(e){console.error(e)}requestAnimationFrame(loop)}
function boot(){Object.values(VIEWS).forEach(v=>v.init&&v.init());
 $$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
 $('#lang').onchange=e=>{LANG=e.target.value;store.set('lang',LANG);applyLang()};applyLang();
 window.addEventListener('resize',()=>{const V=VIEWS[cur];V.R&&V.R.resize()});
 const h=(location.hash||'').slice(1);go(VIEWS[h]?h:'home');requestAnimationFrame(loop)}
boot();
</script>
