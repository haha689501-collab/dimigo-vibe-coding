<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>심연의 탑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --page-bg: #d4cfe0;
  --page-ink: #2b2542;
  --page-soft: #6a6285;
  --abyss: #1c1830;
  --stone: #2e2944;
  --stone-hi: #4d4668;
  --stone-lo: #13101f;
  --parch: #efe3c8;
  --dim: #a8a1c2;
  --torch: #f0b54a;
  --ember: #e05a4f;
  --moss: #5fbfa6;
  --frost: #8fb8ee;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --story: "Nanum Myeongjo", "AppleMyungjo", "Batang", "Noto Serif KR", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #14112a; --page-ink: #dcd6ee; --page-soft: #8d86a8; }
}
:root[data-theme="dark"] { --page-bg: #14112a; --page-ink: #dcd6ee; --page-soft: #8d86a8; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-bg);
  color: var(--page-ink);
  font-family: var(--display);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: var(--display); }
#app {
  width: min(calc(100% - 16px), max(560px, calc((100vh - 250px) * 1.4)), 1008px);
  width: min(calc(100% - 16px), max(560px, calc((100dvh - 250px) * 1.4)), 1008px);
  margin: 14px auto 24px;
  background: var(--abyss);
  color: var(--parch);
  box-shadow: 0 0 0 3px var(--stone-lo), 0 0 0 6px var(--stone-hi), 0 0 0 9px var(--stone-lo), 0 18px 50px rgba(10, 6, 30, 0.45);
  position: relative;
  user-select: none;
}

/* ---- 상단 상태줄 ---- */
#hud {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.4fr) auto;
  gap: 6px 14px;
  align-items: center;
  padding: 8px 12px;
  background: var(--stone);
  border-bottom: 3px solid var(--stone-lo);
  font-size: 15px;
}
#hud[hidden] { display: none; }
#hud-face { width: 40px; height: 40px; image-rendering: pixelated; background: var(--stone-lo); box-shadow: inset 0 0 0 2px var(--stone-hi); }
.who { min-width: 0; line-height: 1.15; }
.who b { display: block; font-weight: 400; font-size: 18px; color: var(--parch); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { color: var(--dim); font-size: 14px; }
.meters { display: grid; gap: 4px; }
.meter { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 6px; font-size: 13px; }
.meter .lbl { color: var(--dim); }
.meter .num { font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }
.bar { height: 10px; background: var(--stone-lo); box-shadow: inset 0 0 0 1px #000; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width 0.35s steps(8); }
.meter.hp .bar i { background: linear-gradient(#f07a6a 0 40%, var(--ember) 40%); }
.meter.xp .bar i { background: linear-gradient(#8fe0c8 0 40%, var(--moss) 40%); }
.meter.hp.low .bar i { animation: lowhp 0.8s steps(2) infinite; }
@keyframes lowhp { 50% { filter: brightness(1.6); } }
.side { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.res { display: flex; gap: 12px; font-size: 15px; white-space: nowrap; }
.res span b { font-weight: 400; color: var(--torch); }
.res .floor b { color: var(--parch); font-size: 18px; }

.btn {
  font-size: 15px;
  color: var(--parch);
  background: var(--stone-hi);
  border: 0;
  padding: 6px 12px 7px;
  box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.18), inset -2px -2px 0 rgba(0, 0, 0, 0.45), 0 0 0 2px var(--stone-lo);
  cursor: pointer;
  position: relative;
  line-height: 1.2;
}
.btn:hover:not(:disabled) { background: #5d5580; }
.btn:active:not(:disabled) { box-shadow: inset -2px -2px 0 rgba(255, 255, 255, 0.12), inset 2px 2px 0 rgba(0, 0, 0, 0.45), 0 0 0 2px var(--stone-lo); transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible { outline: 2px dashed var(--torch); outline-offset: 3px; }
.btn.gold { background: #8a6a2a; color: #fff5dc; }
.btn.gold:hover:not(:disabled) { background: #a07a30; }
kbd { font-family: var(--display); font-size: 0.75em; color: var(--dim); margin-left: 4px; }
.badge { position: absolute; top: -7px; right: -7px; background: var(--torch); color: var(--stone-lo); font-style: normal; font-size: 12px; padding: 1px 5px; box-shadow: 0 0 0 2px var(--stone-lo); }

/* ---- 무대 ---- */
#stage { position: relative; line-height: 0; outline: none; }
#cv { width: 100%; height: auto; display: block; image-rendering: pixelated; aspect-ratio: 1008 / 720; background: #0c0a16; touch-action: none; }
.ov { position: absolute; inset: 0; line-height: 1.5; display: flex; }
.ov[hidden] { display: none; }

#enemy-bar { position: absolute; top: 3%; left: 3%; width: min(38%, 380px); line-height: 1.3;
  background: rgba(19, 16, 31, 0.86); padding: 8px 12px 10px; box-shadow: 0 0 0 2px var(--stone-hi), 0 0 0 4px var(--stone-lo); }
#enemy-bar[hidden] { display: none; }
#enemy-bar .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; align-items: baseline; margin-bottom: 5px; }
#enemy-bar .nm { font-size: 20px; }
#enemy-bar .tag { font-size: 13px; color: var(--dim); }
#enemy-bar .tag b { font-weight: 400; color: var(--torch); }
#enemy-bar .bar { height: 12px; }
#enemy-bar .bar i { background: linear-gradient(#ff8a7a 0 40%, #c8403a 40%); }
#enemy-bar .hpn { font-size: 13px; color: var(--dim); margin-top: 3px; text-align: right; font-variant-numeric: tabular-nums; }
#enemy-bar.boss { box-shadow: 0 0 0 2px #8a2a3a, 0 0 0 4px var(--stone-lo); }

/* ---- 전투 말풍선 ---- */
#bubbles { position: absolute; inset: 0; pointer-events: none; line-height: 1.3; }
#bubbles[hidden] { display: none; }
.bstack { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
#bs-enemy { left: 42%; right: 13%; bottom: var(--anchor, 74%); }
#bs-player { left: 3%; width: 44%; bottom: var(--anchor, 41%); }
.bub { position: relative; max-width: 100%; padding: 5px 11px 6px; text-align: center;
  font-size: clamp(12px, 1.75vw, 18px); color: var(--parch); background: rgba(18, 15, 34, 0.93);
  box-shadow: 0 0 0 2px var(--bc, #6a5f8a), 0 0 0 4px rgba(10, 8, 20, 0.9);
  animation: bubIn 0.16s steps(3) both; }
.bub:not(:last-child) { opacity: 0.62; }
.bub:last-child::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--bc, #6a5f8a); }
.bub.out { animation: bubOut 0.3s ease forwards; }
.bub.crit, .bub.good { --bc: var(--torch); color: #ffe3a0; }
.bub.hurt { --bc: #c8504a; color: #ffc0b4; }
.bub.heal { --bc: #3f9a80; color: #b8f5df; }
.bub.miss { --bc: #5a5478; color: var(--dim); }
.bub.boss { --bc: #c83a64; color: #ffb4c8; }
.bub.warn { --bc: #c88a3a; color: #ffd8a0; }
.bub.info { --bc: #6a5f9a; color: #d4ccf4; }
.bub.enemyheal { --bc: #8a4aa0; color: #ecc4f4; }
@keyframes bubIn { from { opacity: 0; transform: translateY(8px) scale(0.92); } }
@keyframes bubOut { to { opacity: 0; transform: translateY(-6px); } }

#banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center; line-height: 1.1; pointer-events: none; }
#banner[hidden] { display: none; }
#banner b { display: block; font-weight: 400; font-size: clamp(40px, 8vw, 76px); color: var(--parch); text-shadow: 0 4px 0 var(--stone-lo), 0 0 30px rgba(240, 181, 74, 0.35); }
#banner span { display: block; margin-top: 10px; font-family: var(--story); font-weight: 700; font-size: clamp(15px, 2.2vw, 22px); color: var(--torch); }
#banner.show { animation: banner 2.1s ease both; }
@keyframes banner { 0% { opacity: 0; transform: translateY(12px); } 18%, 78% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---- 대화창 ---- */
#dlg { position: absolute; left: 3%; right: 3%; bottom: 3.5%; display: flex; gap: 14px; align-items: flex-start; line-height: 1.6;
  background: rgba(18, 15, 34, 0.95); padding: 14px 18px 16px; cursor: pointer; min-height: 22%;
  box-shadow: 0 0 0 3px var(--parch), 0 0 0 6px var(--stone-lo), inset 0 0 0 2px #3a3358; }
#dlg[hidden] { display: none; }
#dlg-face { width: clamp(52px, 9vw, 84px); height: auto; aspect-ratio: 1; image-rendering: pixelated; background: var(--stone); box-shadow: 0 0 0 2px var(--stone-hi); flex: none; }
#dlg-face[hidden] { display: none; }
.dlg-body { flex: 1; min-width: 0; }
#dlg-name { font-size: clamp(15px, 2vw, 19px); color: var(--torch); margin-bottom: 2px; }
#dlg-name:empty { display: none; }
#dlg-text { margin: 0; font-family: var(--story); font-weight: 700; font-size: clamp(15px, 2.1vw, 20px); color: var(--parch); white-space: pre-line; max-width: 62ch; }
#dlg.narr #dlg-text { font-weight: 400; font-style: normal; color: #e6dcf5; }
#dlg-choices { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
#dlg-choices:empty { display: none; }
#dlg-next { position: absolute; right: 16px; bottom: 8px; color: var(--torch); font-size: 14px; animation: nudge 0.9s steps(2) infinite; }
#dlg-next[hidden] { display: none; }
@keyframes nudge { 50% { transform: translateY(3px); } }

/* ---- 공용 시트(상태창/상점) ---- */
.sheet-wrap { margin: auto; width: min(94%, 720px); max-height: 94%; overflow: auto; background: rgba(22, 18, 38, 0.97);
  box-shadow: 0 0 0 3px var(--stone-hi), 0 0 0 6px var(--stone-lo); padding: 18px 20px 16px; }
.sheet-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.sheet-head canvas { width: 64px; height: 64px; image-rendering: pixelated; background: var(--stone); box-shadow: 0 0 0 2px var(--stone-hi); }
.sheet-head h2 { margin: 0; font-weight: 400; font-size: 26px; line-height: 1.1; }
.sheet-head p { margin: 2px 0 0; color: var(--dim); font-size: 15px; }
.sheet-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px 22px; }
.sheet h3 { margin: 0 0 8px; font-weight: 400; font-size: 17px; color: var(--torch); }
.stat-row { display: grid; grid-template-columns: 54px 36px 44px 1fr; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #332d4d; }
.stat-row .k { font-size: 17px; }
.stat-row .v { font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.stat-row small { color: var(--dim); font-size: 13px; line-height: 1.25; }
.stat-row .btn { padding: 3px 0 4px; font-size: 15px; }
.pts { margin: 10px 0 0; font-size: 16px; }
.pts b { font-weight: 400; color: var(--torch); font-size: 20px; }
.derived { display: flex; gap: 16px; margin-top: 8px; color: var(--dim); font-size: 15px; flex-wrap: wrap; }
.derived b { font-weight: 400; color: var(--parch); }
.kv { margin: 0 0 10px; font-size: 15px; line-height: 1.45; }
.kv dt { color: var(--dim); font-size: 13px; }
.kv dd { margin: 0 0 6px; }
.kv dd small { color: var(--dim); }
.sheet-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.goods { list-style: none; margin: 0; padding: 0; }
.goods li { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid #332d4d; }
.goods .gn { font-size: 18px; }
.goods .gd { grid-column: 1; color: var(--dim); font-size: 14px; line-height: 1.35; }
.goods .btn { grid-row: 1 / span 2; grid-column: 2; min-width: 84px; }
.goods .key { color: var(--dim); font-size: 13px; margin-right: 6px; }
.shop-msg { min-height: 1.5em; margin: 12px 0 0; font-family: var(--story); font-weight: 700; color: var(--torch); font-size: 16px; }

/* ---- 타이틀 ---- */
#ov-title { flex-direction: column; align-items: center; justify-content: space-between; padding: 6% 4% 5%; text-align: center; }
#ov-title .title-menu { position: absolute; right: 6%; bottom: 13%; align-items: stretch; }
@media (max-width: 720px) { #ov-title .title-menu { position: static; align-items: center; } #ov-title .title-menu .btn { min-width: 170px; font-size: 18px; } }
#ov-title h1 { margin: 0; font-weight: 400; font-size: clamp(54px, 12vw, 124px); line-height: 1; color: #f6ecd6; letter-spacing: 0.06em;
  text-shadow: 0 5px 0 #2a1d48, 0 10px 0 #140e26, 0 0 48px rgba(170, 120, 255, 0.45); }
#ov-title .sub { margin: 12px 0 0; font-family: var(--story); font-weight: 700; font-size: clamp(14px, 2vw, 19px); color: #d7cdf0; text-shadow: 0 2px 0 #140e26; }
.title-menu { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.title-menu .btn { font-size: 21px; min-width: 210px; padding: 9px 20px 10px; }
.title-menu p { margin: 4px 0 0; font-size: 14px; color: #cfc6e8; text-shadow: 0 1px 0 #000; }

#ov-name { align-items: center; justify-content: center; background: rgba(12, 10, 22, 0.55); }
.name-box { background: rgba(22, 18, 38, 0.97); box-shadow: 0 0 0 3px var(--stone-hi), 0 0 0 6px var(--stone-lo); padding: 22px 24px; width: min(90%, 420px); }
.name-box label { display: block; font-family: var(--story); font-weight: 700; font-size: 18px; margin-bottom: 12px; }
.name-box input { width: 100%; font-family: var(--display); font-size: 22px; padding: 8px 10px; background: var(--stone-lo); color: var(--parch); border: 0; box-shadow: inset 0 0 0 2px var(--stone-hi); }
.name-box .sheet-foot { margin-top: 14px; }

#ov-end { align-items: center; justify-content: center; background: rgba(8, 6, 16, 0.78); text-align: center; }
.end-box { width: min(90%, 560px); }
.end-box h2 { margin: 0 0 10px; font-weight: 400; font-size: clamp(30px, 5vw, 46px); line-height: 1.15; }
.end-box p { font-family: var(--story); font-weight: 700; font-size: 17px; margin: 6px 0; color: #e0d8f0; }
.end-box .stats { font-family: var(--display); font-weight: 400; color: var(--dim); font-size: 16px; margin: 14px 0 18px; }
.end-box.win h2 { color: var(--torch); }
.end-box.lose h2 { color: var(--ember); }

/* ---- 하단 패널 ---- */
#panel.off { display: none; }
#panel { background: var(--stone); border-top: 3px solid var(--stone-lo); padding: 10px 14px 12px; line-height: 1.45; }
#explore-ui { min-height: 96px; }
#explore-ui { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; }
#explore-ui[hidden], #battle-ui[hidden] { display: none; }
#msg { margin: 0; font-family: var(--story); font-weight: 700; font-size: 17px; color: var(--parch); min-height: 2.9em; max-width: 60ch; }
.keys { margin: 0; font-size: 14px; color: var(--dim); text-align: right; white-space: nowrap; line-height: 1.7; }
.keys kbd { color: var(--parch); margin: 0 2px; }
#toast { position: absolute; right: 14px; bottom: 10px; font-size: 13px; color: var(--moss); opacity: 0; transition: opacity 0.3s; }
#toast.on { opacity: 1; }
#battle-ui { display: flex; flex-direction: column; gap: 10px; }
.battle-row { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; }
#log-toggle { font-size: 15px; white-space: nowrap; }
#log-toggle .arr { display: inline-block; width: 1em; color: var(--torch); }
#blog-wrap { max-height: 10.5em; overflow-y: auto; background: var(--stone-lo); padding: 8px 12px; box-shadow: inset 0 0 0 2px #3a3358; scrollbar-color: var(--stone-hi) transparent; }
#blog-wrap[hidden] { display: none; }
#blog { list-style: none; margin: 0; padding: 0; font-family: var(--story); font-weight: 700; font-size: 15px; line-height: 1.55; }
#blog li { color: #cfc6e2; }
#blog li.turn { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #3a3358; }
#blog li:first-child.turn { margin-top: 0; padding-top: 0; border-top: 0; }
#blog .crit { color: var(--torch); }
#blog .hurt { color: #ff9a8a; }
#blog .heal { color: #8ee8c8; }
#blog .miss { color: var(--dim); }
#blog .boss { color: #ff7a9a; }
#blog .warn { color: #ffc070; }
#blog .info { color: #b8b0e0; }
#blog .enemyheal { color: #d89ae8; }
#blog .good { color: var(--torch); }
#cmds { display: grid; grid-template-columns: repeat(5, minmax(84px, auto)); gap: 8px; min-height: 58px; align-content: end; }
#cmds .btn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 6px 10px 7px; min-height: 58px; font-size: 17px; }
#cmds .btn small { font-size: 12px; color: var(--dim); margin-top: 2px; }
#cmds .btn .n { position: absolute; top: 4px; right: 7px; font-size: 12px; color: var(--dim); }
#cmds .btn.hot { background: #6a4a8a; }
#cmds .btn.wide { grid-column: 1 / -1; align-items: center; min-height: 44px; }

/* ---- 터치 패드 ---- */
#pad { display: none; padding: 10px 14px 14px; background: var(--stone); border-top: 3px solid var(--stone-lo); line-height: 1; }
#pad .dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 50px); gap: 6px; }
#pad .btn { font-size: 20px; padding: 0; touch-action: none; }
#pad .pad-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#pad .pad-side { display: grid; gap: 8px; }
#pad .pad-side .btn { padding: 12px 18px; font-size: 16px; }
@media (pointer: coarse), (max-width: 720px) {
  #pad.on { display: block; }
  .keys { display: none; }
}
@media (max-width: 720px) {
  #hud { grid-template-columns: auto minmax(0, 1fr) auto; font-size: 14px; }
  .meters { grid-column: 1 / -1; grid-row: 2; }
  .side { grid-column: 3; grid-row: 1; }
  .res { display: none; }
  .res.mobile { display: flex; }
  .battle-row { flex-direction: column-reverse; align-items: stretch; gap: 8px; }
  #log-toggle { font-size: 14px; padding: 5px 10px; }
  #cmds { grid-template-columns: repeat(3, 1fr); min-height: 112px; }
  #cmds .btn { min-height: 52px; font-size: 16px; }
  .sheet-grid { grid-template-columns: 1fr; }
  #msg { font-size: 15px; }
  #blog { font-size: 14px; }
  #blog-wrap { max-height: 8em; }
}
.res.mobile[hidden] { display: none !important; }
.res.mobile { display: none; gap: 10px; font-size: 14px; padding: 0 12px 8px; background: var(--stone); }
@media (max-width: 720px) { .res.mobile { display: flex; } }
@media (max-width: 720px) {
  #ov-sheet, #ov-end, #ov-name { position: fixed; z-index: 20; background: rgba(10, 8, 20, 0.8); }
  .sheet-wrap { max-height: 92vh; width: 94%; padding: 14px; }
  .stat-row { grid-template-columns: 48px 32px 48px 1fr; }
  #app.titlemode #cv { height: min(74vh, 640px); object-fit: cover; }
  #ov-title h1 { font-size: 54px; }
  #enemy-bar { width: 42%; top: 2%; left: 2%; padding: 4px 8px 6px; }
  #bs-enemy { left: 42%; right: 2%; }
  #bs-player { left: 1%; width: 48%; }
  .bstack .bub:nth-last-child(n+3) { display: none; }
  .bub { padding: 3px 7px 4px; }
  .bub:last-child::after { bottom: -9px; margin-left: -5px; border-width: 5px; }
  #enemy-bar .nm { font-size: 15px; }
  #enemy-bar .tag { font-size: 11px; }
  #enemy-bar .bar { height: 7px; }
  #enemy-bar .hpn { font-size: 11px; margin-top: 1px; }
  #dlg { padding: 10px 12px 12px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main id="app">
  <header id="hud" hidden>
    <canvas id="hud-face" width="16" height="16" aria-hidden="true"></canvas>
    <div class="who"><b id="hud-name"></b><span id="hud-class"></span></div>
    <div class="meters">
      <div class="meter hp" id="hud-hpm"><span class="lbl">체력</span><div class="bar"><i id="hud-hp-fill"></i></div><span class="num" id="hud-hp"></span></div>

// ---- 장비 (신규) ----
const WEAPONS = [
  [ { name: "녹슨 장검", atk: 3, price: 60 }, { name: "사냥꾼의 단검", atk: 4, price: 75 },

const ARMORS = [

  [ { name: "강철 흉갑", def: 6, hp: 0, price: 220 }, { name: "마력 로브", def: 4, hp: 30, price: 240 },

  [ { name: "용비늘 갑옷", def: 11, hp: 0, price: 650 }, { name: "대천사의 법의", def: 8, hp: 60, price: 680 },
    { name: "공허의 외투", def: 10, hp: 30, price: 700 } ],
];
const STARTER_WEAPON = { slot: "weapon", tier: -1, plus: 0, name: "낡은 목검", atk: 1, price: 10 };
const STARTER_ARMOR = { slot: "armor", tier: -1, plus: 0, name: "해진 여행복", def: 0, hp: 0, price: 10 };

const REWARD_XP_MUL = 0.7;
const REWARD_GOLD_MUL = 0.5;

// ---- 유틸 ----
const rnd = () => Math.random();
const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// 받침에 따라 조사 선택 (숫자로 끝나면 읽는 소리 기준: 영/일/삼/육/칠/팔 = 받침 있음)
const hasBatchim = (word) => {
  const w = String(word).replace(/['"』」)\]\s]+$/, "");
  const ch = w[w.length - 1] || "";
  if (/[0-9]/.test(ch)) return "013678".includes(ch);
  const c = ch.charCodeAt(0);
  if (c < 0xac00 || c > 0xd7a3) return false;
  return (c - 0xac00) % 28 !== 0;
};
const josa = (word, a, b) => word + (hasBatchim(word) ? a : b);

function tierOf(floor) { return floor <= 10 ? 0 : floor <= 20 ? 1 : 2; }

function makeItem(tier, slot) {
  tier = clamp(tier, 0, 2);
  slot = slot || (rnd() < 0.5 ? "weapon" : "armor");
  const base = choice(slot === "weapon" ? WEAPONS[tier] : ARMORS[tier]);
  const r = rnd();
  const plus = r < 0.6 ? 0 : r < 0.9 ? 1 : 2;
  const it = { slot, tier, plus, name: base.name + (plus ? ` +${plus}` : ""), price: Math.round(base.price * (1 + 0.25 * plus)) };
  if (slot === "weapon") it.atk = base.atk + plus * (tier + 1);
  else { it.def = base.def + plus * (tier + 1); it.hp = base.hp + plus * 5 * (tier + 1); }
  return it;
}
function sellPrice(it) { return Math.max(5, Math.floor(it.price * 0.3)); }
function itemStatText(it) {
  if (it.slot === "weapon") return `공격력 +${it.atk}`;
  return `방어 +${it.def}` + (it.hp ? `, 최대 체력 +${it.hp}` : "");
}

// ---- 플레이어 ----
function calcNextXp(level) { return Math.floor(45 * Math.pow(1.35, level - 1)); }

// mode: "ratio"(원본 keep_ratio=True) | "clamp"(keep_ratio=False) | "add"(늘어난 최대 체력만큼 회복)
function recalc(p, mode = "ratio") {
  const oldMax = Math.max(1, p.max_hp || 1);
  const oldHp = p.hp == null ? oldMax : p.hp;
  p.attack = 5 + p.str_stat * 2 + Math.floor(p.level / 3) + (p.weapon ? p.weapon.atk : 0);
  // 버그 수정: 레벨당 3.5 때문에 소수가 되던 최대 체력을 정수로
  p.max_hp = 15 + p.vit_stat * 8 + Math.floor((p.level - 1) * 3.5) + (p.armor ? p.armor.hp || 0 : 0);
  p.def = p.armor ? p.armor.def || 0 : 0;
  if (mode === "ratio") p.hp = Math.max(1, Math.floor(p.max_hp * (oldHp / oldMax) + 1e-9));
  else if (mode === "add") p.hp = Math.min(p.max_hp, oldHp + Math.max(0, p.max_hp - oldMax));
  else p.hp = Math.min(p.max_hp, oldHp);
}

function newPlayer(name) {
  const p = {
    name: name || "모험가", base_class: APPRENTICE, class_name: APPRENTICE, job_stage: 0,
    level: 1, xp: 0, next_xp: calcNextXp(1), stat_points: 15,
    str_stat: 6, agi_stat: 6, vit_stat: 6, potions: 2, gold: 20,
    skill1_cd: 0, skill2_cd: 0, guard: false, evade_bonus: false, burn: 0,
    weapon: { ...STARTER_WEAPON }, armor: { ...STARTER_ARMOR },
    attack: 0, hp: 1, max_hp: 1, def: 0, kills: 0,
  };
  recalc(p, "clamp");
  p.hp = p.max_hp;
  return p;
}

function addStat(p, key) {
  if (p.stat_points <= 0) return false;
  p[key] += 1;
  p.stat_points -= 1;
  recalc(p, "ratio");
  return true;
}

function equipItem(p, it) {
  const old = p[it.slot];
  p[it.slot] = it;
  recalc(p, "add");
  return old;
}

function getSkillInfo(p) {
  const t = CLASS_TREES[p.base_class];
  if (!t) return [{ name: "미해금", cd: 0 }, { name: "미해금", cd: 0 }];
  return [t.skill1, t.skill2];
}

// 반환: 오른 레벨 수. ev 에 연출 이벤트 추가
function gainXp(p, amount, ev) {
  p.xp += amount;
  let n = 0;
  while (p.xp >= p.next_xp) {
    p.xp -= p.next_xp;
    p.level += 1;
    p.next_xp = calcNextXp(p.level);
    p.stat_points += 4;
    recalc(p, "ratio");
    p.hp = p.max_hp;
    n++;
    if (ev) ev.push({ t: "levelup", level: p.level });
  }
  return n;
}

function chooseAwakenClass(p) {
  const s = p.str_stat, a = p.agi_stat, v = p.vit_stat;
  if (s === a && a === v) return "수인";
  if (s >= v && s >= a) return "마법사";
  if (v >= s && v >= a) return "전사";
  return "도적";
}

// 1차 각성 (버그 수정: 1차 전직명 adv1 을 실제로 사용)
function awaken(p) {
  const cls = chooseAwakenClass(p);
  const lines = [];
  p.base_class = cls;
  p.class_name = CLASS_TREES[cls].adv1;
  p.job_stage = 1;
  if (cls === "마법사") { p.str_stat += 5; lines.push("마력이 날뛰기 시작했다. (STR +5)"); }
  else if (cls === "전사") { p.vit_stat += 5; lines.push("강철의 가호가 내려졌다. (VIT +5)"); }
  else if (cls === "도적") { p.agi_stat += 5; lines.push("바람의 민첩함을 훔쳐냈다. (AGI +5)"); }
  else { p.stat_points += 7; lines.push("육체가 인간의 한계를 벗어났다. (스탯 포인트 +7)"); }
  recalc(p, "ratio");
  return { cls, lines };
}

function secondAdvance(p) {
  const t = CLASS_TREES[p.base_class];
  p.job_stage = 2;
  p.class_name = t.adv2;
}

  if (kind === "mid") {
    const b = MID_BOSSES[floor];
    return { id: b.id, kind, name: b.name, hp: b.hp, max_hp: b.hp, attack: b.attack, agi: b.agi,
      stunned: false, weaken_turns: 0, shield: 0, xp_reward: b.xp_reward, gold_reward: b.gold_reward,
      ability: "", sprite: b.id, last_pattern: "" };
  }
  let tier = MONSTER_TIERS[0];
  for (const t of MONSTER_TIERS) if (t.start <= floor && floor <= t.end) { tier = t; break; }
  const off = floor - tier.start;
  let hp = randint(...tier.hp) + off * tier.hp_scale;
  let atk = randint(...tier.atk) + off * tier.atk_scale;
  let agi = randint(...tier.agi) + off * tier.agi_scale;
  let xp = randint(...tier.xp) + off * tier.xp_scale;
  let gold = randint(...tier.gold) + off * tier.gold_scale;
  const name = choice(tier.names);
  const pt = MONSTER_PATTERNS[name];
  hp = Math.max(1, Math.floor(hp * pt.hp_mul));
  atk = Math.max(1, Math.floor(atk * pt.atk_mul));
  agi = Math.max(1, Math.floor(agi * (pt.agi_mul || 1)));
  // 층마다 몬스터가 여러 마리 있으므로 한 마리당 보상을 줄임 (원본: 층당 전투 0.62회)
  xp = Math.max(1, Math.floor(xp * pt.xp_mul * REWARD_XP_MUL));
  gold = Math.max(1, Math.floor(gold * pt.gold_mul * REWARD_GOLD_MUL));
  return { kind: "normal", name, hp, max_hp: hp, attack: atk, agi, stunned: false, weaken_turns: 0, shield: 0,
    xp_reward: xp, gold_reward: gold, ability: pt.ability, sprite: name };
}

// who: 말풍선을 띄울 캐릭터 ("player" | "enemy"). 기본은 그 턴에 행동하는 쪽
let ACTOR = "player";
// split: 기록엔 한 줄, 말풍선은 적/플레이어에 나눠 띄울 때 { enemy: "...", player: "..." }
const log = (ev, text, cls, who, split) => ev.push({ t: "log", text, cls, who: who || ACTOR, split });

function applyEnemyDamage(p, e, dmg, label, ev, opts = {}) {
  let final = Math.max(1, Math.floor(dmg));
  let evade = 0.1 + (e.agi || 8) * 0.006 - (p.agi_stat || 8) * 0.003;
  evade = clamp(evade, 0.02, 0.5);
  if (rnd() < evade) {
    log(ev, `${josa(e.name, "이", "가")} 공격을 피했다!`, "miss", "enemy");
    ev.push({ t: "missE" });
    return false;
  }
  if (e.shield > 0) {
    final = Math.max(1, Math.floor(final * 0.4));
    log(ev, "철벽에 막혀 위력이 줄었다!", "info", "enemy");
  }
  e.hp -= final;
  log(ev, `${label} ${final} 데미지!`, opts.crit ? "crit" : "hit");
  ev.push({ t: "hitE", amount: final, crit: !!opts.crit, hp: e.hp, sfx: opts.sfx || (opts.crit ? "crit" : "hit") });
  if (e.ability === "thorns" && final > 0) {
    const recoil = randint(2, 5);
    p.hp = Math.max(1, p.hp - recoil);
    log(ev, `${e.name}의 가시에 찔렸다. ${recoil} 피해.`, "hurt");
    ev.push({ t: "hitP", amount: recoil, hp: p.hp, small: true });
  }
  return true;
}

function tickCooldowns(p, used = "") {
  if (p.skill1_cd > 0 && used !== "skill1") p.skill1_cd -= 1;
  if (p.skill2_cd > 0 && used !== "skill2") p.skill2_cd -= 1;
}

function normalAttack(p, e, ev) {
  const critChance = Math.min(0.45, 0.05 + p.agi_stat * 0.006);
  const extraChance = Math.min(0.35, p.agi_stat * 0.01);
  let dmg = Math.max(1, randint(p.attack - 2, p.attack + 4));
  if (rnd() < extraChance) {
    const extra = randint(Math.max(1, Math.floor(p.attack / 2)), p.attack);
    dmg += extra;
    log(ev, `추가타 발동! +${extra}`, "info");
  }
  let crit = false;
  if (rnd() < critChance) { dmg *= 1.3; crit = true; log(ev, "치명타!", "crit"); }
  ev.push({ t: "anim", who: "player", kind: "slash" });
  applyEnemyDamage(p, e, dmg, "일반 공격!", ev, { crit });
}

function useSkill1(p, e, ev) {
  const cls = p.base_class, A = p.attack;
  if (cls === "전사") {
    ev.push({ t: "anim", who: "player", kind: "smash" });
    const hit = applyEnemyDamage(p, e, randint(A + 4, A + 9), "파쇄격! 바람을 찢으며 검을 내려쳤다.", ev, { sfx: "smash" });
    if (hit && rnd() < 0.35) {
      e.stunned = true;
      if (e.charging) { e.charging = false; log(ev, "기절한 군주가 모으던 힘이 흩어졌다!", "info", "enemy"); }
      log(ev, `${josa(e.name, "이", "가")} 기절했다!`, "info", "enemy");
    }
  } else if (cls === "마법사") {
    ev.push({ t: "anim", who: "player", kind: "fire" });
    applyEnemyDamage(p, e, randint(A + 5, A + 10), "파이어 에로우!", ev, { sfx: "magic" });
    e.weaken_turns = Math.max(e.weaken_turns || 0, 2);
    log(ev, "적이 화상을 입어 공격에 집중하지 못한다. (공격 약화)", "info", "enemy");
  } else if (cls === "도적") {
    ev.push({ t: "anim", who: "player", kind: "shadow" });
    applyEnemyDamage(p, e, randint(A + 5, A + 11), "암습! 적의 배후로 이동해 단검을 박아 넣었다.", ev, { sfx: "slash" });
  } else {
    const hits = randint(2, 4);
    let total = 0;
    for (let i = 0; i < hits; i++) total += randint(A, A + 3);
    ev.push({ t: "anim", who: "player", kind: "claw", hits });
    applyEnemyDamage(p, e, total, `야수 난무! 발톱을 마구 휘둘렀다. ${hits}연타로`, ev, { sfx: "claw" });
  }
  p.skill1_cd = CLASS_TREES[cls].skill1.cd;
}

function useSkill2(p, e, ev) {
  const cls = p.base_class, A = p.attack;
  if (cls === "전사") {
    ev.push({ t: "anim", who: "player", kind: "ultimate" });
    applyEnemyDamage(p, e, randint(A + 12, A + 30), "[필살기] 천지절단!", ev, { sfx: "ultimate" });
    const recoil = randint(6, 10);
    p.hp = Math.max(1, p.hp - recoil);
    log(ev, `하늘과 땅이 갈라진다. 강한 반동에 팔이 저릿하다. (-${recoil})`, "hurt");
    ev.push({ t: "hitP", amount: recoil, hp: p.hp, small: true });
  } else if (cls === "마법사") {
    ev.push({ t: "anim", who: "player", kind: "meteor" });
    applyEnemyDamage(p, e, randint(A + 14, A + 24), "[필살기] 메테오!", ev, { sfx: "ultimate" });
    log(ev, "하늘에서 신의 분노가 떨어진다.", "info");
  } else if (cls === "도적") {
    let dmg = randint(A + 10, A + 16), crit = false;
    if (rnd() < 0.9) { dmg *= 2; crit = true; log(ev, "사신의 낫이 스스로 급소를 노린다! (치명타)", "crit"); }
    else log(ev, "적의 움직임이 너무 빨라 급소를 빗맞혔다.", "info");
    ev.push({ t: "anim", who: "player", kind: "reaper" });
    applyEnemyDamage(p, e, dmg, "[필살기] 사신의 낫!", ev, { crit, sfx: "ultimate" });
    p.evade_bonus = true;
    log(ev, "어둠 속에 모습을 감췄다. (다음 공격 회피)", "info");
  } else {
    const dmg = randint(A + 11, A + 20), heal = randint(5, 15);
    ev.push({ t: "anim", who: "player", kind: "moon" });
    applyEnemyDamage(p, e, dmg, "[필살기] 월식 폭주!", ev, { sfx: "ultimate" });
    p.hp = Math.min(p.max_hp, p.hp + heal);
    log(ev, `달빛에 몸을 적시며 HP ${heal} 흡수.`, "heal");
    ev.push({ t: "healP", amount: heal, hp: p.hp });
  }
  p.skill2_cd = CLASS_TREES[cls].skill2.cd;
}

// 플레이어 행동. 반환 {ok, msg}
function playerAction(p, e, cmd, ev) {
  ACTOR = "player";
  p.guard = false;
  let used = "";
  if (cmd === "attack") normalAttack(p, e, ev);
  else if (cmd === "skill1") {
    if (p.job_stage < 1) return { ok: false, msg: "스킬은 Lv5 각성 후 해금된다." };
    if (p.skill1_cd > 0) return { ok: false, msg: `스킬 재사용 대기 중 (${p.skill1_cd}턴)` };
    useSkill1(p, e, ev); used = "skill1";
  } else if (cmd === "skill2") {
    if (p.job_stage < 2) return { ok: false, msg: "필살기는 Lv10 2차 전직 후 해금된다." };
    if (p.skill2_cd > 0) return { ok: false, msg: `필살기 재사용 대기 중 (${p.skill2_cd}턴)` };
    useSkill2(p, e, ev); used = "skill2";
  } else if (cmd === "guard") {
    p.guard = true;
    log(ev, "단단히 방어 자세를 취했다.", "info");
    ev.push({ t: "anim", who: "player", kind: "guard" });
  } else if (cmd === "potion") {
    if (p.potions <= 0) return { ok: false, msg: "남은 포션이 없다." };
    const heal = 20;
    p.potions -= 1;
    p.hp = Math.min(p.max_hp, p.hp + heal);
    log(ev, `포션 사용! HP ${heal} 회복`, "heal");
    ev.push({ t: "healP", amount: heal, hp: p.hp });
  }
  tickCooldowns(p, used);
  return { ok: true };
}

function chooseBossPattern(p, e, turn) {
  const pr = p.hp / Math.max(1, p.max_hp), br = e.hp / Math.max(1, e.max_hp);
  let inferno = 1.0, drain = 1.0, collapse = 0;
  if (p.guard) inferno += 1.1;
  if (pr <= 0.35) inferno += 1.2;
  if (br <= 0.55) drain += 1.4;
  if (br <= 0.3) drain += 1.0;
  inferno += Math.min(1.2, turn * 0.05);
  if (e.phase2 && e.boss_last_pattern !== "collapse") collapse = 1.6;
  const roll = rnd() * (inferno + drain + collapse);
  if (roll < inferno) return "inferno";
  if (roll < inferno + drain) return "drain";
  return "collapse";
}

function burnTick(p, ev) {
  if (p.burn > 0 && p.hp > 0) {
    const d = randint(7, 11);
    p.hp = Math.max(0, p.hp - d);
    p.burn -= 1;
    log(ev, `몸을 태우는 홍련의 불꽃! ${d} 피해 (남은 ${p.burn}턴)`, "hurt", "player");
    ev.push({ t: "hitP", amount: d, hp: p.hp, small: true, fire: true });
  }
}

function hurtPlayer(p, amount, ev, extra = {}) {
  p.hp -= amount;
  if (p.hp < 0) p.hp = 0;
  ev.push({ t: "hitP", amount, hp: p.hp, ...extra });
}

function enemyTurn(p, e, turn, ev) {
  ACTOR = "enemy";
  e.shield = 0;
  // --- 최종 보스 2페이즈 전환 ---
  if (e.kind === "boss" && !e.phase2 && e.hp > 0 && e.hp <= e.max_hp * 0.5) {
    e.phase2 = true;
    e.attack = Math.round(e.attack * 1.2);
    e.agi += 4;
    e.stunned = false;
    ev.push({ t: "phase2" });
    log(ev, "탑의 군주의 갑옷이 부서지며 진정한 모습이 드러난다!", "boss");
    log(ev, "군주의 공격력과 속도가 크게 오르고, 패턴이 잦아진다.", "boss");
    ev.push({ t: "say", name: e.name, text: "재미있군... 이 모습을 보는 건 네가 처음이다." });
    burnTick(p, ev);
    return;
  }
  if (e.stunned) {
    log(ev, `${josa(e.name, "은", "는")} 기절해서 움직이지 못한다.`, "info");
    e.stunned = false;
    burnTick(p, ev);
    return;
  }
  // --- 심연 붕괴 (모았던 힘 방출, 회피 불가 / 방어로만 경감) ---
  if (e.charging) {
    e.charging = false;
    ev.push({ t: "anim", who: "enemy", kind: "collapse" });
    if (p.evade_bonus) {
      p.evade_bonus = false;
      log(ev, "[심연 붕괴] ...그림자 속으로 몸을 숨겨 완벽히 피했다!", "boss", "player");
      ev.push({ t: "missP" });
      burnTick(p, ev);
      return;
    }
    let dmg = randint(e.attack + 28, e.attack + 42);
    if (p.guard) dmg = Math.floor(dmg * 0.35);
    dmg = Math.max(1, dmg - p.def);
    log(ev, `[심연 붕괴] 탑 전체가 무너져 내리는 충격! ${dmg} 피해${p.guard ? " (방어로 크게 경감)" : ""}`, "boss", null,
      { enemy: "[심연 붕괴] 탑 전체가 무너져 내린다!", player: `${dmg} 피해${p.guard ? " (방어로 크게 경감)" : ""}` });
    hurtPlayer(p, dmg, ev, { big: true });
    burnTick(p, ev);
    return;
  }
  if (p.evade_bonus) {
    log(ev, "그림자 속에서 완벽히 회피했다!", "miss", "player");
    p.evade_bonus = false;
    ev.push({ t: "missP" });
    burnTick(p, ev);
    return;
  }
  const ability = e.ability || "";
  // 버그 수정: 재생은 플레이어가 회피해도 발동
  if (ability === "regen" && turn % 3 === 0) {
    const heal = randint(6, 20);
    e.hp = Math.min(e.max_hp, e.hp + heal);
    log(ev, `${josa(e.name, "이", "가")} 재생한다. HP +${heal}`, "enemyheal");
    ev.push({ t: "healE", amount: heal, hp: e.hp });
  }
  let dodge = 0.03 + p.agi_stat * 0.005 - (e.agi || 8) * 0.005;
  dodge = clamp(dodge, 0.02, 0.45);
  // 보스 차지 패턴은 회피 판정 전에 결정 (모으는 턴은 공격하지 않음)
  const interval = e.kind === "boss" ? (e.phase2 ? 2 : 3) : 3;
  let pattern = "";
  if (e.kind === "boss" && turn % interval === 0) {
    pattern = chooseBossPattern(p, e, turn);
    e.boss_last_pattern = pattern;
    e.boss_pattern_count += 1;
    if (pattern === "collapse") {
      e.charging = true;
      log(ev, "탑의 군주가 심연의 힘을 모으기 시작한다... (다음 턴 강력한 공격! 방어하라)", "warn");
      ev.push({ t: "anim", who: "enemy", kind: "charge" });
      burnTick(p, ev);
      return;
    }
  }
  if (rnd() < dodge) {
    log(ev, `몸을 굴려 ${e.name}의 공격을 피했다!`, "miss", "player");
    ev.push({ t: "anim", who: "enemy", kind: "attack" });
    ev.push({ t: "missP" });
    burnTick(p, ev);
    return;
  }
  let incoming = randint(e.attack - 2, e.attack + 4);
  let special = false;
  if (e.weaken_turns > 0) {
    incoming = Math.max(1, Math.floor(incoming * 0.7));
    e.weaken_turns -= 1;
    log(ev, "적이 약화되어 공격력이 줄었다.", "info");
  }
  if (ability === "enrage" && e.hp <= e.max_hp * 0.5) {
    incoming = Math.floor(incoming * 1.4);
    log(ev, `${josa(e.name, "이", "가")} 분노해 공격이 강해졌다!`, "warn");
  }
  if (ability === "focus" && turn % 4 === 0) {
    incoming += randint(10, 20);
    log(ev, `${josa(e.name, "이", "가")} 당신의 틈을 찾아냈다!`, "warn");
  }
  let label = `${e.name}의 공격!`;
  if (pattern) {
    special = true;
    if (pattern === "inferno") {
      incoming = randint(e.attack + 6, e.attack + 12);
      label = "[보스 패턴] 지옥 화염!";
      if (p.guard) incoming = Math.max(1, Math.floor(incoming * 0.8));
      ev.push({ t: "anim", who: "enemy", kind: "inferno" });
    } else {
      incoming = randint(e.attack + 3, e.attack + 7);
      const heal = randint(8, 14) + (e.phase2 ? 10 : 0);
      e.hp = Math.min(e.max_hp, e.hp + heal);
      label = "[보스 패턴] 생명 흡수!";
      log(ev, `탑의 군주가 당신의 피를 마셨다. 보스 HP ${heal} 회복`, "enemyheal");
      ev.push({ t: "healE", amount: heal, hp: e.hp });
    }
  }
  // --- 중간 보스 패턴 ---
  if (e.kind === "mid" && turn % 3 === 0) {
    special = true;
    if (e.id === "gatekeeper") {
      const pat = e.last_pattern === "wall" ? "slam" : (rnd() < 0.5 ? "wall" : "slam");
      e.last_pattern = pat;
      if (pat === "wall") {
        e.shield = 1;
        label = "[수문장] 방패를 내리찍으며 철벽 태세!";
        log(ev, "다음 턴에 주는 피해가 크게 줄어든다.", "warn");
        if (p.guard) incoming = Math.max(1, Math.floor(incoming / 2));
      } else {
        incoming = randint(e.attack + 8, e.attack + 14);
        label = "[수문장] 대지 강타!";
        if (p.guard) incoming = Math.max(1, Math.floor(incoming * 0.6));
        ev.push({ t: "anim", who: "enemy", kind: "slam" });
      }
    } else {
      const pat = e.last_pattern === "curse" ? "storm" : (rnd() < 0.5 ? "curse" : "storm");
      e.last_pattern = pat;
      if (pat === "curse") {
        p.burn = 3;
        label = "[마녀] 홍련의 저주!";
        log(ev, "몸에 붉은 불꽃이 옮겨 붙었다. (3턴 화상)", "warn", "player");
        if (p.guard) incoming = Math.max(1, Math.floor(incoming / 2));
        ev.push({ t: "anim", who: "enemy", kind: "inferno" });
      } else {
        incoming = randint(e.attack + 10, e.attack + 18);
        label = "[마녀] 화염 폭풍!";
        if (p.guard) incoming = Math.max(1, Math.floor(incoming * 0.6));
        ev.push({ t: "anim", who: "enemy", kind: "inferno" });
      }
    }
  }
  if (p.guard && !special) {
    if (ability === "guard_break") {
      incoming = Math.max(1, Math.floor(incoming * 0.9));
      log(ev, "가드 파괴! 방어 자세가 무너졌다.", "warn", "player");
    } else incoming = Math.max(1, Math.floor(incoming / 2));
  }
  incoming = Math.max(1, incoming - p.def);
  if (!ev.some((x) => x.t === "anim" && x.who === "enemy")) ev.push({ t: "anim", who: "enemy", kind: "attack" });
  log(ev, `${label} ${incoming} 피해를 받았다.`, "hurt", null, { enemy: label, player: `${incoming} 피해를 받았다.` });
  hurtPlayer(p, incoming, ev);

  if (ability === "drain" && incoming > 0) {
    const heal = Math.max(1, Math.floor(incoming / 3));
    e.hp = Math.min(e.max_hp, e.hp + heal);
    log(ev, `${josa(e.name, "이", "가")} 생명력을 흡수해 HP ${heal} 회복`, "enemyheal");
    ev.push({ t: "healE", amount: heal, hp: e.hp });
  }
  if (ability === "venom" && rnd() < 0.35 && p.hp > 0) {
    const poison = randint(4, 8);
    log(ev, `맹독 추가 피해 ${poison}!`, "hurt", "player");
    hurtPlayer(p, poison, ev, { small: true, poison: true });
  }
  if (ability === "multi" && rnd() < 0.28 && p.hp > 0) {
    const extra = Math.max(1, Math.floor(incoming / 2));
    log(ev, `${e.name}의 연속 공격! 추가 피해 ${extra}`, "hurt", null, { enemy: "연속 공격!", player: `추가 피해 ${extra}` });
    hurtPlayer(p, extra, ev, { small: true });
  }
  burnTick(p, ev);
}

// 전투 승리 보상
function battleRewards(p, e, floor, ev) {
  const r = { gold: e.gold_reward, xp: e.xp_reward, potion: false, item: null };
  p.gold += r.gold;
  p.kills += 1;
  if (r.xp) gainXp(p, r.xp, ev);
  const potionChance = e.kind === "normal" ? 0.2 : 0.5;
  if (e.kind !== "boss" && rnd() < potionChance) { p.potions += 1; r.potion = true; }
  if (e.kind === "mid") r.item = makeItem(tierOf(floor) + 1);
  else if (e.kind === "normal" && rnd() < 0.12) r.item = makeItem(tierOf(floor));
  return r;
}

function cleanupAfterBattle(p) {
  p.guard = false;
  p.evade_bonus = false; // 버그 수정: 사신의 낫 회피가 다음 전투로 넘어가지 않게
  p.burn = 0;
}

// ================= 층 이벤트 =================
function openChest(p, floor) {
  const roll = rnd();
  if (roll < 0.1) { const g = randint(1, 2); p.str_stat += g; recalc(p, "ratio"); return { text: `전투 교본을 발견했다! STR +${g}`, kind: "stat" }; }
  if (roll < 0.2) { const g = randint(1, 2); p.agi_stat += g; recalc(p, "ratio"); return { text: `신속 부적을 발견했다! AGI +${g}`, kind: "stat" }; }
  if (roll < 0.3) { const g = randint(1, 2); p.vit_stat += g; recalc(p, "ratio"); return { text: `생명의 룬을 발견했다! VIT +${g}`, kind: "stat" }; }
  if (roll < 0.55) { const g = randint(18, 30) + floor * 4; p.gold += g; return { text: `금화 상자다! 금화 +${g}`, kind: "gold" }; }
  if (roll < 0.7) { p.potions += 1; return { text: "빛나는 포션을 발견했다! 포션 +1", kind: "potion" }; }
  if (roll < 0.88) { return { text: "장비를 발견했다!", kind: "item", item: makeItem(tierOf(floor)) }; }
  const xp = randint(20, 35) + floor * 4;
  return { text: `고대 기록을 읽었다! 경험치 +${xp}`, kind: "xp", xp };
}

const TRAP_TEXTS = [
  "어두운 복도의 튀어나온 못에 팔이 긁혔다!",
  "무언가 다리를 붙잡았다. 넘어지면서 발목을 삐었다.",
  "발바닥이 따끔해서 보니 송곳이 꽂혀 있었다...",
];
function trapDamage(p, floor) {
  const d = randint(8, 15) + floor;
  p.hp = Math.max(0, p.hp - d);
  return { dmg: d, text: choice(TRAP_TEXTS) };
}

// ---- 상점 ----
function shopBuy(p, id, offers) {
  const need = (g) => (p.gold < g ? { ok: false, msg: "금화가 부족하다." } : null);
  if (id === "potion") { const f = need(25); if (f) return f; p.gold -= 25; p.potions += 1; return { ok: true, msg: "포션을 샀다." }; }
  if (id === "rest") { const f = need(40); if (f) return f; p.gold -= 40; p.hp = p.max_hp; return { ok: true, msg: "모닥불 곁에서 쉬었다. 활력이 완전히 돌아왔다!" }; }
  if (id === "statpot") { const f = need(70); if (f) return f; p.gold -= 70; p.stat_points += 2; return { ok: true, msg: "능력 포션을 마셨다. 스탯 포인트 +2" }; }
  if (id === "book1") {
    // 버그 수정: 더 줄일 수 없으면 금화를 받지 않음
    if (p.skill1_cd <= 1) return { ok: false, msg: "지금은 더 깨달을 비법이 없다. (남은 쿨다운 2턴 이상일 때 사용)" };
    const f = need(80); if (f) return f; p.gold -= 80; p.skill1_cd = Math.max(0, p.skill1_cd - 1); return { ok: true, msg: "비법을 깨달았다! 스킬 쿨다운 -1" };
  }
  if (id === "book2") {
    if (p.skill2_cd <= 2) return { ok: false, msg: "이미 모든 진실을 깨달았다. (남은 쿨다운 3턴 이상일 때 사용)" };
    const f = need(120); if (f) return f; p.gold -= 120; p.skill2_cd = Math.max(0, p.skill2_cd - 1); return { ok: true, msg: "진실을 깨달았다! 필살기 쿨다운 -1" };
  }
  if (id === "weapon" || id === "armor") {
    const it = offers[id];
    if (!it) return { ok: false, msg: "이미 팔린 물건이다." };
    const f = need(it.price); if (f) return f;
    p.gold -= it.price;
    const old = equipItem(p, it);
    offers[id] = null;
    const refund = old && old.tier >= 0 ? sellPrice(old) : 0;
    p.gold += refund;
    return { ok: true, msg: `${it.name} 장착!` + (refund ? ` (기존 장비 ${refund}골드에 판매)` : "") };
  }
  return { ok: false, msg: "" };
}

const SPRITES = {};
function mirrorHalf(half) {
  return half.map((r) => {
    if (r.length !== 8) throw new Error("sprite half row must be 8: " + r);
    return r + [...r].reverse().join("");
  });
}
function defSprite(name, half, pal) {
  if (half.length !== 16) throw new Error("sprite needs 16 rows: " + name);
  SPRITES[name] = { rows: mirrorHalf(half), pal };
}

// ---- 렌더 캐시 ----
const _sprCache = new Map();
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
// variant: "n" 기본, "flash" 흰색 실루엣, "shadow" 검은 실루엣
function getSprite(spec, variant = "n") {
  const key = spec.name + "|" + variant + "|" + JSON.stringify(spec.pal || {});
  let c = _sprCache.get(key);
  if (c) return c;
  const s = SPRITES[spec.name];
  const pal = { ...s.pal, ...(spec.pal || {}) };
  c = document.createElement("canvas");
  c.width = 16; c.height = 16;
  const g = c.getContext("2d");
  const img = g.createImageData(16, 16);
  s.rows.forEach((row, y) => {
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      if (ch === ".") continue;
      let rgb = variant === "flash" ? [255, 255, 255] : variant === "shadow" ? [0, 0, 0] : hexRgb(pal[ch] || "#ff00ff");
      const i = (y * 16 + x) * 4;
      img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
    }
  });
  g.putImageData(img, 0, 0);
  _sprCache.set(key, c);
  return c;
}

  function freq(n) {
    const m = /^([A-G])([#b]?)(\d)$/.exec(n);
    if (!m) return 0;
    let midi = (Number(m[3]) + 1) * 12 + SEMI[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);

  };
  const JINGLES = {

    levelup: { bpm: 170, wave: "square", gain: 0.08, notes: "G4:0.25 C5:0.25 E5:0.25 G5:0.25 C6:0.25 E6:1" },

  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    document.addEventListener("visibilitychange", () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else ctx.resume();
    });
  }

  function tone(f, t, dur, wave, gain, dest, slideTo) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = wave; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  }

    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  function sfx(name) {

  function stopMusic() {
    if (timer) clearInterval(timer);

  }
  function music(name) {
    if (!ctx || current === name) return;
    stopMusic();
    const tr = TRACKS[name];
    if (!tr) return;
    current = name;
    const spb = 60 / tr.bpm;
    const voices = tr.voices.map((v) => {
      const notes = parse(v.notes);
      const len = notes.reduce((a, n) => a + n.beats, 0);
      return { ...v, notes, len, idx: 0, next: 0 };
    });
    const loopBeats = Math.max(...voices.map((v) => v.len));

    const tick = () => {
      if (!seq || !ctx) return;
      const ahead = ctx.currentTime + 0.3;
      for (const v of seq.voices) {
        while (v.next < ahead) {
          const n = v.notes[v.idx];
          const d = n.beats * spb;
          if (n.f) tone(n.f, v.next, Math.max(0.05, d * 0.92), v.wave, v.gain, musicBus);
          v.next += d;
          v.idx = (v.idx + 1) % v.notes.length;
        }
      }
      if (tr.drums) {
        while (seq.drumNext < ahead) {
          const i = seq.drumIdx % 8;
          if (i % 4 === 0) tone(110, seq.drumNext, 0.12, "sine", 0.35, musicBus, 40);
          if (i % 4 === 2) noise(seq.drumNext, 0.08, 0.12, musicBus, "bandpass", 1800);
          noise(seq.drumNext, 0.03, 0.05, musicBus, "highpass", 7000);
          seq.drumNext += spb / 2;
          seq.drumIdx++;

      }
    };
    tick();
    timer = setInterval(tick, 60);
  }
  function jingle(name) {
    if (!ctx || muted) return;
    const j = JINGLES[name];
    const spb = 60 / j.bpm;
    let t = ctx.currentTime + 0.02;
    for (const n of parse(j.notes)) {
      if (n.f) tone(n.f, t, n.beats * spb * 0.95, j.wave, j.gain, sfxBus);

    muted = m;
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.55, ctx.currentTime, 0.05);
  }
  function duck(on) {
    if (musicBus) musicBus.gain.setTargetAtTime(on ? 0.15 : 0.55, ctx.currentTime, 0.1);
  }
  return { init, sfx, music, stopMusic, jingle, setMuted, isMuted: () => muted, duck, current: () => current };
})();

const BOSS_LAYOUT = [
  "#####################",
  "########.....########",
  "########..S..########",
  "########.....########",
  "#####...........#####",
  "#####.#...B...#.#####",
  "#####...........#####",
  "#####.#.......#.#####",
  "#####...........#####",
  "#########...#########",
  "####.............####",
  "####.............####",
  "####......@......####",
  "####.............####",
  "#####################",
];

const idx = (x, y) => y * MW + x;
function isFloor(map, x, y) { return x >= 0 && y >= 0 && x < MW && y < MH && map.tiles[idx(x, y)] === 1; }

function bfs(tiles, sx, sy, blocked) {
  const dist = new Array(MW * MH).fill(-1);
  const q = [[sx, sy]];
  dist[idx(sx, sy)] = 0;
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      const i = idx(nx, ny);
      if (tiles[i] !== 1 || dist[i] >= 0) continue;
      if (blocked && blocked.has(i)) continue;
      dist[i] = dist[idx(x, y)] + 1;
      q.push([nx, ny]);
    }
  }
  return dist;
}

function placeTorches(map, count) {
  const cand = [];
  for (let y = 0; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++)
    if (map.tiles[idx(x, y)] === 0 && map.tiles[idx(x, y + 1)] === 1) cand.push({ x, y });
  map.torches = [];
  for (let i = 0; i < count && cand.length; i++) map.torches.push(cand.splice(Math.floor(rnd() * cand.length), 1)[0]);
}

function genBossFloor(n) {
  const tiles = new Array(MW * MH).fill(0);
  let start, boss, stairs;
  BOSS_LAYOUT.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== "#") tiles[idx(x, y)] = 1;
    if (ch === "@") start = { x, y };
    if (ch === "B") boss = { x, y };
    if (ch === "S") stairs = { x, y };
  }));
  const kind = n === 30 ? "boss" : "mid";
  const map = { floor: n, tier: tierOf(n), tiles, seen: new Array(MW * MH).fill(0), px: start.x, py: start.y,
    stairs: n === 30 ? null : { ...stairs, locked: true }, ents: [], bossFloor: true, nextId: 1 };
  map.ents.push({ id: map.nextId++, type: "boss", x: boss.x, y: boss.y, enemy: buildEnemy(n, kind) });
  map.torches = [{ x: 5, y: 3 }, { x: 15, y: 3 }, { x: 8, y: 0 }, { x: 12, y: 0 }, { x: 4, y: 9 }, { x: 16, y: 9 }];
  return map;
}

function genFloor(n) {
  if (n % 10 === 0) return genBossFloor(n);
  for (let attempt = 0; attempt < 200; attempt++) {
    const tiles = new Array(MW * MH).fill(0);
    const rooms = [];
    for (let i = 0; i < 90 && rooms.length < 7; i++) {
      const w = randint(3, 6), h = randint(3, 4);
      const x = randint(1, MW - w - 1), y = randint(1, MH - h - 1);
      if (rooms.some((r) => x - 1 < r.x + r.w && x + w + 1 > r.x && y - 1 < r.y + r.h && y + h + 1 > r.y)) continue;
      rooms.push({ x, y, w, h });
    }
    if (rooms.length < 5) continue;
    rooms.sort((a, b) => a.x + a.w / 2 - (b.x + b.w / 2));
    for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) tiles[idx(x, y)] = 1;
    const ctr = (r) => ({ x: r.x + Math.floor(r.w / 2), y: r.y + Math.floor(r.h / 2) });
    const connect = (a, b) => {
      const A = ctr(a), B = ctr(b);
      if (rnd() < 0.5) {
        for (let x = Math.min(A.x, B.x); x <= Math.max(A.x, B.x); x++) tiles[idx(x, A.y)] = 1;
        for (let y = Math.min(A.y, B.y); y <= Math.max(A.y, B.y); y++) tiles[idx(B.x, y)] = 1;
      } else {
        for (let y = Math.min(A.y, B.y); y <= Math.max(A.y, B.y); y++) tiles[idx(A.x, y)] = 1;
        for (let x = Math.min(A.x, B.x); x <= Math.max(A.x, B.x); x++) tiles[idx(x, B.y)] = 1;
      }
    };
    for (let i = 0; i < rooms.length - 1; i++) connect(rooms[i], rooms[i + 1]);
    if (rnd() < 0.6) connect(rooms[randint(0, rooms.length - 3)], rooms[rooms.length - 1 - randint(0, 1)]);

    const start = ctr(rooms[0]);
    const dist = bfs(tiles, start.x, start.y);
    let far = null, fd = -1;
    for (let i = 1; i < rooms.length; i++) { const c = ctr(rooms[i]); if (dist[idx(c.x, c.y)] > fd) { fd = dist[idx(c.x, c.y)]; far = rooms[i]; } }
    if (fd < 12) continue;
    const stairs = ctr(far);

    const map = { floor: n, tier: tierOf(n), tiles, seen: new Array(MW * MH).fill(0), px: start.x, py: start.y,
      stairs: { ...stairs, locked: false }, ents: [], bossFloor: false, nextId: 1 };
    const used = new Set([idx(start.x, start.y), idx(stairs.x, stairs.y)]);
    const roomTiles = [];
    for (let i = 1; i < rooms.length; i++) {
      const r = rooms[i];
      for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) roomTiles.push({ x, y });
    }
    const pick = (cond) => {
      const c = roomTiles.filter((t) => !used.has(idx(t.x, t.y)) && (!cond || cond(t)));
      if (!c.length) return null;
      const t = choice(c);
      used.add(idx(t.x, t.y));
      return t;
    };
    const farFromStart = (t) => Math.abs(t.x - start.x) + Math.abs(t.y - start.y) >= 5;
    const add = (o) => { o.id = map.nextId++; map.ents.push(o); };

    const nMon = n <= 3 ? randint(1, 2) : randint(2, 3);
    for (let i = 0; i < nMon; i++) { const t = pick(farFromStart); if (t) add({ type: "monster", x: t.x, y: t.y, enemy: buildEnemy(n) }); }
    const nChest = 1 + (rnd() < 0.35 ? 1 : 0);
    for (let i = 0; i < nChest; i++) { const t = pick(); if (t) add({ type: "chest", x: t.x, y: t.y, opened: false }); }
    const nTrap = 1 + (n > 5 ? 1 : 0) + (rnd() < 0.4 ? 1 : 0);
    for (let i = 0; i < nTrap; i++) {
      const t = pick((t) => Math.abs(t.x - stairs.x) + Math.abs(t.y - stairs.y) > 1);
      if (t) add({ type: "trap", x: t.x, y: t.y, triggered: false });
    }
    if (n === 9 || n === 19 || n === 29 || rnd() < 0.45) { const t = pick(); if (t) add({ type: "npc", npc: "merchant", x: t.x, y: t.y }); }
    if (HINT_FLOORS[n]) { const t = pick(); if (t) add({ type: "npc", npc: "wanderer", x: t.x, y: t.y }); }
    if (LORE_FLOORS[n]) { const t = pick(); if (t) add({ type: "npc", npc: "tablet", x: t.x, y: t.y }); }

    // 상자/NPC 가 길을 막지 않는지 확인
    const blocked = new Set(map.ents.filter((e) => e.type === "chest" || e.type === "npc").map((e) => idx(e.x, e.y)));
    const d2 = bfs(tiles, start.x, start.y, blocked);
    if (d2[idx(stairs.x, stairs.y)] < 0) continue;
    const reachable = map.ents.every((e) => e.type === "trap" || e.type === "monster"
      ? d2[idx(e.x, e.y)] >= 0
      : [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => d2[idx(e.x + dx, e.y + dy)] >= 0));
    if (!reachable) continue;
    placeTorches(map, randint(3, 5));
    return map;
  }
  throw new Error("map gen failed");
}

// ---- 시야 (브레젠험 직선 시야) ----
const VIEW_R = 5.3;
function computeVisible(map) {
  const vis = new Uint8Array(MW * MH);
  const px = map.px, py = map.py;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const dx = x - px, dy = y - py;
    if (dx * dx + dy * dy > VIEW_R * VIEW_R) continue;
    let x0 = px, y0 = py, ok = true;
    const sx = Math.sign(dx), sy = Math.sign(dy), ax = Math.abs(dx), ay = Math.abs(dy);
    let err = ax - ay;
    while (!(x0 === x && y0 === y)) {
      const e2 = 2 * err;
      if (e2 > -ay) { err -= ay; x0 += sx; }
      if (e2 < ax) { err += ax; y0 += sy; }
      if (x0 === x && y0 === y) break;
      if (map.tiles[idx(x0, y0)] !== 1) { ok = false; break; }
    }
    if (ok) { vis[idx(x, y)] = 1; map.seen[idx(x, y)] = 1; }
  }
  // 보이는 바닥에 붙은 벽도 보이게 (복도 테두리)
  const extra = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (!vis[idx(x, y)] || map.tiles[idx(x, y)] !== 1) continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      if (map.tiles[idx(nx, ny)] === 0) extra.push(idx(nx, ny));
    }
  }
  for (const i of extra) { vis[i] = 1; map.seen[i] = 1; }
  return vis;
}

// ---- 타일 그래픽 (절차 생성) ----
function mulberry(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mkCanvas(w, h, fn) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); fn(x); return c; }
const px1 = (g, c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };

const _tileSets = {};
function tileSet(tier) {
  if (_tileSets[tier]) return _tileSets[tier];
  const P = TIER_PAL[tier];
  const floors = [0, 1, 2].map((v) => mkCanvas(16, 16, (g) => {
    const r = mulberry(tier * 97 + v * 13 + 1);
    px1(g, v === 1 ? P.floor2 : P.floor, 0, 0, 16, 16);
    px1(g, P.grout, 0, 0, 16, 1); px1(g, P.grout, 0, 0, 1, 16);
    px1(g, P.grout, 0, 8, 16, 1);
    px1(g, P.grout, v === 2 ? 5 : 9, 1, 1, 7); px1(g, P.grout, v === 2 ? 11 : 4, 9, 1, 7);
    for (let i = 0; i < 7; i++) px1(g, P.speck, 1 + Math.floor(r() * 14), 1 + Math.floor(r() * 14));
    for (let i = 0; i < 4; i++) px1(g, P.grout, 1 + Math.floor(r() * 14), 1 + Math.floor(r() * 14));
  }));
  const face = mkCanvas(16, 16, (g) => {
    const r = mulberry(tier * 31 + 7);
    px1(g, P.face, 0, 0, 16, 16);
    px1(g, P.faceHi, 0, 0, 16, 2);
    for (const y of [5, 10, 15]) px1(g, P.line, 0, y, 16, 1);
    for (const x of [4, 12]) { px1(g, P.line, x, 2, 1, 3); px1(g, P.line, x, 11, 1, 4); }
    for (const x of [0, 8]) px1(g, P.line, x, 6, 1, 4);
    for (let i = 0; i < 6; i++) px1(g, P.faceHi, Math.floor(r() * 16), 2 + Math.floor(r() * 13));
  });
  const top = mkCanvas(16, 16, (g) => {
    const r = mulberry(tier * 53 + 3);
    px1(g, P.top, 0, 0, 16, 16);
    for (let i = 0; i < 10; i++) px1(g, P.topHi, Math.floor(r() * 16), Math.floor(r() * 16), 2, 1);
  });
  const stairs = mkCanvas(16, 16, (g) => {
    g.drawImage(floors[0], 0, 0);
    px1(g, "#0c0a16", 2, 1, 12, 3);
    const steps = ["#8a849e", "#9f99b4", "#b5afc9", "#cbc5dd"];
    steps.forEach((c, i) => { px1(g, c, 2, 4 + i * 3, 12, 3); px1(g, "#2a2638", 2, 6 + i * 3, 12, 1); });
    px1(g, "#1a1626", 1, 1, 1, 15); px1(g, "#1a1626", 14, 1, 1, 15);
  });
  const locked = mkCanvas(16, 16, (g) => {
    g.drawImage(stairs, 0, 0);
    for (let x = 2; x < 14; x += 3) px1(g, "#3a3440", x, 2, 2, 13);
    px1(g, "#5a5260", 1, 6, 14, 2); px1(g, "#5a5260", 1, 11, 14, 2);
  });
  const crack = mkCanvas(16, 16, (g) => {
    const c = "rgba(10,8,18,0.55)";
    [[4, 5], [5, 6], [6, 6], [7, 7], [8, 8], [9, 8], [10, 9], [11, 10], [7, 8], [6, 9], [6, 10], [9, 7], [10, 6]].forEach(([x, y]) => px1(g, c, x, y));
  });
  const spikes = mkCanvas(16, 16, (g) => {
    px1(g, "rgba(10,8,18,0.5)", 2, 3, 12, 11);
    for (const [x, y] of [[3, 4], [8, 4], [5, 9], [10, 9]]) {
      px1(g, "#c8c4d8", x + 1, y, 1, 1); px1(g, "#a8a4b8", x, y + 1, 3, 1); px1(g, "#88849a", x, y + 2, 3, 1); px1(g, "#5a566a", x - 1, y + 3, 5, 1);
    }
    px1(g, "#8a1a2a", 9, 5, 1, 1);
  });
  return (_tileSets[tier] = { floors, face, top, stairs, locked, crack, spikes });
}

const DLG = { el: $("#dlg"), name: $("#dlg-name"), text: $("#dlg-text"), choices: $("#dlg-choices"), face: $("#dlg-face"), next: $("#dlg-next"), active: null, hideT: 0 };
function showText(name, text, face) {
  clearTimeout(DLG.hideT);
  DLG.el.hidden = false;
  DLG.el.classList.toggle("narr", !name);
  DLG.name.textContent = name || "";
  if (face) { DLG.face.hidden = false; drawFace(DLG.face, face); } else DLG.face.hidden = true;
  DLG.choices.innerHTML = "";
  DLG.next.hidden = true;
  DLG.text.textContent = "";
  return new Promise((done) => {
    let i = 0;
    const st = { typing: true };
    const finish = () => {
      if (!st.typing) return;
      clearInterval(timer);
      st.typing = false;
      DLG.text.textContent = text;
      done();
    };
    const timer = setInterval(() => {
      i += reduceMotion ? 6 : 1;
      DLG.text.textContent = text.slice(0, i);
      if (i % 2 === 0 && text[i - 1] && text[i - 1] !== " ") Sound.sfx("blip");
      if (i >= text.length) finish();
    }, 26);
    DLG.typing = st;
    DLG.finishTyping = finish;
  });
}
function hideDlgSoon() { DLG.hideT = setTimeout(() => { DLG.el.hidden = true; }, 60); }
async function say(name, text, face) {
  let resolveAdv;
  const adv = new Promise((r) => (resolveAdv = r));
  DLG.active = { type: "say", advance: () => { if (DLG.typing && DLG.typing.typing) { DLG.finishTyping(); return; } resolveAdv(); } };
  await showText(name, text, face);
  DLG.next.hidden = false;
  await adv;
  DLG.active = null;
  hideDlgSoon();
}
async function choose(name, text, options, face) {
  DLG.active = { type: "choice", advance: () => { if (DLG.typing && DLG.typing.typing) DLG.finishTyping(); } };
  await showText(name, text, face);
  return new Promise((res) => {
    const shownAt = performance.now();
    const pick = (i) => {
      if (performance.now() - shownAt < 160) return;
      Sound.sfx("select");
      DLG.active = null;
      hideDlgSoon();
      res(i);
    };
    DLG.active = { type: "choice", pick, count: options.length, advance: () => {} };
    options.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "btn" + (i === 0 ? " gold" : "");
      b.type = "button";
      b.innerHTML = `${esc(o)}<kbd>${i + 1}</kbd>`;
      b.addEventListener("click", (e) => { e.stopPropagation(); pick(i); });
      DLG.choices.appendChild(b);
    });
    DLG.choices.firstChild.focus({ preventScroll: true });
  });
}

    const r = shopBuy(p, id, offers);
    msg = r.msg;
    Sound.sfx(r.ok ? (id === "rest" ? "heal" : "buy") : "deny");
    refreshHUD();
    render();
    const b = SHEET.box.querySelector(`[data-buy="${id}"]`) || SHEET.box.querySelector('[data-act="close"]');
    b.focus({ preventScroll: true });
  };
  SHEET.box.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (b.dataset.buy) buy(b.dataset.buy);
    if (b.dataset.act === "close") SHEET.close();
  };
  return openSheet(render, (key) => {
    const n = Number(key);
    if (n >= 1 && n <= 7) { const it = goods()[n - 1]; if (it.price != null) buy(it.id); return true; }
    if (key === "Escape") { SHEET.close(); return true; }
    return false;
  });
}

// 좁은 화면에서는 플레이어를 따라가는 카메라로 확대

function drawMapInner() {

      drawEntitySprite(spec, e.x * T, e.y * T, 1, e.npc === "tablet" ? 0 : Math.round(Math.sin(t * 2 + e.id) * 1.5));

    }

  else drawEntitySprite(heroSprite(S.player), px * T, py * T, 1, bob);
  // 안개 & 조명

    if (m.seen[i] && !vis[i]) { g.fillStyle = "rgba(10,8,20,0.66)"; g.fillRect(x * T, y * T, T, T); }
  }
  const cxp = (px + 0.5) * T, cyp = (py + 0.5) * T;

  rg.addColorStop(0, "rgba(10,8,20,0)"); rg.addColorStop(1, "rgba(10,8,20,0.45)");

}

    const r = es * (0.62 + 0.06 * Math.sin(t * (B.charge ? 14 : 6)));
    const gg = g.createRadialGradient(ex, ey - es / 2, 10, ex, ey - es / 2, r);
    gg.addColorStop(0, `rgba(${col},0.55)`); gg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gg; g.fillRect(ex - r, ey - es / 2 - r, r * 2, r * 2);
    g.globalCompositeOperation = "source-over";
    if (rnd() < 0.5) B.parts.push({ x: ex + (rnd() - 0.5) * es * 0.8, y: ey - rnd() * es, vx: 0, vy: -90, life: 0.8, max: 0.8, color: B.charge ? "#b080ff" : "#ff5070", size: 6, grav: 0 });
  }
  if (eAlpha > 0) {
    g.globalAlpha = eAlpha;
    const flash = B.eFlash > t && Math.floor(t * 30) % 2 === 0;
    const flick = B.eDying && Math.floor(t * 20) % 2 === 0;
    if (!flick) g.drawImage(getSprite(monsterSprite(e), flash ? "flash" : "n"), Math.round(ex - es / 2), Math.round(ey - es + bobE), es, es);
    g.globalAlpha = 1;
  }
  // 플레이어
  const ps = 16 * 8;
  let px = PPOS.x, py = PPOS.y;
  if (B.pLunge) { const k = (t - B.pLunge) / 0.26; if (k < 1) { px += Math.sin(k * Math.PI) * 70; py -= Math.sin(k * Math.PI) * 18; } else B.pLunge = 0; }
  pxEllipse(g, PPOS.x, PPOS.y + 4, 46, 10, "rgba(0,0,0,0.35)");
  if (p.guard) {
    g.globalCompositeOperation = "lighter";
    const gg = g.createRadialGradient(px, py - ps / 2, 20, px, py - ps / 2, 110);
    gg.addColorStop(0, "rgba(120,170,255,0.05)"); gg.addColorStop(0.8, "rgba(120,170,255,0.3)"); gg.addColorStop(1, "rgba(120,170,255,0)");
    g.fillStyle = gg; g.fillRect(px - 110, py - ps / 2 - 110, 220, 220);
    g.globalCompositeOperation = "source-over";
  }
  if (p.evade_bonus) g.globalAlpha = 0.45;
  const pflash = B.pFlash > t && Math.floor(t * 30) % 2 === 0;
  g.drawImage(getSprite(heroSprite(p), pflash ? "flash" : "n"), Math.round(px - ps / 2), Math.round(py - ps + Math.sin(t * 3) * 3), ps, ps);
  g.globalAlpha = 1;
  if (p.burn > 0 && rnd() < 0.35) B.parts.push({ x: px + (rnd() - 0.5) * 70, y: py - rnd() * 100, vx: 0, vy: -120, life: 0.5, max: 0.5, color: rnd() < 0.5 ? "#ff7030" : "#ffc050", size: 7, grav: 0 });
  // 이펙트
  B.fx = B.fx.filter((f) => { const k = (t - f.t0) / f.dur; if (k >= 1) return false; f.draw(Math.max(0, k)); return true; });
  const dt = Math.min(0.05, S.dt);
  B.parts = B.parts.filter((q) => {
    q.life -= dt; if (q.life <= 0) return false;
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.grav * dt;
    g.globalAlpha = Math.max(0, Math.min(1, q.life / q.max * 1.4));
    g.fillStyle = q.color; const s = Math.max(2, Math.round(q.size)); g.fillRect(Math.round(q.x - s / 2), Math.round(q.y - s / 2), s, s);
    g.globalAlpha = 1;
    return true;
  });
  if (B.screenFlash > t) { g.fillStyle = B.flashColor || "rgba(255,255,255,0.6)"; g.globalAlpha = Math.min(1, (B.screenFlash - t) * 4); g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  // 떠오르는 숫자
  g.textAlign = "center"; g.textBaseline = "middle";
  B.floaters = B.floaters.filter((f) => {
    const k = (t - f.t0) / 1.0; if (k >= 1) return false;
    const y = f.y - 70 * Math.min(1, k * 1.6);
    g.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    g.font = `${f.size}px "Do Hyeon", sans-serif`;
    g.lineWidth = 7; g.strokeStyle = "#140e22"; g.strokeText(f.text, f.x, y);
    g.fillStyle = f.color; g.fillText(f.text, f.x, y);
    g.globalAlpha = 1;
    return true;
  });
}

// 스킬/공격 연출
function playAnim(ev) {
  const B = S.battle, e = B.enemy, sc = enemyScale(e) * 16;
  const EX = EPOS.x, EY = EPOS.y - sc / 2, PX = PPOS.x, PY = PPOS.y - 64;
  const k = ev.kind;
  if (ev.who === "player") {
    if (k === "guard") { Sound.sfx("guard"); burst(PX, PY, "#9fc4ff", 14, 180, 7); return 260; }
    B.pLunge = S.time;
    if (k === "slash") {
      Sound.sfx("slash");
      fxAdd(0.28, (q) => { g.strokeStyle = "#ffffff"; g.lineWidth = 8; g.globalAlpha = 1 - q; g.beginPath(); g.moveTo(EX - 90, EY - 90 + q * 30); g.lineTo(EX - 90 + 180 * Math.min(1, q * 2.5), EY - 90 + 180 * Math.min(1, q * 2.5)); g.stroke(); g.globalAlpha = 1; });
      return 200;
    }
    if (k === "smash") {
      fxAdd(0.45, (q) => { g.strokeStyle = "#ffe0a0"; g.lineWidth = 10 * (1 - q); g.beginPath(); g.ellipse(EX, EPOS.y, 40 + q * 180, 12 + q * 40, 0, 0, Math.PI * 2); g.stroke(); });
      burst(EX, EPOS.y - 20, "#d8c8a8", 22, 360, 9, 700); shake(12); return 280;
    }
    if (k === "fire") {
      fxAdd(0.3, (q) => { const x = PX + (EX - PX) * q, y = PY + (EY - PY) * q - Math.sin(q * Math.PI) * 60; g.fillStyle = "#ff8030"; g.fillRect(x - 14, y - 14, 28, 28); g.fillStyle = "#ffe080"; g.fillRect(x - 7, y - 7, 14, 14); });
      setTimeout(() => S.battle && burst(EX, EY, "#ff7a2a", 26, 340, 10), 280);
      return 330;
    }
    if (k === "shadow") {
      fxAdd(0.34, (q) => { g.strokeStyle = "#b080ff"; g.lineWidth = 7; g.globalAlpha = 1 - q; g.beginPath(); g.moveTo(EX - 80, EY - 80); g.lineTo(EX + 80, EY + 80); g.moveTo(EX + 80, EY - 80); g.lineTo(EX - 80, EY + 80); g.stroke(); g.globalAlpha = 1; });
      burst(EX, EY, "#7a4ab0", 18, 260, 8); return 260;
    }
    if (k === "claw") {
      const hits = ev.hits || 3;
      for (let i = 0; i < hits; i++) setTimeout(() => { if (!S.battle) return; Sound.sfx("claw"); const ox = (i - hits / 2) * 26; fxAdd(0.22, (q) => { g.strokeStyle = "#ffb060"; g.lineWidth = 6; g.globalAlpha = 1 - q; for (let j = -1; j <= 1; j++) { g.beginPath(); g.moveTo(EX + ox + j * 22 - 50, EY - 70); g.lineTo(EX + ox + j * 22 + 30, EY + 70); g.stroke(); } g.globalAlpha = 1; }); }, i * 110);
      return 120 * hits + 80;
    }
    if (k === "ultimate") {
      B.screenFlash = S.time + 0.25; B.flashColor = "rgba(255,255,255,0.7)";
      fxAdd(0.6, (q) => { g.fillStyle = `rgba(255,240,200,${(1 - q).toFixed(2)})`; g.fillRect(EX - 30 + q * 20, 0, 60 - q * 40, H); });
      burst(EX, EY, "#fff0c0", 36, 460, 10); shake(20); return 480;
    }
    if (k === "meteor") {
      fxAdd(0.4, (q) => { const x = EX + 260 * (1 - q), y = -80 + (EY + 80) * q; g.fillStyle = "#ff6020"; g.fillRect(x - 36, y - 36, 72, 72); g.fillStyle = "#ffd070"; g.fillRect(x - 20, y - 20, 40, 40); g.fillStyle = "rgba(255,120,40,0.4)"; g.fillRect(x, y - 30, 120, 26); });
      setTimeout(() => { if (!S.battle) return; burst(EX, EY, "#ff7030", 44, 520, 12, 200); burst(EX, EY, "#ffe080", 20, 300, 8); shake(22); B.screenFlash = S.time + 0.2; B.flashColor = "rgba(255,160,80,0.6)"; }, 380);
      return 560;
    }
    if (k === "reaper") {
      fxAdd(0.45, (q) => { g.strokeStyle = "#c090ff"; g.lineWidth = 14 * (1 - q) + 2; g.beginPath(); g.arc(EX, EY, 120, -Math.PI * 0.9, -Math.PI * 0.9 + Math.PI * 1.5 * Math.min(1, q * 2)); g.stroke(); });
      burst(EX, EY, "#5a2a90", 30, 380, 9); shake(14); return 380;
    }
    if (k === "moon") {
      fxAdd(0.6, (q) => { pxEllipse(g, EX, 120, 60, 60, `rgba(230,230,255,${(0.8 * (1 - q)).toFixed(2)})`); pxEllipse(g, EX + 24, 104, 46, 46, `rgba(20,16,40,${(0.9 * (1 - q)).toFixed(2)})`); });
      burst(EX, EY, "#e0e0ff", 26, 360, 9); shake(12); return 420;
    }
    return 200;
  }
  // 적 행동
  if (k === "attack" || k === "slam") {
    B.eLunge = S.time;
    if (k === "slam") setTimeout(() => { if (!S.battle) return; burst(PX, PPOS.y, "#c8b898", 26, 380, 9, 800); shake(16); }, 160);
    return 220;
  }
  if (k === "inferno") {
    B.eLunge = S.time;
    for (let i = 0; i < 26; i++) B.parts.push({ x: PX + (rnd() - 0.5) * 200, y: PY - 200 - rnd() * 120, vx: (rnd() - 0.5) * 40, vy: 400 + rnd() * 200, life: 0.6, max: 0.6, color: rnd() < 0.5 ? "#ff6020" : "#ffc050", size: 12, grav: 200 });
    return 300;
  }
  if (k === "charge") {
    Sound.sfx("charge");
    B.charge = true;
    for (let i = 0; i < 30; i++) { const a = rnd() * Math.PI * 2, r = 260; B.parts.push({ x: EX + Math.cos(a) * r, y: EY + Math.sin(a) * r, vx: -Math.cos(a) * r * 1.4, vy: -Math.sin(a) * r * 1.4, life: 0.7, max: 0.7, color: "#9a60ff", size: 8, grav: 0 }); }
    return 500;
  }
  if (k === "collapse") {
    B.charge = false;
    B.screenFlash = S.time + 0.4; B.flashColor = "rgba(40,10,60,0.8)";
    for (let i = 0; i < 40; i++) B.parts.push({ x: rnd() * W, y: -rnd() * 200, vx: 0, vy: 500 + rnd() * 300, life: 1.1, max: 1.1, color: rnd() < 0.5 ? "#5a5070" : "#3a3450", size: 14 + rnd() * 16, grav: 600 });
    shake(30);
    return 450;
  }
  return 200;
}

async function fadeTo(target, ms = 350) {
  const from = S.fade, t0 = performance.now();
  while (true) {
    const k = Math.min(1, (performance.now() - t0) / ms);
    S.fade = from + (target - from) * k;
    if (k >= 1) break;
    await sleep(16);
  }
}

let _flashUntil = 0, _flashColor = "";
function flashScreen(color, dur = 0.5) { _flashUntil = S.time + dur; _flashColor = color; }

// ---------- 탐험 ----------
const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] };
const MOVE_MS = 130;

function monsterWalkable(x, y) {
  const m = S.map;
  if (!isFloor(m, x, y)) return false;
  if (m.stairs && m.stairs.x === x && m.stairs.y === y) return false;
  return !m.ents.some((e) => e.x === x && e.y === y && e.type !== "trap");
}

async function tryMove(dx, dy) {
  if (S.lock || S.mode !== "explore" || S.overlay || DLG.active || S.moving) return;
  const m = S.map, nx = m.px + dx, ny = m.py + dy;
  if (!isFloor(m, nx, ny)) return;
  const ent = entAt(nx, ny);
  if (ent) {
    S.lock = true;
    S.heldDir = null;
    if (ent.type === "monster" || ent.type === "boss") await encounter(ent);
    else if (ent.type === "chest") { if (ent.opened) setMsg("이미 비어 있는 상자다."); else await openChestFlow(ent); }
    else if (ent.type === "npc") await talkFlow(ent);
    if (S.mode === "explore") S.lock = false;
    return;
  }
  S.lock = true;
  S.moving = { fx: m.px, fy: m.py, t0: performance.now(), dur: MOVE_MS };
  m.px = nx; m.py = ny;
  S.vis = computeVisible(m);
  // 몬스터 이동
  let attacker = null;
  for (const e of m.ents) {
    if (e.type !== "monster" || attacker) continue;
    const d = Math.abs(e.x - m.px) + Math.abs(e.y - m.py);
    let step = null;
    if (d <= 3 && S.vis[idx(e.x, e.y)] && rnd() < 0.6) {
      const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([ax, ay]) => ({ x: e.x + ax, y: e.y + ay }))
        .sort((a, b) => Math.abs(a.x - m.px) + Math.abs(a.y - m.py) - (Math.abs(b.x - m.px) + Math.abs(b.y - m.py)));
      step = opts.find((o) => (o.x === m.px && o.y === m.py) || monsterWalkable(o.x, o.y));
    } else if (rnd() < 0.3) {
      const [ax, ay] = choice([[1, 0], [-1, 0], [0, 1], [0, -1]]);
      if (monsterWalkable(e.x + ax, e.y + ay)) step = { x: e.x + ax, y: e.y + ay };
    }
    if (!step) continue;
    if (step.x === m.px && step.y === m.py) { attacker = e; continue; }
    e.ax = e.x; e.ay = e.y; e.x = step.x; e.y = step.y;
    const t0 = performance.now();
    const anim = () => { const k = Math.min(1, (performance.now() - t0) / MOVE_MS); e.ax = e.ax + (e.x - e.ax) * k; e.ay = e.ay + (e.y - e.ay) * k; if (k < 1) requestAnimationFrame(anim); else { delete e.ax; delete e.ay; } };
    requestAnimationFrame(anim);
  }
  await sleep(MOVE_MS);
  S.moving = null;
  // 함정
  const trap = m.ents.find((e) => e.type === "trap" && e.x === m.px && e.y === m.py && !e.triggered);
  if (trap) {
    trap.triggered = true;
    const r = trapDamage(S.player, S.floor);
    Sound.sfx("trap");
    shakeMap(10);
    S.hurtFlash = S.time + 0.5;
    refreshHUD();
    setMsg(`${r.text} 체력 -${r.dmg}`);
    if (S.player.hp <= 0) { await gameOver("함정"); return; }
    saveGame(true);
  }
  if (attacker) { S.heldDir = null; await encounter(attacker); if (S.mode === "explore") S.lock = false; return; }
  // 계단
  if (m.stairs && m.stairs.x === m.px && m.stairs.y === m.py) {
    S.heldDir = null;
    if (m.stairs.locked) { setMsg("계단이 굳게 잠겨 있다. 이 층의 주인을 쓰러뜨려야 열린다."); S.lock = false; return; }
    const i = await choose(null, `${S.floor + 1}층으로 올라갈까요?`, ["올라간다", "조금 더 둘러본다"]);
    if (i === 0) {
      Sound.sfx("stairs");
      await fadeTo(1, 400);
      await enterFloor(S.floor + 1);
      return;
    }
  }
  S.lock = false;
}
function shakeMap(n) { if (!reduceMotion) S.shake = Math.max(S.shake, n); }

async function openChestFlow(ent) {
  ent.opened = true;
  ent.talked = true;

  const p = S.player;
  const r = openChest(p, S.floor);

async function itemFlow(it, face) {
  const p = S.player, cur = p[it.slot];
  const slotName = it.slot === "weapon" ? "무기" : "방어구";
  const refund = cur.tier >= 0 ? sellPrice(cur) : 0;
  const i = await choose(null, `${slotName} 발견: ${it.name} (${itemStatText(it)})\n지금 장비: ${cur.name} (${itemStatText(cur)})`,
    [refund ? `장착한다 (기존 장비는 ${refund} 금화에 판매)` : "장착한다", `판다 (${sellPrice(it)} 금화)`], face);
  if (i === 0) { equipItem(p, it); p.gold += refund; setMsg(`${josa(it.name, "을", "를")} 장착했다.`); Sound.sfx("buy"); }
  else { p.gold += sellPrice(it); setMsg(`${josa(it.name, "을", "를")} ${sellPrice(it)} 금화에 팔았다.`); Sound.sfx("buy"); }
  refreshHUD();
}

async function talkFlow(ent) {
  const first = !ent.talked;
  ent.talked = true;
  if (ent.npc === "merchant") {
    await say("떠돌이 상인", choice(MERCHANT_LINES), { name: "merchant" });

    setMsg("상인과 거래를 마쳤다.");
    saveGame();
  } else if (ent.npc === "wanderer") {
    const lines = HINT_FLOORS[S.floor] || ["..."];
    if (first) for (const l of lines) await say("지친 모험가", l, WANDERER);
    else await say("지친 모험가", lines[lines.length - 1], WANDERER);
  } else if (ent.npc === "tablet") {
    const lines = LORE_FLOORS[S.floor] || [];
    await say(null, "오래된 석판에 누군가의 기록이 새겨져 있다.");
    for (const l of lines) await say("석판", l, { name: "tablet" });
  }
  saveGame(true);
}
