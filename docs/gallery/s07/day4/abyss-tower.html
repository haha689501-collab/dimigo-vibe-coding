let cmdResolver = null;
function renderCmds() {
  const p = S.player, [s1, s2] = getSkillInfo(p);
  const cmds = [
    { id: "attack", label: "공격", sub: `공격력 ${p.attack}`, key: "1" },
    { id: "skill1", label: p.job_stage >= 1 ? s1.name : "스킬", sub: p.job_stage < 1 ? "Lv5 각성 후" : p.skill1_cd ? `대기 ${p.skill1_cd}턴` : "사용 가능", key: "2", off: p.job_stage < 1 || p.skill1_cd > 0, hot: p.job_stage >= 1 && !p.skill1_cd },
    { id: "skill2", label: p.job_stage >= 2 ? s2.name : "필살기", sub: p.job_stage < 2 ? "Lv10 전직 후" : p.skill2_cd ? `대기 ${p.skill2_cd}턴` : "사용 가능", key: "3", off: p.job_stage < 2 || p.skill2_cd > 0, hot: p.job_stage >= 2 && !p.skill2_cd },
    { id: "guard", label: "방어", sub: "받는 피해 절반", key: "4" },
    { id: "potion", label: "포션", sub: `${p.potions}개 남음`, key: "5", off: p.potions <= 0 },
  ];
  $("#cmds").innerHTML = cmds.map((c) => `<button class="btn${c.hot ? " hot" : ""}" type="button" data-cmd="${c.id}" ${c.off ? "disabled" : ""}><span class="n">${c.key}</span>${esc(c.label)}<small>${esc(c.sub)}</small></button>`).join("");
}
function waitCommand() {
  renderCmds();
  const first = $("#cmds .btn:not(:disabled)");
  if (first && !("ontouchstart" in window)) first.focus({ preventScroll: true });
  return new Promise((res) => { cmdResolver = res; });
}
function issueCmd(c) { if (!cmdResolver) return; const r = cmdResolver; cmdResolver = null; Sound.sfx("select"); r(c); }
$("#cmds").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && !b.disabled) issueCmd(b.dataset.cmd); });
function waitContinue(label = "계속하기") {
  $("#cmds").innerHTML = `<button class="btn gold wide" type="button" data-cmd="continue">${esc(label)}<kbd>Enter</kbd></button>`;
  $("#cmds .btn").focus({ preventScroll: true });
  return new Promise((res) => { cmdResolver = res; });
}

// ---- 전투 메시지: 머리 위 말풍선 + 접이식 전체 기록 ----
// who: "player" | "enemy" 이면 말풍선도 띄움, null 이면 기록에만 남김
function blog(text, cls = "", who = null, split = null) {
  const ol = $("#blog");
  const li = document.createElement("li");
  li.textContent = text;
  li.className = cls || "";
  if (S.battle && S.battle.newTurn) { li.classList.add("turn"); S.battle.newTurn = false; }
  ol.appendChild(li);
  while (ol.children.length > 300) ol.removeChild(ol.firstChild);
  $("#blog-live").textContent = text;
  if (S.logOpen) { const w = $("#blog-wrap"); w.scrollTop = w.scrollHeight; }
  if (split) { if (split.enemy) bubble("enemy", split.enemy, cls === "boss" ? "boss" : "warn"); if (split.player) bubble("player", split.player, cls); }
  else if (who) bubble(who, text, cls);
}
const BUB_MAX = 3;
function bubble(who, text, cls = "") {
  const st = $(who === "enemy" ? "#bs-enemy" : "#bs-player");
  const b = document.createElement("div");
  b.className = "bub " + (cls || "");
  b.textContent = text;
  st.appendChild(b);
  while (st.children.length > BUB_MAX) st.removeChild(st.firstChild);
  // 먼저 뜬 말풍선이 먼저 사라지도록 (순서 유지)
  const now = performance.now();
  const until = Math.max(now + (cls === "boss" ? 3400 : 2400), (st._last || 0) + 150);
  st._last = until;
  setTimeout(() => {
    if (!b.isConnected) return;
    if (reduceMotion) { b.remove(); return; }
    b.classList.add("out");
    setTimeout(() => b.remove(), 300);
  }, until - now);
}
function clearBubbles() { for (const id of ["#bs-enemy", "#bs-player"]) { $(id).innerHTML = ""; $(id)._last = 0; } $("#bubbles").hidden = true; }
function setupBubbles(e) {
  const es = 16 * enemyScale(e);
  const headY = EPOS.y - es - 10;
  $("#bs-enemy").style.setProperty("--anchor", `${((1 - headY / H) * 100).toFixed(1)}%`);
  $("#bs-player").style.setProperty("--anchor", `${((1 - (PPOS.y - 136) / H) * 100).toFixed(1)}%`);
  clearBubbles();
  $("#bubbles").hidden = false;
}
S.logOpen = false; // 처음엔 접힌 상태 (이번 접속 동안 선택 유지)
function setLogOpen(open) {
  S.logOpen = open;
  $("#blog-wrap").hidden = !open;
  $("#log-toggle").setAttribute("aria-expanded", String(open));
  $("#log-toggle .arr").textContent = open ? "▾" : "▸";
  $("#log-label").textContent = open ? "전투 기록 접기" : "전투 기록 펼치기";
  if (open) { const w = $("#blog-wrap"); w.scrollTop = w.scrollHeight; }
}
$("#log-toggle").addEventListener("click", () => { Sound.sfx("select"); setLogOpen(!S.logOpen); });
function updateEnemyBar(hp) {
  const e = S.battle.enemy;
  const v = Math.max(0, hp == null ? e.hp : hp);
  $("#eb-name").textContent = e.name;
  const info = ABILITY_INFO[e.ability];
  $("#eb-tag").innerHTML = e.kind === "boss" ? (e.phase2 ? "<b>진정한 모습</b>" : "<b>최종 보스</b>") : e.kind === "mid" ? "<b>수호자</b>" : info ? `특성 <b>${info[0]}</b>` : "";
  $("#eb-fill").style.width = `${(v / e.max_hp) * 100}%`;
  $("#eb-hp").textContent = `${v} / ${e.max_hp}`;
  $("#enemy-bar").classList.toggle("boss", e.kind !== "normal");
}

async function playEvents(ev) {
  const B = S.battle;
  for (const x of ev) {
    if (!S.battle) return;
    if (x.t === "log") { blog(x.text, x.cls, x.who || "player", x.split); await sleep(x.cls === "boss" ? 700 : 300); }
    else if (x.t === "anim") { await sleep(playAnim(x)); }
    else if (x.t === "hitE") {
      Sound.sfx(x.sfx || "hit");
      B.eFlash = S.time + 0.28;
      floater(String(x.amount), EPOS.x + (rnd() - 0.5) * 60, EPOS.y - enemyScale(B.enemy) * 7, x.crit ? "#ffcf4a" : "#ffffff", x.crit ? 60 : 46);
      burst(EPOS.x, EPOS.y - enemyScale(B.enemy) * 8, x.crit ? "#ffd060" : "#ffffff", x.crit ? 18 : 10, 300, 7);
      if (x.crit) shake(10);
      updateEnemyBar(x.hp);
      await sleep(220);
    } else if (x.t === "missE") { Sound.sfx("miss"); floater("빗나감", EPOS.x, EPOS.y - enemyScale(B.enemy) * 7, "#b8b0d8", 38); await sleep(200); }
    else if (x.t === "hitP") {
      Sound.sfx(x.big ? "bighurt" : "hurt");
      B.pFlash = S.time + 0.3;
      floater(String(x.amount), PPOS.x + 125 + (rnd() - 0.5) * 30, PPOS.y - 45, x.fire ? "#ff9a50" : x.poison ? "#a0e070" : "#ff7060", x.small ? 36 : 48);
      shake(x.big ? 26 : x.small ? 4 : 9);
      if (x.big) { B.screenFlash = S.time + 0.3; B.flashColor = "rgba(200,30,60,0.5)"; }
      hudHp(x.hp);
      await sleep(x.small ? 160 : 240);
    } else if (x.t === "missP") { Sound.sfx("miss"); floater("회피", PPOS.x + 125, PPOS.y - 45, "#9fc4ff", 40); await sleep(220); }
    else if (x.t === "healP") { Sound.sfx("heal"); floater(`+${x.amount}`, PPOS.x + 125, PPOS.y - 45, "#7ff0c0", 44); burst(PPOS.x, PPOS.y - 60, "#7ff0c0", 12, 160, 6, -100); hudHp(x.hp); await sleep(240); }
    else if (x.t === "healE") { Sound.sfx("enemyheal"); floater(`+${x.amount}`, EPOS.x, EPOS.y - enemyScale(B.enemy) * 7, "#d89ae8", 40); updateEnemyBar(x.hp); await sleep(220); }
    else if (x.t === "levelup") {
      Sound.jingle("levelup");
      burst(PPOS.x, PPOS.y - 60, "#ffd86b", 24, 260, 8, -60);
      blog(`레벨 업! Lv ${x.level} (스탯 포인트 +4, 체력 모두 회복)`, "good", "player");
      refreshHUD();
      await sleep(650);
    } else if (x.t === "phase2") {
      Sound.sfx("roar");
      shake(30);
      B.screenFlash = S.time + 0.6; B.flashColor = "rgba(255,40,80,0.55)";
      updateEnemyBar();
      await sleep(600);
    } else if (x.t === "say") {
      await say(x.name, x.text, monsterSprite(B.enemy));
    }
  }
}

async function encounter(ent) {
  S.lock = true;
  const e = ent.enemy;
  if (e.kind !== "normal") {
    const intro = e.kind === "boss" ? ["오래 기다렸다, 모험가여.", "이 탑의 꼭대기까지 올라온 자는 나 이후로 네가 처음이다.", "그 끝에 무엇이 있는지 알고 싶다면... 나를 넘어서라."] : MID_BOSSES[S.floor].intro;
    for (const l of intro) await say(e.name, l, monsterSprite(e));
  }
  Sound.sfx("encounter");
  await fadeTo(1, 260);
  const res = await runBattle(ent);
  if (res === "lose") return;
  S.map.ents = S.map.ents.filter((x) => x !== ent);
  if (e.kind === "mid") {
    S.map.stairs.locked = false;
    setMsg("잠겨 있던 계단이 열렸다!");
  }
  if (e.kind === "boss") { await ending(); return; }
  saveGame();
}

async function runBattle(ent) {
  const p = S.player, e = ent.enemy;
  S.mode = "battle";
  S.battle = { enemy: e, turn: 1, fx: [], parts: [], floaters: [], eFlash: 0, pFlash: 0, eLunge: 0, pLunge: 0, screenFlash: 0, charge: false };
  setPanel("battle");
  $("#blog").innerHTML = "";
  setLogOpen(S.logOpen);
  setupBubbles(e);
  $("#enemy-bar").hidden = false;
  updateEnemyBar();
  Sound.music(e.kind === "normal" ? "battle" : "boss");
  await fadeTo(0, 260);
  blog(`${josa(e.name, "이", "가")} 나타났다!`, "warn", "enemy");
  const info = ABILITY_INFO[e.ability];
  if (info) blog(`특성 ${info[0]}: ${info[1]}.`, "info", "enemy");
  if (e.kind === "mid" && e.id === "gatekeeper") blog("3턴마다 철벽 태세나 대지 강타를 쓴다.", "info", "enemy");
  if (e.kind === "mid" && e.id === "witch") blog("3턴마다 홍련의 저주나 화염 폭풍을 쓴다.", "info", "enemy");
  if (e.kind === "boss") blog("체력이 절반 이하가 되면 진정한 모습을 드러낸다.", "info", "enemy");
  while (true) {
    const cmd = await waitCommand();
    S.battle.newTurn = true;
    const ev = [];
    const r = playerAction(p, e, cmd, ev);
    if (!r.ok) { S.battle.newTurn = false; bubble("player", r.msg, "warn"); Sound.sfx("deny"); continue; }
    $("#cmds").innerHTML = "";
    await playEvents(ev);
    refreshHUD();
    if (e.hp <= 0) break;
    await sleep(260);
    const ev2 = [];
    enemyTurn(p, e, S.battle.turn, ev2);
    if (!e.charging) S.battle.charge = false;
    await playEvents(ev2);
    refreshHUD();
    if (p.hp <= 0) { await gameOver(e.name); return "lose"; }
    S.battle.turn++;
  }
  // 승리
  S.battle.eDying = S.time;
  Sound.sfx("roar");
  burst(EPOS.x, EPOS.y - 90, "#ffffff", 30, 320, 8);
  updateEnemyBar(0);
  await sleep(700);
  Sound.jingle("victory");
  blog(`${josa(e.name, "을", "를")} 쓰러뜨렸다!`, "good", "player");
  const ev = [];
  const rw = battleRewards(p, e, S.floor, ev);
  if (e.kind !== "boss") blog(`금화 +${rw.gold}, 경험치 +${rw.xp}${rw.potion ? ", 포션 +1" : ""}${rw.item ? ", 장비 획득" : ""}`, "good", "player");
  refreshHUD();
  await sleep(400);
  await playEvents(ev);
  cleanupAfterBattle(p);
  refreshHUD();
  await waitContinue(e.kind === "boss" ? "왕좌로 다가간다" : "탐험으로 돌아가기");
  await fadeTo(1, 250);
  S.battle = null;
  clearBubbles();
  $("#enemy-bar").hidden = true;
  if (e.kind === "boss") return "win";
  S.mode = "explore";
  setPanel("explore");
  Sound.music("explore");
  await fadeTo(0, 300);
  setMsg(`${josa(e.name, "을", "를")} 쓰러뜨렸다! 금화 +${rw.gold}, 경험치 +${rw.xp}`);
  if (rw.item) await itemFlow(rw.item, monsterSprite(e));
  return "win";
}

    lines = ["심연의 탑이 무너졌다", `${p.name}, 30층 탑 정복 성공!`, "당신은 무너지는 탑을 뒤로하고 다시 땅을 밟았다.", "전설은 끝났다. 당신의 이름과 함께."];
  } else {
    for (const l of ["탑이 당신의 소원을 삼켰다. 세상의 모든 진실이 머릿속으로 쏟아져 들어온다.", "모든 것을 이해한 순간, 당신은 알았다. 이제 당신이 탑이라는 것을."]) await say(null, l);
    lines = ["새로운 군주가 태어났다", `${p.name}, 30층 탑 정복 성공!`, "왕좌에 앉은 당신은 계단 아래를 내려다본다.", "언젠가 올라올 다음 모험가를 기다리며."];
  }
  clearSave();
  $("#panel").classList.add("off");
  await showEnd(true, lines, `최종 Lv ${p.level}  ${classLabel(p)}  STR ${p.str_stat}  AGI ${p.agi_stat}  VIT ${p.vit_stat}  처치 ${p.kills}마리`);

// ---------- 입력 ----------
let audioReady = false;
function ensureAudio() { if (!audioReady) { audioReady = true; Sound.init(); if (S.mode === "title") Sound.music("title"); } }
function setSoundBtn() {
  const on = !Sound.isMuted();
  const b = $("#btn-sound");
  b.textContent = on ? "소리 켬" : "소리 끔";
  b.setAttribute("aria-pressed", String(on));
}
$("#btn-sound").addEventListener("click", () => { ensureAudio(); Sound.setMuted(!Sound.isMuted()); setSoundBtn(); });
const openMenu = async () => {
  if (S.mode !== "explore" || S.lock || S.overlay || DLG.active) return;
  S.lock = true; S.heldDir = null;
  await openStats("menu");
  if (S.mode !== "explore") return;
  refreshHUD(); saveGame(true);
  S.lock = false;
};
$("#btn-menu").addEventListener("click", openMenu);
$("#pad-menu").addEventListener("click", openMenu);

addEventListener("pointerdown", ensureAudio, { capture: true });
function normKey(e) {
  const k = e.key;
  if (/^Key[A-Z]$/.test(e.code || "") && !/^[a-zA-Z]$/.test(k)) return e.shiftKey ? e.code.slice(3) : e.code.slice(3).toLowerCase();
  return k;
}
addEventListener("keydown", (e) => {
  ensureAudio();
  if (e.target && e.target.tagName === "INPUT") return;
  const k = normKey(e);
  if (DLG.active) {
    if (DLG.active.type === "say") {
      if (k === "Enter" || k === " " || k === "z" || k === "Z") { e.preventDefault(); DLG.active.advance(); }
      if (k === "Escape" && S.mode === "title") { introSkip = true; DLG.active.advance(); DLG.active && DLG.active.advance(); }
    } else if (DLG.active.type === "choice") {
      if (DLG.active.pick) {
        const n = Number(k);
        if (n >= 1 && n <= DLG.active.count) { e.preventDefault(); DLG.active.pick(n - 1); }
        if (k === "ArrowRight" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowUp") {
          e.preventDefault();
          const bs = [...DLG.choices.querySelectorAll("button")];
          const i = bs.indexOf(document.activeElement);
          const d = k === "ArrowRight" || k === "ArrowDown" ? 1 : -1;
          bs[(i + d + bs.length) % bs.length].focus();
        }
      } else if (k === "Enter" || k === " ") { e.preventDefault(); DLG.active.advance(); }
    }
    return;
  }
  if (S.overlay === "sheet") { if (SHEET.keys && SHEET.keys(k)) e.preventDefault(); return; }
  if (S.overlay) return;
  if (S.mode === "battle" && S.battle && (k === "l" || k === "L")) { e.preventDefault(); setLogOpen(!S.logOpen); return; }
  if (S.mode === "battle" && cmdResolver) {
    const map = { 1: "attack", a: "attack", 2: "skill1", 3: "skill2", 4: "guard", g: "guard", 5: "potion", p: "potion" };
    if ($("#cmds [data-cmd='continue']")) { if (k === "Enter" || k === " ") { e.preventDefault(); issueCmd("continue"); } return; }
    const c = map[k.toLowerCase ? k.toLowerCase() : k];
    if (c) {
      e.preventDefault();
      const b = $(`#cmds [data-cmd='${c}']`);
      if (b && b.disabled) {
        const r = playerAction({ ...S.player }, { ...S.battle.enemy }, c, []);
        bubble("player", r.msg || "지금은 쓸 수 없다.", "warn"); Sound.sfx("deny");
      } else issueCmd(c);
    }
    return;
  }
  if (S.mode === "explore") {
    if (DIRS[k]) { e.preventDefault(); S.heldDir = DIRS[k]; S.heldKey = k; tryMove(...DIRS[k]); return; }
    if (k === "m" || k === "M" || k === "Escape") { e.preventDefault(); openMenu(); }
  }
});
addEventListener("keyup", (e) => { const k = normKey(e); if (S.heldKey === k || (DIRS[k] && S.heldDir === DIRS[k])) { S.heldDir = null; S.heldKey = null; } });
addEventListener("blur", () => { S.heldDir = null; });

// 터치 D패드 + 화면 탭 이동
document.querySelectorAll("#pad [data-dir]").forEach((b) => {
  const dir = b.dataset.dir.split(",").map(Number);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); S.heldDir = dir; tryMove(...dir); });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => { if (S.heldDir === dir) S.heldDir = null; });
});
cv.addEventListener("pointerdown", (e) => {
  if (S.mode !== "explore" || !S.map) return;
  const r = cv.getBoundingClientRect();
  const cam = mapCamera();
  const cx = ((e.clientX - r.left) / r.width) * W, cy = ((e.clientY - r.top) / r.height) * H;
  const tx = (cx / cam.z + cam.x) / T, ty = (cy / cam.z + cam.y) / T;
  const dx = tx - (S.map.px + 0.5), dy = ty - (S.map.py + 0.5);
  if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  S.heldDir = dir;
  tryMove(...dir);
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { if (e.target === cv) S.heldDir = null; });
cv.addEventListener("pointerleave", () => { S.heldDir = null; });

$("#t-new").addEventListener("click", () => { ensureAudio(); newGame(); });
$("#t-cont").addEventListener("click", () => { ensureAudio(); continueGame(); });

// ---------- 루프 ----------
let lastT = 0;
function frame(ts) {
  S.dt = Math.min(0.1, (ts - lastT) / 1000 || 0);
  lastT = ts;
  S.time = ts / 1000;
  g.save();
  if (S.shake > 0.2) { g.translate((rnd() - 0.5) * S.shake, (rnd() - 0.5) * S.shake); S.shake *= 0.86; } else S.shake = 0;
  if (S.mode === "title" || !S.map) drawTitle(S.time);
  else if (S.mode === "battle" && S.battle) drawBattle();
  else drawMap();
  g.restore();
  if (_flashUntil > S.time) { g.fillStyle = _flashColor; g.globalAlpha = Math.min(1, (_flashUntil - S.time) * 2); g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  if (S.fade > 0) { g.fillStyle = `rgba(8,6,16,${S.fade.toFixed(3)})`; g.fillRect(0, 0, W, H); }
  if (S.mode === "explore" && S.heldDir && !S.lock && !S.moving && !S.overlay && !DLG.active) tryMove(...S.heldDir);
  requestAnimationFrame(frame);
}

goTitle();
setSoundBtn();
requestAnimationFrame(frame);

</script>
</body>
</html>
