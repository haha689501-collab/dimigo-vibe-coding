<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>익명게시판</title>
<style>
  /* 색상: 학교 문구류에서 가져옴 — 볼펜 파랑(행동), 빨간펜(AI 지적), 형광펜(문제 부분), 검은 가림 막대(익명) */
  :root {
    --bg: #E9EDF2;
    --paper: #FBFCFD;
    --ink: #1C2433;
    --muted: #5D6B82;
    --line: #D3DAE4;
    --pen: #2B4ACB;
    --pen-ink: #FFFFFF;
    --pen-soft: #E3E9FB;
    --red: #B93227;
    --red-soft: #FBE9E7;
    --hl: #FFE45C;
    --hl-ink: #1C2433;
    --bar: #1C2433;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161B26;
      --paper: #1F2633;
      --ink: #E6EAF2;
      --muted: #9AA6BC;
      --line: #323C4F;
      --pen: #4A67E8;
      --pen-ink: #FFFFFF;
      --pen-soft: #2A3553;
      --red: #FF9385;
      --red-soft: #3A2422;
      --bar: #000000;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* 데모 전환 띠: 제품 화면과 구분되도록 점선으로 분리 */
  .demo {
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem;
    padding: .45rem 1.25rem;
    border-bottom: 1px dashed var(--muted);
    font-size: .8125rem; color: var(--muted);
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--paper); }
  .seg-btn { border: 0; background: transparent; padding: .3rem .8rem; color: var(--muted); }
  .seg-btn + .seg-btn { border-left: 1px solid var(--line); }
  .seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }

  .wrap { max-width: 60rem; margin: 0 auto; padding: 1.25rem 1.25rem 2.5rem; }

  /* 머리: 게시판 이름이 가장 먼저 보이도록 */
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .board-name { margin: 0; font-size: clamp(2.1rem, 4.5vw, 3.1rem); font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
  .board-name-btn { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; color: inherit; }
  .board-note { margin: .45rem 0 0; font-size: .875rem; color: var(--muted); }
  .head-side { display: flex; flex-wrap: wrap; align-items: center; gap: .9rem; }
  .me { font-size: .875rem; color: var(--muted); }
  .me strong { color: var(--ink); font-weight: 600; }

  /* 익명 표식: 실제 계정 자리를 가린 막대 */
  .redact {
    display: inline-block; width: 2.3em; height: .82em; margin-right: .4em;
    background: var(--bar); border-radius: 2px; vertical-align: -.06em;
  }

  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: .55rem 1rem; font-weight: 600; }
  .btn:hover { border-color: var(--muted); }
  .btn-primary { border-color: var(--pen); background: var(--pen); color: var(--pen-ink); font-weight: 700; }
  .btn-primary:hover { border-color: var(--pen); filter: brightness(1.08); }
  .btn-write { padding: .75rem 1.4rem; font-size: 1.0625rem; }
  .back { border: 0; background: none; padding: .25rem 0; margin-bottom: .6rem; color: var(--pen); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  .notice { margin: 0 0 1rem; padding: .6rem .9rem; border-left: 3px solid var(--red); background: var(--red-soft); font-size: .875rem; }

  .tabs { display: flex; gap: .25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--line); }
  .tab { border: 0; background: none; padding: .5rem .9rem; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  .badge { display: inline-block; min-width: 1.4em; margin-left: .35em; padding: 0 .4em; border-radius: 999px; background: var(--red); color: var(--paper); font-size: .75rem; text-align: center; }

  /* 목록 위: 왼쪽 필터, 오른쪽 검색 */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .6rem; }
  .filters { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: .3rem .9rem; font-size: .9375rem; color: var(--muted); }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--pen-soft); border-color: var(--pen); color: var(--ink); font-weight: 700; }
  .search input { width: min(19rem, 78vw); border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: .5rem .8rem; }
  .count { margin: 0 0 .4rem; font-size: .8125rem; color: var(--muted); }

  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
  /* 게시글 목록이 화면 세로의 3/4 정도를 차지 */
  .list { height: 75vh; min-height: 20rem; overflow-y: auto; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: .95rem 1.25rem; }
  .row:hover { background: var(--pen-soft); }
  .row-top { display: flex; align-items: baseline; gap: .7rem; }
  .cat { flex: none; font-size: .8125rem; font-weight: 700; color: var(--pen); background: var(--pen-soft); border-radius: 4px; padding: .08rem .5rem; }
  .row-title { flex: 1; min-width: 0; font-size: 1.0625rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-comments { flex: none; font-size: .875rem; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .15rem 1.1rem; margin-top: .3rem; font-size: .8125rem; color: var(--muted); }
  .row-mine { color: var(--pen); font-weight: 700; }
  .empty { margin: 0; padding: 3rem 1.25rem; text-align: center; color: var(--muted); }

  /* 글 보기 */
  .post { padding: 1.5rem 1.6rem; margin-bottom: 1rem; }
  .post-title { margin: .6rem 0 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; }
  .post-body { margin: 1.2rem 0 0; max-width: 42rem; line-height: 1.75; white-space: pre-wrap; }
  .post-actions { margin-top: 1.4rem; }

  .comments { padding: 1.25rem 1.6rem 1.5rem; }
  .comments-title { margin: 0 0 .4rem; font-size: 1.0625rem; }
  .comment-list { list-style: none; margin: 0; padding: 0; }
  .comment { padding: .85rem 0; border-bottom: 1px solid var(--line); }
  .comment .meta { margin-top: 0; }
  .comment-body { margin: .3rem 0 0; white-space: pre-wrap; max-width: 42rem; }
  .comment-empty { margin: 0; padding: 1rem 0; color: var(--muted); }
  .comment-form { margin-top: 1.1rem; }
  .readonly-note { margin: 1rem 0 0; font-size: .875rem; color: var(--muted); }

  /* 글 등록/수정 */
  .form { padding: 1.5rem 1.6rem 1.75rem; }
  .form-title { margin: 0 0 1.1rem; font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; }
  .field { margin: 0 0 1.1rem; padding: 0; border: 0; min-width: 0; }
  .field-label { display: block; margin-bottom: .35rem; padding: 0; font-size: .9375rem; font-weight: 700; }
  .field input[type="text"], textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: .6rem .8rem; }
  textarea { resize: vertical; line-height: 1.65; }
  .radio-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .radio-chip span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: .3rem .9rem; color: var(--muted); cursor: pointer; }
  .radio-chip input:checked + span { background: var(--pen-soft); border-color: var(--pen); color: var(--ink); font-weight: 700; }
  .radio-chip input:focus-visible + span { outline: 2px solid var(--pen); outline-offset: 2px; }
  .form-note { margin: 0 0 1rem; font-size: .875rem; color: var(--muted); }
  .err { margin: 0 0 .8rem; color: var(--red); font-weight: 600; font-size: .9375rem; }
  .err:empty { display: none; }
  .form-actions { display: flex; gap: .5rem; }

  /* 관리자: AI 알림함 (빨간펜 + 형광펜) */
  .alerts { padding: 1.5rem 1.6rem; }
  .alerts-desc { margin: 0 0 1rem; max-width: 42rem; font-size: .9375rem; color: var(--muted); }
  .alert-list { list-style: none; margin: 0; padding: 0; }
  .alert { padding: 1.1rem 0; border-top: 1px solid var(--line); }
  .alert-head { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; }
  .kind { font-weight: 800; }
  .reason { font-size: .8125rem; font-weight: 700; color: var(--red); background: var(--red-soft); border-radius: 4px; padding: .08rem .5rem; }
  .alert-time { font-size: .8125rem; color: var(--muted); }
  .new { font-size: .75rem; font-weight: 800; color: var(--red); }
  .alert-where { margin: .4rem 0 0; font-size: .9375rem; }
  .snips { list-style: none; margin: .5rem 0 0; padding: .7rem .9rem; border-left: 3px solid var(--red); background: var(--bg); border-radius: 0 6px 6px 0; }
  .snips li + li { margin-top: .35rem; }
  mark { background: var(--hl); color: var(--hl-ink); padding: 0 .15em; border-radius: 2px; }
  .alert-who { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .8rem; margin: .6rem 0 .7rem; font-size: .875rem; color: var(--muted); }
  .acct { font-weight: 700; color: var(--red); }

  .toast {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 1rem);
    background: var(--ink); color: var(--paper); padding: .6rem 1.1rem; border-radius: 6px;
    font-size: .9375rem; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  /* 다크 모드에서 파란 글자의 대비 확보 (뒤에 두어 위 규칙을 덮어씀) */
  @media (prefers-color-scheme: dark) { .back, .row-mine, .cat { color: #A9B8FF; } }

  @media (max-width: 560px) {
    .wrap { padding: 1rem .9rem 2rem; }
    .post, .comments, .form, .alerts { padding-left: 1.1rem; padding-right: 1.1rem; }
    .row { padding: .85rem 1rem; }
    .search, .search input { width: 100%; }
  }
</style>
</head>
<body>

<div class="demo" role="group" aria-label="데모용 사용자 전환">
  <span>로그인 대신 쓰는 데모용 전환입니다. 지금 보는 사람</span>
  <div class="seg" id="roleSwitch"></div>
</div>

<div class="wrap">
  <header class="head">
    <div>
      <h1 class="board-name"><button type="button" class="board-name-btn" data-action="home">익명게시판</button></h1>
      <p class="board-note"><span class="redact" aria-hidden="true"></span>실제 계정은 가려지고, 익명 닉네임으로만 표시됩니다.</p>
    </div>
    <div class="head-side">
      <span class="me" id="me"></span>
      <button type="button" class="btn btn-primary btn-write" id="writeBtn" data-action="write">글 등록하기</button>
    </div>
  </header>

  <p class="notice" id="storageNotice" hidden>이 환경에서는 브라우저 저장소를 쓸 수 없어, 새로고침하면 글이 사라집니다. 파일을 브라우저에서 직접 열면 글이 유지됩니다.</p>

  <nav class="tabs" id="adminTabs" aria-label="관리자 메뉴" hidden>
    <button type="button" class="tab" data-action="tab" data-tab="list">게시판</button>
    <button type="button" class="tab" data-action="tab" data-tab="alerts">AI 알림함<span class="badge" id="alertBadge" hidden></span></button>
  </nav>

  <main id="view"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- 설정 ---------- */
  var DATA_KEY = 'anonboard.mvp.v1';
  var ROLE_KEY = 'anonboard.mvp.role';

  // PRD에 카테고리 예시가 적혀 있지 않아 임시로 둔 값입니다. 이 배열만 고치면 됩니다.
  var CATEGORIES = ['자유', '고민', '학업', '학교생활', '질문'];
  var ALL = '전체';
  var LIMITS = { title: 60, body: 2000, comment: 500 };

  // 로그인/서버가 없는 MVP라서, 계정 대신 쓰는 데모용 사용자입니다.
  var USERS = [
    { id: 'user-a', label: '사용자 A', nick: '익명의 수달', role: 'user' },
    { id: 'user-b', label: '사용자 B', nick: '익명의 부엉이', role: 'user' },
    { id: 'admin', label: '관리자', nick: null, role: 'admin' }
  ];

  // AI 검사 규칙: 외부 AI API를 쓰지 않는 조건이라 규칙 기반으로 대신합니다.
  // 나중에 실제 AI로 바꿀 때는 aiReview() 함수만 교체하면 됩니다.
  var AI_RULES = [
    {
      label: '욕설·비하 표현',
      patterns: [/씨발|시발|ㅅㅂ|ㅆㅂ|병신|ㅂㅅ|지랄|ㅈㄹ|존나|ㅈㄴ|개새끼|새끼|미친놈|미친년|꺼져|죽어버려|죽여버|쓰레기\s?같|찐따|역겹|극혐/g]
    },
    {
      label: '특정인 지목 의심',
      patterns: [/\d\s?학년\s?\d{1,2}\s?반/g, /\d{1,2}\s?반\s?\d{1,2}\s?번/g, /실명|저격|신상/g]
    },
    {
      label: '확인되지 않은 사실·소문',
      patterns: [/카더라|라던데|라더라|다던데|다더라|소문|들었는데|누가\s?그러는데|확실함|확실해|확실하다|100\s?%|백퍼|팩트임|무조건\s?사실/g]
    }
  ];

  /* ---------- 저장 (적은 글이 유지됨) ---------- */
  var persistOK = true;
  try {
    localStorage.setItem(DATA_KEY + '.test', '1');
    localStorage.removeItem(DATA_KEY + '.test');
  } catch (e) { persistOK = false; }

  function loadData() {
    var raw = null;
    try { raw = localStorage.getItem(DATA_KEY); } catch (e) { persistOK = false; }
    if (raw) {
      try {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.posts) && Array.isArray(d.alerts)) return d;
      } catch (e) { /* 깨진 데이터는 무시 */ }
    }
    return { posts: [], alerts: [] };
  }
  function saveData() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
    catch (e) { persistOK = false; renderChrome(); }
  }
  function loadRole() {
    try {
      var r = sessionStorage.getItem(ROLE_KEY);
      if (USERS.some(function (u) { return u.id === r; })) return r;
    } catch (e) { /* 무시 */ }
    return USERS[0].id;
  }
  function saveRole(id) { try { sessionStorage.setItem(ROLE_KEY, id); } catch (e) { /* 무시 */ } }

  /* ---------- 상태 ---------- */
  var data = loadData();
  var currentUserId = loadRole();
  var ui = { view: 'list', postId: null, editId: null, category: ALL, q: '' };

  var $view = document.getElementById('view');
  var $roleSwitch = document.getElementById('roleSwitch');
  var $me = document.getElementById('me');
  var $writeBtn = document.getElementById('writeBtn');
  var $tabs = document.getElementById('adminTabs');
  var $badge = document.getElementById('alertBadge');
  var $notice = document.getElementById('storageNotice');
  var $toast = document.getElementById('toast');

  /* ---------- 도우미 ---------- */
  function me() { return USERS.filter(function (u) { return u.id === currentUserId; })[0]; }
  function isAdmin() { return me().role === 'admin'; }
  function findPost(id) { return data.posts.filter(function (p) { return p.id === id; })[0] || null; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function timeLabel(ts) {
    var min = Math.floor((Date.now() - ts) / 60000);
    if (min < 1) return '방금 전';
    if (min < 60) return min + '분 전';
    var h = Math.floor(min / 60);
    if (h < 24) return h + '시간 전';
    var d = new Date(ts);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function nickHtml(nick) {
    return '<span><span class="redact" aria-hidden="true" title="실제 계정은 가려져 있습니다"></span>' + esc(nick) + '</span>';
  }
  var toastTimer = null;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $toast.classList.remove('is-on'); }, 2200);
  }

  /* ---------- AI 검사: 문제가 될 수 있는 부분을 찾아 관리자에게 보냄 ---------- */
  function aiReview(text) {
    var ranges = [], reasons = [];
    AI_RULES.forEach(function (rule) {
      var found = false;
      rule.patterns.forEach(function (p) {
        var re = new RegExp(p.source, 'g'), m;
        while ((m = re.exec(text)) !== null) {
          if (!m[0]) { re.lastIndex++; continue; }
          ranges.push([m.index, m.index + m[0].length]);
          found = true;
        }
      });
      if (found) reasons.push(rule.label);
    });
    if (!ranges.length) return null;

    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var hits = [];
    ranges.forEach(function (r) {
      var last = hits[hits.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else hits.push([r[0], r[1]]);
    });

    // 문제 부분 앞뒤 문맥을 조금 붙여 조각으로 만든다
    var CTX = 24, wins = [];
    hits.forEach(function (h) {
      var s = Math.max(0, h[0] - CTX), e = Math.min(text.length, h[1] + CTX);
      var last = wins[wins.length - 1];
      if (last && s <= last.end) { last.end = Math.max(last.end, e); last.hits.push(h); }
      else wins.push({ start: s, end: e, hits: [h] });
    });
    var snippets = wins.map(function (w) {
      var segs = [], pos = w.start;
      if (w.start > 0) segs.push({ t: '…', hit: false });
      w.hits.forEach(function (h) {
        if (h[0] > pos) segs.push({ t: text.slice(pos, h[0]), hit: false });
        segs.push({ t: text.slice(h[0], h[1]), hit: true });
        pos = h[1];
      });
      if (pos < w.end) segs.push({ t: text.slice(pos, w.end), hit: false });
      if (w.end < text.length) segs.push({ t: '…', hit: false });
      return segs;
    });
    return { reasons: reasons, snippets: snippets };
  }

  function reviewAndReport(kind, post, author, text, commentId) {
    var result = aiReview(text);
    if (!result) return;
    data.alerts.unshift({
      id: uid(), kind: kind, postId: post.id, postTitle: post.title, commentId: commentId || null,
      authorId: author.id, nick: author.nick,
      reasons: result.reasons, snippets: result.snippets,
      createdAt: Date.now(), read: false
    });
  }

  /* ---------- 공통 영역 ---------- */
  function renderChrome() {
    $roleSwitch.innerHTML = USERS.map(function (u) {
      return '<button type="button" class="seg-btn" data-action="role" data-id="' + u.id + '" aria-pressed="' +
        (u.id === currentUserId) + '">' + esc(u.label) + '</button>';
    }).join('');

    if (isAdmin()) $me.innerHTML = '<strong>관리자 보기</strong> (확인 전용)';
    else $me.innerHTML = '내 익명 닉네임 <strong>' + esc(me().nick) + '</strong>';

    $writeBtn.hidden = isAdmin() || ui.view === 'write';
    $notice.hidden = persistOK;

    $tabs.hidden = !isAdmin();
    Array.prototype.forEach.call($tabs.querySelectorAll('.tab'), function (t) {
      var on = (t.getAttribute('data-tab') === 'alerts') === (ui.view === 'alerts');
      if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    updateBadge();
  }
  function updateBadge() {
    var n = data.alerts.filter(function (a) { return !a.read; }).length;
    $badge.hidden = n === 0;
    $badge.textContent = n;
  }

  /* ---------- 게시판 목록 ---------- */
  function filteredPosts() {
    var q = ui.q.trim().toLowerCase();
    return data.posts.filter(function (p) {
      if (ui.category !== ALL && p.category !== ui.category) return false;
      if (q && (p.title + '\n' + p.body).toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function (a, b) { return b.createdAt - a.createdAt; });
  }

  function renderList() {
    var chips = [ALL].concat(CATEGORIES).map(function (c) {
      return '<button type="button" class="chip" data-action="filter" data-cat="' + esc(c) + '" aria-pressed="' +
        (c === ui.category) + '">' + esc(c) + '</button>';
    }).join('');
    $view.innerHTML =
      '<div class="toolbar">' +
        '<div class="filters" role="group" aria-label="카테고리 필터">' + chips + '</div>' +
        '<label class="search"><span class="sr-only">게시글 검색</span>' +
        '<input type="search" id="q" placeholder="제목과 내용에서 검색" value="' + esc(ui.q) + '"></label>' +
      '</div>' +
      '<p class="count" id="count" aria-live="polite"></p>' +
      '<section class="panel list" aria-label="게시글 목록"><ul class="rows" id="rows"></ul></section>';
    renderRows();
  }

  function renderRows() {
    var $rows = document.getElementById('rows');
    if (!$rows) return;
    var posts = filteredPosts();
    document.getElementById('count').textContent = '글 ' + posts.length + '개';

    if (!posts.length) {
      var msg = data.posts.length
        ? '조건에 맞는 글이 없습니다. 검색어나 카테고리를 바꿔 보세요.'
        : (isAdmin() ? '아직 등록된 글이 없습니다.' : '아직 등록된 글이 없습니다. 글 등록하기를 눌러 첫 글을 남겨 보세요.');
      $rows.innerHTML = '<li><p class="empty">' + msg + '</p></li>';
      return;
    }
    $rows.innerHTML = posts.map(function (p) {
      var mine = p.authorId === currentUserId;
      return '<li><button type="button" class="row" data-action="open" data-id="' + p.id + '">' +
        '<span class="row-top">' +
          '<span class="cat">' + esc(p.category) + '</span>' +
          '<span class="row-title">' + esc(p.title) + '</span>' +
          '<span class="row-comments">댓글 ' + p.comments.length + '</span>' +
        '</span>' +
        '<span class="meta">' + nickHtml(p.nick) + '<span>' + timeLabel(p.createdAt) + '</span>' +
          (p.updatedAt ? '<span>수정됨</span>' : '') +
          (mine ? '<span class="row-mine">내 글</span>' : '') +
        '</span>' +
      '</button></li>';
    }).join('');
  }

  /* ---------- 글 보기 + 댓글 ---------- */
  function renderDetail() {
    var post = findPost(ui.postId);
    if (!post) { go('list'); return; }
    var formHtml = isAdmin()
      ? '<p class="readonly-note">관리자 보기에서는 글과 댓글을 확인만 합니다.</p>'
      : '<div class="comment-form">' +
          '<label class="field-label" for="commentBody">댓글 남기기</label>' +
          '<textarea id="commentBody" rows="3" maxlength="' + LIMITS.comment + '" placeholder="이 글에 대한 의견을 적어 주세요"></textarea>' +
          '<p class="err" id="commentErr" role="alert"></p>' +
          '<button type="button" class="btn btn-primary" data-action="submit-comment">댓글 등록하기</button>' +
        '</div>';
    $view.innerHTML =
      '<button type="button" class="back" data-action="home">목록으로</button>' +
      '<article class="panel post" id="postBox"></article>' +
      '<section class="panel comments" aria-label="댓글">' +
        '<h3 class="comments-title" id="commentCount"></h3>' +
        '<ul class="comment-list" id="commentList"></ul>' + formHtml +
      '</section>';
    renderDetailContent();
  }

  function renderDetailContent() {
    var post = findPost(ui.postId);
    var $box = document.getElementById('postBox');
    if (!post || !$box) return;
    var mine = post.authorId === currentUserId;
    $box.innerHTML =
      '<span class="cat">' + esc(post.category) + '</span>' +
      '<h2 class="post-title" tabindex="-1" data-focus>' + esc(post.title) + '</h2>' +
      '<div class="meta">' + nickHtml(post.nick) + '<span>' + timeLabel(post.createdAt) + '</span>' +
        (post.updatedAt ? '<span>수정됨 ' + timeLabel(post.updatedAt) + '</span>' : '') +
        (mine ? '<span class="row-mine">내 글</span>' : '') + '</div>' +
      '<div class="post-body">' + esc(post.body) + '</div>' +
      (mine ? '<div class="post-actions"><button type="button" class="btn" data-action="edit">글 수정하기</button></div>' : '');

    document.getElementById('commentCount').textContent = '댓글 ' + post.comments.length;
    document.getElementById('commentList').innerHTML = post.comments.length
      ? post.comments.map(function (c) {
          return '<li class="comment"><div class="meta">' + nickHtml(c.nick) + '<span>' + timeLabel(c.createdAt) + '</span></div>' +
            '<p class="comment-body">' + esc(c.body) + '</p></li>';
        }).join('')
      : '<li><p class="comment-empty">아직 댓글이 없습니다.' + (isAdmin() ? '' : ' 첫 의견을 남겨 보세요.') + '</p></li>';
  }

  function submitComment() {
    var post = findPost(ui.postId);
    var $body = document.getElementById('commentBody');
    var $err = document.getElementById('commentErr');
    if (!post || !$body || isAdmin()) return;
    var body = $body.value.trim();
    if (!body) { $err.textContent = '댓글 내용을 입력하세요.'; $body.focus(); return; }
    $err.textContent = '';
    var comment = { id: uid(), authorId: me().id, nick: me().nick, body: body.slice(0, LIMITS.comment), createdAt: Date.now() };
    post.comments.push(comment);
    reviewAndReport('댓글', post, me(), comment.body, comment.id);
    saveData();
    $body.value = '';
    renderDetailContent();
    toast('댓글을 등록했습니다.');
  }

  /* ---------- 글 등록 / 수정 ---------- */
  function renderWrite() {
    var editing = ui.editId ? findPost(ui.editId) : null;
    if (isAdmin() || (ui.editId && (!editing || editing.authorId !== currentUserId))) { go('list'); return; }
    var cat = editing ? editing.category : '';
    var radios = CATEGORIES.map(function (c) {
      return '<label class="radio-chip"><input type="radio" class="sr-only" name="category" value="' + esc(c) + '"' +
        (c === cat ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
    }).join('');
    $view.innerHTML =
      '<button type="button" class="back" data-action="cancel">' + (editing ? '글로 돌아가기' : '목록으로') + '</button>' +
      '<section class="panel form">' +
        '<h2 class="form-title" tabindex="-1" data-focus>' + (editing ? '글 수정하기' : '글 등록하기') + '</h2>' +
        '<fieldset class="field"><legend class="field-label">카테고리</legend><div class="radio-chips">' + radios + '</div></fieldset>' +
        '<div class="field"><label class="field-label" for="postTitle">제목</label>' +
          '<input type="text" id="postTitle" maxlength="' + LIMITS.title + '" value="' + esc(editing ? editing.title : '') + '"></div>' +
        '<div class="field"><label class="field-label" for="postBody">내용</label>' +
          '<textarea id="postBody" rows="10" maxlength="' + LIMITS.body + '">' + esc(editing ? editing.body : '') + '</textarea></div>' +
        '<p class="form-note">다른 사용자에게는 익명 닉네임 ‘' + esc(me().nick) + '’(으)로만 표시됩니다. ' +
          '등록한 글과 댓글은 AI가 확인하며, 문제가 될 수 있는 부분은 관리자에게 전달됩니다.</p>' +
        '<p class="err" id="postErr" role="alert"></p>' +
        '<div class="form-actions">' +
          '<button type="button" class="btn btn-primary" data-action="submit-post">' + (editing ? '수정 내용 저장하기' : '글 등록하기') + '</button>' +
          '<button type="button" class="btn" data-action="cancel">취소</button>' +
        '</div>' +
      '</section>';
  }

  function submitPost() {
    if (isAdmin()) return;
    var $err = document.getElementById('postErr');
    var checked = $view.querySelector('input[name="category"]:checked');
    var $title = document.getElementById('postTitle');
    var $body = document.getElementById('postBody');
    var title = $title.value.trim().slice(0, LIMITS.title);
    var body = $body.value.trim().slice(0, LIMITS.body);

    if (!checked) { $err.textContent = '카테고리를 하나 고르세요.'; $view.querySelector('input[name="category"]').focus(); return; }
    if (!title) { $err.textContent = '제목을 입력하세요.'; $title.focus(); return; }
    if (!body) { $err.textContent = '내용을 입력하세요.'; $body.focus(); return; }

    var post;
    if (ui.editId) {
      post = findPost(ui.editId);
      if (!post || post.authorId !== currentUserId) { go('list'); return; }
      post.category = checked.value; post.title = title; post.body = body; post.updatedAt = Date.now();
      reviewAndReport('글 수정', post, me(), title + '\n' + body);
      saveData();
      go('detail', { postId: post.id });
      toast('글을 수정했습니다.');
    } else {
      post = { id: uid(), authorId: me().id, nick: me().nick, category: checked.value, title: title, body: body,
               createdAt: Date.now(), updatedAt: null, comments: [] };
      data.posts.push(post);
      reviewAndReport('글', post, me(), title + '\n' + body);
      saveData();
      go('detail', { postId: post.id });
      toast('글을 등록했습니다.');
    }
  }

  /* ---------- 관리자: AI 알림함 ---------- */
  function renderAlerts() {
    if (!isAdmin()) { go('list'); return; }
    var items = data.alerts.map(function (a) {
      var snips = a.snippets.map(function (segs) {
        return '<li>' + segs.map(function (s) {
          var t = esc(s.t.replace(/\s+/g, ' '));
          return s.hit ? '<mark>' + t + '</mark>' : t;
        }).join('') + '</li>';
      }).join('');
      var exists = !!findPost(a.postId);
      return '<li class="alert">' +
        '<div class="alert-head"><span class="kind">' + esc(a.kind) + '</span>' +
          a.reasons.map(function (r) { return '<span class="reason">' + esc(r) + '</span>'; }).join('') +
          '<span class="alert-time">' + timeLabel(a.createdAt) + '</span>' +
          (a.read ? '' : '<span class="new">새 알림</span>') + '</div>' +
        '<p class="alert-where">대상 글: ' + esc(a.postTitle) + '</p>' +
        '<ul class="snips" aria-label="문제가 될 수 있는 부분">' + snips + '</ul>' +
        '<div class="alert-who"><span>작성자 ' + esc(a.nick) + '</span><span class="acct">실제 계정 ' + esc(a.authorId) + '</span></div>' +
        (exists ? '<button type="button" class="btn" data-action="open" data-id="' + a.postId + '">해당 글 보기</button>' : '') +
      '</li>';
    }).join('');

    $view.innerHTML =
      '<section class="panel alerts">' +
        '<h2 class="form-title" tabindex="-1" data-focus>AI 알림함</h2>' +
        '<p class="alerts-desc">AI가 등록된 글과 댓글을 확인해, 문제가 될 수 있는 부분을 이곳으로 보냅니다. ' +
          '이 MVP는 외부 AI 없이 브라우저 안의 규칙 검사로 동작합니다. 알림은 확인용이며, 글은 그대로 게시됩니다.</p>' +
        (items ? '<ul class="alert-list">' + items + '</ul>'
               : '<p class="empty">아직 받은 알림이 없습니다. 문제가 될 수 있는 글이나 댓글이 올라오면 여기에 표시됩니다.</p>') +
      '</section>';

    var hadUnread = false;
    data.alerts.forEach(function (a) { if (!a.read) { a.read = true; hadUnread = true; } });
    if (hadUnread) { saveData(); updateBadge(); }
  }

  /* ---------- 화면 전환 ---------- */
  function render() {
    renderChrome();
    if (ui.view === 'detail') renderDetail();
    else if (ui.view === 'write') renderWrite();
    else if (ui.view === 'alerts') renderAlerts();
    else renderList();
  }
  function go(view, opts) {
    opts = opts || {};
    ui.view = view;
    ui.postId = opts.postId || null;
    ui.editId = opts.editId || null;
    render();
    window.scrollTo(0, 0);
    var f = $view.querySelector('[data-focus]');
    if (f && view !== 'list') f.focus({ preventScroll: true });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'role') {
      currentUserId = el.getAttribute('data-id');
      saveRole(currentUserId);
      if (ui.view === 'write' || ui.view === 'alerts') go('list'); else render();
    }
    else if (action === 'home') go('list');
    else if (action === 'tab') go(el.getAttribute('data-tab'));
    else if (action === 'write') go('write');
    else if (action === 'open') go('detail', { postId: el.getAttribute('data-id') });
    else if (action === 'edit') go('write', { editId: ui.postId });
    else if (action === 'cancel') { if (ui.editId) go('detail', { postId: ui.editId }); else go('list'); }
    else if (action === 'submit-post') submitPost();
    else if (action === 'submit-comment') submitComment();
    else if (action === 'filter') {
      ui.category = el.getAttribute('data-cat');
      Array.prototype.forEach.call($view.querySelectorAll('.chip'), function (c) {
        c.setAttribute('aria-pressed', String(c.getAttribute('data-cat') === ui.category));
      });
      renderRows();
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { ui.q = e.target.value; renderRows(); }
  });

  // 같은 브라우저의 다른 탭에서 올린 글·댓글도 바로 보이도록 동기화
  window.addEventListener('storage', function (e) {
    if (e.key !== DATA_KEY) return;
    data = loadData();
    if (ui.view === 'list') renderRows();
    else if (ui.view === 'detail') { if (findPost(ui.postId)) renderDetailContent(); else go('list'); }
    else if (ui.view === 'alerts') renderAlerts();
    updateBadge();
  });

  render();
})();
</script>
</body>
</html>
