<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀 프로젝트 피드백 (학생용) | AI × BUILD · 한국디지털미디어고등학교</title>
<meta name="theme-color" content="#FBFAF7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C6603C'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='bold' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<style>
/* =====================================================================
   AI × BUILD | Claude Vibe Coding
   색상은 1~3회기 PPT에서 실제로 사용된 값을 그대로 가져왔습니다.
   ===================================================================== */

:root {
  /* PPT 배경 계열 (따뜻한 아이보리) */
  --bg:            #FBFAF7;
  --bg-soft:       #F7F4EE;
  --bg-tint:       #F2EDE7;
  --surface:       #FFFFFF;

  /* PPT 텍스트 계열 */
  --ink:           #22211E;   /* 제목 */
  --ink-body:      #4A443E;   /* 본문 */
  --ink-muted:     #6F6A63;   /* 보조 설명 */
  --ink-faint:     #726C64;   /* 가장 옅은 라벨 (WCAG AA 대비 확보) */

  /* PPT 포인트 색 (테라코타) */
  --accent:        #C6603C;   /* 장식 · 아이콘 · 선 */
  --accent-strong: #A8412B;   /* 글자 · 버튼 (대비 확보) */
  --accent-soft:   #E9B99F;
  --accent-wash:   #F6E9E1;

  /* 구조색 (PPT의 슬레이트 계열) */
  --navy:          #1F2A44;
  --navy-soft:     #667085;

  --line:          #E4DCD1;
  --line-strong:   #C9C1B7;

  --radius:   14px;
  --radius-sm: 9px;
  --shadow:    0 1px 2px rgba(34,33,30,.05), 0 6px 18px rgba(34,33,30,.06);
  --shadow-lg: 0 2px 6px rgba(34,33,30,.07), 0 18px 44px rgba(34,33,30,.11);

  --wrap:    1240px;
  --header-h: 64px;

  --font: 'Pretendard', 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
          'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

/* 화면에는 안 보이지만 스크린리더는 읽는 텍스트 */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink-body);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
  letter-spacing: -0.01em;
  overflow-x: hidden;           /* 가로 스크롤 차단 */
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
h1, h2, h3, h4 { color: var(--ink); line-height: 1.3; margin: 0; letter-spacing: -0.02em; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

a { color: var(--accent-strong); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font: inherit; color: inherit; }

/* 키보드 포커스 표시 */
:focus-visible {
  outline: 3px solid var(--accent-strong);
  outline-offset: 2px;
  border-radius: 4px;
}

.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 200;
  background: var(--accent-strong); color: #fff;
  padding: 10px 16px; border-radius: 8px; font-size: 15px; font-weight: 700;
  transition: top .15s;
}
.skip-link:focus { top: 12px; text-decoration: none; }

.wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding-inline: 20px; }

/* =====================  헤더  ===================== */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(251,250,247,.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  min-height: var(--header-h);
  display: flex; align-items: center; gap: 16px;
  padding-block: 9px;
}

.brand { display: flex; align-items: center; gap: 12px; color: inherit; flex: 1 1 auto; min-width: 0; }
.brand:hover { text-decoration: none; }
.brand-mark {
  font-size: 17px; font-weight: 800; color: var(--ink);
  letter-spacing: .06em; white-space: nowrap;
}
.brand-x { color: var(--accent); margin-inline: 3px; }
.brand-sub {
  display: flex; flex-direction: column; gap: 1px;
  padding-left: 12px; border-left: 1px solid var(--line-strong); min-width: 0;
}
.brand-school { font-size: 12.5px; color: var(--ink-muted); white-space: nowrap; }
.brand-course {
  font-size: 11px; color: var(--accent-strong); font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
}

.site-nav { display: flex; gap: 4px; flex: 0 0 auto; }
.site-nav a {
  font-size: 15px; font-weight: 600; color: var(--ink-body);
  padding: 9px 14px; border-radius: 8px; white-space: nowrap;
  transition: background .15s, color .15s;
}
.site-nav a:hover { background: var(--bg-tint); color: var(--ink); text-decoration: none; }
.site-nav a.is-active { color: var(--accent-strong); background: var(--accent-wash); }

.nav-toggle {
  display: none; align-items: center; gap: 7px;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 9px; padding: 8px 12px; cursor: pointer;
  font-size: 14px; font-weight: 700; color: var(--ink);
}
.nav-toggle-bar { width: 16px; height: 2px; background: var(--ink); box-shadow: 0 -5px 0 var(--ink), 0 5px 0 var(--ink); }

/* =====================  공통 요소  ===================== */
.eyebrow {
  font-size: 11.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent-strong); display: flex; align-items: center; gap: 9px;
}
.eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--line); max-width: 90px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 15px; font-weight: 700; line-height: 1;
  padding: 13px 22px; border-radius: 10px; border: 1px solid transparent;
  cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .1s;
  text-decoration: none; min-height: 46px;
}
.btn:hover { text-decoration: none; }
.btn:active { transform: translateY(1px); }

.btn-primary { background: var(--accent-strong); color: #fff; }
.btn-primary:hover { background: #8F3623; }

.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-ghost:hover { background: var(--bg-tint); border-color: var(--ink-faint); }

.btn-quiet { background: transparent; color: var(--ink-body); border-color: var(--line-strong); }
.btn-quiet:hover { background: var(--bg-tint); color: var(--ink); }

.btn[disabled], .btn[aria-disabled="true"] {
  opacity: .5; cursor: not-allowed; pointer-events: none;
}

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap;
}
.badge-open { background: var(--accent-wash); color: var(--accent-strong); border-color: var(--accent-soft); }
.badge-soon { background: var(--bg-tint); color: var(--ink-muted); border-color: var(--line-strong); }
.badge-phase {
  background: var(--surface); color: var(--navy); border-color: var(--line-strong);
  font-size: 10.5px; letter-spacing: .1em;
}

/* =====================  히어로 (컴팩트)  ===================== */
.hero { border-bottom: 1px solid var(--line-strong); background:
  linear-gradient(180deg, var(--accent-wash) 0%, var(--bg-soft) 72%, var(--bg-soft) 100%); }
.hero-inner { padding-block: 24px 22px; display: grid; gap: 22px; grid-template-columns: minmax(0,1fr) 280px; align-items: end; }

.hero h1 {
  font-size: clamp(24px, 3.1vw, 33px); font-weight: 800; margin-top: 8px;
  line-height: 1.24; letter-spacing: -.01em; text-wrap: balance;
}
.hero-subtitle {
  font-size: clamp(15px, 1.6vw, 17.5px); font-weight: 700; color: var(--accent-strong);
  margin-top: 7px; letter-spacing: -.005em;
}
.hero-brand {
  font-size: 13px; font-weight: 800; color: var(--ink-muted);
  letter-spacing: .03em; margin-top: 9px;
}
.hero-brand .hero-x { color: var(--accent); }
.hero-brand .hero-sub { color: var(--accent-strong); }
.hero-lead {
  font-size: clamp(15px, 1.5vw, 16px); color: var(--ink-body);
  margin-top: 8px; max-width: 58ch; line-height: 1.6;
}
.hero-note { font-size: 13.5px; font-weight: 700; color: var(--ink-muted); margin-top: 10px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

/* 진행 카드 */
.progress-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
}
.progress-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.progress-num { font-size: 26px; font-weight: 800; color: var(--ink); letter-spacing: -.03em; }
.progress-num em { font-style: normal; color: var(--accent-strong); }
.progress-label { font-size: 12.5px; color: var(--ink-muted); font-weight: 600; }
.progress-bar { height: 7px; border-radius: 999px; background: var(--bg-tint); margin-top: 12px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); }
.progress-note { font-size: 12.5px; color: var(--ink-faint); margin-top: 9px; }

/* =====================  섹션  ===================== */
.section { padding-block: 46px; scroll-margin-top: calc(var(--header-h) + 12px); }
.section-alt { background: var(--bg-soft); border-block: 1px solid var(--line); }
.section-head { margin-bottom: 24px; }
.section-head h2 { font-size: clamp(21px, 2.6vw, 27px); font-weight: 800; margin-top: 10px; }
.section-head p { font-size: 15.5px; color: var(--ink-muted); margin-top: 7px; max-width: 62ch; }

/* 강의자료 섹션 탭 : 강의자료 보기 | 실습도구 */
.tabs {
  display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 20px;
  background: var(--accent-wash); border: 1px solid var(--line); border-radius: 999px;
}
.tab {
  padding: 8px 18px; border-radius: 999px;
  font-size: 14.5px; font-weight: 800; color: var(--ink-muted);
}
.tab:hover { color: var(--accent-strong); }
.tab.is-on { background: var(--accent-strong); color: #fff; }

/* 프로세스 레일 : IDEA → SPEC → BUILD → TEST → RELEASE */
.rail { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
.rail-item {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 16px 18px; position: relative;
  display: flex; flex-direction: column;
}
.rail-step { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: .12em; }
.rail-item h3 { font-size: 16.5px; margin-top: 7px; }
.rail-item p { font-size: 13.5px; color: var(--ink-muted); margin-top: 5px; }
.rail-item .rail-sessions { font-size: 12px; color: var(--ink-faint); margin-top: auto; padding-top: 10px; font-family: var(--mono); }
.rail-line { height: 3px; border-radius: 999px; background: var(--accent-soft); margin-top: 14px; }
.rail-item:nth-child(1) .rail-line { background: var(--accent-strong); }
.rail-item:nth-child(2) .rail-line { background: var(--accent); }
.rail-item:nth-child(3) .rail-line { background: var(--accent-soft); }
.rail-item:nth-child(4) .rail-line { background: var(--line-strong); }
.rail-item:nth-child(5) .rail-line { background: var(--line-strong); }

/* =====================  회기 카드  ===================== */
.lesson-grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.lesson-card {
  position: relative; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.lesson-card.is-open:hover {
  border-color: var(--accent-soft); box-shadow: var(--shadow-lg); transform: translateY(-2px);
}
.lesson-card.is-open:focus-within {
  border-color: var(--accent-strong); box-shadow: var(--shadow-lg);
}
.lesson-card.is-soon { background: var(--bg-soft); box-shadow: none; }

.card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-no {
  display: inline-flex; align-items: baseline; gap: 3px;
  font-size: 12.5px; font-weight: 800; color: var(--ink-faint); letter-spacing: .04em;
}
.card-no b { font-size: 20px; color: var(--ink); font-weight: 800; letter-spacing: -.02em; }
.is-open .card-no b { color: var(--accent-strong); }

.card-title { font-size: 18.5px; font-weight: 800; margin-top: 13px; }
.is-soon .card-title { color: var(--ink-muted); }
.card-summary {
  font-size: 14px; color: var(--ink-muted); margin-top: 7px; line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.card-keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
.key {
  font-size: 11.5px; font-weight: 700; color: var(--ink-body);
  background: var(--bg-tint); border: 1px solid var(--line);
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.is-open .key { background: var(--accent-wash); border-color: var(--accent-soft); color: var(--accent-strong); }

.card-outcome {
  margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--line-strong);
  display: flex; gap: 8px; align-items: flex-start;
}
.card-outcome .lbl {
  font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--ink-faint);
  padding-top: 3px; flex: 0 0 auto;
}
.card-outcome .val { font-size: 13.5px; color: var(--ink-body); font-weight: 600; line-height: 1.45; }

.card-foot { margin-top: auto; padding-top: 16px; display: flex; align-items: center; gap: 10px; }
.card-foot .btn { flex: 1; }
.card-slides { font-size: 12px; color: var(--ink-faint); font-family: var(--mono); white-space: nowrap; }

/* 카드 전체를 클릭 영역으로 (버튼 위에 확장 링크) */
.card-link::after { content: ''; position: absolute; inset: 0; border-radius: var(--radius); }

/* =====================  커리큘럼 표  ===================== */
.table-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  -webkit-overflow-scrolling: touch;
}
.curriculum-table { width: 100%; border-collapse: collapse; min-width: 660px; }
.curriculum-table th {
  text-align: left; font-size: 11.5px; font-weight: 800; letter-spacing: .1em;
  color: var(--ink-faint); text-transform: uppercase;
  padding: 13px 16px; border-bottom: 1px solid var(--line-strong); white-space: nowrap;
}
.curriculum-table td {
  padding: 13px 16px; border-bottom: 1px solid var(--line);
  font-size: 14px; color: var(--ink-body); vertical-align: middle;
}
.curriculum-table tr:last-child td { border-bottom: 0; }
.curriculum-table tr:hover td { background: var(--bg-soft); }
.curriculum-table .c-no {
  font-family: var(--mono); font-weight: 800; color: var(--accent-strong);
  width: 54px; font-size: 14.5px;
}
.curriculum-table .c-title { font-weight: 700; color: var(--ink); min-width: 230px; text-wrap: balance; }
.curriculum-table .c-key { color: var(--ink-muted); font-size: 13px; min-width: 175px; }
.curriculum-table .c-out { font-size: 13px; min-width: 175px; }
.curriculum-table .c-st { white-space: nowrap; }

/* =====================  강의자료(뷰어) 페이지  ===================== */
.lesson-page { padding-block: 16px 40px; }

.lesson-bar {
  display: grid; gap: 12px; grid-template-columns: minmax(0,1fr) auto;
  align-items: start; padding-bottom: 13px; border-bottom: 1px solid var(--line);
}
.lesson-bar-main { min-width: 0; }
.crumb { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 700; color: var(--ink-body);
  border: 1px solid var(--line-strong); background: var(--surface);
  padding: 8px 14px; border-radius: 9px; min-height: 40px;
}
.back-link:hover { background: var(--bg-tint); text-decoration: none; color: var(--ink); }
.pos {
  font-size: 13px; font-weight: 700; color: var(--ink-muted); font-family: var(--mono);
}
.pos b { color: var(--accent-strong); }

.lesson-title { font-size: clamp(20px, 2.6vw, 26px); font-weight: 800; margin-top: 10px; }

.lesson-meta { display: grid; gap: 9px; grid-template-columns: 1.35fr 1fr; margin-top: 12px; align-items: start; }
.meta-box {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 13px;
}
.meta-box .lbl {
  font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--accent-strong);
  display: block;
}
.meta-box > .lbl { margin-bottom: 5px; }
.meta-box ul { margin-top: 6px; }
.meta-box ul li {
  font-size: 13px; color: var(--ink-body); line-height: 1.45;
  padding-left: 12px; position: relative;
}
.meta-box ul li + li { margin-top: 3px; }
.meta-box ul li::before {
  content: ''; position: absolute; left: 0; top: 7px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent-soft);
}
.meta-box .outcome-val { font-size: 13.5px; color: var(--ink); font-weight: 700; line-height: 1.45; margin-top: 5px; }

/* 접히는 학습 목표 */
.meta-goals { padding: 0; }
.meta-goals > summary {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 13px; cursor: pointer; list-style: none; min-height: 40px;
  border-radius: var(--radius-sm);
}
.meta-goals > summary::-webkit-details-marker { display: none; }
.meta-goals > summary:hover { background: var(--bg-soft); }
.meta-goals > ul { padding: 0 13px 11px; margin-top: 0; }
.chev {
  width: 8px; height: 8px; flex: 0 0 auto;
  border-right: 2px solid var(--ink-faint); border-bottom: 2px solid var(--ink-faint);
  transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s;
}
.meta-goals[open] > summary .chev { transform: rotate(225deg) translate(-2px, -2px); }

.lesson-nav { display: flex; gap: 8px; flex: 0 0 auto; align-items: flex-start; }
.lesson-nav .btn { padding-inline: 15px; }
.nav-soon {
  display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; line-height: 1.2;
}
.nav-soon small { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); letter-spacing: .06em; }

/* ---- 이전/다음 회기 버튼 (우측 컬럼) ---- */
.lesson-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tool-label {
  font-size: 10.5px; font-weight: 800; letter-spacing: .1em;
  color: var(--accent-strong);
}

/* ---- 슬라이드 무대 ---- */
.viewer { margin-top: 18px; }

.stage-shell { display: flex; justify-content: center; }
.stage {
  position: relative; width: 100%;
  /* 화면 높이에 맞춰 최대한 크게. 16:9 비율은 항상 유지 */
  max-width: min(1180px, calc((100svh - 396px) * 16 / 9));
  min-width: 0;
  aspect-ratio: 16 / 9;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.stage img {
  width: 100%; height: 100%; object-fit: contain;   /* 잘리거나 찌그러지지 않음 */
  background: var(--surface);
}

/* 좌우 화살표 (PC) */
.stage-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,.94); border: 1px solid var(--line-strong);
  color: var(--ink); font-size: 19px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow); transition: background .15s, opacity .15s;
}
.stage-arrow:hover { background: #fff; border-color: var(--accent); color: var(--accent-strong); }
.stage-arrow[disabled] { opacity: .32; cursor: not-allowed; }

  var NUM = '\\d+(?:\\s*[-–~·,]\\s*\\d+)*\\s*행(?![가-힣])';
  var reNum = new RegExp('(?:' + FILE + '\\s*)?' + NUM, 'g');
  // 1) 줄 번호가 들어 있는 괄호만: 줄 번호를 빼고, 남는 게 없으면 괄호와 앞 공백까지 뺌
  t = t.replace(/\s?\(([^()]*)\)/g, function (m, inner) {
    if (!new RegExp(NUM).test(inner)) return m;
    var x = inner.replace(reNum, '').replace(/\s*[,·]\s*(?=[,·]|$)/g, '').replace(/^[\s,·]+/, '').trim();
    var sp = m.charAt(0) === '(' ? '' : m.charAt(0);
    return x ? sp + '(' + x + ')' : '';
  });
  t = t.replace(/\(\d+(?:\s*[-–~·,]\s*\d+)*\s*행에는 있음\)/g, '(다른 곳에는 있음)');
  // 2) 괄호 밖: '파일 N행은' → '파일에는', 남은 ' N행' 은 공백째 뺌
  t = t.replace(new RegExp('(' + FILE + ')\\s+' + '\\d+(?:\\s*[-–~·,]\\s*\\d+)*\\s*행(은|에서|이|가|의)', 'g'), function (m, f, j) {
    return f + ({ '은': '에는', '에서': '에서', '이': '가', '가': '가', '의': '의' })[j];
  });
  t = t.replace(new RegExp('\\s' + NUM, 'g'), '');
  return t.replace(/ +,/g, ',');
}
function ed(t, k, def, tag, cls) {
  tag = tag || 'span';
  if (student()) return '<' + tag + (cls ? ' class="' + cls + '"' : '') + '>' + esc(noLines(tx(t, k, def))) + '</' + tag + '>';
  return '<' + tag + (cls ? ' class="' + cls + '"' : '') + ' contenteditable="true" spellcheck="false" data-k="' + k + '">' + esc(tx(t, k, def)) + '</' + tag + '>';
}
/* 여러 줄 글: 한 줄씩 따로 고칠 수 있고, 저장할 때는 줄바꿈으로 합칩니다 */
function lines(t, k, def, cls, firstHL) {
  return '<ul class="' + cls + '" data-lines="' + k + '">' + tx(t, k, def).split('\n').filter(function (x) { return x.trim(); }).map(function (ln, i) {
    if (student()) return '<li' + (firstHL && i === 0 ? ' class="hl"' : '') + '>' + esc(noLines(ln)) + '</li>';
    return '<li' + (firstHL && i === 0 ? ' class="hl"' : '') + ' contenteditable="true" spellcheck="false">' + esc(ln) + '</li>';
  }).join('') + '</ul>';
}
/* 문장이 끝나는 곳(. 다음)에서 줄을 바꿉니다 */
function brk(x) { return String(x).replace(/([.])\s+(?=\S)/g, '$1\n'); }
function score(t, c) { return T(t.id).sc[c] || t.scores[c][0]; }
function total(t) { return CRIT.reduce(function (a, c) { return a + score(t, c); }, 0); }
/* 학생에게 전달할지: 고른 적이 없으면 '더 좋아지려면' 1~3만 기본으로 보냅니다 (4·5번은 교사가 켜면 전달) */
function isOn(t, k) { var v = T(t.id).off[k]; if (v === undefined) return !(k.charAt(0) === 'i' && +k.slice(1) >= 3); return !v; }
function student() { return S.mode === 'student'; }
function incBox(k, on) { return '<label class="inc"><input type="checkbox" data-inc="' + k + '"' + (on ? ' checked' : '') + '> 학생에게 전달</label>'; }

/* ---------- 슬라이드 목록 ---------- */
/* 교사용: 표지 · 요약 · (분석) · 잘한 점 · 개선 1~5 · 다음 미션 · (질문) · 한마디
   학생용: 교사용 전용 칸과 '전달' 을 끈 개선 칸은 빠집니다 */
function slidesOf(t, forStudent) {
  var L = [{ k: 'cover', label: '표지' }, { k: 'sum', label: '요약 · 평가' }];
  if (t.changes && t.changes.length) L.push({ k: 'chg', label: '달라진 점' });   /* 완성본이 들어온 팀만 */
  if (!forStudent) L.push({ k: 'ana', label: '분석', teacher: 1 });
  t.strengths.forEach(function (_s, i) {
    var on = isOn(t, 's' + i);
    if (forStudent && !on) return;
    L.push({ k: 'good', i: i, label: '잘한 점 ' + (i + 1), off: !on });
  });
  t.improves.forEach(function (_m, i) {
    var on = isOn(t, 'i' + i);
    if (forStudent && !on) return;
    L.push({ k: 'imp', i: i, label: '더 좋아지려면 ' + (i + 1), off: !on });
  });
  L.push({ k: 'mission', label: '다음 미션' });
  if (!forStudent) L.push({ k: 'qs', label: '발표 질문', teacher: 1 });
  return L;
}

function head(t, label, n, all) {
  return '<div class="s-head"><span>' + esc(t.name) + ' · ' + esc(t.members.join(' · ')) + '</span><span><b>' + esc(label) + '</b> &nbsp; ' + n + ' / ' + all + '</span></div>';
}

function slideHTML(t, sl, n, all) {
  var st = T(t.id), h = '', showSc = !student() || S.showScore;
  switch (sl.k) {
  case 'cover':
    h = '<div class="cover"><div>' +
      '<div class="kicker">TEAM PROJECT FEEDBACK</div>' +
      '<h2 class="h-xl">' + esc(t.name) + '</h2>' +
      ed(t, 'one', t.one, 'p', 'one') +
      '<div class="chips">' + t.members.map(function (m) { return '<span class="chip">' + esc(m) + '</span>'; }).join('') + '</div>' +
      '<div class="chips">' + t.tags.map(function (g) { return '<span class="chip g">' + esc(g) + '</span>'; }).join('') + '</div>' +
      '<div class="links">' + t.links.map(function (l) { return '<a href="' + esc(enc(l.href)) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>'; }).join('') + '</div>' +
      '</div>' +
      (PREVIEW[t.id] ? '<div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="' + enc(PREVIEW[t.id]) + '" alt=""></div>' : '<div></div>') +
      '</div>';
    break;
  case 'sum':
    h = '<div class="kicker">한눈에 보기</div><div class="sum"><div>' + lines(t, 'summary', t.summary, 'lines', true) + '</div>' +
      (showSc ? '<div class="scores"><div class="total"><span>평가 합계</span><span><b>' + total(t) + '</b> / 25</span></div>' + CRIT.map(function (c) {
        var v = score(t, c), ai = t.scores[c][0];
        return '<div class="sc"><div class="h">' + c + '<span class="dots">' + [1, 2, 3, 4, 5].map(function (x) {
          return '<button type="button" data-sc="' + c + '" data-v="' + x + '" class="' + (x === v ? 'on' : '') + (!student() && x === ai ? ' ai' : '') + '" aria-label="' + c + ' ' + x + '점">' + x + '</button>';
        }).join('') + '</span></div>' + ed(t, 'sc_' + c, t.scores[c][1], 'span', 'sc-why') + '</div>';
      }).join('') + '</div>' : '<div></div>') +
      '</div>';
    break;
  case 'ana':
    h = '<div class="kicker">교사용 · 코드 분석</div><h2 class="h-l">기능 완성도와 위험 점검</h2><div class="ana">' +
      '<div><h4>기능별 완성도</h4><ul>' + t.features.map(function (f) { return '<li><span class="st ' + ST[f[0]][1] + '">' + ST[f[0]][0] + '</span><b>' + esc(f[1]) + '</b> — ' + esc(f[2]) + '</li>'; }).join('') + '</ul></div>' +
      '<div><h4>버그 · 위험</h4><ul>' + t.risks.map(function (r) { return '<li><span class="st ' + (r[0] === 'ok' ? 'ok' : r[0]) + '">' + LV[r[0]][0] + '</span>' + esc(r[1]) + '</li>'; }).join('') + '</ul></div>' +
      '</div>';
    break;
  case 'good':
    var g = t.strengths[sl.i], gk = 's' + sl.i, gAll = slidesOf(t, student()).filter(function (x) { return x.k === 'good'; }), gNo = gAll.map(function (x) { return x.i; }).indexOf(sl.i) + 1;
    h = incBox(gk, !sl.off) + '<div class="tag-row"><span class="fb-tag good"><b>✓</b>잘한 점</span></div><div class="praise"><span class="pn"><i>' + gNo + '</i>' + gNo + ' / ' + gAll.length + '</span>' +
      ed(t, gk + 't', g[0], 'div', 't') + ed(t, gk + 'd', brk(g[1]), 'div', 'd') + '</div>';
    break;
  case 'imp':
    var m = t.improves[sl.i], k = 'i' + sl.i, mAll = slidesOf(t, student()).filter(function (x) { return x.k === 'imp'; }), num = mAll.map(function (x) { return x.i; }).indexOf(sl.i) + 1;
    h = incBox(k, !sl.off) + '<div class="tag-row"><span class="fb-tag imp"><b>↗</b>더 좋아지려면</span></div><div class="imp"><div>' +
      '<span class="stepno"><i>' + num + '</i>' + num + ' / ' + mAll.length + '</span>' +
      (student() ? '' : '<span class="pri">우선순위 ' + LV[m[0]][0] + '</span>') +
      ed(t, k + 't', m[1], 'h2', 'h-l') +
      '<div class="rows"><span>왜</span>' + ed(t, k + 'w', m[2], 'div') + '<span>어떻게</span>' + ed(t, k + 'h', m[3], 'div') + '</div>' +
      '<div class="ask"><span class="k">Claude</span>' + ed(t, k + 'a', m[4], 'div', 'q') + '<button type="button" class="copy" data-copy="1">복사</button></div>' +
      '</div></div>';
    break;
  case 'chg':
    h = '<div class="tag-row"><span class="fb-tag chg"><b>★</b>달라진 점</span></div>' +
      '<div class="chg-head"><span>지난 버전</span><span></span><span>새 버전</span></div><ul class="chg-list">' +
      t.changes.map(function (c, i) {
        return '<li>' + ed(t, 'c' + i + 'b', c[0], 'div', 'b') + '<span class="ar">→</span>' + ed(t, 'c' + i + 'a', c[1], 'div', 'a') + '</li>';
      }).join('') + '</ul>';
    break;
  case 'mission':
    h = '<div class="center"><div class="mission-box"><div class="kicker">다음 미션</div>' + lines(t, 'mission', t.mission, 'steps', false) + '</div></div>';
    break;
  case 'qs':
    h = '<div class="kicker">교사용 · 발표 때 물어볼 질문</div><h2 class="h-l">확인 질문</h2><ul class="qs">' + t.questions.map(function (q, i) {
      return '<li><span class="qn">' + (i + 1) + '</span><span class="qt">' + esc(q) + '</span><textarea data-qa="' + i + '" placeholder="답변 메모">' + esc(st.qa[i] || '') + '</textarea></li>';
    }).join('') + '</ul>';
    break;
  case 'cm':
    h = '<div class="kicker">선생님 한마디</div>' + (student()
      ? '<div class="cm-view">' + esc(st.cm) + '</div>'
      : '<textarea class="cm" id="cm" placeholder="팀에게 전할 말을 적어 주세요. 학생 전달용 화면 · 인쇄 · 내보내기에 들어갑니다.">' + esc(st.cm) + '</textarea>');
    break;
  }
  return '<div class="slide k-' + sl.k + (sl.off ? ' off' : '') + '">' + head(t, sl.label, n, all) + '<div class="grow" style="display:flex;flex-direction:column;position:relative">' + h + '</div></div>';
}

/* ---------- 그리기 ---------- */
var lastDir = 1;
function curPos(t, list) { var p = S.pos[t.id] || 0; return Math.max(0, Math.min(p, list.length - 1)); }
function renderTeams() {
  $('teams').innerHTML = TEAMS.map(function (t) {
    var done = T(t.id).cm.trim();
    return '<button type="button" class="tcard' + (S.cur === t.id ? ' on' : '') + '" data-team="' + t.id + '">' +
      (done ? '<span class="ok" title="한마디 작성"></span>' : '') + esc(t.name) +
      (student() ? '' : '<small>' + total(t) + '/25</small>') + '</button>';
  }).join('');
}
function renderSlide() {
  var t = team(S.cur), list = slidesOf(t, student()), p = curPos(t, list);
  $('stage').innerHTML = slideHTML(t, list[p], p + 1, list.length).replace('class="slide', 'class="slide' + (lastDir < 0 ? ' back' : ''));
  $('prev').disabled = p === 0; $('next').disabled = p === list.length - 1;
  $('strip').innerHTML = list.map(function (sl, i) {
    return '<button type="button" data-go="' + i + '" class="' + (i === p ? 'on' : '') + (sl.teacher ? ' t' : '') + (sl.k === 'good' ? ' g' : sl.k === 'imp' ? ' m' : sl.k === 'chg' ? ' c' : '') + (sl.off ? ' x' : '') + '">' + esc(sl.label) + '</button>';
  }).join('') + '<span class="pg">' + (p + 1) + ' / ' + list.length + '</span>';
}
function applyMode() {
  document.body.classList.toggle('student', student());
  document.body.classList.toggle('teacher', !student());
  $('showScore').checked = !!S.showScore;
  document.querySelectorAll('[data-mode]').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === S.mode); });
}
function render() { applyMode(); renderTeams(); renderSlide(); }
function go(d) {
  var t = team(S.cur), list = slidesOf(t, student()), p = curPos(t, list) + d;
  if (p < 0 || p >= list.length) return;
  lastDir = d; S.pos[t.id] = p; save(); renderSlide();
}

/* ---------- 학생 전달용 글 (복사 · 내보내기) ---------- */
function teamText(t, withScore) {
  var st = T(t.id), L = [];
  L.push('# ' + t.name + '  (' + t.members.join(', ') + ')', '', tx(t, 'one', t.one), '', tx(t, 'summary', t.summary).split('\n').map(function (x) { return '> ' + x; }).join('\n'), '');
  if (withScore) {
    L.push('## 평가 (합계 ' + total(t) + ' / 25)');
    CRIT.forEach(function (c) { L.push('- ' + c + ' ' + score(t, c) + '점 — ' + tx(t, 'sc_' + c, t.scores[c][1])); });
    L.push('');
  }
  L.push('## 잘한 점');
  t.strengths.forEach(function (s, i) { var k = 's' + i; if (isOn(t, k)) L.push('- **' + tx(t, k + 't', s[0]) + '** — ' + tx(t, k + 'd', s[1])); });
  L.push('', '## 더 좋아지려면');
  var n = 0;
  t.improves.forEach(function (m, i) {
    var k = 'i' + i; if (!isOn(t, k)) return;
    L.push((++n) + '. **' + tx(t, k + 't', m[1]) + '**', '   - 왜: ' + tx(t, k + 'w', m[2]), '   - 어떻게: ' + tx(t, k + 'h', m[3]), '   - Claude에게: "' + tx(t, k + 'a', m[4]) + '"');
  });
  L.push('', '## 다음 미션');
  tx(t, 'mission', t.mission).split('\n').forEach(function (x, i) { if (x.trim()) L.push((i + 1) + '. ' + x.trim()); });
  if (st.cm.trim()) L.push('', '## 선생님 한마디', st.cm.trim());
  return student() ? L.map(noLines).join('\n') : L.join('\n');
}
function copyText(s) {
  function fallback() {
    var a = document.createElement('textarea'); a.value = s; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); toast('복사했습니다'); } catch (e) { toast('복사하지 못했습니다'); }
    a.remove();
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(s).then(function () { toast('복사했습니다'); }, fallback);
  else fallback();
}

/* ---------- 이벤트 ---------- */
document.querySelectorAll('[data-mode]').forEach(function (b) {
  b.addEventListener('click', function () { S.mode = b.dataset.mode; save(); render(); });
});
$('showScore').addEventListener('change', function () { S.showScore = this.checked; save(); renderSlide(); });
$('teams').addEventListener('click', function (e) {
  var b = e.target.closest('[data-team]'); if (!b) return;
  S.cur = b.dataset.team; lastDir = 1; save(); render();
});
$('prev').addEventListener('click', function () { go(-1); });
$('next').addEventListener('click', function () { go(1); });
$('strip').addEventListener('click', function (e) {
  var b = e.target.closest('[data-go]'); if (!b) return;
  var t = team(S.cur), np = +b.dataset.go; lastDir = np >= curPos(t, slidesOf(t, student())) ? 1 : -1;
  S.pos[t.id] = np; save(); renderSlide();
});
function editing(el) { return el && (el.isContentEditable || /^(TEXTAREA|INPUT|SELECT)$/.test(el.tagName)); }
document.addEventListener('keydown', function (e) {
  if (editing(document.activeElement)) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  else if (e.key === 'f' || e.key === 'F') toggleFull();
});
/* 화면 밀기 (터치 · 펜) */
(function () {
  var x0 = null;
  $('stage').addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' && !editing(e.target)) x0 = e.clientX; });
  $('stage').addEventListener('pointerup', function (e) {
    if (x0 == null) return; var dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  });
})();
$('stage').addEventListener('input', function (e) {
  var el = e.target, st = T(S.cur);
  if (el.dataset.k) { st.txt[el.dataset.k] = el.innerText.replace(/\n+$/, ''); save(); return; }
  var ul = el.closest && el.closest('[data-lines]');
  if (ul) { st.txt[ul.dataset.lines] = [].map.call(ul.children, function (li) { return li.innerText.replace(/\n+/g, ' ').trim(); }).filter(Boolean).join('\n'); save(); return; }
  if (el.id === 'cm') { st.cm = el.value; save(); renderTeams(); return; }
  if (el.dataset.qa != null) { st.qa[el.dataset.qa] = el.value; save(); }
});
$('stage').addEventListener('change', function (e) {
  var el = e.target, st = T(S.cur);
  if (el.dataset.inc) { st.off[el.dataset.inc] = el.checked ? 0 : 1; save(); renderSlide(); }
});
$('stage').addEventListener('click', function (e) {
  var st = T(S.cur), b = e.target.closest('[data-sc]');
  if (b && !student()) { st.sc[b.dataset.sc] = +b.dataset.v; save(); renderSlide(); renderTeams(); return; }
  if (e.target.closest('[data-copy]')) { var q = $('stage').querySelector('.ask [data-k]'); copyText(q ? q.innerText : ''); }
});
$('stage').addEventListener('paste', function (e) {
  if (!e.target.closest('[contenteditable]')) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text'));
});
function toggleFull() {
  var d = $('deck');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (d.requestFullscreen) d.requestFullscreen().catch(function () { toast('전체화면을 쓸 수 없는 환경입니다'); });
}
$('btnFull').addEventListener('click', toggleFull);
$('btnCopy').addEventListener('click', function () { copyText(teamText(team(S.cur), student() ? !!S.showScore : true)); });
$('btnExport').addEventListener('click', function () {
  var withScore = student() ? !!S.showScore : true;
  var md = '# 팀 프로젝트 피드백\n\n' + TEAMS.map(function (t) { return teamText(t, withScore); }).join('\n\n---\n\n') + '\n';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown;charset=utf-8' }));
  a.download = '팀프로젝트_피드백.md'; document.body.appendChild(a); a.click(); a.remove();
  toast('팀프로젝트_피드백.md 를 내려받았습니다');
});
/* 인쇄: 지금 팀의 슬라이드를 한 장씩 페이지로 */
function buildPrint() {
  var t = team(S.cur), list = slidesOf(t, student());
  $('printAll').innerHTML = list.map(function (sl, i) {
    var h = slideHTML(t, sl, i + 1, list.length);
    if (sl.k === 'cm') h = h.replace(/<textarea[\s\S]*?<\/textarea>/, '<div class="cm-view">' + esc(T(t.id).cm) + '</div>');
    return '<div class="fb-stage">' + h + '</div>';
  }).join('');
}
window.addEventListener('beforeprint', buildPrint);
$('btnPrint').addEventListener('click', function () { buildPrint(); window.print(); });
$('btnReset').addEventListener('click', function () {
  var t = team(S.cur);
  if (!window.confirm(t.name + ' 팀에서 고친 글 · 점수 · 한마디 · 메모를 모두 지우고 처음 분석으로 되돌릴까요?')) return;
  delete S.t[t.id]; S.pos[t.id] = 0; save(); render(); toast('초기화했습니다');
});

/* 주소로 바로 열기: 팀피드백.html#team=aro&p=4  (p는 1부터) */
(function () {
  var q = new URLSearchParams(location.hash.slice(1));
  if (q.get('team') && TEAMS.some(function (t) { return t.id === q.get('team'); })) S.cur = q.get('team');
  
  if (q.get('p')) S.pos[S.cur] = Math.max(0, (parseInt(q.get('p'), 10) || 1) - 1);
})();
render();
</script>
</body>
</html>
